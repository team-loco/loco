name: loco-dev

x-postgres-env: &postgres-env
  POSTGRES_USER: ${POSTGRES_USER:-loco_user}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loco_password}
  POSTGRES_DB: ${POSTGRES_DB:-loco}

services:
  postgres:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment: *postgres-env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 120s
      start_interval: 1s

  valkey:
    image: valkey/valkey:8.1.11-alpine@sha256:2602ace2be6569bc2bbb06f873776516ab9089821525be34f4305c67eb9db02a
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

  registry:
    image: ghcr.io/project-zot/zot:v2.1.23@sha256:9d3de83ac2099e6f4843045b4c9b65b7e8baf40f92d28f54906dee9d4d390fd7
    ports:
      - "${REGISTRY_PORT:-5001}:5000"
    volumes:
      - ./registry/config.json:/etc/zot/config.json:ro
      - ./registry/htpasswd:/etc/zot/htpasswd:ro
      - registry-data:/var/lib/registry

  s3:
    image: versity/versitygw:v1.10.0@sha256:89cad13cc981986ee284cbafea4613f9533ce6fd5f37a2c96c4c4fb8adb3a316
    environment:
      ROOT_ACCESS_KEY: ${LOCO_SOURCE_BUCKET_ACCESS_KEY_ID:-loco-dev}
      ROOT_SECRET_KEY: ${LOCO_SOURCE_BUCKET_SECRET_ACCESS_KEY:-loco-dev-secret}
      VGW_REGION: ${LOCO_SOURCE_BUCKET_REGION:-us-east-1}
      VGW_PORT: :${S3_PORT:-9000}
      SOURCE_BUCKET: ${LOCO_SOURCE_BUCKET:-loco-sources}
    ports:
      - "${S3_PORT:-9000}:${S3_PORT:-9000}"
    volumes:
      - s3-data:/data
    entrypoint: ["sh", "-c"]
    command:
      - |
        mkdir -p "/data/$$SOURCE_BUCKET"
        exec versitygw posix /data

  dex:
    image: ghcr.io/dexidp/dex:v2.46.1@sha256:65b72ca0f4b0bf6d4ada84ec21da8851782563404ac7b8f926923d27ceced9ab
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports:
      - "${DEX_PORT:-5556}:5556"
    environment:
      WEB_URL: ${WEB_URL:-http://localhost:5173}
      DEX_PORT: ${DEX_PORT:-5556}
      GH_OAUTH_CLIENT_ID: ${GH_OAUTH_CLIENT_ID:-}
      GH_OAUTH_CLIENT_SECRET: ${GH_OAUTH_CLIENT_SECRET:-}
    volumes:
      - ./dex.yaml:/etc/dex/config.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5556/dex/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

  openbao:
    extends:
      file: ../tests/conformance/transit/compose.yaml
      service: openbao
    command: !override ["server"]
    environment:
      BAO_SEAL_KEY: bG9jby1kZXYtb3BlbmJhby1zZWFsLWtleS0wMDAwMDA=
    ports: !override
      - "${OPENBAO_PORT:?}:8200"
    volumes:
      - ./openbao/config.hcl:/openbao/config/config.hcl:ro
      - openbao-data:/openbao/file
    healthcheck:
      test: ["CMD-SHELL", "bao status >/dev/null; [ $$? -ne 1 ]"]

  openbao-seed:
    extends:
      file: ../tests/conformance/transit/compose.yaml
      service: openbao
    profiles: [tools]
    depends_on:
      openbao:
        condition: service_healthy
    env_file: ./api.env
    environment:
      BAO_ADDR: http://openbao:8200
      OPENBAO_INIT_FILE: /openbao/file/init.json
      OPENBAO_RECOVERY_SHARES: 1
      OPENBAO_RECOVERY_THRESHOLD: 1
    ports: !reset []
    volumes:
      - ../charts/loco-control-plane/files/openbao-setup.sh:/openbao/setup.sh:ro
      - openbao-data:/openbao/file
    entrypoint: ["timeout", "120", "sh", "/openbao/setup.sh"]
    command: !override [init, configure]
    healthcheck: !reset {}

  seed:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *postgres-env
      PGHOST: postgres
      SEED_FILE: ${SEED_FILE:-}
    volumes:
      - ..:/repo:ro
    working_dir: /repo
    entrypoint: ["sh", "-c"]
    command:
      - |
        export PGUSER="$$POSTGRES_USER" PGPASSWORD="$$POSTGRES_PASSWORD" PGDATABASE="$$POSTGRES_DB"
        echo "seeding $$SEED_FILE"
        psql -q -v ON_ERROR_STOP=1 -f "$$SEED_FILE"

volumes:
  openbao-data:
  postgres-data:
  registry-data:
  s3-data:
