apiVersion: v1
kind: ConfigMap
metadata: {name: loco-control-plane-values, namespace: flux-system}
data:
  values.yaml: |
{{ indent .ControlPlaneValues 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: loco-worker-values, namespace: flux-system}
data:
  values.yaml: |
{{ indent .WorkerValues 4 }}
---
apiVersion: v1
kind: Secret
metadata: {name: loco-api-env, namespace: loco-system}
stringData:
  DATABASE_URL: postgres://loco_user:loco_password@postgres.{{ .Domain }}:5432/loco?sslmode=disable
  LOCO_SOURCE_BUCKET_ACCESS_KEY_ID: loco-dev
  LOCO_SOURCE_BUCKET_SECRET_ACCESS_KEY: loco-dev-secret
  LOCO_REGISTRY_USERNAME: api
  LOCO_REGISTRY_PASSWORD: loco-dev-api
---
apiVersion: v1
kind: Secret
metadata: {name: openbao-seal, namespace: loco-system}
stringData: {key: {{ .SealKey }}}
---
apiVersion: v1
kind: Secret
metadata: {name: loco-registry-push, namespace: loco-system}
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{{ .PushAuth }}'
---
apiVersion: v1
kind: Secret
metadata: {name: loco-registry-pull, namespace: loco-system}
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{{ .PullAuth }}'
