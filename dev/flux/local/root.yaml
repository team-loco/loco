apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata: {name: platform-bundle, namespace: flux-system}
spec:
  interval: 1m
  url: oci://registry.{{ .Domain }}:{{ .RegistryPort }}/team-loco/loco/platform
  ref: {tag: {{ .BundleVersion }}}
  insecure: true
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata: {name: local-config, namespace: flux-system}
spec:
  interval: 1m
  url: oci://registry.{{ .Domain }}:{{ .RegistryPort }}/team-loco/loco/dev
  ref: {tag: local}
  insecure: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: loco-cluster-config, namespace: flux-system}
spec:
  interval: 1m
  path: ./
  sourceRef: {kind: OCIRepository, name: local-config}
  dependsOn: [{name: loco-namespaces}]
  prune: false
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata: {name: loco, namespace: flux-system}
spec:
  interval: 1m
  path: {{ .EntryPoint }}
  sourceRef: {kind: OCIRepository, name: platform-bundle}
  prune: true
