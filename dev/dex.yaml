{{- if getenv "STACK_DOMAIN" }}
issuer: http://dex.{{ .Env.STACK_DOMAIN }}:{{ .Env.DEX_PORT }}/dex
{{- else }}
issuer: http://localhost:{{ .Env.DEX_PORT }}/dex
{{- end }}
storage:
  type: memory
web:
{{- if getenv "STACK_DOMAIN" }}
  http: 0.0.0.0:{{ .Env.DEX_PORT }}
{{- else }}
  http: 0.0.0.0:5556
{{- end }}
  allowedOrigins:
    - {{ .Env.WEB_URL }}
oauth2:
  passwordConnector: local
  skipApprovalScreen: true
enablePasswordDB: true
staticPasswords:
  - email: dev@loco.test
    username: dev
    userID: 6f1d3c2e-8a51-4c8e-9b0f-2d7a4e5c9b11
    hash: "$2a$10$Py6lsTPTExeAThMuKbDW.OHD.0fwmH37PmxBtGZ8wpYH0IqMGvJJy"
staticClients:
  - id: loco
    name: Loco
    public: true
    redirectURIs:
      - {{ .Env.WEB_URL }}/auth/callback
{{- if getenv "GH_OAUTH_CLIENT_ID" }}
connectors:
  - type: github
    id: github
    name: GitHub
    config:
      clientID: {{ .Env.GH_OAUTH_CLIENT_ID }}
      clientSecret: {{ .Env.GH_OAUTH_CLIENT_SECRET }}
{{- if getenv "STACK_DOMAIN" }}
      redirectURI: http://dex.{{ .Env.STACK_DOMAIN }}:{{ .Env.DEX_PORT }}/dex/callback
{{- else }}
      redirectURI: http://localhost:{{ .Env.DEX_PORT }}/dex/callback
{{- end }}
{{- end }}
