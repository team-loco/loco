logs:
  enabled: true
  namespaceOverride: loco-obs-control-plane
  mode: daemonset
  enableConfigChecksumAnnotation: false
  # Parent-owned exporter settings can change on each Helm upgrade.
  podAnnotations:
    loco.io/release-revision: '{{ .Release.Revision }}'
  configMap:
    create: false
    existingName: '{{ .Release.Name }}-control-plane-logs'
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: 0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
  command:
    extraArgs: [--feature-gates=stanza.synchronousLogEmitter]
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile: {type: RuntimeDefault}
  securityContext:
    runAsUser: 10001
    runAsGroup: 0
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities: {drop: [ALL]}
  resources:
    requests: {cpu: 200m, memory: 256Mi}
    limits: {cpu: "2", memory: 512Mi}
  tolerations: [{operator: Exists}]
  presets:
    logsCollection:
      enabled: true
      storeCheckpoints: false
      maxRecombineLogSize: 102400
  clusterRole:
    create: true
    rules:
      - apiGroups: [""]
        resources: [pods, namespaces, nodes]
        verbs: [get, list, watch]
      - apiGroups: [apps]
        resources: [replicasets]
        verbs: [get, list, watch]
  initContainers:
    - name: state-permissions
      image: busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
      command: [chown, -R, "10001:0", /var/lib/otelcol, /var/lib/otelcol-exporter]
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL], add: [CHOWN]}
      volumeMounts:
        - {name: checkpoints, mountPath: /var/lib/otelcol}
        - {name: exporter-queue, mountPath: /var/lib/otelcol-exporter}
  extraVolumes:
    - name: checkpoints
      hostPath:
        path: '/var/lib/otelcol/{{ include "opentelemetry-collector.namespace" . }}/{{ include "opentelemetry-collector.fullname" . }}'
        type: DirectoryOrCreate
    - name: exporter-queue
      hostPath:
        path: '/var/lib/otelcol-exporter/{{ include "opentelemetry-collector.namespace" . }}/{{ include "opentelemetry-collector.fullname" . }}'
        type: DirectoryOrCreate
    - name: exporter-token
      secret:
        secretName: '{{ .Release.Name }}-system-ingest-token'
        optional: true
  extraVolumeMounts:
    - {name: checkpoints, mountPath: /var/lib/otelcol}
    - {name: exporter-queue, mountPath: /var/lib/otelcol-exporter}
    - {name: exporter-token, mountPath: /etc/otelcol-exporter, readOnly: true}
  ports:
    otlp: {enabled: false}
    otlp-http: {enabled: false}
    jaeger-compact: {enabled: false}
    jaeger-thrift: {enabled: false}
    jaeger-grpc: {enabled: false}
    zipkin: {enabled: false}
  config:
    extensions:
      file_storage: {directory: /var/lib/otelcol}
      file_storage/exporter: {directory: /var/lib/otelcol-exporter}
    exporters:
      otlp_http:
        endpoint: ""
        sending_queue:
          enabled: true
          storage: file_storage/exporter
          num_consumers: 2
          queue_size: 5000
          block_on_overflow: true
          batch: {sizer: items, min_size: 100, flush_timeout: 1s}
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 30s
          max_elapsed_time: 0s
    receivers:
      file_log:
        storage: file_storage
        start_at: beginning
        exclude:
          - '/var/log/pods/{{ include "opentelemetry-collector.namespace" . }}_*/*/*.log'
        operators:
          - id: container-parser
            type: container
            max_log_size: '{{ .Values.presets.logsCollection.maxRecombineLogSize }}'
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 384
        spike_limit_mib: 96
      k8s_attributes/pod_uid:
        auth_type: serviceAccount
        passthrough: false
        wait_for_metadata: true
        filter: {node_from_env_var: OTEL_K8S_NODE_NAME}
        pod_association:
          - sources: [{from: resource_attribute, name: k8s.pod.uid}]
        extract:
          metadata: [k8s.namespace.name, k8s.pod.name, k8s.pod.uid, k8s.node.name, k8s.container.name]
          labels:
            - {from: pod, key: loco.io/platform-log-owner, tag_name: loco.platform.log.owner}
            - {from: pod, key: app.kubernetes.io/name, tag_name: service.name}
      filter/owner:
        error_mode: propagate
        log_conditions: ['resource.attributes["loco.platform.log.owner"] != "control-plane"']
      transform/platform_log:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - set(resource.attributes["service.instance.id"], resource.attributes["k8s.pod.uid"])
              - delete_key(resource.attributes, "loco.platform.log.owner")
              - set(cache["record"], ParseJSON(body)) where IsString(body) and IsMatch(body, "^\\s*\\{")
              - set(body, cache["record"]["msg"]) where IsString(cache["record"]["msg"])
              - set(trace_id, TraceID(cache["record"]["trace_id"])) where IsString(cache["record"]["trace_id"])
              - set(span_id, SpanID(cache["record"]["span_id"])) where IsString(cache["record"]["span_id"])
              - set(time, Time(cache["record"]["time"], "%Y-%m-%dT%H:%M:%S.%f%z")) where IsString(cache["record"]["time"])
              - set(severity_text, cache["record"]["level"]) where IsString(cache["record"]["level"])
              - set(severity_number, 5) where severity_text == "DEBUG"
              - set(severity_number, 9) where severity_text == "INFO"
              - set(severity_number, 13) where severity_text == "WARN"
              - set(severity_number, 17) where severity_text == "ERROR"
              - merge_maps(attributes, cache["record"], "upsert") where IsMap(cache["record"]) and IsString(cache["record"]["msg"])
              - delete_matching_keys(attributes, "^(msg|level|time|trace_id|span_id)$")
      filter/platform_feedback:
        error_mode: propagate
        log_conditions: ['log.attributes["loco.telemetry.internal"] == true']
    service:
      pipelines:
        logs:
          receivers: [file_log]
          processors: [memory_limiter, k8s_attributes/pod_uid, filter/owner, transform/platform_log, filter/platform_feedback, resource/platform]
          exporters: [otlp_http]
