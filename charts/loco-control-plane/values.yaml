ui:
  enabled: true
  hostname: app.loco.build
  image:
    repository: ghcr.io/team-loco/loco-ui
    tag: ""
  imagePullPolicy: Always
  replicaCount: 1
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

api:
  image:
    repository: ghcr.io/team-loco/loco-api
    tag: ""
  imagePullPolicy: Always
  replicaCount: 1
  port: 8000
  existingSecret: ""
  env: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  startupProbe:
    failureThreshold: 60
    periodSeconds: 5

# Gateway namespace where the Envoy Gateway is deployed
gatewayNamespace: loco-system
controlPlaneHostname: api.loco.build

obsProxy:
  cors:
    allowedOrigins: []
  image:
    repository: ghcr.io/team-loco/loco-obs-proxy
    tag: ""
  imagePullPolicy: Always
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  port: 8080
  clickhouse:
    existingSecret:
      name: ""
      key: url
    migratorExistingSecret:
      name: ""
      key: url
