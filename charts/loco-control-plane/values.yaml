    caDuration: 87600h
    duration: 2160h
    # @schema minimum: 1
    reloadSeconds: 60
  # @schema additionalProperties: false
  storage:
    size: 10Gi
    storageClass: ""
  # @schema skipProperties
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  # @schema additionalProperties: false
  seal:
    # @schema enum: [static, awskms, transit]
    type: static
    # @schema additionalProperties: false
    static:
      keyId: "1"
      # @schema additionalProperties: false
      existingSecret:
        name: ""
        key: key
    # @schema additionalProperties: false
    awskms:
      region: ""
      kmsKeyId: ""
      endpoint: ""
      existingSecret: ""
    # @schema additionalProperties: false
    transit:
      address: ""
      mount: transit
      key: ""
      # @schema additionalProperties: false
      existingSecret:
        name: ""
        key: token
  # @schema additionalProperties: false
  recovery:
    # @schema minimum: 1
    shares: 5
    # @schema minimum: 1
    threshold: 3
  # @schema additionalProperties: false
  transit:
    mount: transit
    key: loco
  # @schema additionalProperties: false
  kubernetesAuth:
    mount: kubernetes
    role: loco-api
    setupRole: loco-setup
  # @schema additionalProperties: false
  external:
    address: ""
    # @schema additionalProperties: false
    caSecret:
      name: ""
      key: ca.crt
    # @schema additionalProperties: false
    tokenSecret:
      name: ""
      key: token
