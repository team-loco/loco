# @schema additionalProperties: false; allOf: [{if: {properties: {enabled: {const: true}}}, then: {properties: {image: {properties: {tag: {minLength: 1}}}}}}]
ui:
  enabled: true
  hostname: app.loco.build
  # @schema additionalProperties: false
  image:
    repository: ghcr.io/team-loco/loco-ui
    tag: ""
  imagePullPolicy: Always
  replicaCount: 1
  port: 8080
  # @schema skipProperties
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# @schema additionalProperties: false
api:
  # @schema additionalProperties: false
  image:
    repository: ghcr.io/team-loco/loco-api
    # @schema required; minLength: 1
    tag: ""
  imagePullPolicy: Always
  replicaCount: 1
  port: 8000
  # @schema required; minLength: 1
  existingSecret: ""
  # @schema additionalProperties: false
  bootstrapToken:
    # @schema additionalProperties: false
    existingSecret:
      name: ""
      key: token
  env: {}
  # @schema skipProperties
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  # @schema skipProperties
  startupProbe:
    failureThreshold: 60
    periodSeconds: 5

# Gateway namespace where the Envoy Gateway is deployed
gatewayNamespace: loco-system
controlPlaneHostname: api.loco.build

# @schema additionalProperties: false
gateway:
  create: true
  name: loco-control-plane
  className: loco-control-plane
  service: {}
  tlsSecretName: ""

# @schema additionalProperties: false
certManager:
  enabled: true
  # @schema additionalProperties: false
  issuer:
    create: true
    type: acme
    kind: ClusterIssuer
    name: letsencrypt-prod
    email: ""
    server: https://acme-v02.api.letsencrypt.org/directory
    # @schema item: object
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token-secret
              key: api-token

# @schema additionalProperties: false
secrets:
  cloudflareToken: ""

# @schema additionalProperties: false; allOf: [{if: {properties: {enabled: {const: true}}}, then: {properties: {image: {properties: {tag: {minLength: 1}}}}}}]
obsProxy:
  enabled: true
  # @schema additionalProperties: false
  image:
    repository: ghcr.io/team-loco/loco-obs-proxy
    tag: ""
  imagePullPolicy: Always
  # @schema additionalProperties: false
  query:
    replicaCount: 1
    # @schema skipProperties
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    port: 8080
    # @schema additionalProperties: false
    cors:
      # @schema item: string
      allowedOrigins: []
    # @schema additionalProperties: false
    clickhouse:
      # @schema additionalProperties: false
      existingSecret:
        name: ""
        key: url
      # @schema additionalProperties: false
      migratorExistingSecret:
        name: ""
        key: url
  # @schema additionalProperties: false
  ingest:
    enabled: false
    replicaCount: 1
    # @schema skipProperties
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    port: 8080
    grpcPort: 4317
    httpPort: 4318
    hostname: ""
    # @schema additionalProperties: false
    clickhouse:
      # @schema additionalProperties: false
      existingSecret:
        name: ""
        key: url

# @schema skipProperties
clickhouse:
  enabled: false
  nameOverride: "clickhouse"
  operator:
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    operator:
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
    metrics:
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
    crdHook:
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
  clickhouse:
    # keep in sync with the loco_obs.* grants in clickhouse.clickhouse.users below
    database: loco_obs
    image:
      repository: altinity/clickhouse-server
      tag: "26.3.33.10001.altinitystable@sha256:5bd62b50208bae1d065de7685b0b0a1812f267d1a179aabb15f97c78aed47d1a"
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 101
      runAsGroup: 101
      fsGroup: 101
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    antiAffinity: true
    resources:
      requests:
        cpu: "1"
        memory: 4Gi
      limits:
        cpu: "2"
        memory: 4Gi
    persistence:
      enabled: true
      storageClass: ""
    systemLogRetentionDays: 3
    keeperConfig: |
      <keeper_server>
        <tcp_port>9181</tcp_port>
        <server_id>1</server_id>
        <log_storage_path>/var/lib/clickhouse/coordination/log</log_storage_path>
        <snapshot_storage_path>/var/lib/clickhouse/coordination/snapshots</snapshot_storage_path>
        <raft_configuration>
          <server>
            <id>1</id>
            <hostname>localhost</hostname>
            <port>9234</port>
          </server>
        </raft_configuration>
      </keeper_server>
      <zookeeper>
        <node>
          <host>localhost</host>
          <port>9181</port>
        </node>
      </zookeeper>
      <keeper_map_path_prefix>/keeper_map_tables</keeper_map_path_prefix>
    extraConfig: |
      <clickhouse>
        {{- $.Values.clickhouse.keeperConfig | nindent 2 }}
        <logger>
          <level>information</level>
        </logger>
        {{- range list "query_log" "part_log" }}
        <{{ . }} replace="1">
          <database>system</database>
          <table>{{ . }}</table>
          <partition_by>event_date</partition_by>
          <ttl>event_date + INTERVAL {{ $.Values.clickhouse.systemLogRetentionDays }} DAY DELETE</ttl>
          <flush_interval_milliseconds>7500</flush_interval_milliseconds>
        </{{ . }}>
        {{- end }}
        <query_thread_log remove="1"/>
        <trace_log remove="1"/>
        <processors_profile_log remove="1"/>
        <asynchronous_metrics_update_period_s>60</asynchronous_metrics_update_period_s>
        <opentelemetry_span_log remove="1"/>
        {{- range list "text_log" "metric_log" "asynchronous_metric_log" "error_log" "latency_log" "query_metric_log" "query_views_log" "asynchronous_insert_log" "s3queue_log" "backup_log" "crash_log" "background_schedule_pool_log" "delta_lake_metadata_log" "iceberg_metadata_log" }}
        <{{ . }}>
          <ttl>event_date + INTERVAL {{ $.Values.clickhouse.systemLogRetentionDays }} DAY DELETE</ttl>
        </{{ . }}>
        {{- end }}
      </clickhouse>
    # keep the database in these grants in sync with clickhouse.clickhouse.database above
    users:
      - name: loco_migrator
        password_secret_name: loco-clickhouse-migrator
        grants:
          - "GRANT ALL ON loco_obs.*"
      - name: loco_ingest
        password_secret_name: loco-clickhouse-ingest
        grants:
          - "GRANT INSERT, SHOW COLUMNS ON loco_obs.*"
      - name: loco_reader
        password_secret_name: loco-clickhouse-reader
        grants:
          - "GRANT SELECT ON loco_obs.*"

clickhouseUserPasswords:
  loco_migrator: ""
  loco_ingest: ""
  loco_reader: ""

# @schema additionalProperties: false
openbao:
