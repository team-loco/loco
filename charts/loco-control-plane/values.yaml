ui:
  enabled: true
  hostname: app.loco.build
  image:
    repository: ghcr.io/team-loco/loco-ui
    tag: ""
  imagePullPolicy: Always
  replicaCount: 1
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

api:
  image:
    repository: ghcr.io/team-loco/loco-api
    tag: ""
  imagePullPolicy: Always
  replicaCount: 1
  port: 8000
  existingSecret: ""
  bootstrapToken:
    existingSecret:
      name: ""
      key: token
  env: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  startupProbe:
    failureThreshold: 60
    periodSeconds: 5

# Gateway namespace where the Envoy Gateway is deployed
gatewayNamespace: loco-system
controlPlaneHostname: api.loco.build

obsProxy:
  enabled: true
  image:
    repository: ghcr.io/team-loco/loco-obs-proxy
    tag: ""
  imagePullPolicy: Always
  query:
    replicaCount: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    port: 8080
    cors:
      allowedOrigins: []
    clickhouse:
      existingSecret:
        name: ""
        key: url
      migratorExistingSecret:
        name: ""
        key: url
  ingest:
    enabled: false
    replicaCount: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    port: 8080
    grpcPort: 4317
    httpPort: 4318
    clickhouse:
      existingSecret:
        name: ""
        key: url
