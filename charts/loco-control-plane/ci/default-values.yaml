certManager:
  issuer:
    email: ci@example.invalid

ui:
  image:
    tag: ci

api:
  image:
    tag: ci
  existingSecret: loco-api-env
  clickhouse:
    existingSecret:
      name: loco-api-clickhouse-reader

obsProxy:
  image:
    tag: ci
  ingest:
    clickhouse:
      existingSecret:
        name: loco-obs-proxy-ingest
      migratorExistingSecret:
        name: loco-obs-proxy-migrator

openbao:
  seal:
    static:
      existingSecret:
        name: loco-openbao-seal
  snapshots:
    s3:
      endpoint: https://s3.ci.example.invalid
      bucket: loco-openbao-snapshots
      existingSecret:
        name: loco-openbao-snapshots-s3
