{{- if include "loco-control-plane.nodeLogs" . -}}
{{- $namespace := include "loco-control-plane.nodeCollectorName" . -}}
{{- if eq $namespace .Release.Namespace -}}
{{- fail "the control-plane namespace must differ from its node log collector namespace" -}}
{{- end -}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $namespace }}
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-control-plane-logs
  namespace: {{ $namespace }}
data:
  relay: |
    {{- include "loco-control-plane.nodeCollectorConfig" . | nindent 4 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-control-plane-logs
  namespace: {{ $namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "loco-control-plane.nodeCollectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
{{- if include "loco-control-plane.systemIngest" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-system-ingest
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: {{ .Release.Name }}-obs-proxy-ingest
  ports:
    - name: otlp-http
      port: 80
      targetPort: otlp-http
{{- end }}
{{- end -}}
