{{- if and (include "loco-control-plane.issueCertificate" .) .Values.certManager.issuer.create }}
{{- if ne .Values.certManager.issuer.kind "ClusterIssuer" }}
{{- fail "certManager.issuer.kind must be ClusterIssuer when certManager.issuer.create is true" }}
{{- end }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.certManager.issuer.name }}
spec:
  {{- if eq .Values.certManager.issuer.type "selfSigned" }}
  selfSigned: {}
  {{- else if eq .Values.certManager.issuer.type "acme" }}
  acme:
    email: {{ .Values.certManager.issuer.email | required "certManager.issuer.email is required" }}
    server: {{ .Values.certManager.issuer.server }}
    privateKeySecretRef:
      name: {{ .Values.certManager.issuer.name }}-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token-secret
              key: api-token
  {{- else }}
  {{- fail "certManager.issuer.type must be acme or selfSigned" }}
  {{- end }}
{{- end }}
