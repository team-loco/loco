{{- if .Values.clickhouse.enabled }}
{{- if not .Values.obsProxy.enabled }}
{{- fail "clickhouse.enabled requires obsProxy.enabled" }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-clickhouse
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchExpressions:
      - key: clickhouse.altinity.com/chi
        operator: Exists
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: observability-proxy
        - podSelector:
            matchLabels:
              app: {{ .Release.Name }}-api
      ports:
        - protocol: TCP
          port: 9000
    - from:
        - podSelector:
            matchExpressions:
              - key: clickhouse.altinity.com/chi
                operator: Exists
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: operator
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 8123
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 9009
{{- end }}
