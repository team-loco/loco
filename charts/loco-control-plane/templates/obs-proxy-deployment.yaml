apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-obs-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-obs-proxy
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}-obs-proxy
  replicas: {{ .Values.obsProxy.replicaCount }}
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-obs-proxy
        app.kubernetes.io/component: observability-proxy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: obs-proxy
          image: "{{ .Values.obsProxy.image.repository }}:{{ required "obsProxy.image.tag is required" .Values.obsProxy.image.tag }}"
          imagePullPolicy: {{ .Values.obsProxy.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: PORT
              value: {{ .Values.obsProxy.port | quote }}
            - name: CONTROL_PLANE_URL
              value: {{ include "loco-control-plane.apiURL" . | quote }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ join "," .Values.obsProxy.cors.allowedOrigins | quote }}
            - name: CLICKHOUSE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "obsProxy.clickhouse.existingSecret.name is required" .Values.obsProxy.clickhouse.existingSecret.name | quote }}
                  key: {{ required "obsProxy.clickhouse.existingSecret.key is required" .Values.obsProxy.clickhouse.existingSecret.key | quote }}
            - name: CLICKHOUSE_MIGRATOR_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "obsProxy.clickhouse.migratorExistingSecret.name is required" .Values.obsProxy.clickhouse.migratorExistingSecret.name | quote }}
                  key: {{ required "obsProxy.clickhouse.migratorExistingSecret.key is required" .Values.obsProxy.clickhouse.migratorExistingSecret.key | quote }}
          ports:
            - containerPort: {{ .Values.obsProxy.port }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.obsProxy.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.obsProxy.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.obsProxy.resources | nindent 12 }}
      restartPolicy: Always
