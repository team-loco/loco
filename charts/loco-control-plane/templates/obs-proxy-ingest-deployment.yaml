{{- if .Values.obsProxy.enabled }}
{{- $gatewayTracing := include "loco-control-plane.gatewayTracing" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-obs-proxy-ingest
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-obs-proxy-ingest
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}-obs-proxy-ingest
  {{- if not .Values.obsProxy.ingest.autoscaling.enabled }}
  replicas: {{ .Values.obsProxy.ingest.replicaCount }}
  {{- end }}
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      {{- if $gatewayTracing }}
      annotations:
        checksum/gateway-tracing: {{ include (print $.Template.BasePath "/gateway-tracing-collector.yaml") . | sha256sum }}
      {{- end }}
      labels:
        {{- if include "loco-control-plane.nodeLogs" . }}
        loco.io/platform-log-owner: control-plane
        {{- end }}
        app.kubernetes.io/name: loco-obs-proxy
        app: {{ .Release.Name }}-obs-proxy-ingest
        app.kubernetes.io/component: observability-proxy
    spec:
      automountServiceAccountToken: false
      topologySpreadConstraints:
        {{- include "loco-control-plane.spreadByNode" (dict "app" (printf "%s-obs-proxy-ingest" .Release.Name)) | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: obs-proxy-ingest
          image: "{{ .Values.obsProxy.image.repository }}:{{ .Values.obsProxy.image.tag }}"
          imagePullPolicy: {{ .Values.obsProxy.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            {{- include "loco-control-plane.platformTelemetryEnv" (dict "root" . "env" .Values.obsProxy.ingest.env "path" "obsProxy.ingest.env") | nindent 12 }}
            {{- range $name, $value := omit .Values.obsProxy.ingest.env "PORT" "CONTROL_PLANE_URL" "OTLP_GRPC_PORT" "OTLP_HTTP_PORT" "CLICKHOUSE_DB" "CLICKHOUSE_INGEST_URL" "CLICKHOUSE_MIGRATOR_URL" "SYSTEM_INGEST_TOKEN" }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            - name: PORT
              value: {{ .Values.obsProxy.ingest.port | quote }}
            - name: CONTROL_PLANE_URL
              value: {{ include "loco-control-plane.apiURL" . | quote }}
            - name: OTLP_GRPC_PORT
              value: {{ .Values.obsProxy.ingest.grpcPort | quote }}
            - name: OTLP_HTTP_PORT
              value: {{ .Values.obsProxy.ingest.httpPort | quote }}
            - name: CLICKHOUSE_DB
              value: {{ .Values.clickhouse.clickhouse.database | quote }}
            - name: CLICKHOUSE_INGEST_URL
              valueFrom:
                secretKeyRef:
                  {{- include "loco-control-plane.clickhouseURL" (dict "root" . "grant" "GRANT INSERT" "path" "obsProxy.ingest.clickhouse.existingSecret" "secret" .Values.obsProxy.ingest.clickhouse.existingSecret) | nindent 18 }}
            - name: CLICKHOUSE_MIGRATOR_URL
              valueFrom:
                secretKeyRef:
                  {{- include "loco-control-plane.clickhouseURL" (dict "root" . "grant" "GRANT ALL" "path" "obsProxy.ingest.clickhouse.migratorExistingSecret" "secret" .Values.obsProxy.ingest.clickhouse.migratorExistingSecret) | nindent 18 }}
            {{- if include "loco-control-plane.systemIngest" . }}
            - name: SYSTEM_INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "loco-control-plane.systemIngestSecret" . }}
                  key: token
            {{- end }}
          ports:
            - name: health
              containerPort: {{ .Values.obsProxy.ingest.port }}
            - name: otlp-grpc
              containerPort: {{ .Values.obsProxy.ingest.grpcPort }}
            - name: otlp-http
              containerPort: {{ .Values.obsProxy.ingest.httpPort }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.obsProxy.ingest.resources | nindent 12 }}
        {{- if $gatewayTracing }}
        - name: gateway-tracing
          image: {{ .Values.gateway.tracing.collector.image | quote }}
          args: ["--config=/etc/gateway-tracing/config.yaml"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: SYSTEM_INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "loco-control-plane.systemIngestSecret" . }}
                  key: token
          ports:
            - name: gateway-otlp
              containerPort: {{ .Values.gateway.tracing.collector.port }}
          readinessProbe:
            tcpSocket:
              port: gateway-otlp
          livenessProbe:
            tcpSocket:
              port: gateway-otlp
          resources:
            {{- toYaml .Values.gateway.tracing.collector.resources | nindent 12 }}
          volumeMounts:
            - name: gateway-tracing
              mountPath: /etc/gateway-tracing
              readOnly: true
        {{- end }}
      {{- if $gatewayTracing }}
      volumes:
        - name: gateway-tracing
          configMap:
            name: {{ .Release.Name }}-gateway-tracing
      {{- end }}
      restartPolicy: Always
{{- end }}
