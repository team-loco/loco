{{- if .Values.obsProxy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-obs-proxy-query
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}-obs-proxy-query
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: {{ .Release.Name }}-api
      ports:
        - protocol: TCP
          port: {{ .Values.obsProxy.query.port }}
{{- end }}
