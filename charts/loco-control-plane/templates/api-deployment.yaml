{{- $openbaoCA := or .Values.openbao.enabled .Values.openbao.external.caSecret.name }}
{{- $tokenAuth := and (not .Values.openbao.enabled) .Values.openbao.external.tokenSecret.name }}
{{- $openbaoVolumes := or (not $tokenAuth) $openbaoCA }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-api
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-api
    spec:
      serviceAccountName: {{ include "loco-control-plane.apiServiceAccount" . }}
      automountServiceAccountToken: false
      topologySpreadConstraints:
        {{- include "loco-control-plane.spreadByNode" (dict "app" (printf "%s-api" .Release.Name)) | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - secretRef:
                name: {{ .Values.api.existingSecret | quote }}
          env:
            {{- if .Values.platformTelemetry.enabled }}
            {{- range $name := include "loco-control-plane.otlpExporterEnv" . | fromYamlArray }}
            {{- if hasKey $.Values.api.env $name }}
            {{- fail (printf "%s is set in both api.env and platformTelemetry" $name) }}
            {{- end }}
            {{- end }}
            {{- if include "loco-control-plane.systemIngest" . }}
            - name: LOCO_SYSTEM_INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "loco-control-plane.systemIngestSecret" . }}
                  key: token
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ printf "http://%s-obs-proxy-ingest.%s.svc.cluster.local:%v" .Release.Name .Release.Namespace .Values.obsProxy.ingest.httpPort | quote }}
            - name: OTEL_EXPORTER_OTLP_HEADERS
              value: "Authorization=Bearer%20$(LOCO_SYSTEM_INGEST_TOKEN)"
            {{- else }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.platformTelemetry.exporter.endpoint | quote }}
            {{- with .Values.platformTelemetry.exporter.headers }}
            {{- $headers := list }}
            {{- range $key, $value := . }}
            {{- $headers = append $headers (printf "%s=%s" $key ($value | urlquery | replace "+" "%20")) }}
            {{- end }}
            - name: OTEL_EXPORTER_OTLP_HEADERS
              value: {{ join "," $headers | quote }}
            {{- end }}
            {{- end }}
            - name: LOCO_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.instance.id=$(LOCO_POD_UID)"
            {{- end }}
            {{- $typed := include "loco-control-plane.apiSettings" . | fromYaml }}
            {{- range $name, $value := $typed }}
            {{- if hasKey $.Values.api.env $name }}
            {{- fail (printf "%s is set in both api.env and a typed API setting" $name) }}
            {{- end }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range $name, $value := omit .Values.api.env "APP_PORT" "CLICKHOUSE_URL" "CLICKHOUSE_DB" "LOCO_SECRETS_TRANSIT_ADDR" "LOCO_SECRETS_TRANSIT_MOUNT" "LOCO_SECRETS_TRANSIT_KEY" "LOCO_SECRETS_TRANSIT_CA_FILE" "LOCO_SECRETS_TRANSIT_AUTH" "LOCO_SECRETS_TRANSIT_TOKEN" "LOCO_SECRETS_TRANSIT_KUBERNETES_MOUNT" "LOCO_SECRETS_TRANSIT_KUBERNETES_ROLE" "LOCO_SECRETS_TRANSIT_KUBERNETES_TOKEN_FILE" "LOCO_INGEST_TRANSIT_KEY" "LOCO_REGISTRY_AUTH" "LOCO_REGISTRY_TRANSIT_KEY" "LOCO_REGISTRY_TRANSIT_KEY_VERSION" "LOCO_REGISTRY_TOKEN_SERVICE" }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if not (hasKey .Values.api.env "GOMEMLIMIT") }}
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  containerName: api
                  resource: limits.memory
            {{- end }}
            - name: APP_PORT
              value: {{ printf "0.0.0.0:%v" .Values.api.port | quote }}
            {{- if .Values.postgres.enabled }}
            {{- if hasKey .Values.api.env "DATABASE_URL" }}
            {{- fail "api.env.DATABASE_URL cannot be set while postgres.enabled is true" }}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "loco-control-plane.postgresCluster" . }}-app
                  key: uri
            {{- end }}
            - name: LOCO_SECRETS_TRANSIT_ADDR
              value: {{ include "loco-control-plane.openbaoURL" . | quote }}
            - name: LOCO_SECRETS_TRANSIT_MOUNT
              value: {{ .Values.openbao.transit.mount | quote }}
            - name: LOCO_SECRETS_TRANSIT_KEY
              value: {{ .Values.openbao.transit.key | quote }}
            - name: LOCO_INGEST_TRANSIT_KEY
              value: {{ .Values.openbao.transit.ingestKey | quote }}
            {{- if eq .Values.api.registry.auth "token" }}
            - name: LOCO_REGISTRY_AUTH
              value: token
            - name: LOCO_REGISTRY_TRANSIT_KEY
              value: {{ .Values.openbao.transit.registryKey | quote }}
            - name: LOCO_REGISTRY_TRANSIT_KEY_VERSION
              value: {{ .Values.api.registry.transitKeyVersion | quote }}
            - name: LOCO_REGISTRY_TOKEN_SERVICE
              value: {{ include "loco-control-plane.registryService" . | quote }}
            {{- end }}
            {{- if $tokenAuth }}
            - name: LOCO_SECRETS_TRANSIT_AUTH
              value: token
            - name: LOCO_SECRETS_TRANSIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.openbao.external.tokenSecret.name | quote }}
                  key: {{ .Values.openbao.external.tokenSecret.key | quote }}
            {{- else }}
            - name: LOCO_SECRETS_TRANSIT_AUTH
              value: kubernetes
            - name: LOCO_SECRETS_TRANSIT_KUBERNETES_MOUNT
              value: {{ .Values.openbao.kubernetesAuth.mount | quote }}
            - name: LOCO_SECRETS_TRANSIT_KUBERNETES_ROLE
              value: {{ .Values.openbao.kubernetesAuth.role | quote }}
            - name: LOCO_SECRETS_TRANSIT_KUBERNETES_TOKEN_FILE
              value: /var/run/secrets/openbao/token
            {{- end }}
            {{- if $openbaoCA }}
            - name: LOCO_SECRETS_TRANSIT_CA_FILE
              value: {{ include "loco-control-plane.openbaoCAFile" . }}
            {{- end }}
            {{- with .Values.api.systemAdmins }}
            - name: LOCO_SYSTEM_ADMINS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.api.systemReaders }}
            - name: LOCO_SYSTEM_READERS
              value: {{ join "," . | quote }}
            {{- end }}
            - name: LOCO_TRUSTED_PROXY_HOPS
              value: {{ .Values.api.trustedProxyHops | quote }}
            {{- with .Values.api.invitationTtl }}
            - name: INVITATION_TTL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.api.ntfy }}
            {{- if or .url .topic }}
            - name: NTFY_URL
              value: {{ .url | quote }}
            - name: NTFY_TOPIC
              value: {{ .topic | quote }}
            {{- with .eventTypes }}
            - name: NTFY_EVENT_TYPES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if .tokenSecret.name }}
            - name: NTFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .tokenSecret.name | quote }}
                  key: {{ .tokenSecret.key | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.obsProxy.enabled }}
            - name: CLICKHOUSE_DB
              value: {{ .Values.clickhouse.clickhouse.database | quote }}
            - name: CLICKHOUSE_URL
              valueFrom:
                secretKeyRef:
                  {{- include "loco-control-plane.clickhouseURL" (dict "root" . "grant" "GRANT SELECT" "path" "api.clickhouse.existingSecret" "secret" .Values.api.clickhouse.existingSecret) | nindent 18 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          startupProbe:
            httpGet:
              path: /livez
              port: http
            {{- toYaml .Values.api.startupProbe | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
          {{- if $openbaoVolumes }}
          volumeMounts:
            {{- if not $tokenAuth }}
            - name: openbao-token
              mountPath: /var/run/secrets/openbao
              readOnly: true
            {{- end }}
            {{- if $openbaoCA }}
            - name: openbao-ca
              mountPath: /var/run/secrets/openbao-ca
              readOnly: true
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      {{- if $openbaoVolumes }}
      volumes:
        {{- if not $tokenAuth }}
        - name: openbao-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
        {{- end }}
        {{- if .Values.openbao.enabled }}
        {{- include "loco-control-plane.openbaoCAVolume" . | nindent 8 }}
        {{- else if $openbaoCA }}
        - name: openbao-ca
          secret:
            secretName: {{ .Values.openbao.external.caSecret.name | quote }}
            items:
              - key: {{ .Values.openbao.external.caSecret.key | quote }}
                path: ca.crt
        {{- end }}
      {{- end }}
