{{- $openbaoCA := or .Values.openbao.enabled .Values.openbao.external.caSecret.name }}
{{- $tokenAuth := and (not .Values.openbao.enabled) .Values.openbao.external.tokenSecret.name }}
{{- $openbaoVolumes := or (not $tokenAuth) $openbaoCA }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-api
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-api
    spec:
      serviceAccountName: {{ include "loco-control-plane.apiServiceAccount" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - secretRef:
                name: {{ .Values.api.existingSecret | quote }}
          env:
            {{- range $name, $value := omit .Values.api.env "APP_PORT" "OBSERVABILITY_PROXY_URL" "LOCO_SECRETS_TRANSIT_ADDR" "LOCO_SECRETS_TRANSIT_MOUNT" "LOCO_SECRETS_TRANSIT_KEY" "LOCO_SECRETS_TRANSIT_CA_FILE" "LOCO_SECRETS_TRANSIT_AUTH" "LOCO_SECRETS_TRANSIT_TOKEN" "LOCO_SECRETS_TRANSIT_KUBERNETES_MOUNT" "LOCO_SECRETS_TRANSIT_KUBERNETES_ROLE" "LOCO_SECRETS_TRANSIT_KUBERNETES_TOKEN_FILE" "LOCO_INGEST_TRANSIT_KEY" }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            - name: APP_PORT
              value: {{ printf "0.0.0.0:%v" .Values.api.port | quote }}
            - name: LOCO_SECRETS_TRANSIT_ADDR
              value: {{ include "loco-control-plane.openbaoURL" . | quote }}
            - name: LOCO_SECRETS_TRANSIT_MOUNT
              value: {{ .Values.openbao.transit.mount | quote }}
            - name: LOCO_SECRETS_TRANSIT_KEY
              value: {{ .Values.openbao.transit.key | quote }}
            - name: LOCO_INGEST_TRANSIT_KEY
              value: {{ .Values.openbao.transit.ingestKey | quote }}
            {{- if $tokenAuth }}
            - name: LOCO_SECRETS_TRANSIT_AUTH
              value: token
            - name: LOCO_SECRETS_TRANSIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.openbao.external.tokenSecret.name | quote }}
                  key: {{ .Values.openbao.external.tokenSecret.key | quote }}
            {{- else }}
            - name: LOCO_SECRETS_TRANSIT_AUTH
              value: kubernetes
            - name: LOCO_SECRETS_TRANSIT_KUBERNETES_MOUNT
              value: {{ .Values.openbao.kubernetesAuth.mount | quote }}
            - name: LOCO_SECRETS_TRANSIT_KUBERNETES_ROLE
              value: {{ .Values.openbao.kubernetesAuth.role | quote }}
            - name: LOCO_SECRETS_TRANSIT_KUBERNETES_TOKEN_FILE
              value: /var/run/secrets/openbao/token
            {{- end }}
            {{- if $openbaoCA }}
            - name: LOCO_SECRETS_TRANSIT_CA_FILE
              value: {{ include "loco-control-plane.openbaoCAFile" . }}
            {{- end }}
            {{- with .Values.api.bootstrapToken.existingSecret }}
            {{- if .name }}
            - name: LOCO_BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .name | quote }}
                  key: {{ .key | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.api.email.from }}
            - name: EMAIL_FROM
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.api.email.invitationTtl }}
            - name: INVITATION_TTL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.api.email.transport.existingSecret }}
            {{- if .name }}
            - name: EMAIL_TRANSPORT
              valueFrom:
                secretKeyRef:
                  name: {{ .name | quote }}
                  key: {{ .key | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.api.email.hookSecret.existingSecret }}
            {{- if .name }}
            - name: EMAIL_HOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .name | quote }}
                  key: {{ .key | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.obsProxy.enabled }}
            - name: OBSERVABILITY_PROXY_URL
              value: {{ include "loco-control-plane.obsProxyURL" . | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            {{- toYaml .Values.api.startupProbe | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          {{- if $openbaoVolumes }}
          volumeMounts:
            {{- if not $tokenAuth }}
            - name: openbao-token
              mountPath: /var/run/secrets/openbao
              readOnly: true
            {{- end }}
            {{- if $openbaoCA }}
            - name: openbao-ca
              mountPath: /var/run/secrets/openbao-ca
              readOnly: true
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      {{- if $openbaoVolumes }}
      volumes:
        {{- if not $tokenAuth }}
        - name: openbao-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
        {{- end }}
        {{- if .Values.openbao.enabled }}
        {{- include "loco-control-plane.openbaoCAVolume" . | nindent 8 }}
        {{- else if $openbaoCA }}
        - name: openbao-ca
          secret:
            secretName: {{ .Values.openbao.external.caSecret.name | quote }}
            items:
              - key: {{ .Values.openbao.external.caSecret.key | quote }}
                path: ca.crt
        {{- end }}
      {{- end }}
