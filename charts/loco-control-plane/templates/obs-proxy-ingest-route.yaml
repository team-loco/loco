{{- if include "loco-control-plane.ingestRouted" . }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-obs-proxy-ingest
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    {{- include "loco-control-plane.gatewayRef" . | nindent 4 }}
  hostnames:
    - {{ .Values.obsProxy.ingest.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/
      backendRefs:
        - name: {{ .Release.Name }}-obs-proxy-ingest
          port: {{ .Values.obsProxy.ingest.httpPort }}
{{- end }}
