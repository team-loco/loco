{{- if .Values.obsProxy.enabled }}
{{- $gatewayTracing := include "loco-control-plane.gatewayTracing" . }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-obs-proxy-ingest
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}-obs-proxy-ingest
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.obsProxy.ingest.grpcPort }}
        - protocol: TCP
          port: {{ .Values.obsProxy.ingest.httpPort }}
    {{- if and (include "loco-control-plane.systemIngest" .) (include "loco-control-plane.nodeLogs" .) }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "loco-control-plane.nodeCollectorName" . }}
          podSelector:
            matchLabels:
              {{- include "loco-control-plane.nodeCollectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.obsProxy.ingest.httpPort }}
    {{- end }}
    {{- if or (include "loco-control-plane.ingestRouted" .) $gatewayTracing }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.gatewayNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: proxy
              app.kubernetes.io/managed-by: envoy-gateway
      ports:
        - protocol: TCP
          port: {{ .Values.obsProxy.ingest.httpPort }}
        {{- if $gatewayTracing }}
        - protocol: TCP
          port: {{ .Values.gateway.tracing.collector.port }}
        {{- end }}
    {{- end }}
{{- end }}
