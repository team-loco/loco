{{- if and .Values.obsProxy.enabled .Values.obsProxy.ingest.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-obs-proxy-ingest
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}-obs-proxy-ingest
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.obsProxy.ingest.grpcPort }}
        - protocol: TCP
          port: {{ .Values.obsProxy.ingest.httpPort }}
    {{- if include "loco-control-plane.ingestRouted" . }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.gatewayNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: proxy
              app.kubernetes.io/managed-by: envoy-gateway
      ports:
        - protocol: TCP
          port: {{ .Values.obsProxy.ingest.httpPort }}
    {{- end }}
{{- end }}
