{{- $ingest := .Values.obsProxy.ingest }}
{{- if and .Values.obsProxy.enabled $ingest.autoscaling.enabled }}
{{- with $ingest.autoscaling }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $.Release.Name }}-obs-proxy-ingest
  namespace: {{ $.Release.Namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $.Release.Name }}-obs-proxy-ingest
  minReplicas: {{ .minReplicas }}
  maxReplicas: {{ .maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
{{- $replicas := dict (printf "%s-api" .Release.Name) .Values.api.replicaCount }}
{{- if .Values.ui.enabled }}
{{- $_ := set $replicas (printf "%s-ui" .Release.Name) .Values.ui.replicaCount }}
{{- end }}
{{- if .Values.obsProxy.enabled }}
{{- $_ := set $replicas (printf "%s-obs-proxy-ingest" .Release.Name) (ternary $ingest.autoscaling.minReplicas $ingest.replicaCount $ingest.autoscaling.enabled) }}
{{- end }}
{{- if .Values.openbao.enabled }}
{{- $_ := set $replicas (include "loco-control-plane.openbaoName" .) .Values.openbao.replicas }}
{{- end }}
{{- range $name, $count := $replicas }}
{{- if ge (int $count) 2 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: {{ $name }}
{{- end }}
{{- end }}
