{{- $ingest := .Values.obsProxy.ingest }}
{{- if and .Values.obsProxy.enabled $ingest.autoscaling.enabled }}
{{- with $ingest.autoscaling }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $.Release.Name }}-obs-proxy-ingest
  namespace: {{ $.Release.Namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $.Release.Name }}-obs-proxy-ingest
  minReplicas: {{ .minReplicas }}
  maxReplicas: {{ .maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
{{- $names := list (printf "%s-api" .Release.Name) }}
{{- if .Values.ui.enabled }}
{{- $names = append $names (printf "%s-ui" .Release.Name) }}
{{- end }}
{{- if .Values.obsProxy.enabled }}
{{- $names = append $names (printf "%s-obs-proxy-ingest" .Release.Name) }}
{{- end }}
{{- if .Values.openbao.enabled }}
{{- $names = append $names (include "loco-control-plane.openbaoName" .) }}
{{- end }}
{{- range $name := $names }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: {{ $name }}
{{- end }}
