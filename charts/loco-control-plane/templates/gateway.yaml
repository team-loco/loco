{{- if .Values.gateway.create }}
{{- $listeners := include "loco-control-plane.listeners" . | fromJsonArray }}
{{- $tlsSecret := include "loco-control-plane.tlsSecret" . }}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gateway.className }}
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Values.gatewayNamespace }}
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        {{- if not .Values.gateway.autoscaling.enabled }}
        replicas: {{ .Values.gateway.replicaCount }}
        {{- end }}
        pod:
          topologySpreadConstraints:
            {{- include "loco-control-plane.spreadByNode" (dict "gateway.envoyproxy.io/owning-gateway-name" .Values.gateway.name "gateway.envoyproxy.io/owning-gateway-namespace" .Values.gatewayNamespace) | nindent 12 }}
        container:
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
      {{- with .Values.gateway.autoscaling }}
      {{- if .enabled }}
      envoyHpa:
        minReplicas: {{ .minReplicas }}
        maxReplicas: {{ .maxReplicas }}
        metrics:
          - type: Resource
            resource:
              name: cpu
              target:
                type: Utilization
                averageUtilization: {{ .targetCPUUtilizationPercentage }}
      {{- end }}
      {{- end }}
      {{- if ge (int (ternary .Values.gateway.autoscaling.minReplicas .Values.gateway.replicaCount .Values.gateway.autoscaling.enabled)) 2 }}
      envoyPDB:
        maxUnavailable: 1
      {{- end }}
      {{- with .Values.gateway.service }}
      envoyService:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Values.gatewayNamespace }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: {{ .Values.gateway.name }}
  listeners:
    {{- range $listeners }}
    {{- if $tlsSecret }}
    - name: https-{{ .name }}
      hostname: {{ .hostname | quote }}
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ $tlsSecret }}
            kind: Secret
            group: ""
    {{- else }}
    - name: http-{{ .name }}
      hostname: {{ .hostname | quote }}
      protocol: HTTP
      port: 80
    {{- end }}
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Release.Namespace }}
    {{- end }}
{{- with .Values.gateway.tls.minVersion }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: {{ $.Values.gateway.name }}
  namespace: {{ $.Values.gatewayNamespace }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $.Values.gateway.name }}
  tls:
    minVersion: {{ . | quote }}
{{- end }}
{{- end }}
