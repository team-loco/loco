{{- if .Values.obsProxy.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-obs-proxy-query
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-obs-proxy-query
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}-obs-proxy-query
  replicas: {{ .Values.obsProxy.query.replicaCount }}
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-obs-proxy-query
        app.kubernetes.io/component: observability-proxy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: obs-proxy-query
          image: "{{ .Values.obsProxy.image.repository }}:{{ required "obsProxy.image.tag is required" .Values.obsProxy.image.tag }}"
          imagePullPolicy: {{ .Values.obsProxy.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: PORT
              value: {{ .Values.obsProxy.query.port | quote }}
            - name: CONTROL_PLANE_URL
              value: {{ include "loco-control-plane.apiURL" . | quote }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ join "," .Values.obsProxy.query.cors.allowedOrigins | quote }}
            - name: CLICKHOUSE_DB
              value: {{ .Values.clickhouse.clickhouse.database | quote }}
            - name: CLICKHOUSE_URL
              valueFrom:
                secretKeyRef:
                  {{- include "loco-control-plane.clickhouseURL" (dict "root" . "grant" "GRANT SELECT" "path" "obsProxy.query.clickhouse.existingSecret" "secret" .Values.obsProxy.query.clickhouse.existingSecret) | nindent 18 }}
            - name: CLICKHOUSE_MIGRATOR_URL
              valueFrom:
                secretKeyRef:
                  {{- include "loco-control-plane.clickhouseURL" (dict "root" . "grant" "GRANT ALL" "path" "obsProxy.query.clickhouse.migratorExistingSecret" "secret" .Values.obsProxy.query.clickhouse.migratorExistingSecret) | nindent 18 }}
          ports:
            - containerPort: {{ .Values.obsProxy.query.port }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.obsProxy.query.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.obsProxy.query.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.obsProxy.query.resources | nindent 12 }}
      restartPolicy: Always
{{- end }}
