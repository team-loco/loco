{{- if .Values.clickhouse.enabled }}
{{- $name := printf "%s-clickhouse-credentials" .Release.Name }}
{{- $credentials := list (dict "name" .Values.clickhouse.operator.fullnameOverride "user" .Values.clickhouse.operator.secret.username "server" "") }}
{{- range .Values.clickhouse.clickhouse.users }}
{{- $credentials = append $credentials (dict "name" .password_secret_name "user" .name "server" (printf "clickhouse-%s.%s.svc.cluster.local" $.Values.clickhouse.fullnameOverride $.Release.Namespace)) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
data:
  create.sh: {{ .Files.Get "files/clickhouse-credentials.sh" | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames:
      {{- range $credentials }}
      - {{ .name | quote }}
      {{- end }}
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-%d" $name .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.toolkit.fluxcd.io/driftDetection: disabled
spec:
  ttlSecondsAfterFinished: {{ .Values.setup.ttlSecondsAfterFinished }}
  activeDeadlineSeconds: {{ .Values.setup.timeoutSeconds }}
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        {{- range $i, $credential := $credentials }}
        - name: {{ printf "credential-%d" $i }}
          image: {{ $.Values.openbao.curlImage | quote }}
          command: [sh, /scripts/create.sh]
          env:
            - name: SECRET_NAME
              value: {{ $credential.name | quote }}
            - name: USERNAME_JSON
              value: {{ $credential.user | toJson | quote }}
            - name: URL_USERNAME
              value: {{ $credential.user | urlquery | replace "+" "%20" | quote }}
            - name: SERVER
              value: {{ $credential.server | quote }}
            - name: NAMESPACE
              value: {{ $.Release.Namespace | quote }}
            - name: REQUEST_TIMEOUT
              value: {{ $.Values.setup.requestTimeoutSeconds | quote }}
          securityContext:
            {{- include "loco-control-plane.restrictedContainer" $ | nindent 12 }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: work
              mountPath: /work
        {{- end }}
      volumes:
        - name: scripts
          configMap:
            name: {{ $name }}
        - name: work
          emptyDir:
            medium: Memory
{{- end }}
