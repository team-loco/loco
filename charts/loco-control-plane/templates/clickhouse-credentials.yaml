{{- if .Values.clickhouse.enabled }}
{{- $credentials := list (dict "name" .Values.clickhouse.operator.fullnameOverride "user" .Values.clickhouse.operator.secret.username "server" "") }}
{{- range .Values.clickhouse.clickhouse.users }}
{{- $credentials = append $credentials (dict "name" .password_secret_name "user" .name "server" (printf "clickhouse-%s.%s.svc.cluster.local" $.Values.clickhouse.fullnameOverride $.Release.Namespace)) }}
{{- end }}
{{- range $credentials }}
{{- $existing := lookup "v1" "Secret" $.Release.Namespace .name }}
{{- $data := dict }}
{{- if $existing }}
{{- $data = $existing.data }}
{{- else }}
{{- $password := randBytes 32 | sha256sum }}
{{- $_ := set $data "password" ($password | b64enc) }}
{{- if .server }}
{{- $username := .user | urlquery | replace "+" "%20" }}
{{- $_ := set $data "url" (printf "clickhouse://%s:%s@%s:9000" $username $password .server | b64enc) }}
{{- else }}
{{- $_ := set $data "username" (.user | b64enc) }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- toYaml $data | nindent 2 }}
{{- end }}
{{- end }}
