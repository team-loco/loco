{{- $gatewayTracing := include "loco-control-plane.gatewayTracing" . }}
{{- if and $gatewayTracing (ne .Values.gatewayNamespace .Release.Namespace) }}
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: {{ .Release.Name }}-gateway-tracing
  namespace: {{ .Release.Namespace }}
spec:
  from:
    - group: gateway.envoyproxy.io
      kind: EnvoyProxy
      namespace: {{ .Values.gatewayNamespace }}
  to:
    - group: ""
      kind: Service
      name: {{ .Release.Name }}-obs-proxy-ingest
{{- end }}
