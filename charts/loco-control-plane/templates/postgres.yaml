{{- with .Values.postgres }}
{{- if .enabled }}
{{- $cluster := include "loco-control-plane.postgresCluster" $ }}
{{- $backup := .backup }}
{{- $store := dict }}
{{- if $backup.enabled }}
{{- $s3 := $backup.s3 }}
{{- $store = dict
  "destinationPath" (printf "s3://%s/%s" (required "postgres.backup.s3.bucket is required" $s3.bucket) $s3.prefix)
  "endpointURL" (required "postgres.backup.s3.endpoint is required" $s3.endpoint)
  "s3Credentials" (dict
    "accessKeyId" (dict "name" (required "postgres.backup.s3.existingSecret.name is required" $s3.existingSecret.name) "key" $s3.existingSecret.accessKeyIdKey)
    "secretAccessKey" (dict "name" $s3.existingSecret.name "key" $s3.existingSecret.secretAccessKeyKey))
  "wal" (dict "compression" "gzip")
  "data" (dict "compression" "gzip") }}
{{- end }}
{{- if and .recoverFrom (not $store) }}
{{- fail "postgres.recoverFrom needs postgres.backup.enabled and its bucket" }}
{{- end }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ $cluster }}
  namespace: {{ $.Release.Namespace }}
  # Uninstalling the release or disabling postgres leaves the database and its volumes in place.
  annotations:
    helm.sh/resource-policy: keep
spec:
  instances: {{ .instances }}
  imageName: {{ .image | quote }}
  storage:
    size: {{ .storage.size | quote }}
    {{- with .storage.storageClass }}
    storageClass: {{ . | quote }}
    {{- end }}
  resources:
    {{- toYaml .resources | nindent 4 }}
  bootstrap:
    {{- if .recoverFrom }}
    recovery:
      source: backup
      database: loco
      owner: loco
    {{- else }}
    initdb:
      database: loco
      owner: loco
    {{- end }}
  {{- if .recoverFrom }}
  externalClusters:
    - name: backup
      barmanObjectStore:
        {{- toYaml (merge (dict "serverName" .recoverFrom) $store) | nindent 8 }}
  {{- end }}
  {{- if $store }}
  backup:
    retentionPolicy: {{ $backup.retention | quote }}
    barmanObjectStore:
      {{- with $backup.serverName }}
      serverName: {{ . | quote }}
      {{- end }}
      {{- toYaml $store | nindent 6 }}
  {{- end }}
  {{- with .databases }}
  managed:
    roles:
      {{- range . }}
      - name: {{ .owner | quote }}
        ensure: present
        login: true
        superuser: false
        createrole: {{ .createRole | default false }}
        passwordSecret:
          name: {{ .passwordSecret | quote }}
      {{- end }}
  {{- end }}
{{- range .databases }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: {{ printf "%s-%s" $cluster (.name | replace "_" "-") }}
  namespace: {{ $.Release.Namespace }}
spec:
  name: {{ .name | quote }}
  owner: {{ .owner | quote }}
  ensure: present
  cluster:
    name: {{ $cluster }}
{{- end }}
{{- if $store }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ $cluster }}
  namespace: {{ $.Release.Namespace }}
spec:
  schedule: {{ $backup.schedule | quote }}
  immediate: true
  backupOwnerReference: self
  method: barmanObjectStore
  cluster:
    name: {{ $cluster }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $cluster }}
  namespace: {{ $.Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ $cluster }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: {{ $.Release.Name }}-api
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ $cluster }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .operatorNamespace }}
        {{- with .clients }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .operatorNamespace }}
      ports:
        - protocol: TCP
          port: 8000
{{- end }}
{{- end }}
