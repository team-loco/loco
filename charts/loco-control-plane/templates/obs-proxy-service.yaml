{{- if .Values.obsProxy.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-obs-proxy
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: {{ .Release.Name }}-obs-proxy
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: {{ .Values.obsProxy.port }}
{{- end }}
