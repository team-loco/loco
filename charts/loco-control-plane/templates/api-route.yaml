apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-api
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: eg
      namespace: {{ .Values.gatewayNamespace }}
  hostnames:
    - {{ .Values.controlPlaneHostname | quote }}
  rules:
    - backendRefs:
        - name: {{ .Release.Name }}-api
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /
