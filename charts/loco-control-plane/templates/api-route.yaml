{{- if or (not .Values.ui.enabled) (ne .Values.ui.hostname .Values.controlPlaneHostname) }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-api
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    {{- include "loco-control-plane.gatewayRef" . | nindent 4 }}
  hostnames:
    - {{ .Values.controlPlaneHostname | quote }}
  rules:
    - name: api
      timeouts:
        request: 0s
      backendRefs:
        - name: {{ .Release.Name }}-api
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /
{{- end }}
