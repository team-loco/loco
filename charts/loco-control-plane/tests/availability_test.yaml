suite: availability
release:
  name: loco-control-plane
  namespace: loco-control-plane
values:
  - ../ci/default-values.yaml
templates:
  - templates/api-deployment.yaml
  - templates/obs-proxy-ingest-deployment.yaml
  - templates/ui.yaml
  - templates/openbao.yaml
  - templates/gateway.yaml
  - templates/scaling.yaml
tests:
  - it: runs one API replica and no API disruption budget by default
    asserts:
      - equal:
          path: spec.replicas
          value: 1
        template: templates/api-deployment.yaml
      - containsDocument: {kind: PodDisruptionBudget, apiVersion: policy/v1, name: loco-control-plane-api}
        template: templates/scaling.yaml
        not: true

  - it: autoscales the ingest proxy from two replicas by default when the cluster serves the metrics API
    capabilities:
      apiVersions: [metrics.k8s.io/v1beta1]
    asserts:
      - notExists:
          path: spec.replicas
        template: templates/obs-proxy-ingest-deployment.yaml
      - equal:
          path: spec.minReplicas
          value: 2
        template: templates/scaling.yaml
        documentSelector: {path: kind, value: HorizontalPodAutoscaler}
      - equal:
          path: spec.scaleTargetRef.name
          value: loco-control-plane-obs-proxy-ingest
        template: templates/scaling.yaml
        documentSelector: {path: kind, value: HorizontalPodAutoscaler}

  - it: lets one pod of each multi-replica component go at a time
    asserts:
      - equal:
          path: spec
          value: {maxUnavailable: 1, selector: {matchLabels: {app: loco-control-plane-obs-proxy-ingest}}}
        template: templates/scaling.yaml
        documentSelector: {path: spec.selector.matchLabels.app, value: loco-control-plane-obs-proxy-ingest}
      - equal:
          path: spec
          value: {maxUnavailable: 1, selector: {matchLabels: {app: loco-control-plane-ui}}}
        template: templates/scaling.yaml
        documentSelector: {path: metadata.name, value: loco-control-plane-ui}
      - equal:
          path: spec
          value: {maxUnavailable: 1, selector: {matchLabels: {app: loco-control-plane-openbao}}}
        template: templates/scaling.yaml
        documentSelector: {path: metadata.name, value: loco-control-plane-openbao}

  - it: gives a component with one replica no disruption budget
    set:
      ui.replicaCount: 1
      obsProxy.ingest.autoscaling.enabled: false
      obsProxy.ingest.replicaCount: 1
      openbao.replicas: 1
    asserts:
      - hasDocuments: {count: 0}
        template: templates/scaling.yaml

  - it: runs two dashboard replicas
    template: templates/ui.yaml
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal:
          path: spec.replicas
          value: 2

  - it: spreads each component's pods across nodes and still schedules on one node
    asserts:
      - equal: &apiSpread
          path: spec.template.spec.topologySpreadConstraints
          value:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector: {matchLabels: {app: loco-control-plane-api}}
        template: templates/api-deployment.yaml
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].labelSelector.matchLabels
          value: {app: loco-control-plane-obs-proxy-ingest}
        template: templates/obs-proxy-ingest-deployment.yaml
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].labelSelector.matchLabels
          value: {app: loco-control-plane-ui}
        template: templates/ui.yaml
        documentSelector: {path: kind, value: Deployment}
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].labelSelector.matchLabels
          value: {app: loco-control-plane-openbao}
        template: templates/openbao.yaml
        documentSelector: {path: kind, value: StatefulSet}

  - it: autoscales the gateway's Envoy proxies from two with a disruption budget when the cluster serves the metrics API, and spreads them across nodes
    template: templates/gateway.yaml
    documentSelector: {path: kind, value: EnvoyProxy}
    capabilities:
      apiVersions: [metrics.k8s.io/v1beta1]
    asserts:
      - notExists:
          path: spec.provider.kubernetes.envoyDeployment.replicas
      - equal:
          path: spec.provider.kubernetes.envoyHpa
          value:
            minReplicas: 2
            maxReplicas: 6
            metrics:
              - type: Resource
                resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
      - equal:
          path: spec.provider.kubernetes.envoyPDB
          value: {maxUnavailable: 1}
      - equal:
          path: spec.provider.kubernetes.envoyDeployment.pod.topologySpreadConstraints[0]
          value:
            maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                gateway.envoyproxy.io/owning-gateway-name: loco-control-plane
                gateway.envoyproxy.io/owning-gateway-namespace: loco-system

  - it: runs a fixed number of gateway Envoy proxies when autoscaling is off
    template: templates/gateway.yaml
    documentSelector: {path: kind, value: EnvoyProxy}
    set:
      gateway.autoscaling.enabled: false
      gateway.replicaCount: 1
    asserts:
      - equal:
          path: spec.provider.kubernetes.envoyDeployment.replicas
          value: 1
      - notExists:
          path: spec.provider.kubernetes.envoyHpa
      - notExists:
          path: spec.provider.kubernetes.envoyPDB

  - it: runs two ingest proxies and two gateway Envoy proxies without autoscalers when the cluster serves no metrics API
    asserts:
      - equal:
          path: spec.replicas
          value: 2
        template: templates/obs-proxy-ingest-deployment.yaml
      - containsDocument: {kind: HorizontalPodAutoscaler, apiVersion: autoscaling/v2, name: loco-control-plane-obs-proxy-ingest}
        template: templates/scaling.yaml
        not: true
      - containsDocument: {kind: PodDisruptionBudget, apiVersion: policy/v1, name: loco-control-plane-obs-proxy-ingest, any: true}
        template: templates/scaling.yaml
      - equal:
          path: spec.provider.kubernetes.envoyDeployment.replicas
          value: 2
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: EnvoyProxy}
      - notExists:
          path: spec.provider.kubernetes.envoyHpa
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: EnvoyProxy}
      - equal:
          path: spec.provider.kubernetes.envoyPDB
          value: {maxUnavailable: 1}
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: EnvoyProxy}
