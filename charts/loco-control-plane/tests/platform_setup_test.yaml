suite: platform setup
release:
  name: regional
  namespace: loco-system
values:
  - ../ci/default-values.yaml
templates:
  - templates/openbao-setup.yaml
  - templates/api-deployment.yaml
tests:
  - it: cleans up the OpenBao setup Job after openbao.setup.ttlSecondsAfterFinished
    template: templates/openbao-setup.yaml
    documentSelector: {path: kind, value: Job}
    set:
      openbao.setup.ttlSecondsAfterFinished: 600
    asserts:
      - equal:
          path: spec.ttlSecondsAfterFinished
          value: 600
  - it: maps typed API settings to their environment variables
    template: templates/api-deployment.yaml
    set:
      api.limits.orgsPerUser: 4
      api.limits.secretsPerEnvironment: 24
      api.defaults.minReplicas: 2
      api.defaults.maxRestarts: 3
      api.defaults.deployTimeout: 300
      api.retention.events: 720h
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: LOCO_LIMIT_ORGS_PER_USER, value: '4'}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: LOCO_LIMIT_SECRETS_PER_ENVIRONMENT, value: '24'}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: LOCO_DEFAULT_MIN_REPLICAS, value: '2'}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: LOCO_DEFAULT_MAX_RESTARTS, value: '3'}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: LOCO_DEFAULT_DEPLOY_TIMEOUT, value: '300'}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: EVENTS_RETENTION, value: 720h}
  - it: takes the platform domain from the API hostname unless the values name one
    template: templates/api-deployment.yaml
    set:
      controlPlaneHostname: api.example.test
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: LOCO_PLATFORM_DOMAIN, value: example.test}
  - it: passes the platform domain the values name
    template: templates/api-deployment.yaml
    set:
      platformDomain: workers.example.test
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: LOCO_PLATFORM_DOMAIN, value: workers.example.test}
  - it: passes the default region the values name
    template: templates/api-deployment.yaml
    set:
      defaultRegion: us-ca-1
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: LOCO_DEFAULT_REGION, value: us-ca-1}
  - it: rejects duplicate typed and environment settings
    template: templates/api-deployment.yaml
    set:
      api.limits.orgsPerUser: 4
      api.env.LOCO_LIMIT_ORGS_PER_USER: '5'
    asserts:
      - failedTemplate:
          errorMessage: LOCO_LIMIT_ORGS_PER_USER is set in both api.env and a typed API setting
  - it: preserves zero image retention as an explicit value
    template: templates/api-deployment.yaml
    set:
      api.retention.images: 0
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: LOCO_IMAGE_RETENTION, value: '0'}
