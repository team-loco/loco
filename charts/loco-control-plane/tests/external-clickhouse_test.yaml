suite: external clickhouse
release:
  name: loco-control-plane
  namespace: loco-control-plane
values:
  - ../ci/default-values.yaml
set:
  ui.enabled: false
  certManager.enabled: false
templates:
  - "**/*"
tests:
  - it: renders no ClickHouse server, credentials or ClickHouse network policy
    asserts:
      - isKind:
          of: ClickHouseInstallation
        not: true
      - isKind:
          of: Secret
        not: true
      - hasDocuments:
          count: 0
        template: templates/clickhouse.yaml

  - it: points the API and the proxy at the existing Secrets
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: CLICKHOUSE_URL, valueFrom: {secretKeyRef: {name: loco-api-clickhouse-reader, key: url}}}
        template: templates/api-deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: CLICKHOUSE_INGEST_URL, valueFrom: {secretKeyRef: {name: loco-obs-proxy-ingest, key: url}}}
        template: templates/obs-proxy-ingest-deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: CLICKHOUSE_MIGRATOR_URL, valueFrom: {secretKeyRef: {name: loco-obs-proxy-migrator, key: url}}}
        template: templates/obs-proxy-ingest-deployment.yaml
