suite: openbao
release:
  name: loco-control-plane
  namespace: loco-control-plane
values:
  - ../ci/default-values.yaml
templates:
  - templates/openbao.yaml
  - templates/openbao-setup.yaml
  - templates/openbao-tls.yaml
  - templates/openbao-snapshot.yaml
  - templates/api-deployment.yaml
  - templates/api-service-account.yaml
tests:
  - it: runs the pinned image as a raft StatefulSet with a volume per node
    template: templates/openbao.yaml
    documentSelector: {path: kind, value: StatefulSet}
    asserts:
      - equal:
          path: spec.replicas
          value: 3
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: ^quay\.io/openbao/openbao:[^@]+@sha256:[a-f0-9]{64}$
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 10Gi

  - it: lists every node as a raft join target over TLS
    template: templates/openbao.yaml
    documentSelector: {path: kind, value: ConfigMap}
    asserts:
      - matchRegex:
          path: data["config.hcl"]
          pattern: 'leader_api_addr     = "https://loco-control-plane-openbao-2\.loco-control-plane-openbao-peers\.loco-control-plane\.svc\.cluster\.local:8200"'
      - matchRegex:
          path: data["config.hcl"]
          pattern: 'leader_ca_cert_file = "/openbao/tls/ca\.crt"'
      - notMatchRegex:
          path: data["config.hcl"]
          pattern: tls_disable

  - it: joins only itself with one replica
    set:
      openbao.replicas: 1
    template: templates/openbao.yaml
    documentSelector: {path: kind, value: ConfigMap}
    asserts:
      - notMatchRegex:
          path: data["config.hcl"]
          pattern: openbao-1\.
      - matchRegex:
          path: data["config.hcl"]
          pattern: openbao-0\.

  - it: serves TLS from the certificate cert-manager issues from the chart CA
    template: templates/openbao-tls.yaml
    asserts:
      - equal:
          path: spec.isCA
          value: true
        documentSelector: {path: spec.secretName, value: loco-control-plane-openbao-ca}
      - equal:
          path: spec.issuerRef
          value: {kind: Issuer, name: loco-control-plane-openbao-ca}
        documentSelector: {path: metadata.name, value: loco-control-plane-openbao-tls}
      - contains:
          path: spec.dnsNames
          content: "*.loco-control-plane-openbao-peers.loco-control-plane.svc.cluster.local"
        documentSelector: {path: metadata.name, value: loco-control-plane-openbao-tls}

  - it: mounts the serving certificate and probes over HTTPS
    template: templates/openbao.yaml
    documentSelector: {path: kind, value: StatefulSet}
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content: {name: tls, secret: {secretName: loco-control-plane-openbao-tls, defaultMode: 0440}}
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.scheme
          value: HTTPS

  - it: reads the static seal key from the operator's Secret
    template: templates/openbao.yaml
    asserts:
      - matchRegex:
          path: data["config.hcl"]
          pattern: 'current_key    = "file:///openbao/seal/key"'
        documentSelector: {path: kind, value: ConfigMap}
      - contains:
          path: spec.template.spec.volumes
          content: {name: seal, secret: {secretName: loco-openbao-seal, items: [{key: key, path: key}]}}
        documentSelector: {path: kind, value: StatefulSet}

  - it: requires the static seal Secret
    set:
      openbao.seal.static.existingSecret.name: ""
    template: templates/openbao.yaml
    asserts:
      - failedTemplate:
          errorMessage: openbao.seal.static.existingSecret.name is required

  - it: renders the awskms seal from values
    set:
      openbao.seal.type: awskms
      openbao.seal.awskms: {region: eu-west-1, kmsKeyId: alias/loco, existingSecret: aws}
    template: templates/openbao.yaml
    asserts:
      - matchRegex:
          path: data["config.hcl"]
          pattern: 'kms_key_id = "alias/loco"'
        documentSelector: {path: kind, value: ConfigMap}
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value: [{secretRef: {name: aws}}]
        documentSelector: {path: kind, value: StatefulSet}

  - it: renders the transit seal from values
    set:
      openbao.seal.type: transit
      openbao.seal.transit: {address: "https://seal.test:8200", key: unseal, existingSecret: {name: seal-token}}
    template: templates/openbao.yaml
    asserts:
      - matchRegex:
          path: data["config.hcl"]
          pattern: 'key_name   = "unseal"'
        documentSelector: {path: kind, value: ConfigMap}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: BAO_TOKEN, valueFrom: {secretKeyRef: {name: seal-token, key: token}}}
        documentSelector: {path: kind, value: StatefulSet}

  - it: rejects an unknown seal type
    set:
      openbao.seal.type: shamir
    template: templates/openbao.yaml
    asserts:
      - failedTemplate:
          errorPattern: "openbao/seal/type"

  - it: admits only the API, the setup Job and the other nodes
    template: templates/openbao.yaml
    documentSelector: {path: kind, value: NetworkPolicy}
    asserts:
      - equal:
          path: spec.ingress[0].from
          value:
            - podSelector: {matchLabels: {app: loco-control-plane-api}}
            - podSelector: {matchLabels: {app: loco-control-plane-openbao-setup}}
            - podSelector: {matchLabels: {app: loco-control-plane-openbao-snapshot}}
      - equal:
          path: spec.ingress[1]
          value:
            from: [{podSelector: {matchLabels: {app: loco-control-plane-openbao}}}]
            ports: [{protocol: TCP, port: 8200}, {protocol: TCP, port: 8201}]

  - it: runs a new setup Job with the release on every install and upgrade
    template: templates/openbao-setup.yaml
    documentSelector: {path: kind, value: Job}
    release:
      revision: 7
    asserts:
      - equal:
          path: metadata.name
          value: loco-control-plane-openbao-setup-7
      - notExists:
          path: metadata.annotations
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: curlimages/curl:8.23.0@sha256:11e64e28c5f58c8d93ee95fcf22ac055f48b0bc440e0ce7d8013bbb5ad6aa8ac
      - contains:
          path: spec.template.spec.initContainers[1].env
          content: {name: OPENBAO_PREVIOUS_INIT, value: /init-secret/recovery-keys}
      - contains:
          path: spec.template.spec.initContainers[1].env
          content: {name: OPENBAO_GENERATE_ROOT_TOKEN_FILE, value: /work/generate-root-token}

  - it: proves it can write the init Secret before initializing and stores the output in the same pod
    template: templates/openbao-setup.yaml
    documentSelector: {path: kind, value: Job}
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].command
          value: [sh, /scripts/openbao-init-secret.sh, prepare]
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: init
      - equal:
          path: spec.template.spec.initContainers[2].command
          value: [sh, /scripts/openbao-init-secret.sh, store]
      - contains:
          path: spec.template.spec.initContainers[2].env
          content: {name: INIT_SECRET_PATCH, value: /work/init-secret.json}
      - contains:
          path: spec.template.spec.initContainers[1].env
          content: {name: INIT_SECRET_PATCH, value: /work/init-secret.json}
      - equal:
          path: spec.template.spec.restartPolicy
          value: OnFailure

  - it: ships the init Secret script in the setup ConfigMap
    template: templates/openbao-setup.yaml
    documentSelector: {path: kind, value: ConfigMap}
    asserts:
      - isNotNullOrEmpty:
          path: data["openbao-init-secret.sh"]

  - it: lets the setup role tell a lost init output from a failed login
    template: templates/openbao-setup.yaml
    documentSelector: {path: kind, value: Job}
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: OPENBAO_PREVIOUS_INIT, value: /init-secret/recovery-keys}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: INIT_SECRET, value: loco-control-plane-openbao-init}
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: {name: init-secret, mountPath: /init-secret, readOnly: true}

  - it: verifies OpenBao against the chart CA and logs in later runs with its own role
    template: templates/openbao-setup.yaml
    documentSelector: {path: kind, value: Job}
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: BAO_ADDR, value: "https://loco-control-plane-openbao-0.loco-control-plane-openbao-peers.loco-control-plane.svc.cluster.local:8200"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: BAO_CACERT, value: /var/run/secrets/openbao-ca/ca.crt}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: OPENBAO_SETUP_ROLE, value: loco-setup}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: OPENBAO_SETUP_SERVICE_ACCOUNT, value: loco-control-plane-openbao-setup}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: OPENBAO_API_SERVICE_ACCOUNT, value: loco-control-plane-api}

  - it: lets the setup Job create Secrets and patch only the init Secret
    template: templates/openbao-setup.yaml
    documentSelector: {path: kind, value: Role}
    asserts:
      - equal:
          path: rules
          value:
            - {apiGroups: [""], resources: [secrets], verbs: [create]}
            - {apiGroups: [""], resources: [secrets], resourceNames: [loco-control-plane-openbao-init], verbs: [patch]}

  - it: rejects a recovery threshold above the shares
    set:
      openbao.recovery: {shares: 1, threshold: 2}
    template: templates/openbao-setup.yaml
    asserts:
      - failedTemplate:
          errorMessage: openbao.recovery.threshold must be between 1 and openbao.recovery.shares

  - it: rejects a threshold of one with several shares
    set:
      openbao.recovery: {shares: 3, threshold: 1}
    template: templates/openbao-setup.yaml
    asserts:
      - failedTemplate:
          errorMessage: openbao.recovery.threshold must be at least 2 when openbao.recovery.shares is more than 1

  - it: points the API at the bundled OpenBao over TLS
    template: templates/api-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: LOCO_SECRETS_TRANSIT_ADDR, value: "https://loco-control-plane-openbao.loco-control-plane.svc.cluster.local:8200"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: LOCO_SECRETS_TRANSIT_CA_FILE, value: /var/run/secrets/openbao-ca/ca.crt}
      - contains:
          path: spec.template.spec.volumes
          content: {name: openbao-ca, secret: {secretName: loco-control-plane-openbao-tls, items: [{key: ca.crt, path: ca.crt}]}}
      - equal:
          path: spec.template.spec.serviceAccountName
          value: loco-control-plane-api

  - it: logs the API in with its projected ServiceAccount token
    template: templates/api-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: LOCO_SECRETS_TRANSIT_AUTH, value: kubernetes}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: LOCO_SECRETS_TRANSIT_KUBERNETES_ROLE, value: loco-api}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: LOCO_SECRETS_TRANSIT_KUBERNETES_TOKEN_FILE, value: /var/run/secrets/openbao/token}
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: LOCO_SECRETS_TRANSIT_TOKEN}
          any: true
      - contains:
          path: spec.template.spec.volumes
          content: {name: openbao-token, projected: {sources: [{serviceAccountToken: {path: token, expirationSeconds: 3600}}]}}
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: signs ingest tokens with the transit key the setup Job creates
    set:
      openbao.transit.ingestKey: region-ingest
      api.env: {LOCO_INGEST_TRANSIT_KEY: wrong}
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: LOCO_INGEST_TRANSIT_KEY, value: region-ingest}
        template: templates/api-deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: LOCO_INGEST_TRANSIT_KEY, value: wrong}
        template: templates/api-deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: LOCO_INGEST_TRANSIT_KEY, value: region-ingest}
        template: templates/openbao-setup.yaml
        documentSelector: {path: kind, value: Job}

  - it: requires an ingest signing key name
    set:
      openbao.transit.ingestKey: ""
    asserts:
      - failedTemplate:
          errorPattern: "/openbao/transit/ingestKey': minLength"

  - it: does not hand the API environment to the setup Job
    template: templates/openbao-setup.yaml
    documentSelector: {path: kind, value: Job}
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: LOCO_SECRETS_TRANSIT_TOKEN}
          any: true

  - it: takes a token for an external OpenBao without Kubernetes auth
    set:
      openbao.enabled: false
      openbao.external: {address: "https://bao.region.test:8200", tokenSecret: {name: bao-token}}
    template: templates/api-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: LOCO_SECRETS_TRANSIT_AUTH, value: token}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: LOCO_SECRETS_TRANSIT_TOKEN, valueFrom: {secretKeyRef: {name: bao-token, key: token}}}
      - notExists:
          path: spec.template.spec.volumes

  - it: renders no server for an external OpenBao and passes its address and CA
    set:
      openbao.enabled: false
      openbao.external: {address: "https://bao.region.test:8200", caSecret: {name: bao-ca}}
    asserts:
      - hasDocuments:
          count: 0
        template: templates/openbao.yaml
      - hasDocuments:
          count: 0
        template: templates/openbao-setup.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: LOCO_SECRETS_TRANSIT_ADDR, value: "https://bao.region.test:8200"}
        template: templates/api-deployment.yaml
      - contains:
          path: spec.template.spec.volumes
          content: {name: openbao-ca, secret: {secretName: bao-ca, items: [{key: ca.crt, path: ca.crt}]}}
        template: templates/api-deployment.yaml

  - it: requires an address for an external OpenBao
    set:
      openbao.enabled: false
    template: templates/api-deployment.yaml
    asserts:
      - failedTemplate:
          errorMessage: openbao.external.address is required when openbao.enabled is false

  - it: uploads raft snapshots on a schedule with the snapshot role
    template: templates/openbao-snapshot.yaml
    documentSelector: {path: kind, value: CronJob}
    asserts:
      - equal:
          path: spec.schedule
          value: "0 * * * *"
      - equal:
          path: spec.concurrencyPolicy
          value: Forbid
      - contains:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].env
          content: {name: OPENBAO_SNAPSHOT_ROLE, value: loco-snapshot}
      - contains:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].env
          content: {name: BAO_CACERT, value: /var/run/secrets/openbao-ca/ca.crt}
      - matchRegex:
          path: spec.jobTemplate.spec.template.spec.containers[0].image
          pattern: ^rclone/rclone:[^@]+@sha256:[a-f0-9]{64}$
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content: {name: SNAPSHOT_S3_BUCKET, value: loco-openbao-snapshots}
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content: {name: SNAPSHOT_RETENTION, value: 30d}
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content: {name: RCLONE_CONFIG_SNAPSHOTS_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: loco-openbao-snapshots-s3, key: secret-access-key}}}
      - equal:
          path: spec.jobTemplate.spec.template.spec.automountServiceAccountToken
          value: false

  - it: binds the snapshot role in the setup Job
    template: templates/openbao-setup.yaml
    documentSelector: {path: kind, value: Job}
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: OPENBAO_SNAPSHOT_SERVICE_ACCOUNT, value: loco-control-plane-openbao-snapshot}

  - it: requires the snapshot bucket
    set:
      openbao.snapshots.s3.bucket: ""
    template: templates/openbao-snapshot.yaml
    asserts:
      - failedTemplate:
          errorMessage: openbao.snapshots.s3.bucket is required

  - it: renders no snapshots when they are off
    set:
      openbao.snapshots.enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: templates/openbao-snapshot.yaml
      - notContains:
          path: spec.ingress[0].from
          content: {podSelector: {matchLabels: {app: loco-control-plane-openbao-snapshot}}}
        template: templates/openbao.yaml
        documentSelector: {path: kind, value: NetworkPolicy}
