suite: certificates
release:
  name: loco-control-plane
  namespace: loco-control-plane
values:
  - ../ci/default-values.yaml
  - values/hosts.yaml
set:
  gatewayNamespace: edge
templates:
  - templates/gateway.yaml
  - templates/cm-cert.yaml
  - templates/cm-issuer.yaml
tests:
  - it: renders configured solvers verbatim
    set:
      certManager.issuer.solvers: [{dns01: {route53: {region: us-east-1}}}]
    asserts:
      - equal:
          path: spec.acme.solvers
          value: [{dns01: {route53: {region: us-east-1}}}]
        template: templates/cm-issuer.yaml

  - it: requires solvers when it creates the ACME issuer
    set:
      certManager.issuer.solvers: []
    template: templates/cm-issuer.yaml
    asserts:
      - failedTemplate:
          errorMessage: certManager.issuer.solvers is required for an ACME issuer

  - it: issues from ACME with the operator's email by default
    template: templates/cm-issuer.yaml
    asserts:
      - equal:
          path: spec.acme.email
          value: ci@example.invalid

  - it: puts the Certificate in the gateway namespace
    template: templates/cm-cert.yaml
    asserts:
      - equal:
          path: metadata.namespace
          value: edge

  - it: issues the Certificate from the ClusterIssuer the chart renders
    asserts:
      - equal:
          path: spec.issuerRef
          value: {name: letsencrypt-prod, kind: ClusterIssuer}
        template: templates/cm-cert.yaml
      - equal:
          path: metadata.name
          value: letsencrypt-prod
        template: templates/cm-issuer.yaml
      - isKind: {of: ClusterIssuer}
        template: templates/cm-issuer.yaml

  - it: issues one Certificate per listener, each covering only that listener's hostname
    asserts:
      - hasDocuments: {count: 2}
        template: templates/cm-cert.yaml
      - equal:
          path: spec
          value:
            secretName: loco-control-plane-ui-tls
            issuerRef: {name: letsencrypt-prod, kind: ClusterIssuer}
            dnsNames: [app.region.test]
        template: templates/cm-cert.yaml
        documentSelector: {path: metadata.name, value: loco-control-plane-ui}
      - equal:
          path: spec
          value:
            secretName: loco-control-plane-api-tls
            issuerRef: {name: letsencrypt-prod, kind: ClusterIssuer}
            dnsNames: [api.region.test]
        template: templates/cm-cert.yaml
        documentSelector: {path: metadata.name, value: loco-control-plane-api}

  - it: serves each HTTPS listener from its own Certificate's Secret
    template: templates/gateway.yaml
    documentSelector: {path: kind, value: Gateway}
    asserts:
      - equal:
          path: spec.listeners[*].protocol
          value: HTTPS
      - equal:
          path: spec.listeners[0]
          value:
            name: https-ui
            hostname: app.region.test
            protocol: HTTPS
            port: 443
            tls: {mode: Terminate, certificateRefs: [{name: loco-control-plane-ui-tls, kind: Secret, group: ""}]}
            allowedRoutes:
              namespaces:
                from: Selector
                selector:
                  matchExpressions: [{key: kubernetes.io/metadata.name, operator: In, values: [loco-control-plane]}]
      - equal:
          path: spec.listeners[1].tls.certificateRefs
          value: [{name: loco-control-plane-api-tls, kind: Secret, group: ""}]
      - lengthEqual:
          path: spec.listeners
          count: 2

  - it: issues the ingest listener its own Certificate when ingest is published
    set:
      obsProxy.ingest.hostname: ingest.region.test
    asserts:
      - equal:
          path: spec.dnsNames
          value: [ingest.region.test]
        template: templates/cm-cert.yaml
        documentSelector: {path: spec.secretName, value: loco-control-plane-ingest-tls}
      - equal:
          path: spec.listeners[2].tls.certificateRefs
          value: [{name: loco-control-plane-ingest-tls, kind: Secret, group: ""}]
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: Gateway}

  - it: issues each extra listener its own Certificate
    set:
      gateway.extraListeners: [{hostname: auth.region.test}, {hostname: login.region.test}]
    asserts:
      - hasDocuments: {count: 4}
        template: templates/cm-cert.yaml
      - equal:
          path: spec
          value:
            secretName: loco-control-plane-login.region.test-tls
            issuerRef: {name: letsencrypt-prod, kind: ClusterIssuer}
            dnsNames: [login.region.test]
        template: templates/cm-cert.yaml
        documentSelector: {path: metadata.name, value: loco-control-plane-login.region.test}
      - equal:
          path: spec.listeners[3].tls.certificateRefs
          value: [{name: loco-control-plane-login.region.test-tls, kind: Secret, group: ""}]
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: Gateway}

  - it: needs no solvers or email for a self-signed issuer
    set:
      certManager.issuer: {type: selfSigned, email: "", name: local, solvers: []}
    asserts:
      - equal:
          path: spec
          value: {selfSigned: {}}
        template: templates/cm-issuer.yaml
      - equal:
          path: spec.issuerRef.name
          value: local
        template: templates/cm-cert.yaml

  - it: renders only the Certificate for an existing issuer, without solvers
    set:
      certManager.issuer: {create: false, name: shared, kind: Issuer, solvers: []}
    asserts:
      - hasDocuments: {count: 0}
        template: templates/cm-issuer.yaml
      - equal:
          path: spec.issuerRef
          value: {name: shared, kind: Issuer}
        template: templates/cm-cert.yaml

  - it: requires an email for the ACME issuer
    set:
      certManager.issuer.email: ""
    asserts:
      - failedTemplate:
          errorMessage: certManager.issuer.email is required
        template: templates/cm-issuer.yaml

  - it: renders no cert-manager objects with an existing TLS Secret, and serves that Secret
    set:
      gateway.tlsSecretName: regional-tls
      certManager.issuer.solvers: []
    asserts:
      - hasDocuments: {count: 0}
        template: templates/cm-cert.yaml
      - hasDocuments: {count: 0}
        template: templates/cm-issuer.yaml
      - equal:
          path: spec.listeners[*].tls.certificateRefs[0].name
          value: regional-tls
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: Gateway}

  - it: serves plain HTTP on port 80 without cert-manager objects
    set:
      certManager.enabled: false
    asserts:
      - hasDocuments: {count: 0}
        template: templates/cm-cert.yaml
      - hasDocuments: {count: 0}
        template: templates/cm-issuer.yaml
      - equal:
          path: spec.listeners[*].protocol
          value: HTTP
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: Gateway}
      - equal:
          path: spec.listeners[*].port
          value: 80
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: Gateway}
      - notExists:
          path: spec.listeners[*].tls
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: Gateway}

  - it: renders no Certificate for an existing Gateway
    set:
      gateway: {create: false, name: eg}
    asserts:
      - hasDocuments: {count: 0}
        template: templates/cm-cert.yaml
      - hasDocuments: {count: 0}
        template: templates/cm-issuer.yaml

  - it: creates a declared self-signed issuer for workers while the Gateway serves HTTP
    set:
      certManager.enabled: false
      certManager.issuer: {create: true, type: selfSigned, name: shared-local}
    asserts:
      - equal:
          path: metadata.name
          value: shared-local
        template: templates/cm-issuer.yaml
      - equal:
          path: spec
          value: {selfSigned: {}}
        template: templates/cm-issuer.yaml
      - hasDocuments: {count: 0}
        template: templates/cm-cert.yaml
      - equal:
          path: spec.listeners[*].protocol
          value: HTTP
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: Gateway}

  - it: creates a declared self-signed issuer without creating a Gateway
    set:
      gateway.create: false
      certManager.issuer: {create: true, type: selfSigned, name: shared-local}
    asserts:
      - equal:
          path: spec
          value: {selfSigned: {}}
        template: templates/cm-issuer.yaml
      - hasDocuments: {count: 0}
        template: templates/cm-cert.yaml
