suite: postgres
release:
  name: loco-control-plane
  namespace: loco-control-plane
values:
  - ../ci/default-values.yaml
templates:
  - templates/postgres.yaml
  - templates/api-deployment.yaml
tests:
  - it: renders no database by default and leaves DATABASE_URL to the API Secret
    asserts:
      - hasDocuments: {count: 0}
        template: templates/postgres.yaml
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: DATABASE_URL}
          any: true
        template: templates/api-deployment.yaml

  - it: creates a CloudNativePG cluster with the API database
    set:
      postgres.enabled: true
    template: templates/postgres.yaml
    documentSelector: {path: kind, value: Cluster}
    asserts:
      - equal:
          path: metadata.name
          value: loco-control-plane-postgres
      - equal:
          path: metadata.annotations
          value: {helm.sh/resource-policy: keep}
      - equal:
          path: spec.instances
          value: 2
      - equal:
          path: spec.bootstrap
          value: {initdb: {database: loco, owner: loco}}
      - equal:
          path: spec.storage
          value: {size: 10Gi}
      - matchRegex:
          path: spec.imageName
          pattern: ^ghcr\.io/cloudnative-pg/postgresql:[^@]+@sha256:[a-f0-9]{64}$
      - notExists:
          path: spec.backup
      - notExists:
          path: spec.managed

  - it: passes instances, storage and resources through
    set:
      postgres.enabled: true
      postgres.instances: 3
      postgres.storage: {size: 50Gi, storageClass: fast}
      postgres.resources: {requests: {cpu: "1", memory: 2Gi}, limits: {memory: 4Gi}}
    template: templates/postgres.yaml
    documentSelector: {path: kind, value: Cluster}
    asserts:
      - equal:
          path: spec.instances
          value: 3
      - equal:
          path: spec.storage
          value: {size: 50Gi, storageClass: fast}
      - equal:
          path: spec.resources
          value: {requests: {cpu: "1", memory: 2Gi}, limits: {memory: 4Gi}}

  - it: reads the API's DATABASE_URL from the cluster's app Secret
    set:
      postgres.enabled: true
    template: templates/api-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            valueFrom: {secretKeyRef: {name: loco-control-plane-postgres-app, key: uri}}

  - it: refuses DATABASE_URL in api.env while the chart runs the database
    set:
      postgres.enabled: true
      api.env.DATABASE_URL: postgres://elsewhere
    template: templates/api-deployment.yaml
    asserts:
      - failedTemplate:
          errorMessage: api.env.DATABASE_URL cannot be set while postgres.enabled is true

  - it: backs up to the S3 bucket on a schedule
    set:
      postgres.enabled: true
      postgres.backup:
        enabled: true
        schedule: "0 0 3 * * *"
        retention: 14d
        s3:
          endpoint: https://s3.example.test
          bucket: backups
          prefix: pg
          existingSecret: {name: pg-s3}
    asserts:
      - equal:
          path: spec.backup
          value:
            retentionPolicy: 14d
            barmanObjectStore:
              destinationPath: s3://backups/pg
              endpointURL: https://s3.example.test
              s3Credentials:
                accessKeyId: {name: pg-s3, key: access-key-id}
                secretAccessKey: {name: pg-s3, key: secret-access-key}
              wal: {compression: gzip}
              data: {compression: gzip}
        template: templates/postgres.yaml
        documentSelector: {path: kind, value: Cluster}
      - equal:
          path: spec
          value:
            schedule: "0 0 3 * * *"
            immediate: true
            backupOwnerReference: self
            method: barmanObjectStore
            cluster: {name: loco-control-plane-postgres}
        template: templates/postgres.yaml
        documentSelector: {path: kind, value: ScheduledBackup}

  - it: requires a bucket and credentials for backups
    set:
      postgres.enabled: true
      postgres.backup.enabled: true
    template: templates/postgres.yaml
    asserts:
      - failedTemplate:
          errorMessage: postgres.backup.s3.bucket is required

  - it: archives under another server name and restores from an earlier one
    set:
      postgres.enabled: true
      postgres.backup:
        enabled: true
        serverName: loco-2
        s3: {endpoint: https://s3.example.test, bucket: backups, existingSecret: {name: pg-s3}}
      postgres.recoverFrom: loco-control-plane-postgres
    template: templates/postgres.yaml
    documentSelector: {path: kind, value: Cluster}
    asserts:
      - equal:
          path: spec.backup.barmanObjectStore.serverName
          value: loco-2
      - equal:
          path: spec.bootstrap
          value: {recovery: {source: backup, database: loco, owner: loco}}
      - equal:
          path: spec.externalClusters
          value:
            - name: backup
              barmanObjectStore:
                serverName: loco-control-plane-postgres
                destinationPath: s3://backups/postgres
                endpointURL: https://s3.example.test
                s3Credentials:
                  accessKeyId: {name: pg-s3, key: access-key-id}
                  secretAccessKey: {name: pg-s3, key: secret-access-key}
                wal: {compression: gzip}
                data: {compression: gzip}

  - it: refuses to restore without backups configured
    set:
      postgres.enabled: true
      postgres.recoverFrom: loco-control-plane-postgres
    template: templates/postgres.yaml
    asserts:
      - failedTemplate:
          errorMessage: postgres.recoverFrom needs postgres.backup.enabled and its bucket

  - it: adds a login role and a database for each extra database
    set:
      postgres.enabled: true
      postgres.databases:
        - {name: cp_auth, owner: cp_auth, createRole: true, passwordSecret: cp-auth-db}
        - {name: reports, owner: reporter, passwordSecret: reports-db}
    asserts:
      - equal:
          path: spec.managed.roles
          value:
            - {name: cp_auth, ensure: present, login: true, superuser: false, createrole: true, passwordSecret: {name: cp-auth-db}}
            - {name: reporter, ensure: present, login: true, superuser: false, createrole: false, passwordSecret: {name: reports-db}}
        template: templates/postgres.yaml
        documentSelector: {path: kind, value: Cluster}
      - equal:
          path: spec
          value: {name: cp_auth, owner: cp_auth, ensure: present, cluster: {name: loco-control-plane-postgres}}
        template: templates/postgres.yaml
        documentSelector: {path: metadata.name, value: loco-control-plane-postgres-cp-auth}
      - equal:
          path: spec.owner
          value: reporter
        template: templates/postgres.yaml
        documentSelector: {path: metadata.name, value: loco-control-plane-postgres-reports}

  - it: requires a password Secret for each extra database
    set:
      postgres.enabled: true
      postgres.databases: [{name: cp_auth, owner: cp_auth}]
    template: templates/postgres.yaml
    asserts:
      - failedTemplate: {}

  - it: admits the API, its own instances and the operator to Postgres
    set:
      postgres.enabled: true
    template: templates/postgres.yaml
    documentSelector: {path: kind, value: NetworkPolicy}
    asserts:
      - equal:
          path: spec.podSelector.matchLabels
          value: {cnpg.io/cluster: loco-control-plane-postgres}
      - equal:
          path: spec.ingress
          value:
            - from:
                - podSelector: {matchLabels: {app: loco-control-plane-api}}
                - podSelector: {matchLabels: {cnpg.io/cluster: loco-control-plane-postgres}}
                - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: cnpg-system}}
              ports: [{protocol: TCP, port: 5432}]
            - from:
                - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: cnpg-system}}
              ports: [{protocol: TCP, port: 8000}]

  - it: admits the clients the values name on the Postgres port
    set:
      postgres.enabled: true
      postgres.clients:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: sign-in}}
    template: templates/postgres.yaml
    documentSelector: {path: kind, value: NetworkPolicy}
    asserts:
      - contains:
          path: spec.ingress[0].from
          content: {namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: sign-in}}}
