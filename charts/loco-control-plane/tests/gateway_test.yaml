suite: gateway
release:
  name: loco-control-plane
  namespace: loco-control-plane
values:
  - ../ci/default-values.yaml
  - values/hosts.yaml
templates:
  - templates/gateway.yaml
  - templates/api-route.yaml
  - templates/ui.yaml
  - templates/obs-proxy-ingest-route.yaml
  - templates/obs-proxy-ingest-network-policy.yaml
  - templates/cm-cert.yaml
  - templates/cm-issuer.yaml
tests:
  - it: creates its Gateway and GatewayClass in the gateway namespace
    set:
      gatewayNamespace: edge
      certManager.enabled: false
    asserts:
      - equal:
          path: metadata.namespace
          value: edge
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: Gateway}
      - equal:
          path: spec.gatewayClassName
          value: loco-control-plane
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: Gateway}
      - equal:
          path: spec.controllerName
          value: gateway.envoyproxy.io/gatewayclass-controller
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: GatewayClass}

  - it: listens on each hostname
    set:
      certManager.enabled: false
    template: templates/gateway.yaml
    documentSelector: {path: kind, value: Gateway}
    asserts:
      - lengthEqual:
          path: spec.listeners
          count: 2
      - contains:
          path: spec.listeners
          content: {hostname: app.region.test, protocol: HTTP, port: 80}
          any: true
      - contains:
          path: spec.listeners
          content: {hostname: api.region.test, protocol: HTTP, port: 80}
          any: true

  - it: admits routes only from the release namespace
    set:
      gatewayNamespace: edge
      certManager.enabled: false
    template: templates/gateway.yaml
    documentSelector: {path: kind, value: Gateway}
    asserts:
      - equal:
          path: spec.listeners[*].allowedRoutes.namespaces.selector.matchExpressions
          value: [{key: kubernetes.io/metadata.name, operator: In, values: [loco-control-plane]}]

  - it: attaches every route to the chart's Gateway
    set:
      gatewayNamespace: edge
      certManager.enabled: false
      obsProxy.ingest.hostname: ingest.region.test
    asserts:
      - equal: &chartGateway
          path: spec.parentRefs
          value: [{name: loco-control-plane, namespace: edge}]
        template: templates/api-route.yaml
      - equal: *chartGateway
        template: templates/ui.yaml
        documentSelector: {path: kind, value: HTTPRoute}
      - equal: *chartGateway
        template: templates/obs-proxy-ingest-route.yaml

  - it: runs the Gateway on the chart's EnvoyProxy with Envoy's default Service settings
    set:
      certManager.enabled: false
    template: templates/gateway.yaml
    asserts:
      - equal:
          path: spec.infrastructure.parametersRef
          value: {group: gateway.envoyproxy.io, kind: EnvoyProxy, name: loco-control-plane}
        documentSelector: {path: kind, value: Gateway}
      - notExists:
          path: spec.provider.kubernetes.envoyService
        documentSelector: {path: kind, value: EnvoyProxy}

  - it: passes the Envoy Service settings the values give
    set:
      gateway.service: {type: NodePort, externalTrafficPolicy: Cluster}
    template: templates/gateway.yaml
    documentSelector: {path: kind, value: EnvoyProxy}
    asserts:
      - equal:
          path: spec.provider.kubernetes.envoyService
          value: {type: NodePort, externalTrafficPolicy: Cluster}

  - it: reserves Envoy's measured CPU and bounds its memory without a CPU limit
    template: templates/gateway.yaml
    documentSelector: {path: kind, value: EnvoyProxy}
    asserts:
      - equal:
          path: spec.provider.kubernetes.envoyDeployment.container.resources
          value: {requests: {cpu: 200m, memory: 256Mi}, limits: {memory: 1Gi}}

  - it: serves HTTPS on 443 from the TLS Secret the values name
    set:
      gateway.tlsSecretName: regional-tls
    template: templates/gateway.yaml
    documentSelector: {path: kind, value: Gateway}
    asserts:
      - equal:
          path: spec.listeners[*].protocol
          value: HTTPS
      - equal:
          path: spec.listeners[*].port
          value: 443
      - equal:
          path: spec.listeners[*].tls.certificateRefs
          value: [{name: regional-tls, kind: Secret, group: ""}]

  - it: gives a hostname the dashboard and API share one listener
    set:
      controlPlaneHostname: app.region.test
      certManager.enabled: false
    template: templates/gateway.yaml
    documentSelector: {path: kind, value: Gateway}
    asserts:
      - equal:
          path: spec.listeners[*].hostname
          value: app.region.test
      - lengthEqual:
          path: spec.listeners
          count: 1

  - it: references an existing Gateway without creating one
    set:
      gateway: {create: false, name: eg}
    asserts:
      - hasDocuments: {count: 0}
        template: templates/gateway.yaml
      - equal: &existingGateway
          path: spec.parentRefs
          value: [{name: eg, namespace: loco-system}]
        template: templates/api-route.yaml
      - equal: *existingGateway
        template: templates/ui.yaml
        documentSelector: {path: kind, value: HTTPRoute}

  - it: publishes ingest at its hostname through the Gateway
    set:
      obsProxy.ingest.hostname: ingest.region.test
    asserts:
      - contains:
          path: spec.listeners
          content: {hostname: ingest.region.test}
          any: true
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: Gateway}
      - equal:
          path: spec.hostnames
          value: [ingest.region.test]
        template: templates/obs-proxy-ingest-route.yaml
      - equal:
          path: spec.rules
          value:
            - matches: [{path: {type: PathPrefix, value: /v1/}}]
              backendRefs: [{name: loco-control-plane-obs-proxy-ingest, port: 4318}]
        template: templates/obs-proxy-ingest-route.yaml
      - equal:
          path: spec.ingress[1].from[0].namespaceSelector.matchLabels
          value: {kubernetes.io/metadata.name: loco-system}
        template: templates/obs-proxy-ingest-network-policy.yaml
      - equal:
          path: spec.ingress[1].ports
          value: [{protocol: TCP, port: 4318}]
        template: templates/obs-proxy-ingest-network-policy.yaml

  - it: does not publish ingest without a hostname
    asserts:
      - notContains: &noIngestListener
          path: spec.listeners
          content: {name: https-ingest}
          any: true
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: Gateway}
      - hasDocuments: {count: 0}
        template: templates/obs-proxy-ingest-route.yaml
      - lengthEqual:
          path: spec.ingress
          count: 1
        template: templates/obs-proxy-ingest-network-policy.yaml

  - it: does not publish ingest while the proxy is disabled
    set:
      obsProxy.enabled: false
      obsProxy.ingest.hostname: ingest.region.test
    asserts:
      - notContains: *noIngestListener
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: Gateway}
      - hasDocuments: {count: 0}
        template: templates/obs-proxy-ingest-route.yaml

  - it: requires TLS 1.3 on the whole Gateway when configured
    set:
      gateway.tls.minVersion: "1.3"
    template: templates/gateway.yaml
    documentSelector: {path: kind, value: ClientTrafficPolicy}
    asserts:
      - equal:
          path: spec.tls.minVersion
          value: "1.3"
      - notExists:
          path: spec.headers
      - equal:
          path: spec.targetRefs
          value: [{group: gateway.networking.k8s.io, kind: Gateway, name: loco-control-plane}]

  - it: leaves the default TLS policy to Envoy Gateway
    template: templates/gateway.yaml
    asserts:
      - containsDocument: {kind: ClientTrafficPolicy, apiVersion: gateway.envoyproxy.io/v1alpha1, any: true}
        not: true

  - it: enables Envoy headers on a policy of its own when no TLS minimum is set
    set:
      gateway.envoyHeaders: true
    template: templates/gateway.yaml
    documentSelector: {path: kind, value: ClientTrafficPolicy}
    asserts:
      - equal:
          path: spec.headers.enableEnvoyHeaders
          value: true
      - notExists:
          path: spec.tls

  - it: renders one policy when Envoy headers join a TLS minimum
    set:
      gateway.envoyHeaders: true
      gateway.tls.minVersion: "1.3"
    template: templates/gateway.yaml
    asserts:
      - containsDocument: {kind: ClientTrafficPolicy, apiVersion: gateway.envoyproxy.io/v1alpha1, name: loco-control-plane, any: true}
      - equal:
          path: spec.headers.enableEnvoyHeaders
          value: true
        documentSelector: {path: kind, value: ClientTrafficPolicy}
      - equal:
          path: spec.tls.minVersion
          value: "1.3"
        documentSelector: {path: kind, value: ClientTrafficPolicy}

  - it: creates no TLS policy for an existing Gateway
    set:
      gateway.create: false
      gateway.tls.minVersion: "1.3"
      gateway.envoyHeaders: true
    template: templates/gateway.yaml
    asserts:
      - hasDocuments: {count: 0}

  - it: adds an HTTPS listener per extra hostname that admits routes from the namespaces it names
    set:
      gatewayNamespace: edge
      gateway.extraListeners:
        - {hostname: auth.region.test, namespaces: [fleet, sign-in]}
    template: templates/gateway.yaml
    documentSelector: {path: kind, value: Gateway}
    asserts:
      - equal:
          path: spec.listeners[2]
          value:
            name: https-auth.region.test
            hostname: auth.region.test
            protocol: HTTPS
            port: 443
            tls:
              mode: Terminate
              certificateRefs: [{name: loco-control-plane-auth.region.test-tls, kind: Secret, group: ""}]
            allowedRoutes:
              namespaces:
                from: Selector
                selector:
                  matchExpressions:
                    - {key: kubernetes.io/metadata.name, operator: In, values: [fleet, sign-in]}

  - it: admits an extra listener's routes from the release namespace when it names none
    set:
      certManager.enabled: false
      gateway.extraListeners: [{hostname: auth.region.test}]
    template: templates/gateway.yaml
    documentSelector: {path: kind, value: Gateway}
    asserts:
      - equal:
          path: spec.listeners[2].allowedRoutes.namespaces.selector.matchExpressions[0].values
          value: [loco-control-plane]
      - equal:
          path: spec.listeners[2].protocol
          value: HTTP

  - it: rejects an extra listener without a hostname
    set:
      gateway.extraListeners: [{namespaces: [fleet]}]
    template: templates/gateway.yaml
    asserts:
      - failedTemplate: {}

  - it: rejects an extra hostname the chart already serves
    set:
      gateway.extraListeners: [{hostname: api.region.test}]
    template: templates/gateway.yaml
    asserts:
      - failedTemplate:
          errorMessage: gateway.extraListeners repeats the hostname api.region.test

  - it: rejects an extra hostname listed twice
    set:
      gateway.extraListeners: [{hostname: auth.region.test}, {hostname: auth.region.test}]
    template: templates/gateway.yaml
    asserts:
      - failedTemplate:
          errorMessage: gateway.extraListeners repeats the hostname auth.region.test
