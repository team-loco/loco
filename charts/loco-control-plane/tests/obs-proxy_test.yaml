suite: observability proxy
release:
  name: loco-control-plane
  namespace: loco-control-plane
values:
  - ../ci/default-values.yaml
templates:
  - templates/obs-proxy-ingest-deployment.yaml
  - templates/obs-proxy-ingest-network-policy.yaml
  - templates/obs-proxy-ingest-service.yaml
  - templates/obs-proxy-ingest-route.yaml
  - templates/api-deployment.yaml
  - templates/api-network-policy.yaml
  - templates/clickhouse.yaml
tests:
  - it: runs the ingest Deployment and Service whenever the proxy is enabled
    asserts:
      - containsDocument: {kind: Deployment, apiVersion: apps/v1, name: loco-control-plane-obs-proxy-ingest}
        template: templates/obs-proxy-ingest-deployment.yaml
      - containsDocument: {kind: Service, apiVersion: v1, name: loco-control-plane-obs-proxy-ingest}
        template: templates/obs-proxy-ingest-service.yaml

  - it: reads ingest's ClickHouse URLs from the existing Secrets
    template: templates/obs-proxy-ingest-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: CLICKHOUSE_INGEST_URL, valueFrom: {secretKeyRef: {name: loco-obs-proxy-ingest, key: url}}}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: CLICKHOUSE_MIGRATOR_URL, valueFrom: {secretKeyRef: {name: loco-obs-proxy-migrator, key: url}}}
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: CLICKHOUSE_URL}
          any: true

  - it: requires ingest's ClickHouse Secret
    set:
      obsProxy.ingest.clickhouse.existingSecret.name: ""
    asserts:
      - failedTemplate:
          errorMessage: obsProxy.ingest.clickhouse.existingSecret.name is required
        template: templates/obs-proxy-ingest-deployment.yaml

  - it: requires the migrator Secret name
    set:
      obsProxy.ingest.clickhouse.migratorExistingSecret.name: ""
    asserts:
      - failedTemplate:
          errorMessage: obsProxy.ingest.clickhouse.migratorExistingSecret.name is required
        template: templates/obs-proxy-ingest-deployment.yaml

  - it: requires the migrator Secret key
    set:
      obsProxy.ingest.clickhouse.migratorExistingSecret.key: ""
    asserts:
      - failedTemplate:
          errorMessage: obsProxy.ingest.clickhouse.migratorExistingSecret.key is required
        template: templates/obs-proxy-ingest-deployment.yaml

  - it: reads its database from the one chart value
    set:
      clickhouse.clickhouse.database: observability
    template: templates/obs-proxy-ingest-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: CLICKHOUSE_DB, value: observability}

  - it: gives the proxy no Kubernetes API credentials
    template: templates/obs-proxy-ingest-deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.serviceAccountName
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: renders no proxy objects while the proxy is disabled
    set:
      obsProxy.enabled: false
      obsProxy.ingest.hostname: ingest.region.test
    asserts:
      - hasDocuments: {count: 0}
        template: templates/obs-proxy-ingest-deployment.yaml
      - hasDocuments: {count: 0}
        template: templates/obs-proxy-ingest-network-policy.yaml
      - hasDocuments: {count: 0}
        template: templates/obs-proxy-ingest-service.yaml
      - hasDocuments: {count: 0}
        template: templates/obs-proxy-ingest-route.yaml
      - hasDocuments: {count: 0}
        template: templates/clickhouse.yaml

  - it: leaves the API without ClickHouse or a proxy policy source while the proxy is disabled
    set:
      obsProxy.enabled: false
      api.clickhouse.existingSecret.name: ""
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: CLICKHOUSE_URL}
          any: true
        template: templates/api-deployment.yaml
      - lengthEqual:
          path: spec.ingress[0].from
          count: 1
        template: templates/api-network-policy.yaml

  - it: needs no proxy image tag while the proxy is disabled
    set:
      obsProxy.enabled: false
      obsProxy.image.tag: ""
    asserts:
      - notFailedTemplate: {}

  - it: requires a proxy image tag while the proxy is enabled
    set:
      obsProxy.image.tag: ""
    asserts:
      - failedTemplate:
          errorPattern: "/obsProxy/image/tag': minLength"

  - it: verifies ingest tokens through the private API Service
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: CONTROL_PLANE_URL, value: http://loco-control-plane-api.loco-control-plane.svc.cluster.local}
        template: templates/obs-proxy-ingest-deployment.yaml
      - contains:
          path: spec.ingress[0].from
          content: {podSelector: {matchLabels: {app: loco-control-plane-obs-proxy-ingest}}}
        template: templates/api-network-policy.yaml

  - it: listens for health and OTLP on the ingest container ports
    set:
      obsProxy.ingest: {port: 18080, grpcPort: 14317, httpPort: 14318}
    template: templates/obs-proxy-ingest-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: PORT, value: "18080"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: OTLP_GRPC_PORT, value: "14317"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: OTLP_HTTP_PORT, value: "14318"}
      - equal:
          path: spec.template.spec.containers[0].ports
          value: [{name: health, containerPort: 18080}, {name: otlp-grpc, containerPort: 14317}, {name: otlp-http, containerPort: 14318}]

  - it: checks ingest readiness at /readyz on the health port
    template: templates/obs-proxy-ingest-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet
          value: {path: /readyz, port: health}

  - it: selects the ingest Deployment from the ingest Service
    asserts:
      - equal:
          path: spec.selector
          value: {app: loco-control-plane-obs-proxy-ingest}
        template: templates/obs-proxy-ingest-service.yaml
      - equal:
          path: spec.template.metadata.labels.app
          value: loco-control-plane-obs-proxy-ingest
        template: templates/obs-proxy-ingest-deployment.yaml

  - it: exposes only OTLP from the ingest Service
    template: templates/obs-proxy-ingest-service.yaml
    asserts:
      - matchRegex:
          path: spec.ports[*].targetPort
          pattern: ^otlp-(grpc|http)$
      - lengthEqual:
          path: spec.ports
          count: 2

  - it: admits OTLP to ingest from any pod in the namespace
    template: templates/obs-proxy-ingest-network-policy.yaml
    asserts:
      - lengthEqual:
          path: spec.ingress
          count: 1
      - equal:
          path: spec.ingress[0].from
          value: [{podSelector: {}}]
      - equal:
          path: spec.ingress[0].ports
          value: [{protocol: TCP, port: 4317}, {protocol: TCP, port: 4318}]
