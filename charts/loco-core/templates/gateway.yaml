apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: eg
  namespace: {{ .Release.Namespace }}
spec:
  infrastructure:
    {{- if .Values.global.cloudProvider.annotations }}
    annotations:
      {{- toYaml .Values.global.cloudProvider.annotations | nindent 6 }}
    {{- end }}
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: envoy-proxy
  gatewayClassName: eg
  listeners:
    {{- range $index, $domain := .Values.global.domain.apps }}
    - name: https-apps-{{ $index }}
      hostname: {{ printf "*.%s" $domain | quote }}
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              loco.io/app: "true"
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ $.Release.Name }}-tls
            kind: Secret
            group: ""
    - name: http-apps-{{ $index }}
      hostname: {{ printf "*.%s" $domain | quote }}
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              loco.io/app: "true"
    {{- end }}
    - name: https-platform
      hostname: {{ printf "*.%s" .Values.global.domain.platform | quote }}
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - {{ .Release.Namespace }}
                  - {{ .Values.global.observability.namespace }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ .Release.Name }}-tls
            kind: Secret
            group: ""
    - name: http-platform
      hostname: {{ printf "*.%s" .Values.global.domain.platform | quote }}
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - {{ .Release.Namespace }}
                  - {{ .Values.global.observability.namespace }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-proxy
  namespace: {{ .Release.Namespace }}
spec:
  {{- $collectorHost := printf "%s.%s.svc.cluster.local" .Values.global.observability.otelCollectorDeployment .Values.global.observability.namespace }}
  {{- $collectorPort := .Values.global.observability.otelCollectorGrpcPort }}
  telemetry:
    metrics:
      prometheus:
        disable: true
      enablePerEndpointStats: true
      enableRequestResponseSizesStats: true
      sinks:
        - type: OpenTelemetry
          openTelemetry:
            host: {{ $collectorHost }}
            port: {{ $collectorPort }}
    tracing:
      samplingRate: {{ .Values.envoyProxy.tracing.samplingRate }}
      provider:
        type: OpenTelemetry
        host: {{ $collectorHost }}
        port: {{ $collectorPort }}
    accessLog:
      settings:
        - format:
            type: JSON
            json:
              {{- toYaml .Values.envoyProxy.accessLog.attributes | nindent 14 }}
          sinks:
            - type: OpenTelemetry
              openTelemetry:
                host: {{ $collectorHost }}
                port: {{ $collectorPort }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: enable-http3
  namespace: {{ .Release.Namespace }}
spec:
  http3: {}
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: eg
