{{- if and (not .Values.certManager.existingTLSSecret) .Values.certManager.issuer.create (eq .Values.certManager.issuer.type "acme") }}
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token-secret
  namespace: cert-manager
type: Opaque
stringData:
  api-token: {{ .Values.secrets.cloudflareToken | quote }}
{{- end }}
