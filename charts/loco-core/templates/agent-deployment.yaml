apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-agent
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-agent
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}-agent
  replicas: {{ .Values.global.replicas.agent }}
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        # rolls the agent automatically when a value in its env secret changes
        checksum/env: {{ include (print $.Template.BasePath "/env-config-secret.yml") . | sha256sum }}
      labels:
        app: {{ .Release.Name }}-agent
    spec:
      shareProcessNamespace: true
      serviceAccountName: {{ .Release.Name }}-agent
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Release.Name }}-agent
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          imagePullPolicy: {{ .Values.agent.imagePullPolicy }}
          env:
            - name: LOCO_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-env
          ports:
            - containerPort: {{ .Values.global.ports.agent }}
          resources:
            {{- toYaml .Values.global.resources.agent | nindent 12 }}
      restartPolicy: Always
