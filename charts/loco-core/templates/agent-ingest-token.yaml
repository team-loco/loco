{{- with include "loco-core.exporterTokenSecret" . }}
{{- $secret := . }}
{{- $key := include "loco-core.exporterTokenKey" $ }}
{{- range $namespace := include "loco-core.exporterTokenNamespaces" $ | splitList "," }}
{{- $live := (lookup "v1" "Secret" $namespace $secret).data | default dict }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  namespace: {{ $namespace }}
type: Opaque
data:
  {{ $key }}: {{ dig $key (b64enc $.Values.agent.pendingIngestToken) $live | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $.Release.Name }}-agent-ingest-token
  namespace: {{ $namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $secret | quote }}]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.Release.Name }}-agent-ingest-token
  namespace: {{ $namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $.Release.Name }}-agent-ingest-token
subjects:
  - kind: ServiceAccount
    name: {{ $.Release.Name }}-agent
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
