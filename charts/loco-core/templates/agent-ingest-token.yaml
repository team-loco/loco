{{- with include "loco-core.exporterTokenSecret" . }}
{{- $secret := . }}
{{- range $namespace := include "loco-core.exporterTokenNamespaces" $ | splitList "," }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $.Release.Name }}-agent-ingest-token
  namespace: {{ $namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $secret | quote }}]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.Release.Name }}-agent-ingest-token
  namespace: {{ $namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $.Release.Name }}-agent-ingest-token
subjects:
  - kind: ServiceAccount
    name: {{ $.Release.Name }}-agent
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
