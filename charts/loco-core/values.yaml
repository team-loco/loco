# Global configuration (can be overridden by environment-specific values)
global:
  domain:
    apps:
      - onloco.app
      - onloco.build
    platform: loco.build

  cloudProvider:
    type: ""
    annotations: {}
    loadBalancerIPPool: {}

  resources:
    agent:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 200m
        memory: 512Mi

  observability:
    otelCollectorDeployment: otel-col-deploy
    otelCollectorGrpcPort: 4317
    namespace: observability

  # Replica counts
  replicas:
    agent: 1

  # Container ports
  ports:
    agent: 8000

# Cert-manager configuration
certManager:
  additionalDNSNames: []
  issuer:
    name: letsencrypt-prod
    email: "" # Override in environment-specific values
    server: https://acme-v02.api.letsencrypt.org/directory

agent:
  image:
    repository: ghcr.io/team-loco/loco-agent
    tag: ""
  imagePullPolicy: Always
  buildNamespace: loco-builds
  controllerDeployment: loco-controller
  inventoryInterval: 10m
  buildRetention: 1h
  buildCollectInterval: 5m
  heartbeatInterval: 30s
  clusterQueryTimeout: 10s
  reconcileWorkers: 8
  reconcileRetryBaseDelay: 1s
  reconcileRetryMaxDelay: 30s
  syncOutboundBuffer: 256
  buildQueueSize: 64
  buildCreateRetryDelay: 1s
  buildCreateRetryAttempts: 5
  reconnectBaseDelay: 1s
  reconnectMaxDelay: 30s
  healthyStreamDuration: 1m

secrets:
  cloudflareToken: ""

env:
  LOG_LEVEL: debug

envoyProxy:
  tracing:
    samplingRate: 10
  accessLog:
    attributes:
      method: "%REQ(:METHOD)%"
      path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
      authority: "%REQ(:AUTHORITY)%"
      protocol: "%PROTOCOL%"
      response_code: "%RESPONSE_CODE%"
      response_flags: "%RESPONSE_FLAGS%"
      duration: "%DURATION%"
      bytes_received: "%BYTES_RECEIVED%"
      bytes_sent: "%BYTES_SENT%"
      upstream_cluster: "%UPSTREAM_CLUSTER%"
      upstream_host: "%UPSTREAM_HOST%"
      request_id: "%REQ(X-REQUEST-ID)%"
      trace_id: "%TRACE_ID%"

gateway-helm:
  enabled: true
  crds:
    enabled: true
  config:
    envoyGateway:
      logging:
        default: info
