# Global configuration (can be overridden by environment-specific values)
global:
  domain:
    apps:
      - onloco.app
      - onloco.build
    platform: loco.build

  cloudProvider:
    type: ""
    annotations: {}
    loadBalancerIPPool: {}

  resources:
    agent:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 200m
        memory: 512Mi

  observability:
    otelCollectorDeployment: otel-col-deploy
    namespace: observability

  # Replica counts
  replicas:
    agent: 1

  # Container ports
  ports:
    agent: 8000

# Cert-manager configuration
certManager:
  issuer:
    name: letsencrypt-prod
    email: "" # Override in environment-specific values
    server: https://acme-v02.api.letsencrypt.org/directory

agent:
  image:
    repository: ghcr.io/team-loco/loco-agent
    tag: latest
  imagePullPolicy: Always
  buildNamespace: loco-builds

secrets:
  cloudflareToken: ""

env:
  LOG_LEVEL: "-4"

gateway-helm:
  enabled: true
  crds:
    enabled: true
  config:
    envoyGateway:
      logging:
        default: info
