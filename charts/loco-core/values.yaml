# Global configuration (can be overridden by environment-specific values)
global:
  domain:
    apps:
      - onloco.app
      - onloco.build
    platform: loco.build

  cloudProvider:
    type: ""
    annotations: {}
    loadBalancerIPPool: {}

  resources:
    agent:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 200m
        memory: 512Mi

  observability:
    otelCollectorDeployment: otel-col-deploy
    namespace: observability

  # Replica counts
  replicas:
    agent: 1

  # Container ports
  ports:
    agent: 8000

# Cert-manager configuration
certManager:
  issuer:
    name: letsencrypt-prod
    email: "" # Override in environment-specific values
    server: https://acme-v02.api.letsencrypt.org/directory

agent:
  image:
    repository: ghcr.io/team-loco/loco-agent
    tag: ""
  imagePullPolicy: Always
  buildNamespace: loco-builds
  controllerDeployment: loco-controller
  inventoryInterval: 10m
  buildRetention: 1h
  buildCollectInterval: 5m
  heartbeatInterval: 30s
  clusterQueryTimeout: 10s
  reconcileWorkers: 8
  reconcileRetryBaseDelay: 1s
  reconcileRetryMaxDelay: 30s
  syncOutboundBuffer: 256
  buildQueueSize: 64
  buildCreateRetryDelay: 1s
  buildCreateRetryAttempts: 5
  reconnectBaseDelay: 1s
  reconnectMaxDelay: 30s
  healthyStreamDuration: 1m

secrets:
  cloudflareToken: ""

env:
  LOG_LEVEL: "-4"

gateway-helm:
  enabled: true
  crds:
    enabled: true
  config:
    envoyGateway:
      logging:
        default: info
