# Global configuration (can be overridden by environment-specific values)
global:
  domain:
    base: deploy-app.com
    wildcard: "*.deploy-app.com"

  cloudProvider:
    type: ""
    annotations: {}

  resources:
    ui:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
    agent:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 200m
        memory: 512Mi

  observability:
    otelCollectorDeployment: otel-col-deploy
    namespace: observability

  # Replica counts
  replicas:
    ui: 1
    agent: 1

  # Container ports
  ports:
    agent: 8000
    ui: 8080

# Cert-manager configuration
certManager:
  issuer:
    name: letsencrypt-prod
    email: "" # Override in environment-specific values
    server: https://acme-v02.api.letsencrypt.org/directory

agent:
  image:
    repository: ghcr.io/team-loco/loco-agent
    tag: latest
  imagePullPolicy: Always

ui:
  image:
    repository: ghcr.io/team-loco/loco-ui
    tag: latest
  imagePullPolicy: Always

secrets:
  cloudflareToken: ""

env:
  LOG_LEVEL: "-4"

gateway-helm:
  enabled: true
  crds:
    enabled: true
  config:
    envoyGateway:
      logging:
        default: info
      extensionApis:
        # required for cross-region failover: the loco-controller builds Backend and
        # BackendTrafficPolicy resources, and without this any HTTPRoute referencing a
        # Backend fails with "Backend is disabled in Envoy Gateway configuration".
        enableBackend: true
