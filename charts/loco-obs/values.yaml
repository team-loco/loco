global:
  domain:
    dashboards: dashboards.loco.build
    observability: observability.loco.build

# Gateway namespace where the Envoy Gateway is deployed
gatewayNamespace: envoy-gateway-system

clickhouse:
  enabled: true
  nameOverride: "clickhouse"
  # Note: The service name will be auto-generated as: clickhouse-{{ .Release.Name }}-clickhouse
  operator:
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    operator:
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
    metrics:
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
    crdHook:
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
  clickhouse:
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 101
      runAsGroup: 101
      fsGroup: 101
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    antiAffinity: true
    persistence:
      enabled: true
      storageClass: ""
    systemLogRetentionDays: 3
    extraConfig: |
      <clickhouse>
        <logger>
          <level>information</level>
        </logger>
        {{- range list "query_log" "part_log" "trace_log" }}
        <{{ . }} replace="1">
          <database>system</database>
          <table>{{ . }}</table>
          <partition_by>event_date</partition_by>
          <ttl>event_date + INTERVAL {{ $.Values.clickhouse.systemLogRetentionDays }} DAY DELETE</ttl>
          <flush_interval_milliseconds>7500</flush_interval_milliseconds>
        </{{ . }}>
        {{- end }}
        <query_thread_log remove="1"/>
        <opentelemetry_span_log remove="1"/>
        {{- range list "text_log" "metric_log" "asynchronous_metric_log" "error_log" "latency_log" "query_metric_log" "query_views_log" "processors_profile_log" "asynchronous_insert_log" "s3queue_log" "backup_log" "crash_log" }}
        <{{ . }}>
          <ttl>event_date + INTERVAL {{ $.Values.clickhouse.systemLogRetentionDays }} DAY DELETE</ttl>
        </{{ . }}>
        {{- end }}
      </clickhouse>
    defaultUser:
      allowExternalAccess: true

opentelemetry-operator:
  fullnameOverride: "otel-operator"
  enabled: true

otel-col-daemon:
  enabled: true
  fullnameOverride: "otel-col-daemon"
  namespaceOverride: observability-node
  mode: daemonset
  image:
    repository: "otel/opentelemetry-collector-contrib"
    tag: "0.162.0"
  resources:
    limits:
      cpu: 250m
      memory: 512Mi
  clusterRole:
    create: true
    rules:
      - apiGroups:
          - ""
        resources:
          - nodes/proxy
          - nodes/stats
          - endpoints
          - services
          - pods
        verbs: ["get", "watch", "list"]
  presets:
    logsCollection:
      enabled: true
    hostMetrics:
      enabled: true
    kubernetesAttributes:
      enabled: true
      extractAllPodLabels: true
      extractAllPodAnnotations: true
  config:
    receivers:
      kubeletstats:
        collection_interval: 20s
        auth_type: "serviceAccount"
        endpoint: "https://${env:OTEL_K8S_NODE_IP}:10250"
        insecure_skip_verify: true
        node: "${env:K8S_NODE_NAME}"
        k8s_api_config:
          auth_type: serviceAccount
        collect_all_network_interfaces:
          pod: true
        metrics:
          k8s.pod.cpu_limit_utilization:
            enabled: true
          k8s.pod.cpu_request_utilization:
            enabled: true
          k8s.pod.memory_limit_utilization:
            enabled: true
          k8s.pod.memory_request_utilization:
            enabled: true
          k8s.pod.uptime:
            enabled: true
          k8s.node.uptime:
            enabled: true
          k8s.container.cpu_limit_utilization:
            enabled: true
          k8s.container.cpu_request_utilization:
            enabled: true
          k8s.container.memory_limit_utilization:
            enabled: true
          k8s.container.memory_request_utilization:
            enabled: true
          container.uptime:
            enabled: true
          k8s.node.network.io:
            enabled: true
          k8s.pod.network.io:
            enabled: true
    processors:
      batch:
        timeout: 1s
        send_batch_size: 100
      memory_limiter:
        check_interval: 1s
        limit_mib: 2048
    exporters:
      clickhouse:
        # Endpoint will be dynamically constructed as: tcp://clickhouse-{release-name}-{nameOverride}.{namespace}.svc.cluster.local:9000
        endpoint: tcp://clickhouse-{{ .Release.Name }}-clickhouse.{{ .Release.Namespace }}.svc.cluster.local:9000?dial_timeout=10s&compress=lz4&async_insert=1
        username: default
        password: ""
        traces_table_name: otel_traces
        logs_table_name: otel_logs
        create_schema: false
        timeout: 5s
        database: default
    service:
      pipelines:
        logs:
          exporters: [clickhouse]
          processors: [batch, memory_limiter]
        metrics:
          receivers: [kubeletstats]
          processors: [batch, memory_limiter]
          exporters: [clickhouse]

otel-col-deploy:
  enabled: true
  fullnameOverride: otel-col-deploy
  mode: deployment
  image:
    repository: "otel/opentelemetry-collector-contrib"
    tag: "0.162.0"
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  resources:
    limits:
      cpu: 250m
      memory: 512Mi
  replicaCount: 1
  presets:
    kubernetesAttributes:
      enabled: true
      extractAllPodLabels: true
      extractAllPodAnnotations: true
    kubernetesEvents:
      enabled: true
    clusterMetrics:
      enabled: true
  config:
    processors:
      resource/set_service_name:
        attributes:
          - action: insert
            key: service.name
            from_attribute: app.kubernetes.io/name
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    exporters:
      clickhouse:
        # Endpoint will be dynamically constructed as: tcp://clickhouse-{release-name}-{nameOverride}.{namespace}.svc.cluster.local:9000
        endpoint: tcp://clickhouse-{{ .Release.Name }}-clickhouse.{{ .Release.Namespace }}.svc.cluster.local:9000?dial_timeout=10s&compress=lz4&async_insert=1
        username: default
        password: ""
        traces_table_name: otel_traces
        logs_table_name: otel_logs
        create_schema: true
        ttl: 8760h
        timeout: 5s
        database: default
    service:
      pipelines:
        logs:
          exporters: [clickhouse]
        metrics:
          receivers: [otlp]
          processors: [resource/set_service_name]
          exporters: [clickhouse]

grafana:
  enabled: true
  fullnameOverride: grafana
  adminUser: "" # Override in environment-specific values
  adminPassword: "" # Override in environment-specific values
  persistence:
    enabled: true
    type: pvc
    accessModes:
      - ReadWriteOnce
    size: 2Gi
    finalizers:
      - kubernetes.io/pvc-protection
  plugins:
    - grafana-clickhouse-datasource
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: ClickHouse
          type: grafana-clickhouse-datasource
          jsonData:
            port: 9000
            # Host will be dynamically constructed as: clickhouse-{release-name}-{nameOverride}.{namespace}.svc.cluster.local
            host: clickhouse-{{ .Release.Name }}-clickhouse.{{ .Release.Namespace }}.svc.cluster.local
            defaultDatabase: default
            username: default
            tlsSkipVerify: true
          secureJsonData:
            password: ""
  dashboards:
    default:
      general:
        gnetId: 1860
        revision: 29
        datasource: ClickHouse
  initChownData:
    enabled: false

obsProxy:
  enabled: true
  image:
    repository: ghcr.io/team-loco/loco-obs-proxy
    tag: ""
  imagePullPolicy: Always
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  port: 8080
  controlPlane:
    url: "http://loco-core-agent.loco-system.svc.cluster.local:8000"
  auth:
    existingSecret: ""
  clickhouse:
    database: default
    existingSecret:
      name: ""
      key: url
  guardrails:
    defaultLimit: 1000
    maxLimit: 10000
    queryTimeoutSeconds: 10
    maxTimeRangeHours: 24
    maxConcurrentQueries: 5
    maxTailDurationMinutes: 30
    maxConcurrentTails: 3
    tokenCacheTTLSeconds: 30
