global:
  region: ""
  clickhouse:
    host: ""
    port: 9000
    secure: false

# Gateway namespace where the Envoy Gateway is deployed
gatewayNamespace: envoy-gateway-system
controlPlaneNamespace: loco-system

clickhouse:
  enabled: true
  nameOverride: "clickhouse"
  # Note: The service name will be auto-generated as: clickhouse-{{ .Release.Name }}-clickhouse
  operator:
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    operator:
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
    metrics:
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
    crdHook:
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
  clickhouse:
    image:
      repository: altinity/clickhouse-server
      tag: "26.3.33.10001.altinitystable@sha256:5bd62b50208bae1d065de7685b0b0a1812f267d1a179aabb15f97c78aed47d1a"
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 101
      runAsGroup: 101
      fsGroup: 101
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    antiAffinity: true
    resources:
      requests:
        cpu: "1"
        memory: 4Gi
      limits:
        cpu: "2"
        memory: 4Gi
    persistence:
      enabled: true
      storageClass: ""
    systemLogRetentionDays: 3
    keeperConfig: |
      <keeper_server>
        <tcp_port>9181</tcp_port>
        <server_id>1</server_id>
        <log_storage_path>/var/lib/clickhouse/coordination/log</log_storage_path>
        <snapshot_storage_path>/var/lib/clickhouse/coordination/snapshots</snapshot_storage_path>
        <raft_configuration>
          <server>
            <id>1</id>
            <hostname>localhost</hostname>
            <port>9234</port>
          </server>
        </raft_configuration>
      </keeper_server>
      <zookeeper>
        <node>
          <host>localhost</host>
          <port>9181</port>
        </node>
      </zookeeper>
      <keeper_map_path_prefix>/keeper_map_tables</keeper_map_path_prefix>
    extraConfig: |
      <clickhouse>
        {{- $.Values.clickhouse.keeperConfig | nindent 2 }}
        <logger>
          <level>information</level>
        </logger>
        {{- range list "query_log" "part_log" }}
        <{{ . }} replace="1">
          <database>system</database>
          <table>{{ . }}</table>
          <partition_by>event_date</partition_by>
          <ttl>event_date + INTERVAL {{ $.Values.clickhouse.systemLogRetentionDays }} DAY DELETE</ttl>
          <flush_interval_milliseconds>7500</flush_interval_milliseconds>
        </{{ . }}>
        {{- end }}
        <query_thread_log remove="1"/>
        <trace_log remove="1"/>
        <processors_profile_log remove="1"/>
        <asynchronous_metrics_update_period_s>60</asynchronous_metrics_update_period_s>
        <opentelemetry_span_log remove="1"/>
        {{- range list "text_log" "metric_log" "asynchronous_metric_log" "error_log" "latency_log" "query_metric_log" "query_views_log" "asynchronous_insert_log" "s3queue_log" "backup_log" "crash_log" "background_schedule_pool_log" "delta_lake_metadata_log" "iceberg_metadata_log" }}
        <{{ . }}>
          <ttl>event_date + INTERVAL {{ $.Values.clickhouse.systemLogRetentionDays }} DAY DELETE</ttl>
        </{{ . }}>
        {{- end }}
      </clickhouse>
    defaultUser:
      allowExternalAccess: true
    users:
      - name: loco_migrator
        password_secret_name: loco-obs-clickhouse-migrator
        grants:
          - "GRANT ALL ON loco_obs.*"
      - name: loco_ingest
        password_secret_name: loco-obs-clickhouse-ingest
        grants:
          - "GRANT INSERT, SHOW COLUMNS ON loco_obs.*"
      - name: loco_reader
        password_secret_name: loco-obs-clickhouse-reader
        grants:
          - "GRANT SELECT ON loco_obs.*"

clickhouseUserPasswords:
  loco_migrator: ""
  loco_ingest: ""
  loco_reader: ""

otel-col-daemon:
  enabled: true
  fullnameOverride: "otel-col-daemon"
  namespaceOverride: observability-node
  mode: daemonset
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    runAsUser: 10001
    runAsGroup: 0
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
  initContainers:
    - name: log-checkpoint-permissions
      image: busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
      command: [chown, -R, '{{ .Values.securityContext.runAsUser }}:{{ .Values.securityContext.runAsGroup }}', &logCheckpointDirectory /var/lib/otelcol]
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
          add: [CHOWN]
      volumeMounts:
        - name: log-checkpoint-permissions
          mountPath: *logCheckpointDirectory
  extraVolumes:
    - name: log-checkpoint-permissions
      hostPath:
        path: *logCheckpointDirectory
        type: DirectoryOrCreate
  extraEnvs: &ingestEnvs
    - name: CLICKHOUSE_INGEST_PASSWORD
      valueFrom:
        secretKeyRef:
          name: loco-obs-clickhouse-ingest
          key: password
  image:
    repository: "otel/opentelemetry-collector-contrib"
    tag: "0.162.0"
  resources:
    limits:
      cpu: 250m
      memory: 512Mi
  clusterRole:
    create: true
    rules:
      - apiGroups:
          - ""
        resources:
          - nodes/proxy
          - nodes/stats
          - endpoints
          - services
          - pods
          - namespaces
        verbs: ["get", "watch", "list"]
      - apiGroups:
          - apps
        resources:
          - replicasets
        verbs: ["get", "watch", "list"]
  presets:
    logsCollection:
      enabled: true
      storeCheckpoints: true
    hostMetrics:
      enabled: true
  config:
    receivers:
      prometheus/applications:
        config:
          scrape_configs:
            - job_name: loco-applications
              scrape_interval: 30s
              scrape_timeout: 10s
              sample_limit: 10000
              body_size_limit: 10MB
              honor_labels: false
              honor_timestamps: false
              follow_redirects: false
              kubernetes_sd_configs:
                - role: pod
                  selectors:
                    - role: pod
                      field: spec.nodeName=${env:OTEL_K8S_NODE_NAME}
                      label: loco.io/metrics-port
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_loco_io_metrics_port]
                  action: keep
                  regex: '[0-9]+'
                - source_labels: [__meta_kubernetes_pod_container_port_name]
                  action: keep
                  regex: http
                - source_labels: [__meta_kubernetes_pod_phase]
                  action: keep
                  regex: Running
                - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_label_loco_io_metrics_port]
                  target_label: __address__
                  regex: '(.+);([0-9]+)'
                  replacement: '$${1}:$${2}'
                - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_label_loco_io_metrics_port]
                  target_label: __address__
                  regex: '(.+:.*);([0-9]+)'
                  replacement: '[$${1}]:$${2}'
                - source_labels: [__meta_kubernetes_pod_annotation_loco_io_metrics_path]
                  target_label: __metrics_path__
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                  target_label: job
                - source_labels: [__meta_kubernetes_pod_uid]
                  target_label: loco_scrape_pod_uid
      hostmetrics:
        collection_interval: &collectionInterval 60s
      kubeletstats:
        collection_interval: *collectionInterval
        auth_type: "serviceAccount"
        endpoint: "https://${env:OTEL_K8S_NODE_IP}:10250"
        insecure_skip_verify: true
        node: "${env:OTEL_K8S_NODE_NAME}"
        k8s_api_config:
          auth_type: serviceAccount
        collect_all_network_interfaces:
          pod: true
        metrics:
          k8s.pod.cpu_limit_utilization:
            enabled: true
          k8s.pod.cpu_request_utilization:
            enabled: true
          k8s.pod.memory_limit_utilization:
            enabled: true
          k8s.pod.memory_request_utilization:
            enabled: true
          k8s.pod.uptime:
            enabled: true
          k8s.node.uptime:
            enabled: true
          k8s.container.cpu_limit_utilization:
            enabled: true
          k8s.container.cpu_request_utilization:
            enabled: true
          k8s.container.memory_limit_utilization:
            enabled: true
          k8s.container.memory_request_utilization:
            enabled: true
          container.uptime:
            enabled: true
          k8s.node.network.io:
            enabled: true
          k8s.pod.network.io:
            enabled: true
    processors:
      batch:
        timeout: 1s
        send_batch_size: 100
      memory_limiter:
        check_interval: 1s
        limit_mib: 384
        spike_limit_mib: 96
      resource/region: &region
        attributes:
          - key: loco.region
            value: '{{ required "global.region is required" .Values.global.region }}'
            action: upsert
      resource/strip_tenancy: &stripTenancy
        attributes:
          - key: loco.organization.id
            action: delete
          - key: loco.workspace.id
            action: delete
          - key: loco.environment.id
            action: delete
          - key: loco.resource.id
            action: delete
          - key: loco.io/build-id
            action: delete
          - key: k8s.pod.ip
            action: delete
          - key: k8s.pod.uid
            action: delete
          - key: gateway.envoyproxy.io/owning-gateway-name
            action: delete
          - key: gateway.envoyproxy.io/owning-gateway-namespace
            action: delete
      transform/scrape_identity:
        error_mode: propagate
        metric_statements:
          - context: datapoint
            statements:
              - set(resource.attributes["k8s.pod.uid"], attributes["loco_scrape_pod_uid"])
              - delete_key(attributes, "loco_scrape_pod_uid")
              - delete_key(resource.attributes, "loco_scrape_pod_uid")
              - delete_matching_keys(attributes, "^loco[._].*")
      k8s_attributes/connection:
        filter:
          node_from_env_var: OTEL_K8S_NODE_NAME
        passthrough: false
        pod_association: &connectionAssociation
          - sources:
              - from: connection
        extract: &tenancyExtract
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.node.name
            - k8s.pod.start_time
            - k8s.deployment.name
            - k8s.replicaset.name
            - k8s.replicaset.uid
            - k8s.daemonset.name
            - k8s.daemonset.uid
            - k8s.job.name
            - k8s.job.uid
            - k8s.container.name
            - k8s.cronjob.name
            - k8s.statefulset.name
            - k8s.statefulset.uid
            - container.image.tag
            - container.image.name
            - k8s.cluster.uid
            - service.namespace
            - service.name
            - service.version
            - service.instance.id
          labels:
            - from: pod
              key: loco.io/organization-id
              tag_name: loco.organization.id
            - from: pod
              key: loco.io/workspace-id
              tag_name: loco.workspace.id
            - from: pod
              key: loco.io/environment-id
              tag_name: loco.environment.id
            - from: pod
              key: loco.io/resource-id
              tag_name: loco.resource.id
            - from: pod
              key: loco.io/build-id
              tag_name: loco.io/build-id
            - from: pod
              key: gateway.envoyproxy.io/owning-gateway-name
              tag_name: gateway.envoyproxy.io/owning-gateway-name
            - from: pod
              key: gateway.envoyproxy.io/owning-gateway-namespace
              tag_name: gateway.envoyproxy.io/owning-gateway-namespace
      k8s_attributes/pod_uid:
        filter:
          node_from_env_var: OTEL_K8S_NODE_NAME
        passthrough: false
        pod_association: &podUIDAssociation
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
        extract: *tenancyExtract
    exporters:
      clickhouse: &clickhouseExporter
        endpoint: tcp://{{ include "loco-obs.clickhouseAddress" . }}
        compress: lz4
        async_insert: true
        connection_params:
          dial_timeout: 10s
          log_queries: "0"
          secure: "{{ .Values.global.clickhouse.secure }}"
        username: loco_ingest
        password: ${env:CLICKHOUSE_INGEST_PASSWORD}
        traces_table_name: otel_traces
        logs_table_name: otel_logs
        create_schema: false
        timeout: 5s
        database: loco_obs
    service:
      # memory_limiter must run first so it can refuse data before batch buffers it in memory.
      pipelines:
        logs:
          receivers: [file_log]
          processors: [memory_limiter, k8s_attributes/pod_uid, resource/region, batch]
          exporters: [clickhouse]
        logs/otlp:
          receivers: [otlp]
          processors: [memory_limiter, resource/strip_tenancy, k8s_attributes/connection, resource/region, batch]
          exporters: [clickhouse]
        metrics/applications:
          receivers: [prometheus/applications]
          processors: [memory_limiter, resource/strip_tenancy, transform/scrape_identity, k8s_attributes/pod_uid, resource/region, batch]
          exporters: [clickhouse]
        metrics:
          receivers: [kubeletstats]
          processors: [memory_limiter, k8s_attributes/pod_uid, resource/region, batch]
          exporters: [clickhouse]
        traces:
          receivers: [otlp, jaeger, zipkin]
          processors: [memory_limiter, resource/strip_tenancy, k8s_attributes/connection, resource/region, batch]
          exporters: [clickhouse]

otel-col-deploy:
  enabled: true
  fullnameOverride: otel-col-deploy
  mode: deployment
  extraEnvs:
    - name: CLICKHOUSE_INGEST_PASSWORD
      valueFrom:
        secretKeyRef:
          name: loco-obs-clickhouse-ingest
          key: password
  image: &collectorImage
    repository: "otel/opentelemetry-collector-contrib"
    tag: "0.162.0"
  podSecurityContext: &collectorPodSecurityContext
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext: &collectorSecurityContext
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi
  replicaCount: 1
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 80
  clusterRole:
    create: true
    rules:
      - apiGroups:
          - ""
        resources:
          - pods
          - namespaces
        verbs: ["get", "watch", "list"]
      - apiGroups:
          - apps
        resources:
          - replicasets
        verbs: ["get", "watch", "list"]
  config:
    processors:
      resource/region: *region
      resource/strip_tenancy: *stripTenancy
      k8s_attributes/connection:
        passthrough: false
        pod_association: *connectionAssociation
        extract: *tenancyExtract
      k8s_attributes/pod_uid:
        passthrough: false
        pod_association: *podUIDAssociation
        extract: *tenancyExtract
      transform/envoy_tenancy:
        error_mode: ignore
        trace_statements:
          - context: span
            statements: &dropRecordTenancy
              - delete_key(attributes, "loco.organization.id")
              - delete_key(attributes, "loco.workspace.id")
              - delete_key(attributes, "loco.environment.id")
              - delete_key(attributes, "loco.resource.id")
          - context: span
            conditions: &envoyResource
              - resource.attributes["gateway.envoyproxy.io/owning-gateway-name"] != nil
            statements:
              - set(cache["cluster"], attributes["upstream_cluster"])
              - &parseRoute merge_maps(cache, ExtractPatterns(cache["cluster"], "^httproute/ws-(?P<workspace>[^/]+)/resource-(?P<resource>[^/]+)-route/rule/[0-9]+$$"), "upsert") where cache["cluster"] != nil
              - &setWorkspace set(attributes["loco.workspace.id"], cache["workspace"]) where cache["workspace"] != nil
              - &setResource set(attributes["loco.resource.id"], cache["resource"]) where cache["resource"] != nil
        log_statements:
          - context: log
            statements: *dropRecordTenancy
          - context: log
            conditions: *envoyResource
            statements:
              - set(cache["cluster"], attributes["upstream_cluster"])
              - *parseRoute
              - *setWorkspace
              - *setResource
        metric_statements:
          - context: datapoint
            statements: *dropRecordTenancy
          - context: datapoint
            conditions: *envoyResource
            statements:
              - set(cache["cluster"], attributes["envoy.cluster_name"])
              - *parseRoute
              - *setWorkspace
              - *setResource
      groupbyattrs/tenancy:
        keys:
          - loco.workspace.id
          - loco.resource.id
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    exporters:
      clickhouse: *clickhouseExporter
    service:
      pipelines:
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resource/strip_tenancy, k8s_attributes/connection, transform/envoy_tenancy, groupbyattrs/tenancy, resource/region, batch]
          exporters: [clickhouse]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, resource/strip_tenancy, k8s_attributes/connection, transform/envoy_tenancy, groupbyattrs/tenancy, resource/region, batch]
          exporters: [clickhouse]
        traces:
          receivers: [otlp, jaeger, zipkin]
          processors: [memory_limiter, resource/strip_tenancy, k8s_attributes/connection, transform/envoy_tenancy, groupbyattrs/tenancy, resource/region, batch]
          exporters: [clickhouse]

otel-col-cluster:
  enabled: true
  fullnameOverride: otel-col-cluster
  mode: deployment
  replicaCount: 1
  rollout:
    strategy: Recreate
  extraEnvs: *ingestEnvs
  image: *collectorImage
  podSecurityContext: *collectorPodSecurityContext
  securityContext: *collectorSecurityContext
  resources:
    limits:
      cpu: 250m
      memory: 512Mi
  clusterRole:
    create: true
    rules:
      - apiGroups: [""]
        resources: [pods, namespaces]
        verbs: ["get", "watch", "list"]
      - apiGroups: [apps]
        resources: [replicasets]
        verbs: ["get", "watch", "list"]
  presets:
    kubernetesEvents:
      enabled: true
    clusterMetrics:
      enabled: true
  service:
    enabled: false
  ports:
    otlp:
      enabled: false
    otlp-http:
      enabled: false
    jaeger-compact:
      enabled: false
    jaeger-thrift:
      enabled: false
    jaeger-grpc:
      enabled: false
    zipkin:
      enabled: false
  alternateConfig:
    receivers:
      k8s_cluster:
        collection_interval: *collectionInterval
    extensions:
      health_check:
        endpoint: ${env:MY_POD_IP}:13133
    processors:
      resource/region: *region
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      batch: {}
      k8s_attributes/pod_uid:
        passthrough: false
        pod_association: *podUIDAssociation
        extract: *tenancyExtract
    exporters:
      clickhouse: *clickhouseExporter
    service:
      extensions: [health_check]
      pipelines:
        logs:
          receivers: [k8sobjects]
          processors: [memory_limiter, resource/region, batch]
          exporters: [clickhouse]
        metrics:
          receivers: [k8s_cluster]
          processors: [memory_limiter, k8s_attributes/pod_uid, resource/region, batch]
          exporters: [clickhouse]
