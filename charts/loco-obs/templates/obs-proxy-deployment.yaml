{{- if .Values.obsProxy.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-obs-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-obs-proxy
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}-obs-proxy
  replicas: {{ .Values.obsProxy.replicaCount }}
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-obs-proxy
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: obs-proxy
          image: "{{ .Values.obsProxy.image.repository }}:{{ required "obsProxy.image.tag is required" .Values.obsProxy.image.tag }}"
          imagePullPolicy: {{ .Values.obsProxy.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: PORT
              value: {{ .Values.obsProxy.port | quote }}
            - name: CONTROL_PLANE_URL
              value: {{ .Values.obsProxy.controlPlane.url | quote }}
            - name: PROXY_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-obs-proxy-auth" .Release.Name) .Values.obsProxy.auth.existingSecret }}
                  key: token
                  optional: {{ not .Values.obsProxy.auth.existingSecret }}
            {{- include "loco-obs.clickhouseDSN" (dict "root" . "env" "CLICKHOUSE_URL" "passwordEnv" "CLICKHOUSE_READER_PASSWORD" "user" .Values.obsProxy.clickhouse.readerUser "existingSecret" .Values.obsProxy.clickhouse.existingSecret "path" "obsProxy.clickhouse.existingSecret") | nindent 12 }}
            {{- include "loco-obs.clickhouseDSN" (dict "root" . "env" "CLICKHOUSE_MIGRATOR_URL" "passwordEnv" "CLICKHOUSE_MIGRATOR_PASSWORD" "user" .Values.obsProxy.clickhouse.migratorUser "existingSecret" .Values.obsProxy.clickhouse.migratorExistingSecret "path" "obsProxy.clickhouse.migratorExistingSecret") | nindent 12 }}
            - name: CLICKHOUSE_DB
              value: {{ .Values.obsProxy.clickhouse.database | quote }}
            - name: CLICKHOUSE_LOGS_TTL
              value: {{ .Values.obsProxy.clickhouse.retention.logs | quote }}
            - name: CLICKHOUSE_TRACES_TTL
              value: {{ .Values.obsProxy.clickhouse.retention.traces | quote }}
            - name: CLICKHOUSE_METRICS_TTL
              value: {{ .Values.obsProxy.clickhouse.retention.metrics | quote }}
            - name: MIGRATION_RETRY_BUDGET
              value: {{ printf "%ds" (int .Values.obsProxy.clickhouse.migrations.retryBudgetSeconds) | quote }}
            - name: MIGRATION_RETRY_INTERVAL
              value: {{ printf "%ds" (int .Values.obsProxy.clickhouse.migrations.retryIntervalSeconds) | quote }}
            - name: DEFAULT_LIMIT
              value: {{ .Values.obsProxy.guardrails.defaultLimit | quote }}
            - name: MAX_LIMIT
              value: {{ .Values.obsProxy.guardrails.maxLimit | quote }}
            - name: QUERY_TIMEOUT_SECONDS
              value: {{ .Values.obsProxy.guardrails.queryTimeoutSeconds | quote }}
            - name: MAX_TIME_RANGE_HOURS
              value: {{ .Values.obsProxy.guardrails.maxTimeRangeHours | quote }}
            - name: MAX_CONCURRENT_QUERIES
              value: {{ .Values.obsProxy.guardrails.maxConcurrentQueries | quote }}
            - name: MAX_TAIL_DURATION_MINUTES
              value: {{ .Values.obsProxy.guardrails.maxTailDurationMinutes | quote }}
            - name: MAX_CONCURRENT_TAILS
              value: {{ .Values.obsProxy.guardrails.maxConcurrentTails | quote }}
            - name: TOKEN_CACHE_TTL_SECONDS
              value: {{ .Values.obsProxy.guardrails.tokenCacheTTLSeconds | quote }}
          ports:
            - containerPort: {{ .Values.obsProxy.port }}
          startupProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.obsProxy.port }}
            periodSeconds: {{ .Values.obsProxy.clickhouse.migrations.retryIntervalSeconds }}
            failureThreshold: {{ add 2 (div .Values.obsProxy.clickhouse.migrations.retryBudgetSeconds .Values.obsProxy.clickhouse.migrations.retryIntervalSeconds) }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.obsProxy.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.obsProxy.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.obsProxy.resources | nindent 12 }}
      restartPolicy: Always
{{- end }}
