{{- if .Values.obsProxy.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-obs-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-obs-proxy
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}-obs-proxy
  replicas: {{ .Values.obsProxy.replicaCount }}
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-obs-proxy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: obs-proxy
          image: "{{ .Values.obsProxy.image.repository }}:{{ required "obsProxy.image.tag is required" .Values.obsProxy.image.tag }}"
          imagePullPolicy: {{ .Values.obsProxy.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: PORT
              value: {{ .Values.obsProxy.port | quote }}
            - name: CONTROL_PLANE_URL
              value: {{ required "obsProxy.controlPlane.url is required" .Values.obsProxy.controlPlane.url | quote }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ join "," .Values.obsProxy.cors.allowedOrigins | quote }}
            {{- include "loco-obs.clickhouseDSN" (dict "root" . "env" "CLICKHOUSE_URL" "passwordEnv" "CLICKHOUSE_READER_PASSWORD" "user" .Values.obsProxy.clickhouse.readerUser "existingSecret" .Values.obsProxy.clickhouse.existingSecret "path" "obsProxy.clickhouse.existingSecret") | nindent 12 }}
            {{- include "loco-obs.clickhouseDSN" (dict "root" . "env" "CLICKHOUSE_MIGRATOR_URL" "passwordEnv" "CLICKHOUSE_MIGRATOR_PASSWORD" "user" .Values.obsProxy.clickhouse.migratorUser "existingSecret" .Values.obsProxy.clickhouse.migratorExistingSecret "path" "obsProxy.clickhouse.migratorExistingSecret") | nindent 12 }}
          ports:
            - containerPort: {{ .Values.obsProxy.port }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.obsProxy.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.obsProxy.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.obsProxy.resources | nindent 12 }}
      restartPolicy: Always
{{- end }}
