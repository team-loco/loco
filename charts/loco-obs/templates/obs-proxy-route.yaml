{{- if .Values.obsProxy.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: obs-proxy
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: eg
      namespace: {{ .Values.gatewayNamespace }}
  hostnames:
    - {{ .Values.global.domain.observability | quote }}
  rules:
    - backendRefs:
        - name: {{ .Release.Name }}-obs-proxy
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /
{{- end }}
