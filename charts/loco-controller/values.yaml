# Configure the controller manager deployment
manager:
  replicas: 1

  image:
    repository: ghcr.io/team-loco/loco-controller
    tag: latest
    pullPolicy: Always

  # Arguments
  args:
    - --leader-elect

  # Environment variables
  env: []

  # Pod-level security settings
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  # Container-level security settings
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true

  # Resource limits and requests
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

registry:
  pullSecretName: ""

builds:
  namespace: loco-builds
  agentServiceAccount:
    name: loco-core-agent
    namespace: ""
  pushSecretName: ""
  builderImage:
    repository: ghcr.io/team-loco/loco-builder
    tag: latest
    pullPolicy: Always
  buildkitImage:
    repository: moby/buildkit
    tag: v0.33.1-rootless
    pullPolicy: IfNotPresent
  timeout: 30m
  ttlAfterFinished: 10m
  downloadTimeout: 10m
  maxSourceSize: 200Mi
  maxContextSize: 1Gi
  maxContextFiles: 200000
  maxImageSize: 1Gi
  insecureRegistry: false
  privateEgressCIDRs: []
  seccompLocalhostProfile: ""
  runtimeClassName: ""
  nodeSelector: {}
  tolerations: []
  resources:
    fetch:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: "1"
        memory: 256Mi
    build:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 4Gi
    push:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: "1"
        memory: 512Mi
  storage:
    workspace: 2Gi
    cache: 5Gi
    out: 10Gi
    buildkit: 10Gi

# Essential RBAC permissions (required for controller operation)
# These include ServiceAccount, controller permissions, leader election, and metrics access
# Note: Essential RBAC is always enabled as it's required for the controller to function

# Helper RBAC roles for managing custom resources
# These provide convenient admin/editor/viewer roles for each CRD type
# Useful for giving users different levels of access to your custom resources
rbacHelpers:
  enable: false # Install convenience admin/editor/viewer roles for CRDs

# Custom Resource Definitions
crd:
  enable: true # Install CRDs with the chart
  keep: true # Keep CRDs when uninstalling

# Controller metrics endpoint.
# Enable to expose /metrics endpoint with RBAC protection.
metrics:
  enable: true
  port: 8443 # Metrics server port

# Cert-manager integration for TLS certificates.
# Required for webhook certificates and metrics endpoint certificates.
certManager:
  enable: false

# Prometheus ServiceMonitor for metrics scraping.
# Requires prometheus-operator to be installed in the cluster.
prometheus:
  enable: false
