apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    labels:
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        app.kubernetes.io/name: controller
    name: controller-build-role
    namespace: {{ .Values.builds.namespace }}
rules:
    - apiGroups:
        - batch
      resources:
        - jobs
      verbs:
        - create
        - delete
        - get
        - list
        - watch
    - apiGroups:
        - ""
      resources:
        - pods
      verbs:
        - get
        - list
        - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    labels:
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        app.kubernetes.io/name: controller
    name: controller-build-rolebinding
    namespace: {{ .Values.builds.namespace }}
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: controller-build-role
subjects:
    - kind: ServiceAccount
      name: controller-loco-manager
      namespace: {{ .Release.Namespace }}
