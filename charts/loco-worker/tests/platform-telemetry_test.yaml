suite: platform telemetry
release:
  name: loco-worker
  namespace: loco-system
values:
  - ../ci/default-values.yaml
  - values/platform-telemetry.yaml
tests:
  - it: requires an installation ID
    set:
      global.platformTelemetry.installation: ""
    asserts:
      - failedTemplate:
          errorPattern: "/global/platformTelemetry/installation': minLength"

  - it: requires a cluster name
    set:
      global.platformTelemetry.cluster: ""
    asserts:
      - failedTemplate:
          errorPattern: "/global/platformTelemetry/cluster': minLength"

  - it: requires an environment
    set:
      global.platformTelemetry.environment: ""
    asserts:
      - failedTemplate:
          errorPattern: "/global/platformTelemetry/environment': minLength"

  - it: needs no identity while platform telemetry is off
    set:
      global.platformTelemetry: {enabled: false, installation: "", cluster: "", environment: ""}
    asserts:
      - notFailedTemplate: {}

  - it: gives the collectors only read access and no access to Secrets
    asserts:
      - matchRegex: &readOnly
          path: rules[*].verbs[*]
          pattern: ^(get|list|watch)$
        template: charts/nodeCollector/templates/clusterrole.yaml
      - matchRegex: *readOnly
        template: charts/workloadCollector/templates/clusterrole.yaml
      - matchRegex: *readOnly
        template: charts/clusterCollector/templates/clusterrole.yaml
      - notMatchRegex: &noSecrets
          path: rules[*].resources[*]
          pattern: ^secrets$
        template: charts/nodeCollector/templates/clusterrole.yaml
      - notMatchRegex: *noSecrets
        template: charts/workloadCollector/templates/clusterrole.yaml
      - notMatchRegex: *noSecrets
        template: charts/clusterCollector/templates/clusterrole.yaml
      - isKind: {of: ClusterRole}
        template: charts/nodeCollector/templates/clusterrole.yaml
      - isKind: {of: ClusterRole}
        template: charts/clusterCollector/templates/clusterrole.yaml

  - it: rejects more than one cluster collector replica
    set:
      clusterCollector.replicaCount: 2
    asserts:
      - failedTemplate:
          errorMessage: platform telemetry requires one clusterCollector replica with autoscaling disabled
        template: templates/collectors/collector-configs.yaml

  - it: rejects an autoscaled cluster collector
    set:
      clusterCollector.autoscaling.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: platform telemetry requires one clusterCollector replica with autoscaling disabled
        template: templates/collectors/collector-configs.yaml

  - it: deletes the platform marker from the telemetry workloads send
    template: templates/collectors/collector-configs.yaml
    asserts:
      - matchRegex: &stripsScope
          path: data.relay
          pattern: 'resource/strip_tenancy:\n\s+attributes:\n(\s+- action: delete\n\s+key: \S+\n)*\s+- action: delete\n\s+key: loco\.telemetry\.scope\n'
        documentSelector: {path: metadata.name, value: node-collector-agent}
      - matchRegex: *stripsScope
        documentSelector: {path: metadata.name, value: workload-collector}

  - it: points both controllers at the cluster collector's platform pipelines
    asserts:
      - contains: &platformEndpoint
          path: spec.template.spec.containers[0].env
          content: {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://cluster-collector-platform.loco-obs.svc.cluster.local:4318"}
        template: templates/controller/deployment.yaml
      - contains: *platformEndpoint
        template: templates/builds/deployment.yaml
      - equal:
          path: spec.selector
          value: {app.kubernetes.io/name: cluster-collector, app.kubernetes.io/instance: loco-worker}
        documentSelector: {path: kind, value: Service}
        template: templates/collectors/platform-otlp.yaml
      - equal:
          path: spec.ingress[0].from[0]
          value:
            namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: loco-system}}
            podSelector: {matchExpressions: [{key: app.kubernetes.io/name, operator: In, values: [loco-controller, loco-build-controller]}]}
        documentSelector: {path: kind, value: NetworkPolicy}
        template: templates/collectors/platform-otlp.yaml

  - it: opts out of platform stdout while keeping workload logs and infrastructure metrics
    set:
      global.platformTelemetry.logs.enabled: false
    template: templates/collectors/collector-configs.yaml
    asserts:
      - notMatchRegex:
          path: data.relay
          pattern: 'logs/platform:'
        documentSelector: {path: metadata.name, value: node-collector-agent}
      - matchRegex:
          path: data.relay
          pattern: 'metrics/platform:'
        documentSelector: {path: metadata.name, value: node-collector-agent}
      - matchRegex:
          path: data.relay
          pattern: '(?m)^\s+logs:\n'
        documentSelector: {path: metadata.name, value: node-collector-agent}
      - matchRegex:
          path: data.relay
          pattern: 'logs/platform:'
        documentSelector: {path: metadata.name, value: cluster-collector}

  - it: exports no controller telemetry while platform telemetry is off
    set:
      global.platformTelemetry.enabled: false
    asserts:
      - notContains: &noEndpoint
          path: spec.template.spec.containers[0].env
          content: {name: OTEL_EXPORTER_OTLP_ENDPOINT}
          any: true
        template: templates/controller/deployment.yaml
      - notContains: *noEndpoint
        template: templates/builds/deployment.yaml
      - hasDocuments: {count: 0}
        template: templates/collectors/platform-otlp.yaml

  - it: refuses an OTLP endpoint in a controller's env as well
    set:
      controller.env: [{name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT, value: "http://elsewhere"}]
    asserts:
      - failedTemplate:
          errorMessage: controller.env sets OTEL_EXPORTER_OTLP_METRICS_ENDPOINT, which global.platformTelemetry sets
        template: templates/controller/deployment.yaml

  - it: refuses OTLP headers in the build controller's env as well
    set:
      builds.controller.env: [{name: OTEL_EXPORTER_OTLP_TRACES_HEADERS, value: "x=y"}]
    asserts:
      - failedTemplate:
          errorMessage: builds.controller.env sets OTEL_EXPORTER_OTLP_TRACES_HEADERS, which global.platformTelemetry sets
        template: templates/builds/deployment.yaml

  - it: names each controller replica by its pod UID
    asserts:
      - contains: &podUID
          path: spec.template.spec.containers[0].env
          content: {name: LOCO_POD_UID, valueFrom: {fieldRef: {fieldPath: metadata.uid}}}
        template: templates/controller/deployment.yaml
      - contains: *podUID
        template: templates/builds/deployment.yaml
      - contains: &instance
          path: spec.template.spec.containers[0].env
          content: {name: OTEL_RESOURCE_ATTRIBUTES, value: "service.instance.id=$(LOCO_POD_UID),k8s.namespace.name=loco-system"}
        template: templates/controller/deployment.yaml
      - contains: *instance
        template: templates/builds/deployment.yaml
