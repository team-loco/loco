suite: controller
release:
  name: loco-worker
  namespace: loco-system
values:
  - ../ci/default-values.yaml
tests:
  - it: runs the controller image at the tag the values give
    set:
      controller.image.tag: chart-test
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/team-loco/loco-controller:chart-test
        template: templates/controller/deployment.yaml

  - it: requires a controller image tag
    set:
      controller.image.tag: ""
    asserts:
      - failedTemplate:
          errorPattern: "/controller/image/tag': minLength"

  - it: grants the Application controller no access to Builds or Jobs
    asserts:
      - notMatchRegex:
          path: rules[*].resources[*]
          pattern: ^(builds|jobs)(/.*)?$
        template: templates/controller/manager-role.yaml

  - it: grants the Application controller only read access to pods
    asserts:
      - equal:
          path: rules[?(@.resources[?(@ == 'pods')])].verbs
          value: [get, list, watch]
        template: templates/controller/manager-role.yaml

  - it: keeps namespace deletion with the agent
    asserts:
      - equal:
          path: rules[?(@.resources[?(@ == 'namespaces')])].verbs
          value: [create, get, list, patch, update, watch]
        template: templates/controller/manager-role.yaml

  - it: points at the collector Services, DaemonSet and Gateway the chart renders
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: LOCO_OBSERVABILITY_NAMESPACE, value: loco-obs}
        template: templates/controller/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: LOCO_OTEL_COLLECTOR_SERVICE, value: otel-col-deploy}
        template: templates/controller/deployment.yaml
      - equal:
          path: metadata.name
          value: otel-col-deploy
        template: charts/otel-col-deploy/templates/service.yaml
      - equal:
          path: metadata.namespace
          value: loco-obs
        template: charts/otel-col-deploy/templates/service.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: LOCO_METRICS_COLLECTOR_NAMESPACE, value: loco-obs-node}
        template: templates/controller/deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: LOCO_METRICS_COLLECTOR_SERVICE, value: otel-col-daemon}
        template: templates/controller/deployment.yaml
      - equal:
          path: metadata.namespace
          value: loco-obs-node
        template: charts/otel-col-daemon/templates/daemonset.yaml
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: otel-col-daemon
        template: charts/otel-col-daemon/templates/daemonset.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: LOCO_GATEWAY, value: eg}
        template: templates/controller/deployment.yaml

  - it: reads the collector namespace, Service and ports from the values
    set:
      otel-col-deploy.namespaceOverride: telemetry
      otel-col-deploy.fullnameOverride: collector
      otel-col-deploy.ports.otlp.servicePort: 14317
      otel-col-deploy.ports.otlp-http.servicePort: 14318
    template: templates/controller/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: LOCO_OBSERVABILITY_NAMESPACE, value: telemetry}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: LOCO_OTEL_COLLECTOR_SERVICE, value: collector}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: LOCO_OTEL_COLLECTOR_GRPC_PORT, value: "14317"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: LOCO_OTEL_COLLECTOR_HTTP_PORT, value: "14318"}

  - it: names workspace namespaces with the prefix the values give
    set:
      global.workspaceNamespacePrefix: tenant-
    template: templates/controller/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: LOCO_WORKSPACE_NAMESPACE_PREFIX, value: tenant-}

  - it: names workspace namespaces with the loco- prefix by default
    template: templates/controller/deployment.yaml
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[?(@.name == 'manager')].env[?(@.name == 'LOCO_WORKSPACE_NAMESPACE_PREFIX')].value
          pattern: ^loco-

  - it: runs the Application controller in static registry mode by default
    template: templates/controller/deployment.yaml
    set:
      registry.pullSecretName: pull
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: LOCO_REGISTRY_AUTH, value: static}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: REGISTRY_PULL_SECRET_NAME, value: pull}

  - it: runs the Application controller in token registry mode
    template: templates/controller/deployment.yaml
    set:
      registry.auth: token
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: LOCO_REGISTRY_AUTH, value: token}
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: REGISTRY_PULL_SECRET_NAME}
          any: true

  - it: rejects a static pull Secret in token registry mode
    template: templates/controller/deployment.yaml
    set:
      registry.auth: token
      registry.pullSecretName: pull
    asserts:
      - failedTemplate:
          errorMessage: "registry.pullSecretName applies only to registry.auth static; token mode copies the agent's Secrets"
