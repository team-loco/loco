suite: custom resource definitions
values:
  - ../ci/default-values.yaml
includeCrds: true
templates:
  - "**/*"
tests:
  - it: renders no CustomResourceDefinition for the all role, since mise run crds:apply and the platform bundle own them
    asserts:
      - isKind:
          of: CustomResourceDefinition
        not: true

  - it: renders no CustomResourceDefinition for the apps role
    set:
      cluster.role: apps
    asserts:
      - isKind:
          of: CustomResourceDefinition
        not: true
