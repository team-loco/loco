suite: certificates
release:
  name: loco-worker
  namespace: loco-system
values:
  - ../ci/default-values.yaml
set:
  certManager.issuer.email: operator@example.test
templates:
  - templates/cm-issuer.yaml
  - templates/cm-cert.yaml
  - templates/gateway.yaml
tests:
  - it: issues from ACME by default
    asserts:
      - equal:
          path: spec.acme.email
          value: operator@example.test
        template: templates/cm-issuer.yaml
      - equal:
          path: spec.issuerRef
          value: {name: letsencrypt-prod, kind: ClusterIssuer}
        template: templates/cm-cert.yaml
      - isKind:
          of: ClusterIssuer
        template: templates/cm-issuer.yaml
      - equal:
          path: metadata.name
          value: letsencrypt-prod
        template: templates/cm-issuer.yaml

  - it: requires solvers when it creates the ACME issuer
    set:
      certManager.issuer.solvers: []
    template: templates/cm-issuer.yaml
    asserts:
      - failedTemplate:
          errorMessage: certManager.issuer.solvers is required for an ACME issuer

  - it: renders configured HTTP-01 solvers verbatim
    set:
      certManager.issuer.solvers:
        - http01:
            gatewayHTTPRoute:
              parentRefs: [{name: edge, namespace: gateway, kind: Gateway}]
    asserts:
      - equal:
          path: spec.acme.solvers
          value:
            - http01:
                gatewayHTTPRoute:
                  parentRefs: [{name: edge, namespace: gateway, kind: Gateway}]
        template: templates/cm-issuer.yaml
      - hasDocuments:
          count: 2
        template: templates/cm-cert.yaml

  - it: needs no ACME email or solvers for a self-signed issuer
    set:
      certManager.issuer.email: ""
      certManager.issuer.solvers: []
      certManager.issuer.name: local
      certManager.issuer.type: selfSigned
    asserts:
      - equal:
          path: spec
          value: {selfSigned: {}}
        template: templates/cm-issuer.yaml
      - notExists:
          path: metadata.namespace
        template: templates/cm-issuer.yaml
      - equal:
          path: spec.issuerRef
          value: {name: local, kind: ClusterIssuer}
        template: templates/cm-cert.yaml

  - it: references an existing ClusterIssuer without solvers
    set:
      certManager.issuer: {create: false, name: operator-issuer, kind: ClusterIssuer, solvers: []}
    asserts:
      - hasDocuments:
          count: 0
        template: templates/cm-issuer.yaml
      - equal:
          path: spec.issuerRef
          value: {name: operator-issuer, kind: ClusterIssuer}
        template: templates/cm-cert.yaml

  - it: references an existing namespaced Issuer
    set:
      certManager.issuer: {create: false, name: operator-issuer, kind: Issuer}
    asserts:
      - hasDocuments:
          count: 0
        template: templates/cm-issuer.yaml
      - equal:
          path: spec.issuerRef
          value: {name: operator-issuer, kind: Issuer}
        template: templates/cm-cert.yaml

  - it: renders no certificate resources with an existing TLS Secret, and serves that Secret
    set:
      certManager.existingTLSSecret: operator-tls
      certManager.issuer.solvers: []
    asserts:
      - hasDocuments:
          count: 0
        template: templates/cm-issuer.yaml
      - hasDocuments:
          count: 0
        template: templates/cm-cert.yaml
      - equal:
          path: spec.listeners[?(@.protocol == "HTTPS")].tls.certificateRefs
          value: [{name: operator-tls, kind: Secret, group: ""}]
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: Gateway}

  - it: issues one wildcard Certificate per app domain
    asserts:
      - hasDocuments:
          count: 2
        template: templates/cm-cert.yaml
      - equal:
          path: spec
          value:
            secretName: loco-worker-onloco.app-tls
            issuerRef: {name: letsencrypt-prod, kind: ClusterIssuer}
            commonName: "*.onloco.app"
            dnsNames: ["*.onloco.app"]
        template: templates/cm-cert.yaml
        documentSelector: {path: metadata.name, value: loco-worker-onloco.app}
      - equal:
          path: spec
          value:
            secretName: loco-worker-onloco.build-tls
            issuerRef: {name: letsencrypt-prod, kind: ClusterIssuer}
            commonName: "*.onloco.build"
            dnsNames: ["*.onloco.build"]
        template: templates/cm-cert.yaml
        documentSelector: {path: metadata.name, value: loco-worker-onloco.build}

  - it: serves each app domain's HTTPS listener from its own Certificate's Secret
    template: templates/gateway.yaml
    documentSelector: {path: kind, value: Gateway}
    asserts:
      - equal:
          path: spec.listeners[?(@.name == "https-apps-0")].tls.certificateRefs
          value: [{name: loco-worker-onloco.app-tls, kind: Secret, group: ""}]
      - equal:
          path: spec.listeners[?(@.name == "https-apps-1")].tls.certificateRefs
          value: [{name: loco-worker-onloco.build-tls, kind: Secret, group: ""}]

  - it: rejects an unknown issuer type
    set:
      certManager.issuer.type: unknown
    asserts:
      - failedTemplate:
          errorMessage: certManager.issuer.type must be acme or selfSigned
        template: templates/cm-issuer.yaml

  - it: rejects creating a namespaced Issuer
    set:
      certManager.issuer.kind: Issuer
    asserts:
      - failedTemplate:
          errorMessage: certManager.issuer.kind must be ClusterIssuer when certManager.issuer.create is true
        template: templates/cm-issuer.yaml

  - it: requires an ACME email when it creates the ACME issuer
    set:
      certManager.issuer.email: ""
    asserts:
      - failedTemplate:
          errorPattern: "/certManager/issuer/email': minLength"

  - it: adds each additional name to the Certificate of the longest app domain it falls under
    set:
      global.domain.apps: [example.test, apps.example.test]
      certManager.additionalDNSNames: ["*.staging-east.apps.example.test", "*.edge.example.test"]
    template: templates/cm-cert.yaml
    asserts:
      - equal:
          path: spec.dnsNames
          value: ["*.example.test", "*.edge.example.test"]
        documentSelector: {path: metadata.name, value: loco-worker-example.test}
      - equal:
          path: spec.dnsNames
          value: ["*.apps.example.test", "*.staging-east.apps.example.test"]
        documentSelector: {path: metadata.name, value: loco-worker-apps.example.test}

  - it: rejects an additional name under no app domain
    set:
      certManager.additionalDNSNames: ["*.elsewhere.test"]
    template: templates/cm-cert.yaml
    asserts:
      - failedTemplate:
          errorMessage: certManager.additionalDNSNames entry *.elsewhere.test is under no apps domain
