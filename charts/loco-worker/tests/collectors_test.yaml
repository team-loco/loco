suite: collectors
release:
  name: loco-worker
  namespace: loco-system
values:
  - ../ci/default-values.yaml
tests:
  - it: enriches dependency telemetry with the namespace workspace
    template: templates/collectors/collector-configs.yaml
    documentSelector: {path: metadata.name, value: workload-collector}
    asserts:
      - matchRegex:
          path: data.relay
          pattern: 'from: namespace\n\s+key: loco.io/workspace-id\n\s+tag_name: loco.workspace.id'

  - it: extracts the gateway route namespace for ownership lookup
    template: templates/collectors/collector-configs.yaml
    documentSelector: {path: metadata.name, value: workload-collector}
    set:
      global.workspaceNamespacePrefix: tenant-
    asserts:
      - matchRegex:
          path: data.relay
          pattern: 'httproute/\(\?P<namespace>tenant-'
      - matchRegex:
          path: data.relay
          pattern: 'set\(attributes\["k8s.namespace.name"\], cache\["namespace"\]\)'

  - it: runs only the node collector as a DaemonSet
    asserts:
      - isKind:
          of: DaemonSet
        template: charts/nodeCollector/templates/daemonset.yaml
      - equal:
          path: metadata.name
          value: node-collector-agent
        template: charts/nodeCollector/templates/daemonset.yaml
      - hasDocuments:
          count: 0
        template: charts/workloadCollector/templates/daemonset.yaml
      - hasDocuments:
          count: 0
        template: charts/clusterCollector/templates/daemonset.yaml
      - isKind:
          of: StatefulSet
        template: charts/workloadCollector/templates/statefulset.yaml
      - isKind:
          of: StatefulSet
        template: charts/clusterCollector/templates/statefulset.yaml
      - hasDocuments:
          count: 0
        template: charts/nodeCollector/templates/statefulset.yaml

  - it: puts the node collector in the privileged namespace and the others in the restricted one
    asserts:
      - equal: {path: metadata.namespace, value: loco-obs-node}
        template: charts/nodeCollector/templates/daemonset.yaml
      - equal: {path: metadata.namespace, value: loco-obs-node}
        template: charts/nodeCollector/templates/serviceaccount.yaml
      - equal: {path: metadata.namespace, value: loco-obs}
        template: charts/workloadCollector/templates/statefulset.yaml
      - equal: {path: metadata.namespace, value: loco-obs}
        template: charts/workloadCollector/templates/service.yaml
      - equal: {path: metadata.namespace, value: loco-obs}
        template: charts/workloadCollector/templates/serviceaccount.yaml
      - equal: {path: metadata.namespace, value: loco-obs}
        template: charts/clusterCollector/templates/statefulset.yaml
      - equal: {path: metadata.namespace, value: loco-obs}
        template: charts/clusterCollector/templates/serviceaccount.yaml
      - equal: {path: metadata.namespace, value: loco-obs-node}
        template: templates/collectors/collector-configs.yaml
        documentSelector: {path: metadata.name, value: node-collector-agent}
      - equal: {path: metadata.namespace, value: loco-obs}
        template: templates/collectors/collector-configs.yaml
        documentSelector: {path: metadata.name, value: workload-collector}
      - equal: {path: metadata.namespace, value: loco-obs}
        template: templates/collectors/collector-configs.yaml
        documentSelector: {path: metadata.name, value: cluster-collector}

  - it: labels each collector namespace with its Pod Security level and keeps it on uninstall
    template: templates/collectors/namespaces.yaml
    asserts:
      - isSubset:
          path: metadata.labels
          content:
            pod-security.kubernetes.io/enforce: restricted
            pod-security.kubernetes.io/audit: restricted
            pod-security.kubernetes.io/warn: restricted
        documentSelector: {path: metadata.name, value: loco-obs}
      - isSubset:
          path: metadata.labels
          content:
            pod-security.kubernetes.io/enforce: privileged
            pod-security.kubernetes.io/audit: privileged
            pod-security.kubernetes.io/warn: privileged
        documentSelector: {path: metadata.name, value: loco-obs-node}
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep

  - it: admits OTLP to the workload collector from the release namespace
    template: templates/collectors/network-policies.yaml
    documentSelector: {path: metadata.name, value: allow-otlp-ingress}
    asserts:
      - equal:
          path: metadata.namespace
          value: loco-obs
      - contains:
          path: spec.ingress[0].from
          content: {namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: loco-system}}}

  - it: requires an exporter endpoint
    set:
      global.exporter.endpoint: ""
    asserts:
      - failedTemplate:
          errorMessage: global.exporter.endpoint is required
        template: templates/collectors/collector-configs.yaml

  - it: requires a region
    set:
      global.region: ""
    asserts:
      - failedTemplate:
          errorMessage: global.region is required
        template: templates/collectors/collector-configs.yaml

  - it: mounts the bearer token Secret and the export queue in every collector
    set:
      global.exporter.ingestToken.enabled: true
      global.exporter.ingestToken.secretName: cluster-token
    asserts:
      - contains: &tokenVolume
          path: spec.template.spec.volumes
          content: {name: exporter-token, secret: {secretName: cluster-token, optional: true}}
        template: charts/nodeCollector/templates/daemonset.yaml
      - contains: *tokenVolume
        template: charts/workloadCollector/templates/statefulset.yaml
      - contains: *tokenVolume
        template: charts/clusterCollector/templates/statefulset.yaml
      - contains: &tokenMount
          path: spec.template.spec.containers[0].volumeMounts
          content: {name: exporter-token, mountPath: /etc/otelcol-exporter, readOnly: true}
        template: charts/nodeCollector/templates/daemonset.yaml
      - contains: *tokenMount
        template: charts/workloadCollector/templates/statefulset.yaml
      - contains: *tokenMount
        template: charts/clusterCollector/templates/statefulset.yaml
      - contains: &queueMount
          path: spec.template.spec.containers[0].volumeMounts
          content: {name: exporter-queue, mountPath: /var/lib/otelcol-exporter}
        template: charts/nodeCollector/templates/daemonset.yaml
      - contains: *queueMount
        template: charts/workloadCollector/templates/statefulset.yaml
      - contains: *queueMount
        template: charts/clusterCollector/templates/statefulset.yaml

  - it: queues the node collector's exports in a host path per namespace and collector
    template: charts/nodeCollector/templates/daemonset.yaml
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: exporter-queue
            hostPath: {path: /var/lib/otelcol-exporter/loco-obs-node/node-collector, type: DirectoryOrCreate}

  - it: hands the node collector's export queue and log checkpoints to the collector user before it starts
    template: charts/nodeCollector/templates/daemonset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 10001
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsGroup
          value: 0
      - equal:
          path: spec.template.spec.initContainers[?(@.name == 'state-permissions')].command
          value: [chown, -R, "10001:0", /var/lib/otelcol, /var/lib/otelcol-exporter]
      - equal:
          path: spec.template.spec.initContainers[?(@.name == 'state-permissions')].volumeMounts
          value:
            - {mountPath: /var/lib/otelcol, name: log-checkpoint-permissions}
            - {mountPath: /var/lib/otelcol-exporter, name: exporter-queue}
      - contains:
          path: spec.template.spec.volumes
          content: {name: log-checkpoint-permissions, hostPath: {path: /var/lib/otelcol, type: DirectoryOrCreate}}

  - it: keeps the node collector's log checkpoints in a host path
    template: charts/nodeCollector/templates/daemonset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: {name: varlibotelcol, mountPath: /var/lib/otelcol}
      - contains:
          path: spec.template.spec.volumes
          content: {name: varlibotelcol, hostPath: {path: /var/lib/otelcol, type: DirectoryOrCreate}}

  - it: lets the state permissions init container only chown
    template: charts/nodeCollector/templates/daemonset.yaml
    asserts:
      - equal:
          path: spec.template.spec.initContainers[?(@.name == 'state-permissions')].securityContext.capabilities
          value: {drop: [ALL], add: [CHOWN]}
      - equal:
          path: spec.template.spec.initContainers[?(@.name == 'state-permissions')].securityContext.allowPrivilegeEscalation
          value: false

  - it: runs the node collector as non-root
    template: charts/nodeCollector/templates/daemonset.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true

  - it: keeps every volume the chart mounts when log checkpoints are off
    set:
      nodeCollector.presets.logsCollection.storeCheckpoints: false
    template: charts/nodeCollector/templates/daemonset.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content: {name: varlibotelcol}
          any: true
      - contains:
          path: spec.template.spec.volumes
          content: {name: log-checkpoint-permissions}
          any: true
      - contains:
          path: spec.template.spec.volumes
          content: {name: exporter-queue}
          any: true
      - contains:
          path: spec.template.spec.volumes
          content: {name: exporter-token}
          any: true

  - it: gives each StatefulSet collector its own export queue claim
    asserts:
      - equal: &claim
          path: spec.volumeClaimTemplates[0].metadata.name
          value: exporter-queue
        template: charts/workloadCollector/templates/statefulset.yaml
      - equal: *claim
        template: charts/clusterCollector/templates/statefulset.yaml
      - lengthEqual: &oneClaim
          path: spec.volumeClaimTemplates
          count: 1
        template: charts/workloadCollector/templates/statefulset.yaml
      - lengthEqual: *oneClaim
        template: charts/clusterCollector/templates/statefulset.yaml
      - equal: &readWriteOnce
          path: spec.volumeClaimTemplates[0].spec.accessModes
          value: [ReadWriteOnce]
        template: charts/workloadCollector/templates/statefulset.yaml
      - equal: *readWriteOnce
        template: charts/clusterCollector/templates/statefulset.yaml
      - matchRegex: &storage
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          pattern: ^[1-9]
        template: charts/workloadCollector/templates/statefulset.yaml
      - matchRegex: *storage
        template: charts/clusterCollector/templates/statefulset.yaml
      - notContains: &noQueueVolume
          path: spec.template.spec.volumes
          content: {name: exporter-queue}
          any: true
        template: charts/workloadCollector/templates/statefulset.yaml
      - notContains: *noQueueVolume
        template: charts/clusterCollector/templates/statefulset.yaml

  - it: lets each StatefulSet collector own its claim through fsGroup
    asserts:
      - equal: &fsGroup
          path: spec.template.spec.securityContext.fsGroup
          value: 10001
        template: charts/workloadCollector/templates/statefulset.yaml
      - equal: *fsGroup
        template: charts/clusterCollector/templates/statefulset.yaml

  - it: lets the node and workload collectors get, list and watch the pods, namespaces and ReplicaSets they extract metadata from
    asserts:
      - equal:
          path: rules[?(@.resources[?(@ == 'pods')])].verbs
          value: [get, watch, list]
        template: charts/nodeCollector/templates/clusterrole.yaml
      - equal:
          path: rules[?(@.resources[?(@ == 'namespaces')])].verbs
          value: [get, watch, list]
        template: charts/nodeCollector/templates/clusterrole.yaml
      - equal:
          path: rules[?(@.resources[?(@ == 'replicasets')])].verbs
          value: [get, watch, list]
        template: charts/nodeCollector/templates/clusterrole.yaml
      - equal:
          path: rules[?(@.resources[?(@ == 'pods')])].verbs
          value: [get, watch, list]
        template: charts/workloadCollector/templates/clusterrole.yaml
      - equal:
          path: rules[?(@.resources[?(@ == 'namespaces')])].verbs
          value: [get, watch, list]
        template: charts/workloadCollector/templates/clusterrole.yaml
      - equal:
          path: rules[?(@.resources[?(@ == 'replicasets')])].verbs
          value: [get, watch, list]
        template: charts/workloadCollector/templates/clusterrole.yaml

  - it: runs one cluster collector, without an autoscaler
    asserts:
      - equal:
          path: spec.replicas
          value: 1
        template: charts/clusterCollector/templates/statefulset.yaml
      - equal:
          path: spec.updateStrategy.type
          value: RollingUpdate
        template: charts/clusterCollector/templates/statefulset.yaml
      - hasDocuments:
          count: 0
        template: charts/clusterCollector/templates/hpa.yaml

  - it: holds every collector until the agent has written the token file
    set:
      global.exporter.ingestToken.enabled: true
      global.exporter.ingestToken.secretKey: bearer
      global.exporter.ingestToken.waitIntervalSeconds: 7
    asserts:
      - contains: &tokenPath
          path: spec.template.spec.initContainers[?(@.name == 'exporter-token-wait')].env
          content: {name: TOKEN_FILE, value: /etc/otelcol-exporter/bearer}
          any: true
        template: charts/nodeCollector/templates/daemonset.yaml
      - contains: *tokenPath
        template: charts/workloadCollector/templates/statefulset.yaml
      - contains: *tokenPath
        template: charts/clusterCollector/templates/statefulset.yaml

  - it: runs the token wait as the unprivileged collector user
    set:
      global.exporter.ingestToken.enabled: true
    template: charts/workloadCollector/templates/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.initContainers[?(@.name == 'exporter-token-wait')].securityContext
          value:
            runAsUser: 10001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}

  - it: renders exporter batching and backpressure settings into every collector
    set:
      global.exporter.queue.batch.min_size: 42
      global.exporter.queue.batch.flush_timeout: 2s
    template: templates/collectors/collector-configs.yaml
    asserts:
      - matchRegex:
          path: data.relay
          pattern: 'min_size: 42'
      - matchRegex:
          path: data.relay
          pattern: 'flush_timeout: 2s'
      - matchRegex:
          path: data.relay
          pattern: 'block_on_overflow: true'

  - it: shares Kubernetes metadata processors and emits node file logs synchronously
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --feature-gates=stanza.synchronousLogEmitter,processor.k8sattributes.ShareProcessorBetweenPipelines
        template: charts/nodeCollector/templates/daemonset.yaml
      - contains:
          path: spec.template.spec.containers[0].args
          content: --feature-gates=processor.k8sattributes.ShareProcessorBetweenPipelines
        template: charts/workloadCollector/templates/statefulset.yaml
      - contains:
          path: spec.template.spec.containers[0].args
          content: --feature-gates=processor.k8sattributes.ShareProcessorBetweenPipelines
        template: charts/clusterCollector/templates/statefulset.yaml

  - it: enriches route groups from namespace labels before export
    template: templates/collectors/collector-configs.yaml
    documentSelector: {path: metadata.name, value: workload-collector}
    asserts:
      - matchRegex:
          path: data.relay
          pattern: 'k8s_attributes/route_namespace'

  - it: gives every collector a CPU request and a CPU limit of 2
    asserts:
      - equal: &collectorCPULimit
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: "2"
        template: charts/nodeCollector/templates/daemonset.yaml
      - equal: *collectorCPULimit
        template: charts/workloadCollector/templates/statefulset.yaml
      - equal: *collectorCPULimit
        template: charts/clusterCollector/templates/statefulset.yaml
      - exists: &collectorRequests
          path: spec.template.spec.containers[0].resources.requests.cpu
        template: charts/nodeCollector/templates/daemonset.yaml
      - exists: *collectorRequests
        template: charts/clusterCollector/templates/statefulset.yaml

  - it: reads platform container logs on the node collector
    set:
      global.platformTelemetry: {enabled: true, installation: test, cluster: test, environment: test}
    template: templates/collectors/collector-configs.yaml
    documentSelector: {path: metadata.name, value: node-collector-agent}
    asserts:
      - matchRegex:
          path: data.relay
          pattern: 'transform/platform_log'
      - matchRegex:
          path: data.relay
          pattern: 'filter/workload_logs'
      - matchRegex:
          path: data.relay
          pattern: 'wait_for_metadata: true'
