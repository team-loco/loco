suite: gateway
release:
  name: loco-worker
  namespace: loco-system
values:
  - ../ci/default-values.yaml
templates:
  - templates/gateway.yaml
  - charts/otel-col-deploy/templates/service.yaml
  - charts/gateway-helm/templates/envoy-gateway-config.yaml
  - charts/gateway-helm/templates/infra-manager-rbac.yaml
  - charts/gateway-helm/templates/envoy-gateway-deployment.yaml
tests:
  - it: deploys proxies beside their Gateways with cross-namespace infrastructure permissions
    asserts:
      - matchRegex:
          path: data["envoy-gateway.yaml"]
          pattern: 'type: GatewayNamespace'
        template: charts/gateway-helm/templates/envoy-gateway-config.yaml
      - matchRegex:
          path: data["envoy-gateway.yaml"]
          pattern: 'controllerName: gateway.envoyproxy.io/gatewayclass-controller'
        template: charts/gateway-helm/templates/envoy-gateway-config.yaml
      - equal:
          path: spec.controllerName
          value: gateway.envoyproxy.io/gatewayclass-controller
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: GatewayClass}
      - contains:
          path: rules
          content: {apiGroups: [authentication.k8s.io], resources: [tokenreviews], verbs: [create]}
        template: charts/gateway-helm/templates/infra-manager-rbac.yaml
        documentSelector: {path: kind, value: ClusterRole}

  - it: sends every Envoy signal to the deployment collector's OTLP gRPC Service, metrics as deltas
    asserts:
      - equal:
          path: spec.telemetry.metrics
          value:
            prometheus: {disable: true}
            sinks:
              - type: OpenTelemetry
                openTelemetry:
                  backendRefs: [{name: otel-col-deploy, namespace: loco-obs, port: 4317}]
                  reportCountersAsDeltas: true
                  reportHistogramsAsDeltas: true
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: EnvoyProxy}
      - equal:
          path: spec.telemetry.tracing.provider
          value: {type: OpenTelemetry, backendRefs: [{name: otel-col-deploy, namespace: loco-obs, port: 4317}]}
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: EnvoyProxy}
      - equal:
          path: spec.telemetry.accessLog.settings[0].sinks
          value:
            - type: OpenTelemetry
              openTelemetry: {backendRefs: [{name: otel-col-deploy, namespace: loco-obs, port: 4317}]}
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: EnvoyProxy}
      - equal:
          path: metadata.name
          value: otel-col-deploy
        template: charts/otel-col-deploy/templates/service.yaml
      - equal:
          path: metadata.namespace
          value: loco-obs
        template: charts/otel-col-deploy/templates/service.yaml
      - contains:
          path: spec.ports
          content: {name: otlp, port: 4317}
          any: true
        template: charts/otel-col-deploy/templates/service.yaml

  - it: resolves every telemetry backend from the collector values
    set:
      otel-col-deploy.namespaceOverride: telemetry
      otel-col-deploy.fullnameOverride: collector
      otel-col-deploy.ports.otlp.servicePort: 14317
    asserts:
      - equal:
          path: spec.telemetry.metrics.sinks[0].openTelemetry.backendRefs
          value: [{name: collector, namespace: telemetry, port: 14317}]
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: EnvoyProxy}
      - equal:
          path: spec.telemetry.tracing.provider.backendRefs
          value: [{name: collector, namespace: telemetry, port: 14317}]
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: EnvoyProxy}
      - equal:
          path: spec.telemetry.accessLog.settings[0].sinks[0].openTelemetry.backendRefs
          value: [{name: collector, namespace: telemetry, port: 14317}]
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: EnvoyProxy}

  - it: leaves the Envoy Service settings to Envoy Gateway by default
    asserts:
      - notExists:
          path: spec.provider.kubernetes.envoyService
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: EnvoyProxy}

  - it: passes native NodePort Service settings through to Envoy
    set:
      envoyProxy.service:
        type: NodePort
        externalTrafficPolicy: Cluster
        patch:
          type: StrategicMerge
          value: {spec: {ports: [{port: 80, nodePort: 30080}]}}
    asserts:
      - equal:
          path: spec.provider.kubernetes.envoyService
          value:
            type: NodePort
            externalTrafficPolicy: Cluster
            patch:
              type: StrategicMerge
              value: {spec: {ports: [{port: 80, nodePort: 30080}]}}
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: EnvoyProxy}

  - it: reserves Envoy's measured CPU and bounds its memory without a CPU limit
    asserts:
      - equal:
          path: spec.provider.kubernetes.envoyDeployment.container.resources
          value: {requests: {cpu: 200m, memory: 256Mi}, limits: {memory: 1Gi}}
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: EnvoyProxy}

  - it: gives Envoy Gateway's controller its Go memory limit from its container memory limit
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 1Gi
        template: charts/gateway-helm/templates/envoy-gateway-deployment.yaml
      - notExists:
          path: spec.template.spec.containers[0].resources.limits.cpu
        template: charts/gateway-helm/templates/envoy-gateway-deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: GOMEMLIMIT, valueFrom: {resourceFieldRef: {resource: limits.memory}}}
        template: charts/gateway-helm/templates/envoy-gateway-deployment.yaml

  - it: samples traces at the configured rate
    set:
      envoyProxy.tracing.samplingRate: 37
    asserts:
      - equal:
          path: spec.telemetry.tracing.samplingRate
          value: 37
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: EnvoyProxy}

  - it: logs each request and its upstream as JSON
    asserts:
      - lengthEqual:
          path: spec.telemetry.accessLog.settings
          count: 1
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: EnvoyProxy}
      - equal:
          path: spec.telemetry.accessLog.settings[0].format.type
          value: JSON
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: EnvoyProxy}
      - isSubset:
          path: spec.telemetry.accessLog.settings[0].format.json
          content:
            method: "%REQ(:METHOD)%"
            path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
            response_code: "%RESPONSE_CODE%"
            duration: "%DURATION%"
            upstream_cluster: "%UPSTREAM_CLUSTER%"
            trace_id: "%TRACE_ID%"
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: EnvoyProxy}

  - it: logs the access log attributes the values add
    set:
      envoyProxy.accessLog.attributes.route: "%ROUTE_NAME%"
    asserts:
      - isSubset:
          path: spec.telemetry.accessLog.settings[0].format.json
          content: {route: "%ROUTE_NAME%"}
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: EnvoyProxy}

  - it: admits platform routes only from the release and collector namespaces
    asserts:
      - equal:
          path: spec.listeners[?(@.name =~ /-platform$/)].allowedRoutes.namespaces.selector.matchExpressions
          value: [{key: kubernetes.io/metadata.name, operator: In, values: [loco-system, loco-obs]}]
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: Gateway}

  - it: requires TLS 1.3 on the whole Gateway when configured
    set:
      envoyProxy.tls.minVersion: "1.3"
    template: templates/gateway.yaml
    documentSelector: {path: kind, value: ClientTrafficPolicy}
    asserts:
      - equal:
          path: spec.tls.minVersion
          value: "1.3"
      - equal:
          path: spec.targetRefs
          value: [{group: gateway.networking.k8s.io, kind: Gateway, name: eg}]

  - it: preserves HTTP3 and Envoy's default TLS minimum
    template: templates/gateway.yaml
    documentSelector: {path: kind, value: ClientTrafficPolicy}
    asserts:
      - exists:
          path: spec.http3
      - notExists:
          path: spec.tls
