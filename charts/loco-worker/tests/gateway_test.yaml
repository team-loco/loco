suite: gateway
release:
  name: loco-worker
  namespace: loco-system
values:
  - ../ci/default-values.yaml
templates:
  - templates/gateway.yaml
  - templates/application-fallback.yaml
  - templates/network-policies.yaml
  - charts/workloadCollector/templates/service.yaml
  - charts/gateway-helm/templates/envoy-gateway-config.yaml
  - charts/gateway-helm/templates/infra-manager-rbac.yaml
  - charts/gateway-helm/templates/envoy-gateway-deployment.yaml
tests:
  - it: routes unmatched application hosts to the control plane over TLS
    set:
      env.CONTROL_PLANE_URL: https://api.example.test
    asserts:
      - equal:
          path: spec.validation.wellKnownCACertificates
          value: System
        template: templates/application-fallback.yaml
        documentSelector: {path: kind, value: BackendTLSPolicy}
      - equal:
          path: spec.endpoints[0].fqdn
          value: {hostname: api.example.test, port: 443}
        template: templates/application-fallback.yaml
        documentSelector: {path: kind, value: Backend}
      - equal:
          path: spec.rules[0].filters[1].urlRewrite.path.replaceFullPath
          value: /application-not-found
        template: templates/application-fallback.yaml
        documentSelector: {path: kind, value: HTTPRoute}
      - equal:
          path: spec.hostnames
          value: ["*.onloco.app", "*.onloco.build"]
        template: templates/application-fallback.yaml
        documentSelector: {path: kind, value: HTTPRoute}
      - equal:
          path: spec.rules[0].filters[0].requestHeaderModifier.remove
          value: [X-Forwarded-Host, Authorization, Cookie]
        template: templates/application-fallback.yaml
        documentSelector: {path: kind, value: HTTPRoute}
      - equal:
          path: spec.listeners[0].allowedRoutes.namespaces.selector.matchExpressions[0].values
          value: ["true", fallback]
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: Gateway}
      - matchRegex:
          path: data["envoy-gateway.yaml"]
          pattern: 'enableBackend: true'
        template: charts/gateway-helm/templates/envoy-gateway-config.yaml

  - it: uses the API prefix when the control plane shares the dashboard hostname
    set:
      env.CONTROL_PLANE_URL: https://loco.example.test:8443/api/
    asserts:
      - equal:
          path: spec.rules[0].filters[1].urlRewrite.path.replaceFullPath
          value: /api/application-not-found
        template: templates/application-fallback.yaml
        documentSelector: {path: kind, value: HTTPRoute}
      - equal:
          path: spec.endpoints[0].fqdn
          value: {hostname: loco.example.test, port: 8443}
        template: templates/application-fallback.yaml
        documentSelector: {path: kind, value: Backend}

  - it: does not send fallback requests to an HTTP control plane
    set:
      env.CONTROL_PLANE_URL: http://api.example.test
    asserts:
      - hasDocuments:
          count: 0
        template: templates/application-fallback.yaml

  - it: deploys proxies beside their Gateways with cross-namespace infrastructure permissions
    asserts:
      - matchRegex:
          path: data["envoy-gateway.yaml"]
          pattern: 'type: GatewayNamespace'
        template: charts/gateway-helm/templates/envoy-gateway-config.yaml
      - matchRegex:
          path: data["envoy-gateway.yaml"]
          pattern: 'controllerName: gateway.envoyproxy.io/gatewayclass-controller'
        template: charts/gateway-helm/templates/envoy-gateway-config.yaml
      - equal:
          path: spec.controllerName
          value: gateway.envoyproxy.io/gatewayclass-controller
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: GatewayClass}
      - contains:
          path: rules
          content: {apiGroups: [authentication.k8s.io], resources: [tokenreviews], verbs: [create]}
        template: charts/gateway-helm/templates/infra-manager-rbac.yaml
        documentSelector: {path: kind, value: ClusterRole}

  - it: sends every Envoy signal to the workload collector's OTLP gRPC Service, metrics as deltas
    asserts:
      - equal:
          path: spec.telemetry.metrics
          value:
            prometheus: {disable: true}
            sinks:
              - type: OpenTelemetry
                openTelemetry:
                  backendRefs: [{name: workload-collector, namespace: loco-obs, port: 4317}]
                  reportCountersAsDeltas: true
                  reportHistogramsAsDeltas: true
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: EnvoyProxy}
      - equal:
          path: spec.telemetry.tracing.provider
          value: {type: OpenTelemetry, backendRefs: [{name: workload-collector, namespace: loco-obs, port: 4317}]}
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: EnvoyProxy}
      - equal:
          path: spec.telemetry.accessLog.settings[0].sinks
          value:
            - type: OpenTelemetry
              openTelemetry: {backendRefs: [{name: workload-collector, namespace: loco-obs, port: 4317}]}
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: EnvoyProxy}
      - equal:
          path: metadata.name
          value: workload-collector
        template: charts/workloadCollector/templates/service.yaml
      - equal:
          path: metadata.namespace
          value: loco-obs
        template: charts/workloadCollector/templates/service.yaml
      - contains:
          path: spec.ports
          content: {name: otlp, port: 4317}
          any: true
        template: charts/workloadCollector/templates/service.yaml

  - it: resolves every telemetry backend from the collector values
    set:
      workloadCollector.namespaceOverride: telemetry
      workloadCollector.fullnameOverride: collector
      workloadCollector.ports.otlp.servicePort: 14317
    asserts:
      - equal:
          path: spec.telemetry.metrics.sinks[0].openTelemetry.backendRefs
          value: [{name: collector, namespace: telemetry, port: 14317}]
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: EnvoyProxy}
      - equal:
          path: spec.telemetry.tracing.provider.backendRefs
          value: [{name: collector, namespace: telemetry, port: 14317}]
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: EnvoyProxy}
      - equal:
          path: spec.telemetry.accessLog.settings[0].sinks[0].openTelemetry.backendRefs
          value: [{name: collector, namespace: telemetry, port: 14317}]
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: EnvoyProxy}

  - it: leaves the Envoy Service settings to Envoy Gateway by default
    asserts:
      - notExists:
          path: spec.provider.kubernetes.envoyService
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: EnvoyProxy}

  - it: passes native NodePort Service settings through to Envoy
    set:
      envoyProxy.service:
        type: NodePort
        externalTrafficPolicy: Cluster
        patch:
          type: StrategicMerge
          value: {spec: {ports: [{port: 80, nodePort: 30080}]}}
    asserts:
      - equal:
          path: spec.provider.kubernetes.envoyService
          value:
            type: NodePort
            externalTrafficPolicy: Cluster
            patch:
              type: StrategicMerge
              value: {spec: {ports: [{port: 80, nodePort: 30080}]}}
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: EnvoyProxy}

  - it: reserves Envoy's measured CPU and bounds its memory without a CPU limit
    asserts:
      - equal:
          path: spec.provider.kubernetes.envoyDeployment.container.resources
          value: {requests: {cpu: 200m, memory: 256Mi}, limits: {memory: 1Gi}}
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: EnvoyProxy}

  - it: gives Envoy Gateway's controller a 150m CPU request and its Go memory limit from its container memory limit
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 150m
        template: charts/gateway-helm/templates/envoy-gateway-deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: GOMEMLIMIT, valueFrom: {resourceFieldRef: {resource: limits.memory}}}
        template: charts/gateway-helm/templates/envoy-gateway-deployment.yaml

  - it: samples traces at the configured rate
    set:
      envoyProxy.tracing.samplingRate: 37
    asserts:
      - equal:
          path: spec.telemetry.tracing.samplingRate
          value: 37
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: EnvoyProxy}

  - it: logs each request and its upstream as JSON
    asserts:
      - lengthEqual:
          path: spec.telemetry.accessLog.settings
          count: 1
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: EnvoyProxy}
      - equal:
          path: spec.telemetry.accessLog.settings[0].format.type
          value: JSON
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: EnvoyProxy}
      - isSubset:
          path: spec.telemetry.accessLog.settings[0].format.json
          content:
            method: "%REQ(:METHOD)%"
            path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
            response_code: "%RESPONSE_CODE%"
            duration: "%DURATION%"
            upstream_cluster: "%UPSTREAM_CLUSTER%"
            trace_id: "%TRACE_ID%"
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: EnvoyProxy}

  - it: logs the access log attributes the values add
    set:
      envoyProxy.accessLog.attributes.route: "%ROUTE_NAME%"
    asserts:
      - isSubset:
          path: spec.telemetry.accessLog.settings[0].format.json
          content: {route: "%ROUTE_NAME%"}
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: EnvoyProxy}

  - it: listens only on the app domains' wildcards
    set:
      global.domain.apps: [apps.example.test, other.example.test]
    asserts:
      - lengthEqual:
          path: spec.listeners
          count: 4
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: Gateway}
      - equal:
          path: spec.listeners[?(@.name =~ /-apps-0$/)].hostname
          value: "*.apps.example.test"
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: Gateway}
      - equal:
          path: spec.listeners[?(@.name =~ /-apps-1$/)].hostname
          value: "*.other.example.test"
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: Gateway}

  - it: requires TLS 1.3 on the whole Gateway when configured, without HTTP/3
    set:
      envoyProxy.tls.minVersion: "1.3"
    template: templates/gateway.yaml
    documentSelector: {path: kind, value: ClientTrafficPolicy}
    asserts:
      - notExists:
          path: spec.http3
      - notExists:
          path: spec.headers
      - equal:
          path: spec.tls.minVersion
          value: "1.3"
      - equal:
          path: spec.targetRefs
          value: [{group: gateway.networking.k8s.io, kind: Gateway, name: eg}]

  - it: serves no HTTP/3 or UDP by default
    asserts:
      - containsDocument: {kind: ClientTrafficPolicy, apiVersion: gateway.envoyproxy.io/v1alpha1}
        not: true
        template: templates/gateway.yaml
      - notContains:
          path: spec.ingress[0].ports
          content: {protocol: UDP, port: 10443}
        template: templates/network-policies.yaml
        documentSelector: {path: metadata.name, value: allow-gateway-proxy-ingress}

  - it: serves HTTP/3 over UDP when enabled, keeping Envoy's default TLS minimum
    set:
      envoyProxy.http3: true
    asserts:
      - exists:
          path: spec.http3
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: ClientTrafficPolicy}
      - notExists:
          path: spec.tls
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: ClientTrafficPolicy}
      - notExists:
          path: spec.headers
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: ClientTrafficPolicy}
      - contains:
          path: spec.ingress[0].ports
          content: {protocol: UDP, port: 10443}
        template: templates/network-policies.yaml
        documentSelector: {path: metadata.name, value: allow-gateway-proxy-ingress}

  - it: enables Envoy headers on a policy of its own when nothing else needs one
    set:
      envoyProxy.envoyHeaders: true
    template: templates/gateway.yaml
    documentSelector: {path: kind, value: ClientTrafficPolicy}
    asserts:
      - equal:
          path: spec.headers.enableEnvoyHeaders
          value: true
      - notExists:
          path: spec.http3
      - notExists:
          path: spec.tls

  - it: renders one policy when Envoy headers join HTTP/3 and a TLS minimum
    set:
      envoyProxy.envoyHeaders: true
      envoyProxy.http3: true
      envoyProxy.tls.minVersion: "1.3"
    asserts:
      - containsDocument: {kind: ClientTrafficPolicy, apiVersion: gateway.envoyproxy.io/v1alpha1, name: eg, namespace: loco-system, any: true}
        template: templates/gateway.yaml
      - exists:
          path: spec.http3
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: ClientTrafficPolicy}
      - equal:
          path: spec.tls.minVersion
          value: "1.3"
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: ClientTrafficPolicy}
      - equal:
          path: spec.headers.enableEnvoyHeaders
          value: true
        template: templates/gateway.yaml
        documentSelector: {path: kind, value: ClientTrafficPolicy}
