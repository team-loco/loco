# Global configuration
global:
  # @schema additionalProperties: false
  domain:
    # app domains: customer services get one-label names under them, such as storefront.onloco.app.
    # @schema minItems: 1; uniqueItems: true
    apps:
      - onloco.app
      - onloco.build

  # @schema additionalProperties: false
  cloudProvider:
    annotations: {}

  # The Go runtime sets GOMAXPROCS from the CPU limit, at least 2; Go containers have a CPU limit of
  # at least 2.
  # @schema additionalProperties: false
  resources:
    # @schema skipProperties
    agent:
      requests:
        cpu: 200m
        memory: 128Mi
      limits:
        cpu: "2"
        memory: 512Mi

  workspaceNamespacePrefix: loco-ws-

  # Replica counts
  # @schema additionalProperties: false
  replicas:
    # One agent per cluster: every replica shares the cluster's identity.
    # @schema minimum: 0; maximum: 1
    agent: 1

  # code of the cluster's region, such as us-ca-1; the agent reports it and the API refuses a
  # region the cluster is not registered in. It is attached to platform records as loco.region.
  region: ""
  # @schema additionalProperties: false
  exporter:
    endpoint: ""
    headers: {}
    # @schema additionalProperties: false
    ingestToken:
      enabled: false
      secretName: loco-otlp-exporter
      secretKey: token
      directory: &exporterTokenDirectory /etc/otelcol-exporter
      waitIntervalSeconds: 2
    # @schema additionalProperties: false
    queue:
      directory: &exporterQueueDirectory /var/lib/otelcol-exporter
      num_consumers: 2
      queue_size: 5000
      block_on_overflow: true
      # @schema additionalProperties: false
      batch:
        sizer: items
        min_size: 100
        flush_timeout: 1s
    retry:
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s
  # export node metrics, Kubernetes state and platform events through a separate pipeline.
  # these settings apply to the node DaemonSet and the single cluster collector.
  # @schema additionalProperties: false; allOf: [{if: {properties: {enabled: {const: true}}}, then: {properties: {installation: {minLength: 1}}}}, {if: {properties: {enabled: {const: true}}}, then: {properties: {cluster: {minLength: 1}}}}, {if: {properties: {enabled: {const: true}}}, then: {properties: {environment: {minLength: 1}}}}]
  platformTelemetry:
    # opt in; adds platform pipelines next to the application telemetry pipelines, and the
    # controllers export their traces and metrics to the cluster collector's platform pipelines.
    enabled: false
    # keep only platform pipelines in the node and cluster collectors.
    # requires enabled: true and otel-col-deploy.enabled: false.
    platformOnly: false
    # required when enabled: stable ID for the Loco installation, shared by its clusters.
    # exported as loco.installation.id; supplied by the operator, not discovered.
    installation: ""
    # required when enabled: stable name of this Kubernetes cluster (k8s.cluster.name).
    cluster: ""
    # required when enabled: this cluster's environment (deployment.environment.name),
    # such as development, staging or production.
    environment: ""
    # duration between node scrapes and cluster metric emissions; 60s limits collection load.
    # also sets the interval of the cluster receiver the application pipeline shares.
    # Kubernetes events arrive through a watch and do not wait for this interval.
    collectionInterval: 60s
    # node condition metrics: Ready=true is healthy; a pressure condition=true is unhealthy.
    # these defaults cover readiness and memory, disk and process ID exhaustion.
    nodeConditions: [Ready, MemoryPressure, DiskPressure, PIDPressure]
    # node capacity available to pods after Kubernetes reservations: CPU cores,
    # memory bytes, temporary storage bytes and pod slots. these are capacity, not usage.
    allocatableTypes: [cpu, memory, ephemeral-storage, pods]
    # namespaces outside this chart allowed in the platform pipeline's namespaced workload metrics
    # and events, next to the release and collector namespaces. node and cluster metrics without
    # a namespace are always included.
    namespaces: [kube-system, cert-manager]
    # without an endpoint, platform pipelines use global.exporter, and the observability proxy
    # stores them under the system tenant. with one, they go only to that OTLP/HTTP endpoint.
    # @schema additionalProperties: false
    exporter:
      endpoint: ""
      # @schema additionalProperties: {type: string}
      headers: {}

# Cert-manager configuration
# @schema additionalProperties: false; allOf: [{if: {properties: {existingTLSSecret: {const: ''}, issuer: {properties: {create: {const: true}, type: {const: acme}}}}}, then: {properties: {issuer: {properties: {email: {minLength: 1}}}}}}]
certManager:
  existingTLSSecret: ""
  additionalDNSNames: []
  # @schema additionalProperties: false
  issuer:
    create: true
    type: acme
    kind: ClusterIssuer
    name: letsencrypt-prod
    email: ""  # required for an acme issuer
    server: https://acme-v02.api.letsencrypt.org/directory
    # cert-manager ACME solvers, required when the chart creates the ACME issuer.
    # @schema item: object
    solvers: []

# @schema additionalProperties: false
cluster:
  # Which workloads this cluster runs; the agent reports it to the control plane.
  # @schema enum: [apps, builds, all]
  role: all

# @schema additionalProperties: false
agent:
  # @schema additionalProperties: false
  joinToken:
    value: ""
    existingSecret: ""
    secretKey: join-token
  assertionLifetime: 1m
  # @schema additionalProperties: false
  image:
    repository: ghcr.io/team-loco/loco-agent
    # @schema required; minLength: 1
    tag: ""
  imagePullPolicy: Always
  inventoryInterval: 10m
  buildRetention: 1h
  buildCollectInterval: 5m
  clusterQueryTimeout: 10s
  reconcileWorkers: 8
  reconcileRetryBaseDelay: 1s
  reconcileRetryMaxDelay: 30s
  syncOutboundBuffer: 256
  buildQueueSize: 64
  buildCreateRetryDelay: 1s
  buildCreateRetryAttempts: 5
  reconnectBaseDelay: 1s
  reconnectMaxDelay: 30s
  healthyStreamDuration: 1m
  registryCredentialCheckInterval: 5m

env:
  LOG_LEVEL: debug

# @schema additionalProperties: false
envoyProxy:
  # HTTP/3 over UDP 443 on the app listeners. Envoy Gateway then adds UDP 443 next to TCP 443 on
  # the Envoy Service, which a load balancer that keys its config by port alone rejects.
  http3: false
  # Envoy adds x-envoy-* headers to responses, among them x-envoy-upstream-service-time, the
  # milliseconds the upstream took. It shows every client per-request upstream timing, which
  # sharpens timing attacks. Keep it off in production.
  envoyHeaders: false
  # @schema additionalProperties: false
  tls:
    # -- Minimum client TLS version; empty keeps Envoy Gateway defaults.
    # @schema type: string; enum: ["", "1.2", "1.3"]
    minVersion: ""
  service: {}
  # Envoy replicas when autoscaling is off.
  # @schema minimum: 0
  replicas: 2
  # A CPU-utilization autoscaler for the Envoy Deployment; replaces replicas when enabled.
  # @schema additionalProperties: false
  autoscaling:
    enabled: true
    # @schema minimum: 1
    minReplicas: 2
    # @schema minimum: 1
    maxReplicas: 6
    # Percent of the CPU request.
    # @schema minimum: 1
    targetCPUUtilizationPercentage: 70
  # Envoy's container in the gateway's Envoy Deployment.
  # @schema skipProperties
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      memory: 1Gi
  statsFlushInterval: 60s
  # @schema additionalProperties: false
  tracing:
    samplingRate: 10
  # @schema additionalProperties: false
  accessLog:
    attributes:
      method: "%REQ(:METHOD)%"
      path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
      authority: "%REQ(:AUTHORITY)%"
      protocol: "%PROTOCOL%"
      response_code: "%RESPONSE_CODE%"
      response_flags: "%RESPONSE_FLAGS%"
      duration: "%DURATION%"
      bytes_received: "%BYTES_RECEIVED%"
      bytes_sent: "%BYTES_SENT%"
      upstream_cluster: "%UPSTREAM_CLUSTER%"
      upstream_host: "%UPSTREAM_HOST%"
      request_id: "%REQ(X-REQUEST-ID)%"
      trace_id: "%TRACE_ID%"

# @schema skipProperties
metrics-server:
  enabled: true
  fullnameOverride: loco-metrics-server
  image:
    repository: registry.k8s.io/metrics-server/metrics-server
    tag: v0.9.0@sha256:d9862115e7c7881280d3d75ca26bda8ffc0fc213315979575bf23ce9826205c0
  replicas: 2
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: metrics-server
  resources:
    limits:
      memory: 512Mi

# @schema skipProperties
gateway-helm:
  enabled: true
  crds:
    enabled: false
  podDisruptionBudget:
    maxUnavailable: 1
  deployment:
    replicas: 2
    pod:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              control-plane: envoy-gateway
    envoyGateway:
      resources:
        requests:
          cpu: 150m
      extraEnv:
        - name: GOMEMLIMIT
          valueFrom:
            resourceFieldRef:
              resource: limits.memory
  config:
    envoyGateway:
      extensionApis:
        enableBackend: true
      provider:
        type: Kubernetes
        kubernetes:
          deploy:
            type: GatewayNamespace
      logging:
        level:
          default: info

# @schema additionalProperties: false
controller:
  name: loco-controller
  # One replica holds the leader lease; the others wait to take over.
  # @schema minimum: 0
  replicas: 2

  # @schema additionalProperties: false
  image:
    repository: ghcr.io/team-loco/loco-controller
    # @schema required; minLength: 1
    tag: ""
    pullPolicy: Always

  # @schema item: string
  args: []

  # Seconds a new application replica must stay ready before a rollout replaces an old one.
  # @schema type: integer; minimum: 0
  minReadySeconds: 10

  # Seconds a terminating application keeps listening while routing removes its endpoint.
  # @schema type: integer; minimum: 1; maximum: 2147483647
  drainSeconds: 5

  # Seconds every replica of a rollout must go without a restart before the rollout counts as healthy.
  # @schema type: integer; minimum: 0; maximum: 2147483647
  healthyAfterSeconds: 300

  env: []

  # @schema skipProperties
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  # @schema skipProperties
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true

  # @schema skipProperties
  resources:
    requests:
      cpu: 150m
      memory: 128Mi
    limits:
      cpu: "2"
      memory: 256Mi

# @schema additionalProperties: false
registry:
  # @schema enum: [static, token]
  auth: static
  pullSecretName: ""

# @schema additionalProperties: false
builds:
  createNamespace: true

  # @schema additionalProperties: false
  controller:
    # One replica holds the leader lease; the others wait to take over.
    # @schema minimum: 0
    replicas: 2
    # @schema item: string
    args: []
    env: []
    # @schema skipProperties
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    # @schema skipProperties
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
    # @schema skipProperties
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: "2"
        memory: 128Mi

  namespace: loco-builds
  # @schema additionalProperties: false
  podSecurity:
    level: privileged
    version: latest

  pushSecretName: ""
  # @schema additionalProperties: false
  builderImage:
    repository: ghcr.io/team-loco/loco-builder
    tag: ""
    pullPolicy: Always
  # @schema additionalProperties: false
  buildkitImage:
    repository: moby/buildkit
    tag: v0.34.2-rootless@sha256:c8252268760e1baba80780d63d738ef9f260fb7c7c0973c78494cb9ddd99eda1
    pullPolicy: IfNotPresent
  timeout: 30m
  ttlAfterFinished: 10m
  downloadTimeout: 10m
  # @schema type: [string, integer]
  maxSourceSize: 200Mi
  # @schema type: [string, integer]
  maxContextSize: 1Gi
  maxContextFiles: 200000
  # @schema type: [string, integer]
  maxImageSize: 1Gi
  insecureRegistry: false
  buildkitdConfig: ""
  # @schema item: object
  privateEgress: []
  seccompLocalhostProfile: ""
  runtimeClassName: ""
  nodeSelector: {}
  # @schema item: object
  tolerations: []
  # @schema additionalProperties: false
  resources:
    # @schema skipProperties
    fetch:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: "2"
        memory: 256Mi
    # @schema skipProperties
    build:
      requests:
        cpu: "1"
        memory: 1Gi
      limits:
        cpu: "4"
        memory: 4Gi
    # @schema skipProperties
    push:
      requests:
        cpu: 200m
        memory: 64Mi
      limits:
        cpu: "2"
        memory: 512Mi
  # @schema additionalProperties: false
  storage:
    # @schema type: [string, integer]
    workspace: 2Gi
    # @schema type: [string, integer]
    cache: 5Gi
    # @schema type: [string, integer]
    out: 10Gi
    # @schema type: [string, integer]
    buildkit: 10Gi

# @schema skipProperties
otel-col-daemon: {}

# @schema skipProperties
otel-col-deploy: {}

# @schema skipProperties
otel-col-cluster: {}

# @schema skipProperties
loco-collector-config: {}
