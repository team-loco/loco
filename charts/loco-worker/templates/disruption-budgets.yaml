{{- $controllers := list }}
{{- if include "loco-worker.runsApps" . }}
{{- $controllers = append $controllers "loco-controller" }}
{{- end }}
{{- if include "loco-worker.runsBuilds" . }}
{{- $controllers = append $controllers "loco-build-controller" }}
{{- end }}
{{- range $name := $controllers }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
{{- end }}
