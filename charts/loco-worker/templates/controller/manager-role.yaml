{{- if include "loco-worker.runsApps" . }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: loco-controller
rules:
    - apiGroups:
        - ""
      resources:
        - namespaces
      verbs:
        - create
        - get
        - list
        - patch
        - update
        - watch
    - apiGroups:
        - ""
      resources:
        - nodes
      verbs:
        - get
        - list
        - watch
    - apiGroups:
        - ""
      resources:
        - pods
      verbs:
        - get
        - list
        - patch
        - watch
    - apiGroups:
        - ""
      resources:
        - secrets
        - services
      verbs:
        - create
        - delete
        - get
        - list
        - patch
        - update
        - watch
    - apiGroups:
        - ""
      resources:
        - serviceaccounts
      verbs:
        - create
        - delete
        - get
        - list
        - patch
        - watch
    - apiGroups:
        - apps
      resources:
        - deployments
      verbs:
        - create
        - delete
        - get
        - list
        - patch
        - update
        - watch
    - apiGroups:
        - apps
      resources:
        - replicasets
      verbs:
        - list
        - patch
    - apiGroups:
        - autoscaling
      resources:
        - horizontalpodautoscalers
      verbs:
        - create
        - delete
        - get
        - list
        - patch
        - update
        - watch
    - apiGroups:
        - events.k8s.io
      resources:
        - events
      verbs:
        - get
        - list
        - watch
    - apiGroups:
        - gateway.networking.k8s.io
      resources:
        - httproutes
      verbs:
        - create
        - delete
        - get
        - list
        - patch
        - update
        - watch
    - apiGroups:
        - infra.loco.io
      resources:
        - applications
      verbs:
        - create
        - delete
        - get
        - list
        - patch
        - update
        - watch
    - apiGroups:
        - infra.loco.io
      resources:
        - applications/finalizers
      verbs:
        - update
    - apiGroups:
        - infra.loco.io
      resources:
        - applications/status
      verbs:
        - get
        - patch
        - update
    - apiGroups:
        - networking.k8s.io
      resources:
        - networkpolicies
      verbs:
        - create
        - delete
        - get
        - list
        - patch
        - update
        - watch
    - apiGroups:
        - networking.k8s.io
      resources:
        - servicecidrs
      verbs:
        - get
        - list
        - watch
{{- end }}
