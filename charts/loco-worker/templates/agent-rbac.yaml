apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "loco-worker.agentServiceAccount" . }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-agent
  namespace: {{ .Release.Namespace }}
rules:
  # Permissions for managing Application CRDs in the namespace
  - apiGroups: ["infra.loco.io"]
    resources: ["applications"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  # Permissions for reading status of Applications
  - apiGroups: ["infra.loco.io"]
    resources: ["applications/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "list", "update", "delete"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: [{{ .Values.controller.name | quote }}]
    verbs: ["get"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways"]
    resourceNames: [{{ include "loco-worker.gateway" . | quote }}]
    verbs: ["get"]
  {{- with include "loco-worker.certificate" . }}
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    resourceNames: [{{ . | quote }}]
    verbs: ["get"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-agent
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-agent
subjects:
  - kind: ServiceAccount
    name: {{ include "loco-worker.agentServiceAccount" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-agent
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: ["kube-system"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-agent
subjects:
  - kind: ServiceAccount
    name: {{ include "loco-worker.agentServiceAccount" . }}
    namespace: {{ .Release.Namespace }}
