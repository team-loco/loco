apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ include "loco-worker.gatewayClass" . }}
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "loco-worker.gateway" . }}
  namespace: {{ .Release.Namespace }}
spec:
  infrastructure:
    {{- if .Values.global.cloudProvider.annotations }}
    annotations:
      {{- toYaml .Values.global.cloudProvider.annotations | nindent 6 }}
    {{- end }}
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: envoy-proxy
  gatewayClassName: {{ include "loco-worker.gatewayClass" . }}
  listeners:
    {{- range $index, $domain := .Values.global.domain.apps }}
    - name: https-apps-{{ $index }}
      hostname: {{ printf "*.%s" $domain | quote }}
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              loco.io/app: "true"
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ include "loco-worker.tlsSecret" (list $ $domain) }}
            kind: Secret
            group: ""
    - name: http-apps-{{ $index }}
      hostname: {{ printf "*.%s" $domain | quote }}
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              loco.io/app: "true"
    {{- end }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-proxy
  namespace: {{ .Release.Namespace }}
spec:
  {{- $collectorService := include "loco-worker.collectorService" . }}
  {{- $collectorNamespace := include "loco-worker.observabilityNamespace" . }}
  {{- $collectorPort := index .Values "otel-col-deploy" "ports" "otlp" "servicePort" }}
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        {{- if not .Values.envoyProxy.autoscaling.enabled }}
        replicas: {{ .Values.envoyProxy.replicas }}
        {{- end }}
        pod:
          topologySpreadConstraints:
            {{- include "loco-worker.spreadByNode" (dict "gateway.envoyproxy.io/owning-gateway-name" (include "loco-worker.gateway" .) "gateway.envoyproxy.io/owning-gateway-namespace" .Release.Namespace) | nindent 12 }}
        container:
          resources:
            {{- toYaml .Values.envoyProxy.resources | nindent 12 }}
      {{- with .Values.envoyProxy.autoscaling }}
      {{- if .enabled }}
      envoyHpa:
        minReplicas: {{ .minReplicas }}
        maxReplicas: {{ .maxReplicas }}
        metrics:
          - type: Resource
            resource:
              name: cpu
              target:
                type: Utilization
                averageUtilization: {{ .targetCPUUtilizationPercentage }}
      {{- end }}
      {{- end }}
      envoyPDB:
        maxUnavailable: 1
      {{- with .Values.envoyProxy.service }}
      envoyService:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  bootstrap:
    type: Merge
    value: |
      stats_flush_interval: {{ .Values.envoyProxy.statsFlushInterval }}
  telemetry:
    metrics:
      prometheus:
        disable: true
      sinks:
        - type: OpenTelemetry
          openTelemetry:
            backendRefs:
              - name: {{ $collectorService }}
                namespace: {{ $collectorNamespace }}
                port: {{ $collectorPort }}
            reportCountersAsDeltas: true
            reportHistogramsAsDeltas: true
    tracing:
      samplingRate: {{ .Values.envoyProxy.tracing.samplingRate }}
      provider:
        type: OpenTelemetry
        backendRefs:
          - name: {{ $collectorService }}
            namespace: {{ $collectorNamespace }}
            port: {{ $collectorPort }}
    accessLog:
      settings:
        - format:
            type: JSON
            json:
              {{- toYaml .Values.envoyProxy.accessLog.attributes | nindent 14 }}
          sinks:
            - type: OpenTelemetry
              openTelemetry:
                backendRefs:
                  - name: {{ $collectorService }}
                    namespace: {{ $collectorNamespace }}
                    port: {{ $collectorPort }}
{{- $clientSettings := or .Values.envoyProxy.http3 .Values.envoyProxy.tls.minVersion }}
{{- if or $clientSettings .Values.envoyProxy.envoyHeaders }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: {{ include "loco-worker.gateway" . }}
  namespace: {{ .Release.Namespace }}
spec:
  {{- if .Values.envoyProxy.http3 }}
  http3: {}
  {{- end }}
  {{- with .Values.envoyProxy.tls.minVersion }}
  tls:
    minVersion: {{ . | quote }}
  {{- end }}
  {{- if .Values.envoyProxy.envoyHeaders }}
  headers:
    enableEnvoyHeaders: true
  {{- end }}
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ include "loco-worker.gateway" . }}
{{- end }}
