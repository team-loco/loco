{{- $token := .Values.global.exporter.ingestToken }}
{{- if $token.enabled }}
{{- range $namespace := include "loco-worker.ingestTokenNamespaces" $ | splitList "," }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $.Release.Name }}-agent-ingest-token
  namespace: {{ $namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $token.secretName | quote }}]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.Release.Name }}-agent-ingest-token
  namespace: {{ $namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $.Release.Name }}-agent-ingest-token
subjects:
  - kind: ServiceAccount
    name: {{ include "loco-worker.agentServiceAccount" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
