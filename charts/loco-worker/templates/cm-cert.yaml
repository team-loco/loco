{{- if not .Values.certManager.existingTLSSecret }}
{{- $domains := .Values.global.domain.apps }}
{{- $owners := dict }}
{{- range $name := .Values.certManager.additionalDNSNames }}
{{- $owner := "" }}
{{- range $domains }}
{{- if and (hasSuffix (printf ".%s" .) $name) (gt (len .) (len $owner)) }}
{{- $owner = . }}
{{- end }}
{{- end }}
{{- $_ := set $owners $name (required (printf "certManager.additionalDNSNames entry %s is under no apps domain" $name) $owner) }}
{{- end }}
{{- range $domain := $domains }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
    name: {{ include "loco-worker.certificate" (list $ $domain) }}
    namespace: {{ $.Release.Namespace }}
spec:
    secretName: {{ include "loco-worker.tlsSecret" (list $ $domain) }}
    issuerRef:
        name: {{ $.Values.certManager.issuer.name }}
        kind: {{ $.Values.certManager.issuer.kind }}
    commonName: {{ printf "*.%s" $domain | quote }}
    dnsNames:
        - {{ printf "*.%s" $domain | quote }}
        {{- range $name, $owner := $owners }}
        {{- if eq $owner $domain }}
        - {{ $name | quote }}
        {{- end }}
        {{- end }}
{{- end }}
{{- end }}
