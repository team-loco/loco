apiVersion: v2
name: loco-worker
description: "Loco worker cluster: agent, controllers, Envoy Gateway and OpenTelemetry collectors"
type: application
version: 0.4.17
dependencies:
    - name: metrics-server
      version: 3.14.0
      repository: https://kubernetes-sigs.github.io/metrics-server/
      condition: metrics-server.enabled
    - name: gateway-helm
      version: 1.10.0
      repository: oci://docker.io/envoyproxy
      condition: gateway-helm.enabled
    - name: opentelemetry-collector
      repository: https://open-telemetry.github.io/opentelemetry-helm-charts
      version: 0.178.2
      alias: nodeCollector
      condition: nodeCollector.enabled
    - name: opentelemetry-collector
      repository: https://open-telemetry.github.io/opentelemetry-helm-charts
      version: 0.178.2
      alias: workloadCollector
      condition: workloadCollector.enabled
    - name: opentelemetry-collector
      repository: https://open-telemetry.github.io/opentelemetry-helm-charts
      version: 0.178.2
      alias: clusterCollector
      condition: clusterCollector.enabled
maintainers:
    - name: nikumar1206
sources:
    - https://github.com/team-loco/loco
keywords:
    - loco
    - kubernetes
    - worker
