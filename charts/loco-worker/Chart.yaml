apiVersion: v2
name: loco-worker
description: "Loco worker cluster: agent, controllers, Envoy Gateway and OpenTelemetry collectors"
type: application
version: 0.2.2
dependencies:
    - name: gateway-helm
      version: 1.9.2
      repository: oci://docker.io/envoyproxy
      condition: gateway-helm.enabled
    - name: opentelemetry-collector
      repository: https://open-telemetry.github.io/opentelemetry-helm-charts
      version: 0.175.1
      alias: otel-col-daemon
      condition: otel-col-daemon.enabled
    - name: opentelemetry-collector
      repository: https://open-telemetry.github.io/opentelemetry-helm-charts
      version: 0.175.1
      alias: otel-col-deploy
      condition: otel-col-deploy.enabled
    - name: opentelemetry-collector
      repository: https://open-telemetry.github.io/opentelemetry-helm-charts
      version: 0.175.1
      alias: otel-col-cluster
      condition: otel-col-cluster.enabled
maintainers:
    - name: Nikhil
sources:
    - https://github.com/team-loco/loco
keywords:
    - loco
    - kubernetes
    - worker
