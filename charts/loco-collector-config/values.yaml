exports:
  collectors:
    # @schema skipProperties
    otel-col-daemon:
      global:
        exporter:
          endpoint: ""
          headers: {}
          queue:
            directory: /var/lib/otelcol-exporter
            num_consumers: 2
            queue_size: 5000
            block_on_overflow: true
            batch: {sizer: items, min_size: 100, flush_timeout: 1s}
          retry: {initial_interval: 1s, max_interval: 30s, max_elapsed_time: 0s}
          ingestToken:
            enabled: false
            secretName: loco-otlp-exporter
            secretKey: token
            directory: /etc/otelcol-exporter
            waitIntervalSeconds: 2
      enabled: true
      fullnameOverride: "otel-col-daemon"
      configMap:
        create: false
        existingName: '{{ include "loco-collector.fullname" . }}-agent'
      podAnnotations:
        checksum/platform-telemetry: '{{ toJson .Values | sha256sum }}'
      namespaceOverride: loco-obs-node
      mode: daemonset
      command:
        # Keep file-log checkpoints behind acceptance into the persistent exporter queue.
        extraArgs:
          - --feature-gates=stanza.synchronousLogEmitter
      podSecurityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        runAsUser: &collectorUser 10001
        runAsGroup: 0
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      initContainers:
        - name: state-permissions
          image: &busyboxImage busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          command: [chown, -R, '{{ .Values.securityContext.runAsUser }}:{{ .Values.securityContext.runAsGroup }}', &logCheckpointDirectory /var/lib/otelcol, '{{ .Values.global.exporter.queue.directory }}']
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [CHOWN]
          volumeMounts:
            - name: log-checkpoint-permissions
              mountPath: *logCheckpointDirectory
            - name: exporter-queue
              mountPath: '{{ .Values.global.exporter.queue.directory }}'
        - &exporterTokenWait
          name: exporter-token-wait
          image: *busyboxImage
          command:
            - sh
            - -c
            - '{{ if eq (include "loco-collector.tokenRequired" .) "true" }}until [ -s "$TOKEN_FILE" ]; do sleep "$WAIT_INTERVAL_SECONDS"; done{{ end }}'
          env:
            - name: TOKEN_FILE
              value: '{{ .Values.global.exporter.ingestToken.directory }}/{{ .Values.global.exporter.ingestToken.secretKey }}'
            - name: WAIT_INTERVAL_SECONDS
              value: '{{ .Values.global.exporter.ingestToken.waitIntervalSeconds }}'
          securityContext:
            runAsUser: *collectorUser
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: exporter-token
              mountPath: '{{ .Values.global.exporter.ingestToken.directory }}'
              readOnly: true
      extraVolumes:
        - name: log-checkpoint-permissions
          hostPath:
            path: *logCheckpointDirectory
            type: DirectoryOrCreate
        - name: exporter-queue
          hostPath:
            path: '/var/lib/otelcol-exporter/{{ include "loco-collector.namespace" . }}/{{ include "loco-collector.fullname" . }}'
            type: DirectoryOrCreate
        - &exporterTokenVolume
          name: exporter-token
          secret:
            secretName: '{{ tpl .Values.global.exporter.ingestToken.secretName . }}'
            optional: true
      extraVolumeMounts: &exporterVolumeMounts
        - name: exporter-queue
          mountPath: '{{ .Values.global.exporter.queue.directory }}'
        - name: exporter-token
          mountPath: '{{ .Values.global.exporter.ingestToken.directory }}'
          readOnly: true
      image: &collectorImage
        repository: "otel/opentelemetry-collector-contrib"
        tag: "0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea"
      # The collector chart sets GOMEMLIMIT to 80% of the memory limit.
      resources:
        requests:
          cpu: 200m
          memory: 256Mi
        limits:
          cpu: "2"
          memory: 512Mi
      clusterRole:
        create: true
        rules:
          - apiGroups:
              - ""
            resources:
              - nodes/proxy
              - nodes/stats
              - endpoints
              - services
              - pods
              - namespaces
            verbs: ["get", "watch", "list"]
          - apiGroups:
              - apps
            resources:
              - replicasets
            verbs: ["get", "watch", "list"]
      presets:
        logsCollection:
          enabled: true
          storeCheckpoints: true
          maxRecombineLogSize: 102400
      livenessProbe: &nodeProbe
        httpGet: {path: /, port: 13133}
      readinessProbe: *nodeProbe
      config:
        extensions:
          health_check:
            endpoint: '${env:MY_POD_IP}:{{ .Values.livenessProbe.httpGet.port }}'
        receivers:
          file_log:
            # the collector's own logs and Kubernetes, Flux and cert-manager logs stay on the node.
            exclude:
              - '/var/log/pods/{{ include "loco-collector.namespace" . }}_{{ include "loco-collector.fullname" . }}*_*/{{ include "loco-collector.lowercaseChartName" . }}/*.log'
              - /var/log/pods/kube-system_*/*/*.log
              - /var/log/pods/flux-system_*/*/*.log
              - /var/log/pods/cert-manager_*/*/*.log
            operators:
              - id: container-parser
                type: container
                max_log_size: '{{ .Values.presets.logsCollection.maxRecombineLogSize }}'
              - id: drop-empty
                type: filter
                expr: 'body matches "^\\s*$"'
              - id: multiline-source
                type: add
                field: attributes["loco.multiline.source"]
                value: EXPR(attributes["log.file.path"] + " " + attributes["log.iostream"])
              # indented lines, Java causes and Go panic and goroutine traces continue the earlier line of their stream.
              - id: multiline
                type: recombine
                combine_field: body
                source_identifier: attributes["loco.multiline.source"]
                is_first_entry: >-
                  not (body matches "^\\s" or body startsWith "Caused by: " or body matches "^goroutine [0-9]+ .*\\[.+\\]:$"
                  or body startsWith "[signal " or body startsWith "created by "
                  or body matches "^(panic|[^\\s(]*[./](\\(\\*?[^\\s()]+\\)\\.)?[^\\s(]*)\\([0-9a-fx{}?,. ]*\\)$")
                max_log_size: '{{ .Values.presets.logsCollection.maxRecombineLogSize }}'
                force_flush_period: 500ms
              - id: multiline-source-remove
                type: remove
                field: attributes["loco.multiline.source"]
          kubeletstats:
            collection_interval: &collectionInterval 60s
            auth_type: "serviceAccount"
            endpoint: "https://${env:OTEL_K8S_NODE_IP}:10250"
            insecure_skip_verify: true
            node: "${env:OTEL_K8S_NODE_NAME}"
            k8s_api_config:
              auth_type: serviceAccount
            collect_all_network_interfaces:
              pod: true
            metrics:
              k8s.pod.cpu_limit_utilization:
                enabled: true
              k8s.pod.cpu_request_utilization:
                enabled: true
              k8s.pod.memory_limit_utilization:
                enabled: true
              k8s.pod.memory_request_utilization:
                enabled: true
              k8s.pod.uptime:
                enabled: true
              k8s.node.uptime:
                enabled: true
              k8s.container.cpu_limit_utilization:
                enabled: true
              k8s.container.cpu_request_utilization:
                enabled: true
              k8s.container.memory_limit_utilization:
                enabled: true
              k8s.container.memory_request_utilization:
                enabled: true
              container.uptime:
                enabled: true
              k8s.node.network.io:
                enabled: true
              k8s.pod.network.io:
                enabled: true
        processors:
          memory_limiter:
            check_interval: 1s
            limit_mib: 384
            spike_limit_mib: 96
          # Pod memory limit in bytes, then the working set as a share of it; a processor's rules read only its input metrics.
          metricsgeneration/memory_limit:
            rules:
              - name: k8s.pod.memory.limit
                unit: By
                type: calculate
                metric1: k8s.pod.memory.usage
                metric2: k8s.pod.memory_limit_utilization
                operation: divide
          metricsgeneration/working_set_utilization:
            rules:
              - name: k8s.pod.memory.working_set_limit_utilization
                unit: "1"
                type: calculate
                metric1: k8s.pod.memory.working_set
                metric2: k8s.pod.memory.limit
                operation: divide
          resource/region: &region
            attributes:
              - key: loco.region
                value: '{{ required "global.region is required" .Values.global.region }}'
                action: upsert
          resource/strip_tenancy: &stripTenancy
            attributes:
              - key: loco.organization.id
                action: delete
              - key: loco.workspace.id
                action: delete
              - key: loco.environment.id
                action: delete
              - key: loco.resource.id
                action: delete
              - key: loco.telemetry.scope
                action: delete
              - key: loco.io/build-id
                action: delete
              - key: k8s.pod.ip
                action: delete
              - key: k8s.pod.uid
                action: delete
              - key: k8s.pod.name
                action: delete
              - key: k8s.namespace.name
                action: delete
              - key: gateway.envoyproxy.io/owning-gateway-name
                action: delete
              - key: gateway.envoyproxy.io/owning-gateway-namespace
                action: delete
          transform/log_severity:
            error_mode: silent
            log_statements:
              - context: log
                conditions:
                  - severity_number == 0 and severity_text == ""
                statements:
                  - set(cache["message"], body) where IsString(body)
                  - replace_pattern(cache["message"], "\\x1b\\[[0-?]*[ -/]*[@-~]", "") where IsString(cache["message"])
                  - set(cache["record"], ParseJSON(cache["message"])) where IsString(body) and IsMatch(cache["message"], "^\\s*\\{")
                  - set(cache["level"], cache["record"]["level"]) where IsMap(cache["record"])
                  - set(cache["level"], cache["record"]["severity"]) where cache["level"] == nil and IsMap(cache["record"])
                  - set(cache["level"], cache["record"]["severityText"]) where cache["level"] == nil and IsMap(cache["record"])
                  - merge_maps(cache, ExtractPatterns(cache["message"], "(?i)^(?:\\[?[0-9]{4}[-/][0-9T:.+Z/ -]+\\]?\\s+)?(?:\\[[0-9]+\\]\\s+)?(?:level=|\\[)?(?P<level>TRACE|DEBUG|INFO|NOTICE|WARN(?:ING)?|ERROR|FATAL|CRITICAL|PANIC)(?:\\]|[\\s:=]|$)"), "upsert") where cache["level"] == nil and IsString(body) and not IsMatch(cache["message"], "^\\s*\\{")
                  - set(cache["fields"], ParseKeyValue(cache["message"])) where cache["level"] == nil and IsString(body) and not IsMatch(cache["message"], "^\\s*\\{")
                  - set(cache["level"], cache["fields"]["level"]) where cache["level"] == nil and IsMap(cache["fields"])
                  - set(cache["level"], "ERROR") where cache["level"] == nil and attributes["log.iostream"] == "stderr"
                  - set(cache["level"], ToUpperCase(cache["level"])) where IsString(cache["level"])
                  - set(severity_text, "TRACE") where cache["level"] == "TRACE"
                  - set(severity_number, 1) where severity_text == "TRACE"
                  - set(severity_text, "DEBUG") where cache["level"] == "DEBUG"
                  - set(severity_number, 5) where severity_text == "DEBUG"
                  - set(severity_text, "INFO") where cache["level"] == "INFO" or cache["level"] == "NOTICE" or cache["level"] == "INFORMATION"
                  - set(severity_number, 9) where severity_text == "INFO"
                  - set(severity_text, "WARN") where cache["level"] == "WARN" or cache["level"] == "WARNING"
                  - set(severity_number, 13) where severity_text == "WARN"
                  - set(severity_text, "ERROR") where cache["level"] == "ERROR" or cache["level"] == "ERR"
                  - set(severity_number, 17) where severity_text == "ERROR"
                  - set(severity_text, "FATAL") where cache["level"] == "FATAL" or cache["level"] == "CRITICAL" or cache["level"] == "PANIC"
                  - set(severity_number, 21) where severity_text == "FATAL"
          # observability-proxy/pkg/ingest marks self-export failures with this attribute.
          filter/platform_feedback:
            error_mode: propagate
            log_conditions:
              - log.attributes["loco.telemetry.internal"] == true
          transform/platform_log:
            error_mode: ignore
            log_statements:
              - context: log
                statements:
                  - set(resource.attributes["service.name"], resource.attributes["loco.platform.service.name"]) where IsString(resource.attributes["loco.platform.service.name"])
                  - delete_key(resource.attributes, "loco.platform.service.name")
                  - set(resource.attributes["service.instance.id"], resource.attributes["k8s.pod.uid"])
                  - set(cache["record"], ParseJSON(body)) where IsString(body) and IsMatch(body, "^\\s*\\{")
                  - set(body, cache["record"]["msg"]) where IsString(cache["record"]["msg"])
                  - set(trace_id, TraceID(cache["record"]["trace_id"])) where IsString(cache["record"]["trace_id"])
                  - set(span_id, SpanID(cache["record"]["span_id"])) where IsString(cache["record"]["span_id"])
                  - set(time, Time(cache["record"]["time"], "%Y-%m-%dT%H:%M:%S.%f%z")) where IsString(cache["record"]["time"])
                  - merge_maps(attributes, cache["record"], "upsert") where IsMap(cache["record"]) and IsString(cache["record"]["msg"])
                  - delete_matching_keys(attributes, "^(msg|level|time|trace_id|span_id)$")
          k8s_attributes/connection:
            filter:
              node_from_env_var: OTEL_K8S_NODE_NAME
            passthrough: false
            pod_association: &connectionAssociation
              - sources:
                  - from: connection
            extract: &tenancyExtract
              # Application SDKs own service identity; infer Kubernetes identity only.
              metadata:
                - k8s.namespace.name
                - k8s.pod.name
                - k8s.pod.uid
                - k8s.node.name
                - k8s.pod.start_time
                - k8s.deployment.name
                - k8s.replicaset.name
                - k8s.replicaset.uid
                - k8s.daemonset.name
                - k8s.daemonset.uid
                - k8s.job.name
                - k8s.job.uid
                - k8s.container.name
                - k8s.cronjob.name
                - k8s.statefulset.name
                - k8s.statefulset.uid
                - container.image.tags
                - container.image.repo_digests
                - container.image.name
                - k8s.cluster.uid
              labels:
                - from: pod
                  key: loco.io/organization-id
                  tag_name: loco.organization.id
                - from: pod
                  key: loco.io/workspace-id
                  tag_name: loco.workspace.id
                - from: pod
                  key: loco.io/environment-id
                  tag_name: loco.environment.id
                - from: namespace
                  key: loco.io/organization-id
                  tag_name: loco.organization.id
                - from: namespace
                  key: loco.io/workspace-id
                  tag_name: loco.workspace.id
                - from: namespace
                  key: loco.io/environment-id
                  tag_name: loco.environment.id
                - from: pod
                  key: loco.io/resource-id
                  tag_name: loco.resource.id
                - from: pod
                  key: loco.io/build-id
                  tag_name: loco.io/build-id
                - from: pod
                  key: gateway.envoyproxy.io/owning-gateway-name
                  tag_name: gateway.envoyproxy.io/owning-gateway-name
                - from: pod
                  key: gateway.envoyproxy.io/owning-gateway-namespace
                  tag_name: gateway.envoyproxy.io/owning-gateway-namespace
          k8s_attributes/pod_uid:
            filter:
              node_from_env_var: OTEL_K8S_NODE_NAME
            passthrough: false
            pod_association: &podUIDAssociation
              - sources:
                  - from: resource_attribute
                    name: k8s.pod.uid
            extract: *tenancyExtract
        service:
          extensions: [health_check]
          # Refuse data before enrichment and persistence consume more memory.
          pipelines:
            logs:
              receivers: [file_log]
              processors: [memory_limiter, transform/log_severity, k8s_attributes/pod_uid, resource/region]
            logs/otlp:
              receivers: [otlp]
              processors: [memory_limiter, resource/strip_tenancy, k8s_attributes/connection, resource/region]
            metrics:
              receivers: [kubeletstats]
              processors:
                - memory_limiter
                - metricsgeneration/memory_limit
                - metricsgeneration/working_set_utilization
                - k8s_attributes/pod_uid
                - resource/region
            traces:
              receivers: [otlp, jaeger, zipkin]
              processors: [memory_limiter, resource/strip_tenancy, k8s_attributes/connection, resource/region]

    # @schema skipProperties
    otel-col-deploy:
      enabled: true
      fullnameOverride: otel-col-deploy
      namespaceOverride: &observabilityNamespace loco-obs
      ports:
        otlp:
          servicePort: 4317
        otlp-http:
          servicePort: 4318
      mode: statefulset
      statefulset: &exporterQueueClaims
        volumeClaimTemplates:
          - metadata:
              name: exporter-queue
            spec:
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 2Gi
      configMap:
        create: false
        existingName: '{{ include "loco-collector.fullname" . }}'
      podAnnotations:
        checksum/platform-telemetry: '{{ toJson .Values | sha256sum }}'
      initContainers: &exporterInitContainers [*exporterTokenWait]
      extraVolumes: &exporterVolumes [*exporterTokenVolume]
      extraVolumeMounts: *exporterVolumeMounts
      image: *collectorImage
      podSecurityContext: &collectorPodSecurityContext
        runAsNonRoot: true
        fsGroup: *collectorUser
        seccompProfile:
          type: RuntimeDefault
      securityContext: &collectorSecurityContext
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 200m
          memory: 256Mi
        limits:
          cpu: "2"
          memory: 512Mi
      # Fixed count: a removed replica strands the queue on its volume.
      replicaCount: 2
      autoscaling:
        enabled: false
      podDisruptionBudget:
        enabled: true
        maxUnavailable: 1
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: otel-col-deploy
      clusterRole:
        create: true
        rules:
          - apiGroups:
              - ""
            resources:
              - pods
              - namespaces
            verbs: ["get", "watch", "list"]
          - apiGroups:
              - apps
            resources:
              - replicasets
            verbs: ["get", "watch", "list"]
      config:
        processors:
          resource/region: *region
          resource/strip_tenancy: *stripTenancy
          k8s_attributes/connection:
            passthrough: false
            pod_association: *connectionAssociation
            extract: *tenancyExtract
          k8s_attributes/pod_uid:
            passthrough: false
            pod_association: *podUIDAssociation
            extract: *tenancyExtract
          transform/envoy_tenancy:
            error_mode: ignore
            trace_statements:
              - context: span
                statements: &dropRecordTenancy
                  - delete_key(attributes, "loco.organization.id")
                  - delete_key(attributes, "loco.workspace.id")
                  - delete_key(attributes, "loco.environment.id")
                  - delete_key(attributes, "loco.resource.id")
              - context: span
                conditions: &envoyResource
                  - resource.attributes["gateway.envoyproxy.io/owning-gateway-name"] != nil
                statements:
                  - set(cache["cluster"], attributes["upstream_cluster"])
                  - &parseRoute merge_maps(cache, ExtractPatterns(cache["cluster"], "^httproute/(?P<namespace>{{ regexQuoteMeta .Values.global.workspaceNamespacePrefix }}[^/]+)/resource-(?P<resource>[^/]+)-route/rule/[0-9]+$$"), "upsert") where cache["cluster"] != nil
                  - &setNamespace set(attributes["k8s.namespace.name"], cache["namespace"]) where cache["namespace"] != nil
                  - &setResource set(attributes["loco.resource.id"], cache["resource"]) where cache["resource"] != nil
            log_statements:
              - context: log
                statements: *dropRecordTenancy
              - context: log
                conditions: *envoyResource
                statements:
                  - set(cache["cluster"], attributes["upstream_cluster"])
                  - *parseRoute
                  - *setResource
                  - *setNamespace
            metric_statements:
              - context: datapoint
                statements: *dropRecordTenancy
              - context: datapoint
                conditions: *envoyResource
                statements:
                  - set(cache["cluster"], attributes["envoy.cluster_name"])
                  - *parseRoute
                  - *setResource
                  - *setNamespace
          k8s_attributes/route_namespace:
            passthrough: false
            pod_association:
              - sources:
                  - from: resource_attribute
                    name: k8s.pod.name
                  - from: resource_attribute
                    name: k8s.namespace.name
            extract:
              metadata: []
              labels:
                - from: namespace
                  key: loco.io/organization-id
                  tag_name: loco.organization.id
                - from: namespace
                  key: loco.io/workspace-id
                  tag_name: loco.workspace.id
                - from: namespace
                  key: loco.io/environment-id
                  tag_name: loco.environment.id
          groupbyattrs/tenancy:
            keys:
              - loco.workspace.id
              - loco.resource.id
              - k8s.namespace.name
        receivers:
          otlp:
            protocols:
              grpc:
                endpoint: 0.0.0.0:4317
              http:
                endpoint: 0.0.0.0:4318
        service:
          pipelines:
            logs:
              receivers: [otlp]
              processors: [memory_limiter, resource/strip_tenancy, k8s_attributes/connection, transform/envoy_tenancy, groupbyattrs/tenancy, k8s_attributes/route_namespace, resource/region]
            metrics:
              receivers: [otlp]
              processors: [memory_limiter, resource/strip_tenancy, k8s_attributes/connection, transform/envoy_tenancy, groupbyattrs/tenancy, k8s_attributes/route_namespace, resource/region]
            traces:
              receivers: [otlp, jaeger, zipkin]
              processors: [memory_limiter, resource/strip_tenancy, k8s_attributes/connection, transform/envoy_tenancy, groupbyattrs/tenancy, k8s_attributes/route_namespace, resource/region]

    # @schema skipProperties
    otel-col-cluster:
      enabled: true
      fullnameOverride: otel-col-cluster
      namespaceOverride: *observabilityNamespace
      configMap:
        create: false
        existingName: '{{ include "loco-collector.fullname" . }}'
      podAnnotations:
        checksum/platform-telemetry: '{{ toJson .Values | sha256sum }}'
      mode: statefulset
      statefulset: *exporterQueueClaims
      replicaCount: 1
      initContainers: *exporterInitContainers
      extraVolumes: *exporterVolumes
      extraVolumeMounts: *exporterVolumeMounts
      image: *collectorImage
      podSecurityContext: *collectorPodSecurityContext
      securityContext: *collectorSecurityContext
      resources:
        requests:
          cpu: 150m
          memory: 256Mi
        limits:
          cpu: "2"
          memory: 512Mi
      clusterRole:
        create: true
        rules:
          - apiGroups: [""]
            resources: [pods, namespaces]
            verbs: ["get", "watch", "list"]
          - apiGroups: [apps]
            resources: [replicasets]
            verbs: ["get", "watch", "list"]
      presets:
        kubernetesEvents:
          enabled: true
        clusterMetrics:
          enabled: true
      service:
        enabled: false
      ports:
        otlp:
          enabled: false
        otlp-http:
          enabled: false
        jaeger-compact:
          enabled: false
        jaeger-thrift:
          enabled: false
        jaeger-grpc:
          enabled: false
        zipkin:
          enabled: false
      alternateConfig:
        receivers:
          k8s_cluster:
            collection_interval: *collectionInterval
        extensions:
          health_check:
            endpoint: ${env:MY_POD_IP}:13133
        processors:
          resource/region: *region
          memory_limiter:
            check_interval: 5s
            limit_percentage: 80
            spike_limit_percentage: 25
          k8s_attributes/pod_uid:
            passthrough: false
            pod_association: *podUIDAssociation
            extract: *tenancyExtract
        service:
          extensions: [health_check]
          pipelines:
            logs:
              receivers: [k8sobjects]
              processors: [memory_limiter, resource/region]
            metrics:
              receivers: [k8s_cluster]
              processors: [memory_limiter, k8s_attributes/pod_uid, resource/region]
