{{- if .Values.builds.enabled }}
{{- $controller := .Values.builds.controller }}
apiVersion: apps/v1
kind: Deployment
metadata:
    labels:
        {{- include "loco-operator.buildControllerLabels" . | nindent 8 }}
    name: loco-build-controller
    namespace: {{ .Release.Namespace }}
spec:
    replicas: {{ $controller.replicas }}
    selector:
        matchLabels:
            app.kubernetes.io/name: loco-build-controller
    template:
        metadata:
            annotations:
                kubectl.kubernetes.io/default-container: manager
            labels:
                {{- include "loco-operator.buildControllerLabels" . | nindent 16 }}
        spec:
            containers:
                - args:
                    - --reconciler=build
                    {{- if .Values.metrics.enable }}
                    - --metrics-bind-address=:{{ .Values.metrics.port }}
                    {{- else }}
                    - --metrics-bind-address=0
                    {{- end }}
                    - --health-probe-bind-address=:8081
                    {{- range $controller.args }}
                    - {{ . }}
                    {{- end }}
                  command:
                    - /manager
                  env:
                    - name: LOCO_NAMESPACE
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.namespace
                    {{- with .Values.registry.pullSecretName }}
                    - name: REGISTRY_PULL_SECRET_NAME
                      value: {{ . | quote }}
                    {{- end }}
                    - name: LOCO_BUILD_CONFIG
                      value: {{ include "loco-operator.buildConfig" . | quote }}
                    {{- with $controller.env }}
                    {{- toYaml . | nindent 20 }}
                    {{- end }}
                  image: {{ include "loco-operator.image" . | quote }}
                  imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
                  livenessProbe:
                    httpGet:
                        path: /healthz
                        port: 8081
                    initialDelaySeconds: 15
                    periodSeconds: 20
                  name: manager
                  readinessProbe:
                    httpGet:
                        path: /readyz
                        port: 8081
                    initialDelaySeconds: 5
                    periodSeconds: 10
                  resources:
                    {{- toYaml $controller.resources | nindent 20 }}
                  securityContext:
                    {{- toYaml $controller.securityContext | nindent 20 }}
            securityContext:
                {{- toYaml $controller.podSecurityContext | nindent 16 }}
            serviceAccountName: loco-build-controller
            terminationGracePeriodSeconds: 10
{{- end }}
