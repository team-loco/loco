{{- if .Values.metrics.enable }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
    labels:
        {{- include "loco-operator.controllerLabels" . | nindent 8 }}
    name: loco-controller-metrics-auth
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: loco-operator-metrics-auth
subjects:
    - kind: ServiceAccount
      name: loco-controller
      namespace: {{ .Release.Namespace }}
{{- end }}
