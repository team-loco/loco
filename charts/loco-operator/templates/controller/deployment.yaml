apiVersion: apps/v1
kind: Deployment
metadata:
    labels:
        {{- include "loco-operator.controllerLabels" . | nindent 8 }}
    name: loco-controller
    namespace: {{ .Release.Namespace }}
spec:
    replicas: {{ .Values.controller.replicas }}
    selector:
        matchLabels:
            app.kubernetes.io/name: loco-controller
    template:
        metadata:
            annotations:
                kubectl.kubernetes.io/default-container: manager
            labels:
                {{- include "loco-operator.controllerLabels" . | nindent 16 }}
        spec:
            containers:
                - args:
                    - --reconciler=application
                    {{- if .Values.metrics.enable }}
                    - --metrics-bind-address=:{{ .Values.metrics.port }}
                    {{- else }}
                    - --metrics-bind-address=0
                    {{- end }}
                    - --health-probe-bind-address=:8081
                    {{- range .Values.controller.args }}
                    - {{ . }}
                    {{- end }}
                  command:
                    - /manager
                  env:
                    - name: LOCO_NAMESPACE
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.namespace
                    {{- with .Values.registry.pullSecretName }}
                    - name: REGISTRY_PULL_SECRET_NAME
                      value: {{ . | quote }}
                    {{- end }}
                    {{- with .Values.controller.env }}
                    {{- toYaml . | nindent 20 }}
                    {{- end }}
                  image: {{ include "loco-operator.image" . | quote }}
                  imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
                  livenessProbe:
                    httpGet:
                        path: /healthz
                        port: 8081
                    initialDelaySeconds: 15
                    periodSeconds: 20
                  name: manager
                  readinessProbe:
                    httpGet:
                        path: /readyz
                        port: 8081
                    initialDelaySeconds: 5
                    periodSeconds: 10
                  resources:
                    {{- toYaml .Values.controller.resources | nindent 20 }}
                  securityContext:
                    {{- toYaml .Values.controller.securityContext | nindent 20 }}
            securityContext:
                {{- toYaml .Values.controller.podSecurityContext | nindent 16 }}
            serviceAccountName: loco-controller
            terminationGracePeriodSeconds: 10
