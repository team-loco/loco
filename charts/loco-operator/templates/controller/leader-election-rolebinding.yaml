apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    labels:
        {{- include "loco-operator.controllerLabels" . | nindent 8 }}
    name: loco-controller-leader-election
    namespace: {{ .Release.Namespace }}
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: loco-operator-leader-election
subjects:
    - kind: ServiceAccount
      name: loco-controller
      namespace: {{ .Release.Namespace }}
