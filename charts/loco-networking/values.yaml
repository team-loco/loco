cilium:
  enabled: true
  # --- General settings ---
  # todo: figure out how to get the service host here.
  k8sServiceHost: "172.18.0.4"
  k8sServicePort: "6443"
  kubeProxyReplacement: true
  # NOTE: `hostServices` was removed from the Cilium chart back in 1.11 and has
  # been silently ignored ever since (confirmed absent from both 1.19.5 and
  # 1.20.1 values). Its modern replacement is `socketLB.enabled`, which is
  # currently OFF (rendered config shows bpf-lb-sock="false"). Enabling it is a
  # real datapath change, so it is deliberately not flipped here — see the
  # dependency-bump PR discussion.
  #
  # Because socketLB is disabled while kubeProxyReplacement is on, Cilium 1.20
  # changes where in-cluster pod -> NodePort traffic is load-balanced: it now
  # happens as traffic leaves the client pod rather than at the target node.
  externalIPs:
    enabled: true
  # --- Networking ---
  ipam:
    mode: kubernetes
  routingMode: tunnel
  tunnelProtocol: vxlan
  autoDirectNodeRoutes: false
  enableIPv4Masquerade: true
  enableIPv6Masquerade: false
  # --- Policy enforcement ---
  policyEnforcementMode: default
  # --- Hubble (observability) ---
  hubble:
    enabled: true
    metrics:
      enableOpenMetrics: true
      enabled:
        - "flow:sourceContext=identity;destinationContext=identity;trafficDirection"
        - "drop:sourceContext=identity;destinationContext=identity;trafficDirection"
        - "tcp:sourceContext=identity;destinationContext=identity;trafficDirection"
        - "dns:sourceContext=identity;destinationContext=identity;trafficDirection"
        - "icmp:sourceContext=identity;destinationContext=identity;trafficDirection"
    relay:
      enabled: true
    ui:
      enabled: true
  # --- KubeProxy replacement ---
  bpf:
    masquerade: true
    # WARNING (Cilium 1.20+): tproxy=true is incompatible with the netkit
    # datapath. Do not set `bpf.datapathMode: auto` or netkit here — Cilium
    # either fails to start or silently reverts to veth. We run veth today
    # (rendered config shows datapath-mode="veth"), so this is safe as-is.
    tproxy: true
    hostRouting: true
  # --- NodePort / Services ---
  enableNodePort: true
  enableHostPort: true
  nodePort:
    enableHealthCheck: true
