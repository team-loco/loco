<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="robots" content="noindex" />
		<link rel="icon" href="data:," />
		<title>Page not found | Loco</title>
		<style>
			:root {
				color-scheme: light dark;
				--bg: #ffffff;
				--fg: #2a2522;
				--fg2: #56504a;
				--fg3: #7d766e;
				--accent: #1e40af;
				--accent-hover: #172f86;
				--on-accent: #ffffff;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #161412;
					--fg: #f3efea;
					--fg2: #c9c2ba;
					--fg3: #8f877e;
					--accent: #4a74d6;
					--accent-hover: #5d86e6;
				}
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				padding: 24px 16px;
				background: var(--bg);
				color: var(--fg);
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
				font-size: 13px;
				line-height: 1.4;
				-webkit-font-smoothing: antialiased;
			}
			main {
				width: 100%;
				max-width: 420px;
				text-align: center;
			}
			.code {
				margin: 0 0 12px;
				font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
				font-size: 11px;
				letter-spacing: 0.08em;
				color: var(--fg3);
			}
			h1 {
				margin: 0 0 8px;
				font-size: 24px;
				line-height: 1.25;
				font-weight: 600;
				letter-spacing: -0.01em;
			}
			p {
				margin: 0 0 24px;
				color: var(--fg2);
			}
			a {
				display: inline-flex;
				align-items: center;
				height: 32px;
				padding: 0 12px;
				border-radius: 4px;
				background: var(--accent);
				color: var(--on-accent);
				font-weight: 500;
				text-decoration: none;
			}
			a:hover {
				background: var(--accent-hover);
			}
			a:focus-visible {
				outline: 2px solid var(--fg3);
				outline-offset: 2px;
			}
		</style>
	</head>
	<body>
		<main>
			<p class="code">404</p>
			<h1>Page not found</h1>
			<p>The page you requested does not exist or has moved.</p>
			<a href="/">Go to Loco</a>
		</main>
	</body>
</html>
