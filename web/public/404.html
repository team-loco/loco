<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<title>Page not found | Loco</title>
		<style>
			/* Values copy web/src/index.css and the art colours copy ClusterArt.tsx; a static 404 cannot load the app's stylesheet or scripts. */
			:root {
				color-scheme: light dark;
				--bg: #ffffff;
				--panel: #f5f5f4;
				--panel2: #ececea;
				--raise: #ffffff;
				--line2: #d8d8d5;
				--fg: #18181b;
				--fg3: #66666c;
				--fg4: #a1a1a6;
				--brand: #2455eb;
				--art-strong: color-mix(in oklab, var(--fg) 42%, var(--bg));
				--art-soft: color-mix(in oklab, var(--fg) 22%, var(--bg));
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #0f0f11;
					--panel: #161618;
					--panel2: #202023;
					--raise: #1c1c1f;
					--line2: #313137;
					--fg: #ececef;
					--fg3: #8b8b94;
					--fg4: #5b5b63;
					--brand: #7b9cff;
				}
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100dvh;
				display: flex;
				flex-direction: column;
				background: var(--bg);
				color: var(--fg);
				font-family:
					"Geist Variable",
					-apple-system,
					BlinkMacSystemFont,
					"Segoe UI",
					"Helvetica Neue",
					Helvetica,
					Arial,
					sans-serif;
				font-size: 13px;
				line-height: 1.4;
				-webkit-font-smoothing: antialiased;
			}
			header {
				padding: 20px clamp(16px, 3vw, 28px) 0;
			}
			.logo {
				display: inline-flex;
				align-items: center;
				height: 32px;
				border-radius: 2px;
				color: var(--brand);
			}
			.logo svg {
				width: 46px;
				height: auto;
			}
			main {
				flex: 1;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 12px;
				width: 100%;
				max-width: 560px;
				margin: 0 auto;
				padding: 40px 16px 96px;
				text-align: center;
			}
			.art {
				display: block;
				max-width: 100%;
				overflow: visible;
			}
			h1 {
				margin: 8px 0 0;
				font-size: 24px;
				font-weight: 400;
				line-height: 1.4;
				letter-spacing: -0.03em;
			}
			p {
				margin: 0;
				max-width: 34em;
				font-size: 14px;
				line-height: 1.55;
				color: var(--fg3);
			}
			.button {
				display: inline-flex;
				align-items: center;
				height: 32px;
				margin-top: 6px;
				padding: 0 12px;
				border: 1px solid var(--line2);
				border-radius: 6px;
				background: var(--raise);
				color: var(--fg);
				text-decoration: none;
			}
			.button:hover {
				border-color: var(--fg4);
			}
			a:focus-visible {
				outline: 2px solid var(--fg4);
				outline-offset: 2px;
			}
		</style>
	</head>
