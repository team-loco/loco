[general]
host = "::"
port = 8080
root = "/public"
page404 = "/public/404.html"
health = true
log-level = "info"

compression = true
compression-level = "default"
compression-static = true

cache-control-headers = false
security-headers = false
directory-listing = false

[advanced]

[[advanced.headers]]
source = "**"
[advanced.headers.headers]
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
Referrer-Policy = "strict-origin-when-cross-origin"
X-XSS-Protection = "1; mode=block"
Vary = "Accept-Encoding"
Cache-Control = "no-cache"
Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self'; manifest-src 'self'"

[[advanced.headers]]
source = "**/*.{js,css,png,jpg,jpeg,gif,ico,svg,woff,woff2,ttf,eot}"
[advanced.headers.headers]
Cache-Control = "public, max-age=31536000, immutable"

[[advanced.headers]]
source = "/{index.html,runtime-config.js,theme.js}"
[advanced.headers.headers]
Cache-Control = "no-cache"

[[advanced.headers]]
source = "/install.sh"
[advanced.headers.headers]
Content-Type = "text/plain; charset=utf-8"
Cache-Control = "no-cache"

[[advanced.headers]]
source = "/{skills.md,docs/skills.md}"
[advanced.headers.headers]
Content-Type = "text/markdown; charset=utf-8"
Cache-Control = "no-cache"

# Unknown paths open the UI, so React's NotFound answers them, and the first
# matching rewrite wins:
# - Paths with a file extension stay files, so a missing /assets/x.js is a real 404.
# - The documentation mounted at /docs stays as it is.
# - Everything else becomes /spa.html, a copy of index.html.
# Missing files and unknown documentation paths are answered with page404, which
# web/build.ts renders from the UI's NotFound page.
[[advanced.rewrites]]
source = "/**/*.*"
destination = "$0"

[[advanced.rewrites]]
source = "/"
destination = "$0"

[[advanced.rewrites]]
source = "/docs"
destination = "$0"

[[advanced.rewrites]]
source = "/docs/**"
destination = "$0"

[[advanced.rewrites]]
source = "/**"
destination = "/spa.html"
