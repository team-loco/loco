version: 1
partial: backend
services:
  backend:
    dockerfile: Dockerfile
    port: 8000
    routing: { pathPrefix: /, idleTimeout: 60 }
    health: { path: /api/health, interval: 30, timeout: 5, failThreshold: 3, startupGracePeriod: 0 }
    domains: [backend.onloco.app]
    regions:
      us-east-1: { cpu: 100m, memory: 256Mi, replicas: { min: 1, max: 1 } }
