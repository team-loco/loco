version: 1
partial: metrics-server
services:
  metrics-server:
    dockerfile: Dockerfile
    port: 8000
    routing: { pathPrefix: /, idleTimeout: 60 }
    health: { path: /, interval: 30, timeout: 5, failThreshold: 3, startupGracePeriod: 0 }
    domains: [metrics-server.onloco.app]
    regions:
      us-east-1: { cpu: 100m, memory: 256Mi, replicas: { min: 1, max: 1 } }
