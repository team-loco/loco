apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../releases/control-plane.yaml
  - loco.yaml
configMapGenerator:
  - name: loco-control-plane-values
    namespace: flux-system
    files:
      - values.yaml=values/loco-control-plane.yaml
generatorOptions:
  disableNameSuffixHash: true
