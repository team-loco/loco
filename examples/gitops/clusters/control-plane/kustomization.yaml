apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../releases/control-plane.yaml
  - ../../bases/control-plane
configMapGenerator:
  - name: loco-control-plane-values
    namespace: flux-system
    files:
      - values.yaml=values/loco-control-plane.yaml
generatorOptions:
  disableNameSuffixHash: true
patches:
  - target: {kind: Kustomization, name: loco-cluster-config}
    patch: |-
      - op: replace
        path: /spec/path
        value: ./clusters/control-plane/config
