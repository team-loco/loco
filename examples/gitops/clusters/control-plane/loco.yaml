apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: loco
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: OCIRepository
    name: platform-bundle
  path: ./control-plane
  prune: true
  wait: true
  timeout: 30m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: loco-cluster-config
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/control-plane/config
  prune: true
  wait: true
  dependsOn:
    - name: loco-namespaces
  decryption:
    provider: sops
    secretRef:
      name: sops-age
