apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../releases/workers-staging.yaml
  - loco.yaml
configMapGenerator:
  - name: loco-worker-values
    namespace: flux-system
    files:
      - values.yaml=values/loco-worker.yaml
generatorOptions:
  disableNameSuffixHash: true
