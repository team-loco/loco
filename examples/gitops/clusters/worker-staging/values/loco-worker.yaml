global:
  region: us-ca-1
  domain:
    apps:
      - apps.example.com
  exporter:
    endpoint: https://ingest.example.com
certManager:
  issuer:
    email: admin@example.com
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
env:
  CONTROL_PLANE_URL: https://api.example.com
  LOCO_REGISTRY_HOST: registry.example.com
