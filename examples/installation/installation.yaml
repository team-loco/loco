# yaml-language-server: $schema=../../schemas/installation.v1.json
version: 1
name: example
release:
  manifest: ./release.json
controlPlane:
  kubernetes:
    context: example-control-plane
    clusterUID: control-plane-cluster-uid
    namespace: loco-system
  apiURL: https://api.example.com
  webURL: https://console.example.com
  database:
    secretRef: {name: loco-inputs, key: database-url}
  auth:
    issuer: https://auth.example.com
    clientId: loco
    bootstrapRedirectURI: http://127.0.0.1:8400/callback
    signupMode: closed
  sourceBucket:
    endpoint: https://s3.example.com
    region: us-east-1
    bucket: loco-source
    credentialsSecretRef: {name: loco-source}
  registry:
    endpoint: https://registry.example.com
    credentialsSecretRef: {name: loco-registry}
  openbao:
    managed: true
    seal:
      type: static
    snapshots:
      credentialsSecretRef: {name: loco-backups}
      endpoint: https://s3.example.com
      region: us-east-1
      bucket: loco-backups
  observability:
    enabled: true
    ingestURL: https://ingest.example.com
  certificates:
    issuerRef: {name: example-issuer, kind: ClusterIssuer}
workers:
  - name: staging-us
    kubernetes:
      context: example-staging-us
      clusterUID: worker-cluster-uid
      namespace: loco-system
    region: us-east-1
    tier: staging
    role: all
    appsDomain: staging.apps.example.com
    metricsServer: {enabled: true, kubeletInsecureTLS: false}
    builds: {privateEgress: []}
    certificates:
      issuerRef: {name: example-issuer, kind: ClusterIssuer}
