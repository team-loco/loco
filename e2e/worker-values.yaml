global:
  domain:
    platform: e2e-platform.test.local
  replicas:
    agent: 0
certManager:
  issuer:
    email: e2e@test.local
agent:
  image:
    tag: e2e
envoyProxy:
  tracing:
    samplingRate: 100
controller:
  image:
    pullPolicy: Never
registry:
  pullSecretName: loco-registry
builds:
  pushSecretName: loco-registry-push
  insecureRegistry: true
  timeout: 10m
  builderImage:
    pullPolicy: Never
  buildkitImage:
    pullPolicy: Never
