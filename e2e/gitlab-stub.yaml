apiVersion: v1
kind: ConfigMap
metadata:
  name: gitlab-stub
data:
  default.conf: |
    server {
        listen 8080;
        default_type application/json;

        location ~ ^/api/v4/projects/[^/]+/deploy_tokens$ {
            if ($request_method = POST) {
                return 201 '{"id": 1, "username": "e2e", "token": "e2e", "expires_at": ""}';
            }
            return 405;
        }

        location ~ ^/api/v4/projects/[^/]+/deploy_tokens/[^/]+$ {
            return 204;
        }

        location / {
            return 404;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab-stub
  labels:
    app: gitlab-stub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitlab-stub
  template:
    metadata:
      labels:
        app: gitlab-stub
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.31.6-alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            tcpSocket:
              port: 8080
      volumes:
        - name: config
          configMap:
            name: gitlab-stub
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab-stub
spec:
  selector:
    app: gitlab-stub
  ports:
    - port: 8080
      targetPort: 8080
