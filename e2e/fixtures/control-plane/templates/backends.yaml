apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: {{ required "postgresImage is required" .Values.postgresImage | quote }}
          env:
            - name: POSTGRES_USER
              value: loco
            - name: POSTGRES_DB
              value: loco
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fixture-password
                  key: password
          readinessProbe:
            exec:
              command: [pg_isready, -U, loco, -d, loco]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-config
data:
  keeper.xml: |
    <clickhouse>
      {{- .Values.keeperConfig | nindent 6 }}
      <mark_cache_size>16777216</mark_cache_size>
      <background_schedule_pool_size>16</background_schedule_pool_size>
      <max_server_memory_usage>536870912</max_server_memory_usage>
    </clickhouse>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickhouse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      containers:
        - name: clickhouse
          image: {{ required "clickhouseImage is required" .Values.clickhouseImage | quote }}
          env:
            - name: CLICKHOUSE_USER
              value: loco
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fixture-password
                  key: password
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
          volumeMounts:
            - name: config
              mountPath: /etc/clickhouse-server/config.d/keeper.xml
              subPath: keeper.xml
          readinessProbe:
            httpGet:
              path: /ping
              port: 8123
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: clickhouse-config
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
spec:
  selector:
    app: clickhouse
  ports:
    - name: native
      port: 9000
