apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: {{ required "postgresImage is required" .Values.postgresImage | quote }}
          env:
            - name: POSTGRES_USER
              value: loco
            - name: POSTGRES_DB
              value: loco
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fixture-password
                  key: password
          readinessProbe:
            exec:
              command: [pg_isready, -U, loco, -d, loco]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
