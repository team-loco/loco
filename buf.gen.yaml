version: v2
inputs:
  - directory: .
  - module: buf.build/googleapis/googleapis
    paths: [google/rpc/error_details.proto]
plugins:
  # TypeScript — gen/ts/ mirrors gen/go/ instead of being buried in web/src/gen.
  - local: ./node_modules/.bin/protoc-gen-es
    out: ./gen/ts
    include_imports: true
    opt:
      - target=ts
      - json_types=true
