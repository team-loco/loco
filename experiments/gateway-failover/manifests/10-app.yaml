# The tenant app. REGION is substituted by setup.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: default
  labels: {app: demo-app}
spec:
  replicas: 2
  selector:
    matchLabels: {app: demo-app}
  template:
    metadata:
      labels: {app: demo-app}
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10
          args: ["--name", "__REGION__"]
          ports: [{containerPort: 80}]
          readinessProbe:
            httpGet: {path: /health, port: 80}
            periodSeconds: 2
            failureThreshold: 1
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: default
spec:
  selector: {app: demo-app}
  ports: [{port: 80, targetPort: 80, name: http}]
