name: Merge queue changes
description: Apply the calling workflow's pull_request path filters to merge_group runs, which GitHub runs unfiltered. Outputs run=true for every other event.

outputs:
  run:
    description: Whether the workflow's jobs should run.
    value: ${{ steps.match.outputs.run }}

runs:
  using: composite
  steps:
    - id: match
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        WORKFLOW_REF: ${{ github.workflow_ref }}
        BASE: ${{ github.event.merge_group.base_sha }}
        HEAD: ${{ github.event.merge_group.head_sha }}
      run: |
        set -euo pipefail
        if [ "$EVENT" != merge_group ]; then
          echo "run=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        workflow=${WORKFLOW_REF#*/*/}
        workflow=${workflow%%@*}
        mapfile -t patterns < <(yq '.on.pull_request.paths[]' "$workflow")
        if [ "${#patterns[@]}" -eq 0 ]; then
          echo "run=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        git fetch --no-tags --depth=1 origin "$BASE"
        mapfile -t changed < <(git diff --name-only "$BASE" "$HEAD")

        for file in "${changed[@]}"; do
          for pattern in "${patterns[@]}"; do
            glob=${pattern//\*\*/*}
            if [[ $file == $glob || ( $pattern == '**/'* && $file == ${glob#\*/} ) ]]; then
              echo "$file matches $pattern"
              echo "run=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
        done

        echo "no changed file matches the pull_request paths of $workflow"
        echo "run=false" >> "$GITHUB_OUTPUT"
