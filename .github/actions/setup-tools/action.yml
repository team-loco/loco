name: Setup tools
description: Install every tool pinned in mise.toml at the versions and checksums recorded in mise.lock.

inputs:
  go-cache:
    description: Cache key suffix for the Go module, build and golangci-lint caches. Caching is skipped when empty.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      with:
        version: 2026.10.6

    - if: inputs.go-cache != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
          ~/.cache/golangci-lint
        key: go-${{ runner.os }}-${{ inputs.go-cache }}-${{ hashFiles('mise.lock', '**/go.sum') }}
        restore-keys: |
          go-${{ runner.os }}-${{ inputs.go-cache }}-
