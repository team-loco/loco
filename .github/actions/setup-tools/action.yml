name: Setup tools
description: Install every tool pinned in mise.toml at the versions and checksums recorded in mise.lock. Caches are saved only on main, the one ref whose caches pull requests and merge groups can restore.

inputs:
  go-cache:
    description: Cache key suffix for the Go build cache. Caching, including the shared Go module cache, is skipped when empty.
    required: false
    default: ""
  lint-cache:
    description: Set to true to cache golangci-lint results with the Go build cache.
    required: false
    default: "false"
  save-go-modules:
    description: Set to true in the one job that downloads every module of every go.mod and saves the shared Go module cache on main.
    required: false
    default: "false"
  image-cache:
    description: >-
      Set to true to serve the images `mise run images:public` lists from the image cache, as the
      mirror of the public image registry for the Docker daemon, the BuildKit builders given the
      buildkitd-config output and the e2e kind nodes, at the address DOCKER_HUB_MIRROR holds. An
      image the cache lacks comes from the public registry. Docker reloads its configuration.
    required: false
    default: "false"
  save-image-cache:
    description: Set to true in the one job that pulls every image through a syncing registry and saves the image cache on main.
    required: false
    default: "false"

outputs:
  buildkitd-config:
    description: A buildkitd.toml mirroring the public image registry to the image cache; empty when the cache serves nothing.
    value: ${{ steps.image-mirror.outputs.buildkitd-config }}

runs:
  using: composite
  steps:
    - if: inputs.go-cache != '' && inputs.save-go-modules == 'true' && github.ref == 'refs/heads/main'
      id: go-modules-save
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/go/pkg/mod
        key: go-mod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}

    - if: inputs.go-cache != '' && (inputs.save-go-modules != 'true' || github.ref != 'refs/heads/main')
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/go/pkg/mod
        key: go-mod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          go-mod-${{ runner.os }}-

    - id: mise-tools
      shell: bash
      run: |
        python3 -I -c '
        import hashlib, json, tomllib
        config = tomllib.load(open("mise.toml", "rb"))
        digest = hashlib.sha256(open("mise.lock", "rb").read())
        digest.update(json.dumps([config["tools"], config["settings"]], sort_keys=True).encode())
        print("hash=" + digest.hexdigest())
        ' >> "$GITHUB_OUTPUT"

    - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      env:
        MISE_TOOLS_HASH: ${{ steps.mise-tools.outputs.hash }}
      with:
        version: 2026.11.6
        cache_save: ${{ github.ref == 'refs/heads/main' }}
        cache_key: "{{cache_key_prefix}}-{{platform}}-{{version}}-{{env.MISE_TOOLS_HASH}}"

    - if: github.ref == 'refs/heads/main'
      id: helm-deps-save
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: charts/*/charts/*.tgz
        key: helm-deps-${{ hashFiles('charts/*/Chart.yaml', 'charts/*/Chart.lock') }}

    - if: github.ref != 'refs/heads/main'
      id: helm-deps-restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: charts/*/charts/*.tgz
        key: helm-deps-${{ hashFiles('charts/*/Chart.yaml', 'charts/*/Chart.lock') }}

    # Cache archives keep their original mtimes. Mark an exact hit newer than
    # checkout's Chart files so mise's sources/outputs check skips the download.
    - if: steps.helm-deps-save.outputs.cache-hit == 'true' || steps.helm-deps-restore.outputs.cache-hit == 'true'
      shell: bash
      run: touch charts/*/charts/*.tgz

    - if: steps.go-modules-save.outcome == 'success' && steps.go-modules-save.outputs.cache-hit != 'true'
      shell: bash
      run: |
        git ls-files -- '*go.mod' | while read -r modfile; do
          go -C "$(dirname "$modfile")" mod download
        done

    - if: inputs.go-cache != ''
      id: go-build
      shell: bash
      env:
        GO_CACHE: ${{ inputs.go-cache }}
        LINT_CACHE: ${{ inputs.lint-cache }}
      run: |
        prefix="go-build-$RUNNER_OS-$GO_CACHE-$(go env GOVERSION)"
        paths=$(go env GOCACHE)
        if [ "$LINT_CACHE" = true ]; then
          prefix="$prefix-golangci-lint-$(golangci-lint version --short)"
          paths="$paths"$'\n'"$HOME/.cache/golangci-lint"
        fi
        {
          echo "prefix=$prefix-"
          echo "paths<<EOF"
          echo "$paths"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - if: inputs.go-cache != '' && github.ref == 'refs/heads/main'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.go-build.outputs.paths }}
        key: ${{ steps.go-build.outputs.prefix }}${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ steps.go-build.outputs.prefix }}

    - if: inputs.go-cache != '' && github.ref != 'refs/heads/main'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.go-build.outputs.paths }}
        key: ${{ steps.go-build.outputs.prefix }}${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ steps.go-build.outputs.prefix }}

    # The cache holds the amd64 image of each pinned index, with the index and its attestation
    # manifests. Saving pulls them through a Zot syncing on demand from the public registry;
    # serving runs Zot without sync, so a miss returns 404 and the client goes to the registry.
    - if: inputs.image-cache == 'true' || inputs.save-image-cache == 'true'
      id: image-cache-key
      shell: bash
      run: echo "key=public-images-$(mise run --quiet images:public | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

    - if: inputs.save-image-cache == 'true' && github.ref == 'refs/heads/main'
      id: image-cache-save
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/public-images
        key: ${{ steps.image-cache-key.outputs.key }}

    - if: inputs.image-cache == 'true' && inputs.save-image-cache != 'true'
      id: image-cache-restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/public-images
        key: ${{ steps.image-cache-key.outputs.key }}
        restore-keys: |
          public-images-

    - if: (steps.image-cache-save.outcome == 'success' && steps.image-cache-save.outputs.cache-hit != 'true') || steps.image-cache-restore.outputs.cache-matched-key != ''
      id: image-mirror
      shell: bash
      env:
        SYNC: ${{ steps.image-cache-save.outcome == 'success' }}
      run: |
        dir=$RUNNER_TEMP/public-images
        mkdir -p "$dir"
        mirror=$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}'):5555
        root=$dir
        if [ "$SYNC" = true ]; then
          root=/var/lib/registry
        fi
        jq -n --arg root "$root" --argjson sync "$SYNC" '{
          distSpecVersion: "1.1.1",
          storage: {rootDirectory: $root, gc: false, dedupe: false},
          http: {address: "0.0.0.0", port: "5555", compat: ["docker2s2"]},
          log: {level: "warn"}
        } + if $sync then {extensions: {sync: {enable: true, registries: [
          {urls: ["https://registry-1.docker.io"], onDemand: true, content: [{prefix: "**"}]}
        ]}}} else {} end' > "$RUNNER_TEMP/zot.json"
        if [ "$SYNC" = true ]; then
          docker run -d --name public-images -p 5555:5555 -v "$dir:$root" \
            -v "$RUNNER_TEMP/zot.json:/etc/zot/config.json:ro" "$(yq '.services.registry.image' dev/compose.yaml)"
        else
          nohup zot serve "$RUNNER_TEMP/zot.json" > "$RUNNER_TEMP/zot.log" 2>&1 &
        fi
        curl -sf --retry 30 --retry-connrefused --retry-delay 1 "http://$mirror/v2/"
        config=/etc/docker/daemon.json
        sudo test -s "$config" || echo '{}' | sudo tee "$config" > /dev/null
        sudo jq --arg mirror "$mirror" '."registry-mirrors" = ["http://" + $mirror] | ."insecure-registries" += [$mirror]' "$config" |
          sudo tee "$config.new" > /dev/null
        sudo mv "$config.new" "$config"
        sudo systemctl reload docker
        until docker info --format '{{json .RegistryConfig.Mirrors}}' | grep -q "$mirror"; do sleep 1; done
        echo "DOCKER_HUB_MIRROR=$mirror" >> "$GITHUB_ENV"
        {
          echo "buildkitd-config<<EOF"
          printf '[registry."docker.io"]\n  mirrors = ["%s"]\n[registry."%s"]\n  http = true\n' "$mirror" "$mirror"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - if: steps.image-mirror.outcome == 'success' && steps.image-cache-save.outcome == 'success'
      shell: bash
      run: |
        mise run --quiet images:public | xargs -n1 docker pull -q
        docker rm -f public-images
        sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/public-images"
        du -sh "$RUNNER_TEMP/public-images"
