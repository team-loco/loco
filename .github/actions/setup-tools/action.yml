name: Setup tools
description: Install every tool pinned in mise.toml at the versions and checksums recorded in mise.lock. Caches are saved only on main, the one ref whose caches pull requests and merge groups can restore.

inputs:
  go-cache:
    description: Cache key suffix for the Go module, build and golangci-lint caches. Caching is skipped when empty.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      with:
        version: 2026.10.6
        cache_save: ${{ github.ref == 'refs/heads/main' }}

    - if: inputs.go-cache != '' && github.ref == 'refs/heads/main'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
          ~/.cache/golangci-lint
        key: go-${{ runner.os }}-${{ inputs.go-cache }}-${{ hashFiles('mise.lock', '**/go.sum') }}
        restore-keys: |
          go-${{ runner.os }}-${{ inputs.go-cache }}-

    - if: inputs.go-cache != '' && github.ref != 'refs/heads/main'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
          ~/.cache/golangci-lint
        key: go-${{ runner.os }}-${{ inputs.go-cache }}-${{ hashFiles('mise.lock', '**/go.sum') }}
        restore-keys: |
          go-${{ runner.os }}-${{ inputs.go-cache }}-
