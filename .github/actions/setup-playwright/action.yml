name: Setup Playwright
description: Install Chromium for the Playwright version locked in the shared test project, with its system libraries. The browser and the packages apt downloads for it are cached per runner image; the cache is saved only on main, the one ref whose caches pull requests and merge groups can restore.

runs:
  using: composite
  steps:
    - name: Read the Playwright version
      id: playwright
      shell: bash
      run: |
        echo "version=$(uv run --frozen --project tests python -c 'from importlib.metadata import version; print(version("playwright"))')" >> "$GITHUB_OUTPUT"
        echo "image=$ImageOS" >> "$GITHUB_OUTPUT"

    - if: github.ref == 'refs/heads/main'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/ms-playwright
          ~/.cache/playwright-apt
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}

    - if: github.ref != 'refs/heads/main'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/ms-playwright
          ~/.cache/playwright-apt
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}

    # Installs the system libraries even when the browser came from the cache; apt takes cached packages before the mirrors.
    - name: Install browser
      shell: bash
      run: |
        shopt -s nullglob
        mkdir -p ~/.cache/playwright-apt
        cached=(~/.cache/playwright-apt/*.deb)
        if (( ${#cached[@]} )); then sudo cp "${cached[@]}" /var/cache/apt/archives/; fi
        uv run --frozen --project tests playwright install --with-deps chromium
        downloaded=(/var/cache/apt/archives/*.deb)
        if (( ${#downloaded[@]} )); then cp "${downloaded[@]}" ~/.cache/playwright-apt/; fi
