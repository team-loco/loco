# Changed paths that run each workflow .github/workflows/ci.yml calls, keyed by
# the workflow's file name. tools/ci-changes evaluates them with the semantics of
# a workflow's `paths` filter: `*` stays within a directory, `**` crosses
# directories, `?` makes the preceding character optional, `{a,b}` matches
# either word, and a later `!pattern` excludes what earlier patterns matched. A
# workflow without a list for an event never runs on that event. A workflow's
# `for` list names the workflows that use its output; it runs whenever one of
# them runs.
#
# A pass of a workflow on the same inputs stands in for running it: the tree
# entries of the files its pull_request paths match, its workflow file, ci.yml
# and mise.lock. `reuse: false` marks a
# workflow whose result depends on more than those files, such as the pull
# request it comments on, what it publishes or an advisory database; a
# workflow with a `for` list never reuses a pass.

auth-conformance:
  pull_request: &auth-conformance
    - "api/auth/**"
    - "api/mail/**"
    - "api/service/**"
    - "api/migrations/**"
    - "api/queries/**"
    - "tests/conformance/auth/**"
    - "mise-tasks/test/auth-conformance"
    - "mise-tasks/test/auth-invitations"
    - ".github/workflows/auth-conformance.yml"
    - ".github/actions/setup-tools/**"
    - "mise.toml"
    - "mise.lock"
  push: *auth-conformance

