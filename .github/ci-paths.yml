# Changed paths that run each workflow .github/workflows/ci.yml calls, keyed by
# the workflow's file name. tools/ci-changes evaluates them with the semantics of
# a workflow's `paths` filter: `*` stays within a directory, `**` crosses
# directories, `?` makes the preceding character optional, and `{a,b}` matches
# either word. A workflow without a list for an event never runs on that event.
# A workflow's `for` list names the workflows that use its output; it runs
# whenever one of them runs.
#
# Go code is not listed by path. `go.build` names the Go packages a workflow
# builds and runs, and `go.test` the packages whose tests it runs; a pattern
# ending in /... names every package of its module under that directory. On
# each event it has a list for, a workflow also runs for a change to what those
# packages import, transitively and across the repository's modules: the
# imported packages' Go files and embedded files, the tested packages'
# directories, and the go.mod and go.sum files that build reads.
# go-lint-and-test runs for a change to any Go module's lint and tests, and
# lints and tests only the affected modules.
#
# A pass of a workflow on the same inputs stands in for running it: the tree
# entries of the files its pull_request paths or Go packages cover, its
# workflow file, ci.yml and mise.lock. `reuse: false` marks a
# workflow whose result depends on more than those files, such as the pull
# request it comments on, what it publishes or an advisory database; a
# workflow with a `for` list never reuses a pass.

auth-conformance:
  go:
    build: [tools/authkeys]
    test: [api/auth]
  pull_request: &auth-conformance
    - "tests/conformance/auth/**"
    - "mise-tasks/test/auth-conformance"
    - "mise-tasks/test/auth-invitations"
    - "mise-tasks/test/lib/auth-stack.sh"
    - "mise-tasks/test/lib/testres.sh"
    - "internal/testres/**"
    - "tools/testres/**"
    - ".github/workflows/auth-conformance.yml"
    - ".github/actions/setup-tools/**"
    - "mise.toml"
    - "mise.lock"
  push: *auth-conformance

