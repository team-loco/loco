# Changed paths that run each workflow .github/workflows/ci.yml calls, keyed by
# the workflow's file name. tools/ci-changes evaluates them with the semantics of
# a workflow's `paths` filter: `*` stays within a directory, `**` crosses
# directories, `?` makes the preceding character optional, `{a,b}` matches
# either word, and a later `!pattern` excludes what earlier patterns matched. A
# workflow without a list for an event never runs on that event.

