name: Observability Chart

on:
  workflow_call:

permissions:
  contents: read

jobs:

  charts:
    name: Observability Charts
    runs-on: ubuntu-latest
    env:
      MISE_ENABLE_TOOLS: go,helm,yq,github:project-zot/zot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-tools
        with:
          go-cache: obs-chart
          image-cache: true
      - name: Check that every ClickHouse table the chart creates has a TTL
        run: mise run test:obs-retention

      - name: Check that the collectors take tenancy only from pod labels
        if: ${{ !cancelled() }}
        run: mise run test:obs-tenancy
