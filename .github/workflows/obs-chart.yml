name: Observability Chart

on:
  push:
    branches:
      - main
    paths:
      - "charts/loco-worker/**"
      - "charts/loco-control-plane/**"
      - "mise-tasks/test/obs-retention"
      - "mise-tasks/test/obs-tenancy"
      - "mise-tasks/test/lib/**"
      - "observability-proxy/**"
      - "gen/go/**"
      - "internal/buildinfo/**"
      - "go.mod"
      - "go.sum"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/obs-chart.yml"
      - ".github/actions/setup-tools/**"
      - "!**/*_test.go"
  pull_request:
    paths:
      - "charts/loco-worker/**"
      - "charts/loco-control-plane/**"
      - "mise-tasks/test/obs-retention"
      - "mise-tasks/test/obs-tenancy"
      - "mise-tasks/test/lib/**"
      - "observability-proxy/**"
      - "gen/go/**"
      - "internal/buildinfo/**"
      - "go.mod"
      - "go.sum"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/obs-chart.yml"
      - ".github/actions/setup-tools/**"
      - "!**/*_test.go"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  retention:
    name: Observability Retention
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-tools
      - name: Check that every ClickHouse table the chart creates has a TTL
        run: mise run test:obs-retention

  tenancy:
    name: Observability Tenancy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-tools
      - name: Check that the collectors take tenancy only from pod labels
        run: mise run test:obs-tenancy
