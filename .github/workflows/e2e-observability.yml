name: Observability E2E

on:
  pull_request:
    paths:
      - "agent/**"
      - "controller/**"
      - "k8sapi/**"
      - "observability-proxy/**"
      - "proto/loco/observability/**"
      - "proto/loco/token/**"
      - "gen/go/**"
      - "api/main.go"
      - "api/migrations/**"
      - "api/service/token.go"
      - "api/tvm/**"
      - "api/interceptor/**"
      - "charts/loco-worker/**"
      - "charts/loco-control-plane/**"
      - "manifests/namespaces/**"
      - "dev/compose.yaml"
      - "mise-tasks/e2e/**"
      - "mise-tasks/crds/**"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "mise.toml"
      - "mise.lock"
      - ".github/actions/setup-tools/**"
      - "!**/*_test.go"
      - "e2e/**"
      - ".github/workflows/e2e-observability.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  e2e:
    name: Observability E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-tools
        with:
          go-cache: e2e

      - name: Run the observability end-to-end tests
        run: ./e2e/run.sh --no-teardown --observability observability

      - name: Upload the evidence report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: observability-evidence
          path: e2e/out/observability-evidence.md
          if-no-files-found: warn
