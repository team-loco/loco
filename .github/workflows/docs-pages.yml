# Publishes docs/site to GitHub Pages, which serves it at docs.loco.build: the
# two newest releases and main as staging.
name: Documentation Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      # The docs build imports the dashboard's fonts, theme, favicon and wordmark.
      - "web/src/fonts.css"
      - "web/src/theme.css"
      - "web/public/favicon.svg"
      - "web/public/logo.svg"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/docs-pages.yml"
  release:
    types: [published]
  # The Release workflow publishes with its own token, which starts no release-triggered run.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # The build reads the content of the release tags.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - run: bun install --frozen-lockfile
      - run: mise run docs:build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
