name: Resource Status E2E

on:
  pull_request:
    paths:
      - "agent/**"
      - "controller/**"
      - "k8sapi/**"
      - "proto/loco/agent/**"
      - "proto/loco/resource/**"
      - "api/main.go"
      - "api/config.go"
      - "api/migrations/**"
      - "api/queries/cluster.sql"
      - "api/queries/deployment.sql"
      - "api/queries/placement.sql"
      - "api/queries/resource.sql"
      - "api/service/agent.go"
      - "api/service/deployment.go"
      - "api/service/placement.go"
      - "api/service/resource.go"
      - "api/service/resource_status.go"
      - "api/service/sync.go"
      - "api/pkg/converter/**"
      - "charts/loco-worker/**"
      - "manifests/namespaces/**"
      - "compose.yaml"
      - "e2e/**"
      - "mise-tasks/e2e/**"
      - "mise-tasks/crds/**"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "mise.toml"
      - "mise.lock"
      - ".github/actions/setup-tools/**"
      - ".github/workflows/e2e-status.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  e2e:
    name: Resource Status E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-tools
        with:
          go-cache: e2e

      - name: Run the resource status end-to-end tests
        run: ./e2e/run.sh --no-teardown --builds-disabled resource_status
