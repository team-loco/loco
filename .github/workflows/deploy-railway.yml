name: Deploy to Railway

on:
  workflow_call:
    inputs:
      environment:
        description: Railway and GitHub environment to deploy to.
        required: true
        type: string
      commit:
        description: Full commit sha whose images and Railway configuration to deploy.
        required: true
        type: string

permissions:
  contents: read

env:
  NO_COLOR: "1"

jobs:
  deploy:
    name: Railway Deploy (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: railway-deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}

      - uses: ./.github/actions/setup-tools

      - name: Resolve images
        id: images
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          COMMIT: ${{ inputs.commit }}
          REGISTRY: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail

          ui_suffix=""
          if [ "$ENVIRONMENT" = "staging" ]; then
            ui_suffix="-staging"
          fi
          api="$REGISTRY-api:sha-$COMMIT"
          ui="$REGISTRY-ui:sha-$COMMIT$ui_suffix"
          docs="$REGISTRY-docs:sha-$COMMIT$ui_suffix"

          for image in "$api" "$ui" "$docs"; do
            if ! docker manifest inspect "$image" > /dev/null; then
              echo "::error::$image does not exist; only commits built by build.yml can be deployed"
              exit 1
            fi
          done

          {
            echo "api=$api"
            echo "ui=$ui"
            echo "docs=$docs"
          } >> "$GITHUB_OUTPUT"

      - name: Apply
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          DEPLOY_COMMIT: ${{ inputs.commit }}
        run: railway config apply --yes --confirm-destructive

      - name: Wait for API
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          IMAGE: ${{ steps.images.outputs.api }}
        run: mise run railway:wait loco::cp-api "$IMAGE"

      - name: Wait for UI
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          IMAGE: ${{ steps.images.outputs.ui }}
        run: mise run railway:wait loco::cp-ui "$IMAGE"

      - name: Wait for Docs
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          IMAGE: ${{ steps.images.outputs.docs }}
        run: mise run railway:wait loco::cp-docs "$IMAGE"
