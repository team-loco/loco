name: Auth Conformance

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  conformance:
    name: Auth Conformance
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-tools
        with:
          go-cache: auth-conformance

      - name: Run the auth contract against Supabase Auth, Keycloak, Zitadel and Dex
        run: mise run test:auth-conformance
        timeout-minutes: 15

      - name: Run the invitation journey against Dex
        run: mise run test:auth-invitations
        timeout-minutes: 10
