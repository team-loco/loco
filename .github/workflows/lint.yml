name: Lint

on:
  workflow_call:
  push:
    branches:
      - main
      - staging
    paths:
      - "api/**"
      - "cmd/**"
      - "controller/**"
      - "agent/**"
      - "k8sapi/**"
      - "observability-proxy/**"
      - "main.go"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - "Makefile"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "api/**"
      - "cmd/**"
      - "controller/**"
      - "agent/**"
      - "k8sapi/**"
      - "observability-proxy/**"
      - "main.go"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - "Makefile"
      - ".github/workflows/lint.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  golangci:
    name: ${{ matrix.component }} Lint
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - component: API
            working-directory: api

          - component: CLI
            working-directory: "."

          - component: Controller
            working-directory: controller

          - component: Agent
            working-directory: agent

          - component: K8s API
            working-directory: k8sapi

          - component: Observability Proxy
            working-directory: observability-proxy

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: golangci-lint
        env:
          GO_MODULES: ${{ matrix.working-directory }}
        run: make lint-go GO_MODULES="$GO_MODULES"
