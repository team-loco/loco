name: Lint

on:
  workflow_call:
  push:
    branches:
      - main
      - staging
    paths:
      - "api/**"
      - "cmd/**"
      - "controller/**"
      - "agent/**"
      - "k8sapi/**"
      - "observability-proxy/**"
      - "main.go"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - "Makefile"
      - "mise.toml"
      - "mise.lock"
      - ".github/actions/setup-tools/**"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "api/**"
      - "cmd/**"
      - "controller/**"
      - "agent/**"
      - "k8sapi/**"
      - "observability-proxy/**"
      - "main.go"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - "Makefile"
      - "mise.toml"
      - "mise.lock"
      - ".github/actions/setup-tools/**"
      - ".github/workflows/lint.yml"

permissions:
  contents: read

jobs:
  golangci:
    name: ${{ matrix.component }} Lint
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - component: API
            working-directory: api

          - component: CLI
            working-directory: "."

          - component: Controller
            working-directory: controller

          - component: Agent
            working-directory: agent

          - component: K8s API
            working-directory: k8sapi

          - component: Observability Proxy
            working-directory: observability-proxy

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-tools
        with:
          tools: go golangci-lint
          go-cache: lint-${{ matrix.working-directory }}

      - name: golangci-lint
        env:
          GO_MODULES: ${{ matrix.working-directory }}
        run: make lint-go GO_MODULES="$GO_MODULES"
