name: Lint

on:
  workflow_call:
  push:
    branches:
      - main
      - staging
    paths:
      - "api/**"
      - "cmd/**"
      - "controller/**"
      - "agent/**"
      - "k8sapi/**"
      - "observability-proxy/**"
      - "main.go"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - "mise-tasks/lint/go"
      - "mise.toml"
      - "mise.lock"
      - ".github/actions/setup-tools/**"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "api/**"
      - "cmd/**"
      - "controller/**"
      - "agent/**"
      - "k8sapi/**"
      - "observability-proxy/**"
      - "main.go"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - "mise-tasks/lint/go"
      - "mise.toml"
      - "mise.lock"
      - ".github/actions/setup-tools/**"
      - ".github/workflows/lint.yml"
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  golangci:
    name: ${{ matrix.component }} Lint
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - component: API
            working-directory: api

          - component: CLI
            working-directory: "."

          - component: Controller
            working-directory: controller

          - component: Agent
            working-directory: agent

          - component: K8s API
            working-directory: k8sapi

          - component: Observability Proxy
            working-directory: observability-proxy

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-tools
        with:
          go-cache: lint-${{ matrix.working-directory }}

      - name: golangci-lint
        env:
          GO_MODULE: ${{ matrix.working-directory }}
        run: mise run lint:go "$GO_MODULE"
