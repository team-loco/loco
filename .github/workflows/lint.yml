name: Lint

on:
  push:
    branches:
      - main
    paths: &paths
      - "api/**"
      - "cmd/**"
      - "internal/**"
      - "tools/**"
      - "controller/**"
      - "agent/**"
      - "builder/**"
      - "k8sapi/**"
      - "observability-proxy/**"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - "mise-tasks/lint/go"
      - "gen/go/**"
      - ".github/actions/go-changes/**"
      - "mise.toml"
      - "mise.lock"
      - ".github/actions/setup-tools/**"
      - ".github/workflows/lint.yml"
  pull_request:
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Lint Changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.changes.outputs.run }}
      api: ${{ steps.changes.outputs.api }}
      matrix: ${{ steps.changes.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: changes
        uses: ./.github/actions/go-changes
        with:
          matrix: |
            - component: API
              working-directory: api

            - component: CLI
              working-directory: cmd

            - component: Shared packages
              working-directory: "."

            - component: Controller
              working-directory: controller

            - component: Agent
              working-directory: agent

            - component: Builder
              working-directory: builder

            - component: K8s API
              working-directory: k8sapi

            - component: Observability Proxy
              working-directory: observability-proxy

  golangci:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: ${{ matrix.component }} Lint
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-tools
        with:
          go-cache: lint-${{ matrix.working-directory }}
          lint-cache: true

      - name: golangci-lint
        env:
          GO_MODULE: ${{ matrix.working-directory }}
        run: mise run lint:go "$GO_MODULE"
