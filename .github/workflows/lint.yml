name: Lint

on:
  workflow_call:
  push:
    branches:
      - main
      - staging
    paths:
      - "api/**"
      - "cmd/**"
      - "controller/**"
      - "main.go"
      - "go.mod"
      - "go.sum"
      - "**.proto"
      - "**/buf.yaml"
      - "**/buf.lock"
  pull_request:
    # `labeled`/`unlabeled` are required on top of the defaults so that adding or
    # removing the `break-buf` label re-runs this workflow. Without them the
    # label can only take effect on the next push.
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "api/**"
      - "cmd/**"
      - "controller/**"
      - "main.go"
      - "go.mod"
      - "go.sum"
      - "**.proto"
      - "**/buf.yaml"
      - "**/buf.lock"

permissions:
  contents: read
  pull-requests: write

jobs:
  golangci:
    name: ${{ matrix.component }} Lint
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - component: API
            working-directory: api

          - component: CLI
            working-directory: "."

          - component: Controller
            working-directory: controller

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          working-directory: ${{ matrix.working-directory }}
          args: --config=${{ github.workspace }}/.golangci.yml --timeout=5m
  buf:
    name: Buf Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: bufbuild/buf-action@v1
        with:
          token: ${{ secrets.BUF_TOKEN }}
          # Skip the breaking-change check on PRs labelled `break-buf`.
          # NOTE: this must key off the pull_request payload. The previous
          # `github.event.head_commit.message` only exists on push events, so on
          # a PR it was always null and the bypass could never fire.
          breaking: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'break-buf') }}
          breaking_against_registry: true
