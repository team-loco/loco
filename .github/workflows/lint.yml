name: Lint

on:
  workflow_call:
  push:
    branches:
      - main
      - staging
    paths:
      - "api/**"
      - "cmd/**"
      - "controller/**"
      - "agent/**"
      - "k8sapi/**"
      - "observability-proxy/**"
      - "main.go"
      - "go.mod"
      - "go.sum"
  pull_request:
    paths:
      - "api/**"
      - "cmd/**"
      - "controller/**"
      - "agent/**"
      - "k8sapi/**"
      - "observability-proxy/**"
      - "main.go"
      - "go.mod"
      - "go.sum"

permissions:
  contents: read

jobs:
  golangci:
    name: ${{ matrix.component }} Lint
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - component: API
            working-directory: api

          - component: CLI
            working-directory: "."

          - component: Controller
            working-directory: controller

          - component: Agent
            working-directory: agent

          - component: K8s API
            working-directory: k8sapi

          - component: Observability Proxy
            working-directory: observability-proxy

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          working-directory: ${{ matrix.working-directory }}
          args: --config=${{ github.workspace }}/.golangci.yml --timeout=5m
