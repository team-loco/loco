name: Chart Contracts

on:
  pull_request:
    paths:
      - "charts/**"
      - "env/**"
      - "helmfile.yaml.gotmpl"
      - "tests/charts/**"
      - "e2e/certificates.sh"
      - "mise.toml"
      - "mise.lock"
      - ".github/actions/setup-tools/**"
      - ".github/workflows/chart-contracts.yml"
  push:
    branches: [main]
    paths:
      - "charts/**"
      - "env/**"
      - "helmfile.yaml.gotmpl"
      - "tests/charts/**"
      - "e2e/certificates.sh"
      - "mise.toml"
      - "mise.lock"
      - ".github/actions/setup-tools/**"
      - ".github/workflows/chart-contracts.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-tools
      - run: mise run test:chart-contracts

  certificates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-tools
      - run: mise run e2e:certificates
