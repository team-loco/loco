name: Chart Contracts

on:
  pull_request:
    paths:
      - "tests/pyproject.toml"
      - "tests/uv.lock"
      - "charts/**"
      - "env/**"
      - "mise-tasks/helm/**"
      - "tests/charts/**"
      - "tests/collector/**"
      - "e2e/certificates.sh"
      - "e2e/control-plane.sh"
      - "controller/config/crd/**"
      - "mise-tasks/crds/**"
      - "e2e/control-plane-values.yaml"
      - "e2e/api-failover.py"
      - "e2e/cluster-metrics.py"
      - "e2e/fixtures/api-failover/**"
      - "e2e/fixtures/control-plane/**"
      - "mise.toml"
      - "mise.lock"
      - ".github/actions/setup-tools/**"
      - ".github/workflows/chart-contracts.yml"
  push:
    branches: [main]
    paths:
      - "tests/pyproject.toml"
      - "tests/uv.lock"
      - "charts/**"
      - "env/**"
      - "mise-tasks/helm/**"
      - "tests/charts/**"
      - "tests/collector/**"
      - "e2e/certificates.sh"
      - "e2e/control-plane.sh"
      - "controller/config/crd/**"
      - "mise-tasks/crds/**"
      - "e2e/control-plane-values.yaml"
      - "e2e/api-failover.py"
      - "e2e/cluster-metrics.py"
      - "e2e/fixtures/api-failover/**"
      - "e2e/fixtures/control-plane/**"
      - "mise.toml"
      - "mise.lock"
      - ".github/actions/setup-tools/**"
      - ".github/workflows/chart-contracts.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-tools
      - run: mise run test:chart-contracts
      - run: mise run test:collector-logs

  certificates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-tools
      - run: mise run e2e:certificates

  control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-tools
      - run: mise run e2e:control-plane
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: control-plane-evidence
          path: |
            e2e/runs/loco-cp-*/diagnostics.txt
            e2e/runs/loco-cp-*/postgres-migrations.txt
            e2e/runs/loco-cp-*/observability.json
            e2e/runs/loco-cp-*/config.json

  cluster-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-tools
      - run: mise run e2e:cluster-metrics
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cluster-metrics-evidence
          path: |
            e2e/runs/loco-metrics-*/result.txt
            e2e/runs/loco-metrics-*/diagnostics.txt
