name: Config E2E

on:
  pull_request:
    paths:
      - "agent/**"
      - "builder/**"
      - "controller/**"
      - "k8sapi/**"
      - "proto/**"
      - "api/main.go"
      - "api/migrations/**"
      - "api/queries/**"
      - "api/service/**"
      - "api/pkg/**"
      - "charts/loco-worker/**"
      - "manifests/namespaces/**"
      - "dev/compose.yaml"
      - "dev/registry/**"
      - "mise-tasks/cluster/registry"
      - "mise-tasks/cluster/build-egress"
      - "tests/e2e/**"
      - "mise-tasks/e2e/**"
      - "mise-tasks/crds/**"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "mise.toml"
      - "mise.lock"
      - ".github/actions/setup-tools/**"
      - ".github/workflows/e2e-config.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  e2e:
    name: Config E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-tools
        with:
          go-cache: e2e

      - name: Run the loco.yaml end-to-end tests
        run: ./tests/e2e/run.sh --no-teardown config_apply
