name: Config E2E

on:
  pull_request:
    paths:
      - "agent/**"
      - "builder/**"
      - "controller/**"
      - "k8sapi/**"
      - "proto/**"
      - "api/main.go"
      - "api/migrations/**"
      - "api/queries/**"
      - "api/service/**"
      - "api/pkg/**"
      - "charts/loco-operator/**"
      - "compose.yaml"
      - "registry/local/**"
      - "mise-tasks/cluster/registry"
      - "mise-tasks/cluster/build-egress"
      - "e2e/**"
      - "cmd/loco/**"
      - "internal/**"
      - "main.go"
      - "go.mod"
      - "go.sum"
      - "mise.toml"
      - "mise.lock"
      - ".github/actions/setup-tools/**"
      - ".github/actions/merge-queue-changes/**"
      - ".github/workflows/e2e-config.yml"
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Config E2E Changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: changes
        uses: ./.github/actions/merge-queue-changes

  e2e:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Config E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-tools
        with:
          go-cache: e2e-config

      - name: Run the loco.yaml end-to-end tests
        run: ./e2e/run.sh --no-teardown config_apply
