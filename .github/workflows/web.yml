name: Web

on:
  workflow_call:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "gen/ts/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/web.yml"
      - "mise.toml"
      - "mise.lock"
      - ".github/actions/setup-tools/**"
  pull_request:
    paths:
      - "web/**"
      - "gen/ts/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/web.yml"
      - "mise.toml"
      - "mise.lock"
      - ".github/actions/setup-tools/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  build:
    name: Web Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-tools

      # Install from the repository root: web and gen/ts are bun workspaces, and
      # the UI imports generated TypeScript from gen/ts.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # This is the gate that matters: `bun run build` is `bun check && vite
      # build`, the exact command web/Dockerfile runs. If it fails here, the UI
      # image cannot be built and a deploy would fail.
      - name: Build
        working-directory: web
        run: bun run build

      - name: Lint
        run: mise run lint:web

      - name: Test
        run: mise run test:web
