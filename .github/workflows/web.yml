name: Web

on:
  workflow_call:

permissions:
  contents: read

jobs:

  checks:
    name: Web Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-tools

      # Install from the repository root: web and gen/ts are bun workspaces, and
      # the UI imports generated TypeScript from gen/ts.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # This is the gate that matters: `bun run build` is `bun check && bun
      # build.ts`, the exact command web/Dockerfile runs. If it fails here, the UI
      # image cannot be built and a deploy would fail.
      - name: Build
        working-directory: web
        run: bun run build

      - name: Lint
        run: mise run lint:web

      - name: Test
        run: mise run test:web

      - name: Test install script
        run: mise run test:install

  # Each shard builds the API and UI once and runs its suites one after another;
  # suites running side by side on one runner miss their timing bounds.
  browser:
    name: Web Browser ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-tools
        with:
          go-cache: web

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(uv run --frozen --project docs python -c 'from importlib.metadata import version; print(version("playwright"))')" >> "$GITHUB_OUTPUT"

      # Saved only on main, the one ref whose caches pull requests can restore.
      - if: github.ref == 'refs/heads/main'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Installs the system libraries even when the browser came from the cache.
      - name: Install browser
        run: uv run --frozen --project docs playwright install --with-deps chromium

      - name: Test screenshot readiness and the UI server
        if: matrix.shard == 1
        run: uv run --frozen --project docs pytest .agents/skills/ui-evidence/scripts/test_evidence.py

      - name: Test the dashboard suites
        timeout-minutes: 30
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: mise run test:ui --shard "$SHARD"

      - name: Upload dashboard suite evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-evidence-${{ matrix.shard }}
          path: tests/ui/out
          if-no-files-found: warn
