name: Web

on:
  workflow_call:

permissions:
  contents: read

jobs:

  build:
    name: Web Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-tools

      # Install from the repository root: web and gen/ts are bun workspaces, and
      # the UI imports generated TypeScript from gen/ts.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # This is the gate that matters: `bun run build` is `bun check && bun
      # build.ts`, the exact command web/Dockerfile runs. If it fails here, the UI
      # image cannot be built and a deploy would fail.
      - name: Build
        working-directory: web
        run: bun run build

      - name: Lint
        run: mise run lint:web

      - name: Test
        run: mise run test:web

      - name: Test install script
        run: mise run test:install

      - name: Install browser
        run: uv run --frozen --project docs playwright install --with-deps chromium

      - name: Test trace viewer in Chromium
        run: mise run e2e:trace-ui

      - name: Test scoped Activity in Chromium
        run: mise run e2e:activity-ui

      - name: Upload Activity browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: activity-ui-evidence
          path: tests/e2e/out/activity-ui
          if-no-files-found: warn

      - name: Upload trace viewer browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trace-ui-evidence
          path: tests/e2e/out/trace-ui
          if-no-files-found: warn

      - name: Test settings field labels in Chromium
        run: mise run e2e:settings-labels

      - name: Upload settings field evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: settings-field-evidence
          path: tests/e2e/out/settings-labels
          if-no-files-found: warn

      - name: Test deployment history in Chromium
        timeout-minutes: 15
        run: mise run e2e:deployment-history

      - name: Upload deployment-history browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-history-evidence
          path: tests/e2e/out/deployment-history
          if-no-files-found: warn
          retention-days: 7
