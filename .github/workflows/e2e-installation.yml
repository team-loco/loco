name: Installation E2E

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  installation:
    name: Installation E2E
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-tools
        with:
          go-cache: e2e
      - name: Test installation runner failure and cleanup behavior
        run: mise run test:e2e-installation-runner
      # The fixture images reuse the layers build.yml caches on main. Run steps
      # reach that cache only through the runtime variables the second action
      # exports. The suite points DOCKER_CONFIG at its own directory, so the
      # builder's state lives in BUILDX_CONFIG instead.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        env:
          BUILDX_CONFIG: ${{ runner.temp }}/buildx
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Install, bootstrap, enroll and deploy through the public commands
        env:
          BUILDX_CONFIG: ${{ runner.temp }}/buildx
        run: mise run e2e:installation -ci-cache
