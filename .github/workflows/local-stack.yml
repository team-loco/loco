name: Local Stack

on:
  pull_request:
    paths: &paths
      - "tests/pyproject.toml"
      - "tests/uv.lock"
      - "dev/stack.sh"
      - "dev/api.env"
      - "tests/stack/**"
      - "mise-tasks/helm/**"
      - "dev/worker-chart.yaml"
      - "charts/**"
      - ".github/workflows/local-stack.yml"
  push:
    branches: [main]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-tools
      - run: mise run test:stack
