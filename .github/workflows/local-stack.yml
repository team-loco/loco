name: Local Stack

on:
  pull_request:
    paths:
      - "pytest.ini"
      - "tests/pyproject.toml"
      - "tests/uv.lock"
      - "env/local/stack.sh"
      - "mise-tasks/cluster/lb-range"
      - "tests/stack/**"
      - ".github/workflows/local-stack.yml"
  push:
    branches: [main]
    paths:
      - "pytest.ini"
      - "tests/pyproject.toml"
      - "tests/uv.lock"
      - "env/local/stack.sh"
      - "mise-tasks/cluster/lb-range"
      - "tests/stack/**"
      - ".github/workflows/local-stack.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-tools
      - run: mise run test:stack
