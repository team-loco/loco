name: OSV

on:
  pull_request:
    paths:
      - "**/Dockerfile"
      - "**/go.mod"
      - "**/go.sum"
      - "**/package.json"
      - "bun.lock"
      - ".github/workflows/osv.yml"
  push:
    branches:
      - main
    paths:
      - "**/Dockerfile"
      - "**/go.mod"
      - "**/go.sum"
      - "**/package.json"
      - "bun.lock"
      - ".github/workflows/osv.yml"
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source:
    name: Source
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      scan-args: |-
        --recursive
        --experimental-exclude=examples
        ./

  source-baseline:
    name: Source Baseline
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      scan-args: |-
        --recursive
        --experimental-exclude=examples
        ./
      fail-on-vuln: false

  changes:
    name: Detect Changed Images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.filter.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Filter
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request)
              FILES=$(git diff --name-only "$BASE...$HEAD") ;;
            push)
              if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
                FILES=$(git ls-files)
              else
                FILES=$(git diff --name-only "$BEFORE" "$AFTER")
              fi ;;
            *)
              FILES=$(git ls-files) ;;
          esac
          echo "changed files:"
          echo "$FILES"

          sel=()
          add() { grep -qE "$2" <<<"$FILES" && sel+=("$1") || true; }

          # an image is rescanned when its own tree, its Dockerfile, or a module
          # graph it compiles against moves
          add '"controller"' '^(controller/|k8sapi/)'
          add '"api"' '^(api/|gen/go/|internal/buildinfo/|go\.mod$|go\.sum$|k8sapi/)'
          add '"agent"' '^(agent/|gen/go/|internal/buildinfo/|go\.mod$|go\.sum$|k8sapi/)'
          add '"builder"' '^builder/'
          add '"observability-proxy"' '^(observability-proxy/|gen/go/|internal/buildinfo/|go\.mod$|go\.sum$)'
          add '"ui"' '^(web/|gen/ts/|package\.json$|bun\.lock$)'

          printf 'images=[%s]\n' "$(IFS=,; echo "${sel[*]-}")" >> "$GITHUB_OUTPUT"

  image:
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: ./.github/actions/setup-tools

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image == 'ui' && './web/Dockerfile' || format('./{0}/Dockerfile', matrix.image) }}
          push: false
          load: true
          tags: loco-${{ matrix.image }}:osv
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # scanning the exported archive keeps osv-scanner out of the docker socket
      - name: Scan image
        run: |
          set -euo pipefail
          docker save "loco-${{ matrix.image }}:osv" -o /tmp/image.tar
          set +e
          osv-scanner scan image --archive /tmp/image.tar \
            --format sarif --output-file /tmp/osv-image.sarif
          code=$?
          set -e
          if [ "$code" -eq 128 ]; then
            echo "no package sources in this image; uploading an empty result"
            cat > /tmp/osv-image.sarif <<'SARIF'
          {
            "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
            "version": "2.1.0",
            "runs": [
              {
                "tool": {
                  "driver": {
                    "name": "osv-scanner",
                    "informationUri": "https://github.com/google/osv-scanner",
                    "rules": []
                  }
                },
                "results": []
              }
            ]
          }
          SARIF
            exit 0
          fi
          if [ "$code" -gt 1 ]; then
            exit "$code"
          fi

      - name: Upload results
        if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: /tmp/osv-image.sarif
          category: osv-image-${{ matrix.image }}
