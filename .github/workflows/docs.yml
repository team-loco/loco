name: Documentation

on:
  workflow_call:

permissions:
  contents: read

jobs:

  docs:
    name: Documentation Build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      MISE_ENABLE_TOOLS: bun,uv,python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The Pages build reads the content of the release tags.
          fetch-depth: 0
      - uses: ./.github/actions/setup-tools
      - run: bun install --frozen-lockfile
      - run: bun run --cwd docs typecheck
      - name: Build the staging dashboard mount
        run: mise run docs:build:staging
      - uses: ./.github/actions/setup-playwright
      - name: Build and check the docs.loco.build artifact
        run: mise run test:pages
