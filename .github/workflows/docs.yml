name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - "tests/pyproject.toml"
      - "tests/uv.lock"
      - "docs/**"
      - "web/**"
      - "gen/ts/**"
      - "schemas/loco.v1.json"
      - "package.json"
      - "bun.lock"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/docs.yml"
      - ".github/actions/setup-tools/**"
  pull_request:
    paths:
      - "tests/pyproject.toml"
      - "tests/uv.lock"
      - "docs/**"
      - "web/**"
      - "gen/ts/**"
      - "schemas/loco.v1.json"
      - "package.json"
      - "bun.lock"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/docs.yml"
      - ".github/actions/setup-tools/**"
  workflow_call:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  docs:
    name: Documentation Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-tools
      - name: Test production and staging builds
        run: mise run test:docs
      - name: Install browser
        run: uv run --frozen --project docs playwright install --with-deps chromium
      - name: Check navigation, search and page actions
        env:
          DOCS_SCREENSHOT_DIR: ${{ runner.temp }}/docs-screenshots
        run: mise run docs:check:browser
      - name: Save theme screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-screenshots
          path: ${{ runner.temp }}/docs-screenshots
          if-no-files-found: ignore

  container:
    name: Documentation Container Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-tools
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install browser
        run: uv run --frozen --project docs playwright install --with-deps chromium
      - name: Check shared UI and docs hosting
        env:
          DOCS_SCREENSHOT_DIR: ${{ runner.temp }}/hosted-docs-screenshots
        run: mise run docs:check:container
      - name: Save hosted documentation screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-docs-screenshots
          path: ${{ runner.temp }}/hosted-docs-screenshots
          if-no-files-found: ignore
