name: Build and Deploy to Staging

on:
  push:
    branches:
      - staging

env:
  REGISTRY: ghcr.io
  DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_PAT }}

jobs:
  test:
    name: Run Tests
    uses: ./.github/workflows/test.yml

  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      controller: ${{ steps.filter.outputs.controller }}
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      agent: ${{ steps.filter.outputs.agent }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Filter
        id: filter
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            FILES=$(git ls-files)
          else
            FILES=$(git diff --name-only "$BEFORE" "$AFTER")
          fi
          echo "changed files:"
          echo "$FILES"

          match() { echo "$FILES" | grep -qE "$1" && echo true || echo false; }

          {
            echo "controller=$(match '^(controller/|shared/|go\.(mod|sum)$)')"
            echo "api=$(match '^(api/|shared/|proto/|go\.(mod|sum)$)')"
            echo "web=$(match '^(web/|gen/ts/|package\.json$|bun\.lock$)')"
            echo "agent=$(match '^(agent/|k8sapi/|go\.(mod|sum)$)')"
          } >> "$GITHUB_OUTPUT"

  push-controller-image:
    name: Build and Push Controller Image (RC)
    needs: [test, changes]
    if: needs.changes.outputs.controller == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-push.yml
    with:
      image_name: ${{ github.repository }}-controller
      context: ./controller
      dockerfile: ./controller/Dockerfile

  push-api-image:
    name: Build and Push API Image (RC)
    needs: [test, changes]
    if: needs.changes.outputs.api == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-push.yml
    with:
      image_name: ${{ github.repository }}-api
      context: .
      dockerfile: ./api/Dockerfile

  push-ui-image:
    name: Build and Push UI Image (RC)
    needs: [test, changes]
    if: needs.changes.outputs.web == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-push.yml
    with:
      image_name: ${{ github.repository }}-ui
      context: .
      dockerfile: ./web/Dockerfile
      build_args: |
        VITE_API_URL=${{ vars.VITE_API_URL_STAGING || 'https://api.deploy-app.com' }}
        VITE_APP_ENV=STAGING

  push-agent-image:
    name: Build and Push Agent Image (RC)
    needs: [test, changes]
    if: needs.changes.outputs.agent == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-push.yml
    with:
      image_name: ${{ github.repository }}-agent
      context: ./agent
      dockerfile: ./agent/Dockerfile

  deploy-staging:
    name: Deploy to Staging
    needs:
      - push-api-image
      - push-controller-image
      - push-ui-image
      - push-agent-image
    runs-on: ubuntu-latest
    environment: staging
    if: always()

    env:
      API_IMAGE: ${{ needs.push-api-image.outputs.image }}
      CONTROLLER_IMAGE: ${{ needs.push-controller-image.outputs.image }}
      UI_IMAGE: ${{ needs.push-ui-image.outputs.image }}
      AGENT_IMAGE: ${{ needs.push-agent-image.outputs.image }}
      CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
      GITLAB_PAT: ${{ secrets.GITLAB_PAT }}
      GITLAB_PROJECT_ID: ${{ secrets.GITLAB_PROJECT_ID }}
      GITLAB_TOKEN_NAME: ${{ secrets.GITLAB_TOKEN_NAME }}
      GITLAB_URL: ${{ secrets.GITLAB_URL }}
      GITLAB_REGISTRY_URL: ${{ secrets.GITLAB_REGISTRY_URL }}
      GITLAB_DEPLOY_TOKEN_NAME: ${{ secrets.GITLAB_DEPLOY_TOKEN_NAME }}
      GH_OAUTH_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
      GH_OAUTH_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
      GH_OAUTH_STATE: ${{ secrets.GH_OAUTH_STATE }}
      APP_ENV: ${{ secrets.APP_ENV }}
      LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
      PORT: ${{ secrets.PORT }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GH_SHA: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_PAT }}

      - name: Get kubeconfig
        run: doctl kubernetes cluster kubeconfig save loco-cluster

      - name: Verify cluster access
        run: kubectl get nodes

      - name: Setup Helm
        uses: azure/setup-helm@v5.0.1

      - name: Add Helm repositories
        run: |
          helm repo add jetstack https://charts.jetstack.io
          helm repo add cilium https://helm.cilium.io
          helm repo add altinity https://helm.altinity.com
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm repo update

      - name: Build Helm dependencies
        run: |
          helm dependency build ./charts/loco-core
          helm dependency build ./charts/loco-controller
          helm dependency build ./charts/loco-obs
          helm dependency build ./charts/loco-networking

      - name: Helm dry-run
        run: helmfile -e staging diff

      - name: Deploy to Staging
        run: helmfile -e staging sync

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/loco-api -n loco-core --timeout=5m || true
          kubectl rollout status deployment/loco-controller -n loco-controller --timeout=5m || true
          kubectl rollout status deployment/loco-ui -n loco-core --timeout=5m || true

      - name: Smoke tests
        run: |
          API_POD=$(kubectl get pod -n loco-core -l app=loco-api -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
          if [ -n "$API_POD" ]; then
            kubectl exec -n loco-core $API_POD -- curl -f http://localhost:8000/health || true
          fi
