name: Evidence
run-name: Evidence ${{ github.sha }} ${{ inputs.key }}

# Runs dashboard suites and before/after screenshots for a branch on request; `mise run ci:evidence` dispatches it.
# The run name carries the head commit SHA and `key`, a hash of the other inputs, so `ci:evidence` can find a run it would repeat.
on:
  workflow_dispatch:
    inputs:
      suites:
        description: Space-separated tests/ui suites, as `mise run test:ui` names them
        type: string
        default: ""
      shots:
        description: Shot spec JSON in the ui-evidence skill's format
        type: string
        default: ""
      scenario:
        description: Scenario JSON for the shots; the ui-evidence skill's example scenario when empty
        type: string
        default: ""
      base:
        description: Branch or commit the before screenshots build
        type: string
        default: main
      key:
        description: Hash of the other inputs, set by `mise run ci:evidence`
        type: string
        default: ""

permissions:
  contents: read

jobs:
  evidence:
    name: Evidence
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check the inputs
        env:
          SUITES: ${{ inputs.suites }}
          SHOTS: ${{ inputs.shots }}
        run: |
          if [[ -z ${SUITES// } && -z $SHOTS ]]; then
            echo "::error::Give suites, shots or both"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/evidence"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-tools
        with:
          go-cache: web
          image-cache: true

      - uses: ./.github/actions/setup-playwright

      - name: Run the suites
        if: inputs.suites != ''
        timeout-minutes: 30
        env:
          SUITES: ${{ inputs.suites }}
        run: |
          set -o pipefail
          read -ra suites <<<"$SUITES"
          mise run test:ui "${suites[@]}" 2>&1 | tee "$RUNNER_TEMP/evidence/suites.log"

      - name: Take the screenshots
        if: ${{ !cancelled() && inputs.shots != '' }}
        timeout-minutes: 30
        env:
          SHOTS: ${{ inputs.shots }}
          SCENARIO: ${{ inputs.scenario }}
          BASE: ${{ inputs.base }}
        run: |
          input=$RUNNER_TEMP/evidence-input
          mkdir -p "$input"
          printf '%s\n' "$SHOTS" > "$input/shots.json"
          if [[ -n $SCENARIO ]]; then
            printf '%s\n' "$SCENARIO" > "$input/scenario.json"
          else
            cp .agents/skills/ui-evidence/scenario.example.json "$input/scenario.json"
          fi
          base=$(git rev-parse --verify --quiet "origin/$BASE^{commit}" || git rev-parse --verify "$BASE^{commit}")
          echo "Before: $BASE at $base; after: $GITHUB_REF_NAME at $(git rev-parse HEAD)" | tee "$RUNNER_TEMP/evidence/refs.txt"
          evidence=(uv run --frozen --project "$GITHUB_WORKSPACE/tests" python "$GITHUB_WORKSPACE/tests/ui/evidence.py")
          before=$("${evidence[@]}" up --ref "$base" --name before --scenario "$input/scenario.json")
          after=$("${evidence[@]}" up --ref HEAD --name after --scenario "$input/scenario.json")
          "${evidence[@]}" shoot --state "$before" --spec "$input/shots.json" --out "$RUNNER_TEMP/evidence/evidence"
          "${evidence[@]}" shoot --state "$after" --spec "$input/shots.json" --out "$RUNNER_TEMP/evidence/evidence"
          cd "$RUNNER_TEMP/evidence"
          "${evidence[@]}" table --out evidence > evidence.md

      - name: Collect the suite output
        if: ${{ always() && inputs.suites != '' }}
        run: |
          if [[ -d tests/ui/out ]]; then cp -R tests/ui/out "$RUNNER_TEMP/evidence/suites"; fi

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn
