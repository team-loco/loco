name: E2E
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collector-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-tools
      - name: Run tenancy integration fixture
        run: mise run test:obs-tenancy
