name: E2E

on:
  workflow_call:
    inputs:
      images:
        description: Prebuilt images, with * standing for the image name; empty builds them here.
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

env:
  E2E_RUN_ID: ci
  E2E_IMAGES: ${{ inputs.images }}
  E2E_VERSION: ${{ inputs.images != '' && format('sha-{0}', github.sha) || 'e2e' }}

jobs:

  # Each shard is one tests/e2e package: one install that its tests share, each in its own
  # organization and workspace.
  shard:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Repeated rollback
            shard: apps
            tests: "^TestFailedDeploymentRollsBack$"
          - name: Repeated ingress
            shard: apps
            tests: "^TestIngress$"
          - name: Repeated port rollout
            shard: apps
            tests: "^TestPortRollout$"
          - name: Repeated resource status
            shard: apps
            tests: "^TestResourceStatus$"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-tools
        with:
          go-cache: e2e

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: inputs.images != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The runner is discarded with the run, so --keep skips the teardown.
      - name: Run the shard
        env:
          SHARD: ${{ matrix.shard }}
          TESTS: ${{ matrix.tests }}
          E2E_KEEP: "true"
        run: mise exec -- go -C tests/e2e test -v -count=2 -timeout 60m "./$SHARD" -run "$TESTS"
