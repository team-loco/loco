name: E2E
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collector-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-tools
      - run: mise run helm:deps
      - name: Prove broken workspace attribution
        run: |
          set +e
          mise exec -- uv run --locked --project tests pytest -s tests/collector/test_namespace_tenancy.py
          result=$?
          test "$result" = 1
      - name: Remove namespace suffix as workspace ID
        run: |
          sed -i '/&setWorkspace set(attributes/d; /- *setWorkspace/d' charts/loco-worker/values.yaml
      - name: Prove namespace label enrichment
        run: mise exec -- uv run --locked --project tests pytest -s tests/collector/test_namespace_tenancy.py
