# Publishes the image CI built and tested for this commit, tagged ci-<commit>,
# as sha-<commit>, then verifies and attests each platform and the index.
name: Publish a Docker image

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      tag_suffix:
        required: false
        type: string
        default: ""
    outputs:
      image:
        description: "Full image tag"
        value: ${{ jobs.publish.outputs.image }}

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tag moves by digest to the index CI built. A push runs Docker, Charts
      # and OSV on it when its files select them; e2e tests a pull request's amd64 build.
      - name: Tag the tested image
        id: push
        env:
          REPOSITORY: ${{ env.REGISTRY }}/${{ inputs.image_name }}
          SOURCE: ci-${{ github.sha }}${{ inputs.tag_suffix }}
          TAG: sha-${{ github.sha }}${{ inputs.tag_suffix }}
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "$REPOSITORY:$SOURCE" --format '{{json .Manifest}}' | jq -r .digest)
          docker buildx imagetools create --tag "$REPOSITORY:$TAG" "$REPOSITORY@$digest"
          published=$(docker buildx imagetools inspect "$REPOSITORY:$TAG" --format '{{json .Manifest}}' | jq -r .digest)
          if [ "$published" != "$digest" ]; then
            echo "::error::$REPOSITORY:$TAG is $published, not the tested $digest"
            exit 1
          fi
          echo "image=$REPOSITORY:$TAG" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  verify-platform:
    needs: publish
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the Container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve and verify platform image
        id: platform
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ inputs.image_name }}@${{ needs.publish.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker buildx imagetools inspect "$IMAGE" --raw > image-index.json
          image=$(python3 tools/platform-images/verify.py resolve "$IMAGE" "$PLATFORM" image-index.json)
          docker pull "$image"
          python3 tools/platform-images/verify.py image "$image" "$PLATFORM"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=${image##*@}" >> "$GITHUB_OUTPUT"

      - name: Attest platform build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ inputs.image_name }}
          subject-digest: ${{ steps.platform.outputs.digest }}
          push-to-registry: true

      # Install separately so a transient release download can retry without
      # repeating the scan or allowing a missing SBOM through attestation.
      - name: Install Syft
        id: syft
        continue-on-error: true
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Wait before retrying Syft installation
        if: steps.syft.outcome == 'failure'
        run: sleep 10

      - name: Retry Syft installation
        if: steps.syft.outcome == 'failure'
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Generate platform SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.platform.outputs.image }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false

      - name: Attest platform SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ inputs.image_name }}
          subject-digest: ${{ steps.platform.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true

  attest-index:
    needs: [publish, verify-platform]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to the Container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest verified image index
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ inputs.image_name }}
          subject-digest: ${{ needs.publish.outputs.digest }}
          push-to-registry: true
