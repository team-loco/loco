name: Dependency Checks

on:
  schedule:
    # Mon & Thu, 09:00 UTC
    - cron: "0 9 * * 1,4"
  workflow_dispatch: {}

jobs:
  chartbump:
    name: Bump Helm chart dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Add Helm repos
        run: make helm-repos

      - name: Install chartbump
        run: |
          set -euo pipefail
          latest_url=$(gh release view --repo nikumar1206/chartbump --json assets \
            -q '.assets[] | select(.name | test("linux_amd64")) | .url')
          curl --fail --location --silent --show-error -o /tmp/chartbump.tar.gz "$latest_url"
          mkdir -p /tmp/chartbump
          tar -xzf /tmp/chartbump.tar.gz -C /tmp/chartbump
          chmod +x /tmp/chartbump/chartbump
          echo "/tmp/chartbump" >> "$GITHUB_PATH"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run chartbump
        run: chartbump -charts ./charts

      - name: Open pull request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(charts): bump helm chart dependencies"
          branch: automation/chartbump
          title: "chore(charts): automated helm chart dependency bump"
          body: |
            Automated by [chartbump](https://github.com/nikumar1206/chartbump), run from the
            twice-weekly `Dependency Checks` workflow.

            chartbump always jumps to the newest available version, including majors --
            review the `Chart.yaml`/`Chart.lock` diff and upstream release notes before
            merging, and run `helm template`/`helm lint` on any changed chart.
          delete-branch: true
          labels: dependencies

  go-mod-report:
    name: Report Go module updates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Check for available updates
        run: ./scripts/check-go-mod-updates.sh /tmp/report.md

      - name: Open or update tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="Go module updates available"
          body_file=/tmp/issue-body.md
          {
            echo "_Automated report from the twice-weekly \`Dependency Checks\` workflow._"
            echo "_Report-only: nothing here is applied automatically. Major bumps in particular usually need source changes (import path, API surface) -- see how \`fang\`/\`log\` v1->v2 were done as an example._"
            echo ""
            cat /tmp/report.md
          } > "$body_file"

          existing=$(gh issue list --search "in:title \"$title\" is:open" --json number -q '.[0].number' || true)
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file "$body_file"
          else
            gh issue create --title "$title" --body-file "$body_file" --label dependencies
          fi
