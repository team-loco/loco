name: Tests

on:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - "cmd/**"
      - "internal/**"
      - "tools/**"
      - "controller/**"
      - "agent/**"
      - "builder/**"
      - "observability-proxy/**"
      - "k8sapi/**"
      - "controller/Makefile"
      - "mise-tasks/test/obs-proxy"
      - "charts/loco-obs/values.yaml"
      - "go.mod"
      - "go.sum"
      - "gen/go/**"
      - ".github/actions/go-changes/**"
      - "mise.toml"
      - "mise.lock"
      - ".github/actions/setup-tools/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "api/**"
      - "cmd/**"
      - "internal/**"
      - "tools/**"
      - "controller/**"
      - "agent/**"
      - "builder/**"
      - "observability-proxy/**"
      - "k8sapi/**"
      - "controller/Makefile"
      - "mise-tasks/test/obs-proxy"
      - "charts/loco-obs/values.yaml"
      - "go.mod"
      - "go.sum"
      - "gen/go/**"
      - ".github/actions/go-changes/**"
      - "mise.toml"
      - "mise.lock"
      - ".github/actions/setup-tools/**"
      - ".github/workflows/test.yml"
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Tests Changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.changes.outputs.run }}
      api: ${{ steps.changes.outputs.api }}
      matrix: ${{ steps.changes.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: changes
        uses: ./.github/actions/go-changes
        with:
          matrix: |
            - component: CLI
              working-directory: "."
              test-command: mise run test:cli
              timeout: 10

            - component: Controller
              working-directory: controller
              test-command: mise run test:controller
              timeout: 10

            - component: Agent
              working-directory: agent
              test-command: mise run test:agent
              timeout: 10

            - component: Builder
              working-directory: builder
              test-command: mise run test:builder
              timeout: 10

            - component: Observability proxy
              working-directory: observability-proxy
              test-command: mise run test:counter-metrics
              timeout: 10

            - component: K8s API
              working-directory: k8sapi
              test-command: mise run test:k8sapi
              timeout: 10

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    name: API Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: loco_test
          POSTGRES_PASSWORD: loco_test
          POSTGRES_DB: loco_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loco_test -d loco_test"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30

      valkey:
        image: valkey/valkey:8.1.10-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30

    env:
      LOCO_TEST_DATABASE_URL: postgres://loco_test:loco_test@localhost:5432/loco_test?sslmode=disable
      LOCO_TEST_VALKEY_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-tools
        with:
          go-cache: test-api

      - name: Run tests
        run: mise run test:api
        timeout-minutes: 10

      - name: Display coverage
        if: always()
        run: cd api && go tool cover -func=coverage.out

  test:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: ${{ matrix.component }} Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-tools
        with:
          go-cache: test-${{ matrix.working-directory }}

      - name: Tidy dependencies
        if: matrix.component == 'Controller'
        run: cd ${{ matrix.working-directory }} && go mod tidy

      - name: Run tests
        run: ${{ matrix.test-command }}
        timeout-minutes: ${{ matrix.timeout }}

      - name: Display coverage
        if: always() && matrix.component == 'CLI'
        run: cd ${{ matrix.working-directory }} && go tool cover -func=coverage.out
