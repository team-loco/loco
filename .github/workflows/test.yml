name: Tests

on:
  push:
    branches:
      - main
      - staging
    paths:
      - "api/**"
      - "cmd/**"
      - "controller/**"
      - "agent/**"
      - "main.go"
      - "go.mod"
      - "go.sum"
      - "mise.toml"
      - "mise.lock"
      - ".github/actions/setup-tools/**"
  pull_request:
    paths:
      - "api/**"
      - "cmd/**"
      - "controller/**"
      - "agent/**"
      - "main.go"
      - "go.mod"
      - "go.sum"
      - "mise.toml"
      - "mise.lock"
      - ".github/actions/setup-tools/**"
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.component }} Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        include:
          - component: API
            working-directory: api
            test-command: mise run test:api
            timeout: 10

          - component: CLI
            working-directory: "."
            test-command: mise run test:cli
            timeout: 10

          - component: Controller
            working-directory: controller
            test-command: mise run test:controller
            timeout: 10

          - component: Agent
            working-directory: agent
            test-command: mise run test:agent
            timeout: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-tools
        with:
          go-cache: test-${{ matrix.working-directory }}

      - name: Tidy dependencies
        if: matrix.component == 'Controller'
        run: cd ${{ matrix.working-directory }} && go mod tidy

      - name: Run tests
        run: ${{ matrix.test-command }}
        timeout-minutes: ${{ matrix.timeout }}

      - name: Display coverage
        if: always() && matrix.component != 'Controller' && matrix.component != 'Agent'
        run: cd ${{ matrix.working-directory }} && go tool cover -func=coverage.out
