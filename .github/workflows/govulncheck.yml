name: Go Vulnerabilities

on:
  workflow_call:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: Reachable Go Vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-tools
        with:
          go-cache: govulncheck
          save-go-modules: true

      - name: Test scanner task
        run: mise run test:govulncheck

      - name: Scan every Go module
        run: mise run lint:govulncheck
