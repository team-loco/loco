name: Docker

on:
  push:
    branches:
      - main
    paths:
      - "tests/pyproject.toml"
      - "tests/uv.lock"
      - "**/Dockerfile"
      - "**/*.dockerignore"
      - "**/*compose*.yaml"
      - "**/*compose*.yml"
      - ".github/workflows/docker.yml"
      - "mise-tasks/lint/versions"
      - "mise-tasks/test/platform-binaries"
      - "tools/platform-images/**"
      - "tests/versions/**"
      - "mise.toml"
      - "mise.lock"
      - "docs/pyproject.toml"
      - "bunfig.toml"
      - "renovate.json5"
      - ".github/actions/setup-tools/**"
      - "api/**"
      - "agent/**"
      - "builder/**"
      - "controller/**"
      - "observability-proxy/**"
      - "k8sapi/**"
      - "internal/**"
      - "gen/go/**"
      - "gen/ts/**"
      - "web/**"
      - "go.mod"
      - "go.sum"
      - "package.json"
      - "bun.lock"
      - "docs/uv.lock"
      - "docs/zensical.toml"
      - "docs/scripts/**"
      - "docs/content/**"
      - "docs/overrides/**"
      - "schemas/loco.v1.json"
  pull_request:
    paths:
      - "tests/pyproject.toml"
      - "tests/uv.lock"
      - "**/Dockerfile"
      - "**/*.dockerignore"
      - "**/*compose*.yaml"
      - "**/*compose*.yml"
      - ".github/workflows/docker.yml"
      - "mise-tasks/lint/versions"
      - "mise-tasks/test/platform-binaries"
      - "tools/platform-images/**"
      - "tests/versions/**"
      - "mise.toml"
      - "mise.lock"
      - "docs/pyproject.toml"
      - "bunfig.toml"
      - "renovate.json5"
      - ".github/actions/setup-tools/**"
      - "api/**"
      - "agent/**"
      - "builder/**"
      - "controller/**"
      - "observability-proxy/**"
      - "k8sapi/**"
      - "internal/**"
      - "gen/go/**"
      - "gen/ts/**"
      - "web/**"
      - "go.mod"
      - "go.sum"
      - "package.json"
      - "bun.lock"
      - "docs/uv.lock"
      - "docs/zensical.toml"
      - "docs/scripts/**"
      - "docs/content/**"
      - "docs/overrides/**"
      - "schemas/loco.v1.json"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  changes:
    name: Detect Changed Images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.filter.outputs.images }}
      targets: ${{ steps.filter.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Filter
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          targets='{"runner":"ubuntu-latest","platform":"linux/amd64"}'
          if [ "$EVENT" = pull_request ]; then
            FILES=$(git diff --name-only "$BASE...$HEAD")
          else
            FILES=$(git ls-files)
            targets+=',{"runner":"ubuntu-24.04-arm","platform":"linux/arm64"}'
          fi
          sel=()
          add() {
            grep -qE "^($3/|\.github/workflows/docker\.yml$|tools/platform-images/$4)" <<<"$FILES" || return 0
            sel+=("{\"name\":\"$1\",\"cache_scope\":\"$2\",\"dockerfile\":\"./$3/Dockerfile\"}")
          }
          add Controller controller controller '|k8sapi/'
          add API api api '|k8sapi/|gen/go/|internal/|go\.(mod|sum)$'
          add UI ui web '|gen/ts/|docs/(pyproject\.toml|uv\.lock|zensical\.toml|scripts/|content/|overrides/)|schemas/loco\.v1\.json$|package\.json$|bun\.lock$'
          add Agent agent agent '|k8sapi/|gen/go/|internal/|go\.(mod|sum)$'
          add "Observability Proxy" obs-proxy observability-proxy '|gen/go/|internal/|go\.(mod|sum)$'
          add Builder builder builder ''
          echo "images=[$(IFS=,; echo "${sel[*]-}")]" >> "$GITHUB_OUTPUT"
          echo "targets=[$targets]" >> "$GITHUB_OUTPUT"

  buildkit-check:
    name: ${{ matrix.image.name }} ${{ matrix.target.platform }}
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ${{ matrix.target.runner }}

    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.changes.outputs.targets) }}
        image: ${{ fromJSON(needs.changes.outputs.images) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # contexts must match build.yml -- CopyIgnoredFile
      # and friends are only correct against the context the image really builds
      # with.
      - name: Build check
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: ${{ matrix.target.platform }}
          call: check
          build-args: |
            BUILDKIT_DOCKERFILE_CHECK=skip=InvalidDefinitionDescription,experimental=all

      - name: Build native platform image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: ${{ matrix.target.platform }}
          load: true
          tags: loco-platform:check
          build-args: VERSION=architecture-check
          cache-from: type=gha,scope=${{ matrix.image.cache_scope }}

      - name: Verify image platform and executable
        env:
          PLATFORM: ${{ matrix.target.platform }}
        run: python3 tools/platform-images/verify.py image loco-platform:check "$PLATFORM"

  base-image-versions:
    name: Image Pins
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-tools

      - name: Test platform image contracts
        run: mise run test:platform-images

      - name: Check image digests and Dockerfile base images against mise.toml
        run: mise run lint:versions

  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-tools

      - name: Lint Dockerfiles
        env:
          LINT_DOCKER_FORMAT: sarif
        run: mise run lint:docker > hadolint.sarif

      - name: Upload results
        if: always()
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: hadolint.sarif
          category: hadolint
