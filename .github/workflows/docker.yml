name: Docker

on:
  push:
    branches:
      - main
      - staging
    paths:
      - "**/Dockerfile"
      - "**/.dockerignore"
      - ".github/workflows/docker.yml"
      - "mise-tasks/lint/versions"
      - "mise.toml"
      - "mise.lock"
      - ".github/actions/setup-tools/**"
  pull_request:
    paths:
      - "**/Dockerfile"
      - "**/.dockerignore"
      - ".github/workflows/docker.yml"
      - "mise-tasks/lint/versions"
      - "mise.toml"
      - "mise.lock"
      - ".github/actions/setup-tools/**"
  workflow_call:

permissions:
  contents: read

jobs:
  buildkit-check:
    name: ${{ matrix.name }} Dockerfile Check
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Controller
            context: .
            dockerfile: ./controller/Dockerfile

          - name: API
            context: .
            dockerfile: ./api/Dockerfile

          - name: UI
            context: .
            dockerfile: ./web/Dockerfile

          - name: Agent
            context: .
            dockerfile: ./agent/Dockerfile

          - name: Observability Proxy
            context: .
            dockerfile: ./observability-proxy/Dockerfile

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # contexts must match deploy-{staging,production}.yml -- CopyIgnoredFile
      # and friends are only correct against the context the image really builds
      # with.
      - name: Build check
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          call: check
          build-args: |
            BUILDKIT_DOCKERFILE_CHECK=skip=InvalidDefinitionDescription,experimental=all

  base-image-versions:
    name: Base Image Versions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-tools
        with:
          tools: yq

      - name: Check Dockerfile base images against mise.toml
        run: mise run lint:versions

  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-tools

      - name: Lint Dockerfiles
        env:
          LINT_DOCKER_FORMAT: sarif
        run: mise run lint:docker > hadolint.sarif

      - name: Upload results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: hadolint.sarif
          category: hadolint
