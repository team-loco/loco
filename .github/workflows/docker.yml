name: Docker

on:
  push:
    branches:
      - main
    paths:
      - "**/Dockerfile"
      - "**/*.dockerignore"
      - "**/*compose*.yaml"
      - "**/*compose*.yml"
      - ".github/workflows/*.yml"
      - "mise-tasks/lint/versions"
      - "mise-tasks/test/platform-binaries"
      - "tools/platform-images/**"
      - "tests/versions/**"
      - "mise.toml"
      - "mise.lock"
      - "docs/pyproject.toml"
      - ".github/actions/setup-tools/**"
  pull_request:
    paths:
      - "**/Dockerfile"
      - "**/*.dockerignore"
      - "**/*compose*.yaml"
      - "**/*compose*.yml"
      - ".github/workflows/*.yml"
      - "mise-tasks/lint/versions"
      - "mise-tasks/test/platform-binaries"
      - "tools/platform-images/**"
      - "tests/versions/**"
      - "mise.toml"
      - "mise.lock"
      - "docs/pyproject.toml"
      - ".github/actions/setup-tools/**"
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  buildkit-check:
    name: ${{ matrix.image.name }} ${{ matrix.target.platform }}
    runs-on: ${{ matrix.target.runner }}

    strategy:
      fail-fast: false
      matrix:
        target:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
        image:
          - name: Controller
            dockerfile: ./controller/Dockerfile
          - name: API
            dockerfile: ./api/Dockerfile
          - name: UI
            dockerfile: ./web/Dockerfile
          - name: Agent
            dockerfile: ./agent/Dockerfile
          - name: Observability Proxy
            dockerfile: ./observability-proxy/Dockerfile
          - name: Builder
            dockerfile: ./builder/Dockerfile

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # contexts must match build.yml -- CopyIgnoredFile
      # and friends are only correct against the context the image really builds
      # with.
      - name: Build check
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: ${{ matrix.target.platform }}
          call: check
          build-args: |
            BUILDKIT_DOCKERFILE_CHECK=skip=InvalidDefinitionDescription,experimental=all

      - name: Build native platform image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: ${{ matrix.target.platform }}
          load: true
          tags: loco-platform:check
          build-args: VERSION=architecture-check

      - name: Verify image platform and executable
        env:
          PLATFORM: ${{ matrix.target.platform }}
        run: python3 tools/platform-images/verify.py image loco-platform:check "$PLATFORM"

  base-image-versions:
    name: Image Pins
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-tools

      - name: Test platform image contracts
        run: mise run test:platform-images

      - name: Check image digests and Dockerfile base images against mise.toml
        run: mise run lint:versions

  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-tools

      - name: Lint Dockerfiles
        env:
          LINT_DOCKER_FORMAT: sarif
        run: mise run lint:docker > hadolint.sarif

      - name: Upload results
        if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: hadolint.sarif
          category: hadolint
