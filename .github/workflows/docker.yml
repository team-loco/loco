name: Docker

on:
  workflow_call:
    inputs:
      images:
        description: Prebuilt images, with * standing for the image name; empty builds them here.
        type: string
        default: ""

permissions:
  contents: read

jobs:

  changes:
    name: Detect Changed Images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.filter.outputs.images }}
      targets: ${{ steps.filter.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Filter
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          targets='{"runner":"ubuntu-latest","platform":"linux/amd64"}'
          if [ "$EVENT" = pull_request ]; then
            FILES=$(git diff --name-only "$BASE...$HEAD")
          else
            FILES=$(git ls-files)
            targets+=',{"runner":"ubuntu-24.04-arm","platform":"linux/arm64"}'
          fi
          sel=()
          add() {
            grep -qE "^($3/|\.github/workflows/docker\.yml$|tools/platform-images/$4)" <<<"$FILES" || return 0
            sel+=("{\"name\":\"$1\",\"cache_scope\":\"$2\",\"dockerfile\":\"./$3/Dockerfile\"}")
          }
          add Controller controller controller '|k8sapi/'
          add API api api '|k8sapi/|gen/go/|internal/|go\.(mod|sum)$'
          add UI ui web '|gen/ts/|docs/(pyproject\.toml|uv\.lock|zensical\.toml|scripts/|content/|overrides/)|schemas/loco\.v1\.json$|package\.json$|bun\.lock$'
          add Agent agent agent '|k8sapi/|gen/go/|internal/|go\.(mod|sum)$'
          add "Observability Proxy" obs-proxy observability-proxy '|gen/go/|internal/|go\.(mod|sum)$'
          add Builder builder builder ''
          echo "images=[$(IFS=,; echo "${sel[*]-}")]" >> "$GITHUB_OUTPUT"
          echo "targets=[$targets]" >> "$GITHUB_OUTPUT"

  buildkit-check:
    name: Images ${{ matrix.target.platform }}
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ${{ matrix.target.runner }}
    permissions:
      contents: read
      packages: read

    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.changes.outputs.targets) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: inputs.images != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docker-bake.hcl builds each image with the context CopyIgnoredFile
      # and friends must be checked against.
      - name: Check, then pull or build, and verify each changed image
        env:
          IMAGES: ${{ inputs.images }}
          CHANGED: ${{ needs.changes.outputs.images }}
          PLATFORM: ${{ matrix.target.platform }}
        run: |
          set -euo pipefail
          mapfile -t targets < <(jq -r '.[].cache_scope' <<<"$CHANGED")
          docker buildx bake --call check \
            --set '*.args.BUILDKIT_DOCKERFILE_CHECK=skip=InvalidDefinitionDescription,experimental=all' "${targets[@]}"
          pull=true
          if [ -z "$IMAGES" ]; then
            pull=false
            IMAGES='ghcr.io/team-loco/loco-*:check'
            TAG=check VERSION=architecture-check PLATFORMS="$PLATFORM" docker buildx bake --load "${targets[@]}"
          fi
          for target in "${targets[@]}"; do
            image=${IMAGES//\*/$target}
            if [ "$pull" = true ]; then
              docker pull -q --platform "$PLATFORM" "$image"
            fi
            python3 tools/platform-images/verify.py image "$image" "$PLATFORM"
          done

  dockerfiles:
    name: Dockerfile Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-tools

      - name: Test platform image contracts
        run: mise run test:platform-images

      - name: Check image digests and Dockerfile base images against mise.toml
        run: mise run lint:versions

      - name: Lint Dockerfiles
        if: ${{ !cancelled() }}
        env:
          LINT_DOCKER_FORMAT: sarif
        run: mise run lint:docker > hadolint.sarif

      - name: Upload results
        if: ${{ !cancelled() && hashFiles('hadolint.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: hadolint.sarif
          category: hadolint
