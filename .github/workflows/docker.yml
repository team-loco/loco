name: Docker

on:
  push:
    branches:
      - main
    paths:
      - "**/Dockerfile"
      - "**/*.dockerignore"
      - "**/*compose*.yaml"
      - "**/*compose*.yml"
      - ".github/workflows/*.yml"
      - "mise-tasks/lint/versions"
      - "mise.toml"
      - "mise.lock"
      - ".github/actions/setup-tools/**"
  pull_request:
    paths:
      - "**/Dockerfile"
      - "**/*.dockerignore"
      - "**/*compose*.yaml"
      - "**/*compose*.yml"
      - ".github/workflows/*.yml"
      - "mise-tasks/lint/versions"
      - "mise.toml"
      - "mise.lock"
      - ".github/actions/setup-tools/**"
  merge_group:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Docker Changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: changes
        uses: ./.github/actions/merge-queue-changes

  buildkit-check:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: ${{ matrix.name }} Dockerfile Check
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Controller
            context: .
            dockerfile: ./controller/Dockerfile

          - name: API
            context: .
            dockerfile: ./api/Dockerfile

          - name: UI
            context: .
            dockerfile: ./web/Dockerfile

          - name: Agent
            context: .
            dockerfile: ./agent/Dockerfile

          - name: Observability Proxy
            context: .
            dockerfile: ./observability-proxy/Dockerfile

          - name: Builder
            context: .
            dockerfile: ./builder/Dockerfile

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # contexts must match build.yml -- CopyIgnoredFile
      # and friends are only correct against the context the image really builds
      # with.
      - name: Build check
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          call: check
          build-args: |
            BUILDKIT_DOCKERFILE_CHECK=skip=InvalidDefinitionDescription,experimental=all

  base-image-versions:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Image Pins
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-tools

      - name: Check image digests and Dockerfile base images against mise.toml
        run: mise run lint:versions

  hadolint:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Hadolint
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-tools

      - name: Lint Dockerfiles
        env:
          LINT_DOCKER_FORMAT: sarif
        run: mise run lint:docker > hadolint.sarif

      - name: Upload results
        if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: hadolint.sarif
          category: hadolint
