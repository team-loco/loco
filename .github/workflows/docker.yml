name: Docker

on:
  workflow_call:
    inputs:
      images:
        description: Prebuilt images, with * standing for the image name; empty builds them here.
        type: string
        default: ""

permissions:
  contents: read

jobs:

  buildkit-check:
    name: Images ${{ matrix.platform }}
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: read

    strategy:
      fail-fast: false
      matrix:
        # Images builds arm64 only for a push to main.
        platform: ${{ fromJSON(github.event_name == 'push' && '["linux/amd64","linux/arm64"]' || '["linux/amd64"]') }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: inputs.images != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docker-bake.hcl builds each image with the context CopyIgnoredFile
      # and friends must be checked against.
      - name: Check, then pull or build, and verify each image
        env:
          IMAGES: ${{ inputs.images }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          targets=(controller api agent builder obs-proxy ui)
          docker buildx bake --call check \
            --set '*.args.BUILDKIT_DOCKERFILE_CHECK=skip=InvalidDefinitionDescription,experimental=all' "${targets[@]}"
          pull=true
          if [ -z "$IMAGES" ]; then
            pull=false
            IMAGES='ghcr.io/team-loco/loco-*:check'
            TAG=check VERSION=architecture-check PLATFORMS="$PLATFORM" docker buildx bake --load "${targets[@]}"
          fi
          for target in "${targets[@]}"; do
            image=${IMAGES//\*/$target}
            if [ "$pull" = true ]; then
              docker pull -q --platform "$PLATFORM" "$image"
            fi
            python3 tools/platform-images/verify.py image "$image" "$PLATFORM"
          done

  dockerfiles:
    name: Dockerfile Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-tools

      - name: Test platform image contracts
        run: mise run test:platform-images

      - name: Check image digests and Dockerfile base images against mise.toml
        run: mise run lint:versions

      - name: Lint Dockerfiles
        if: ${{ !cancelled() }}
        env:
          LINT_DOCKER_FORMAT: sarif
        run: mise run lint:docker > hadolint.sarif

      - name: Upload results
        if: ${{ !cancelled() && hashFiles('hadolint.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: hadolint.sarif
          category: hadolint
