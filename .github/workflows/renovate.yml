name: Renovate

on:
  schedule:
    # Monday 06:00 America/Los_Angeles
    - cron: "0 13 * * 1"
  workflow_dispatch:
    inputs:
      logLevel:
        description: Log level
        type: choice
        default: info
        options:
          - info
          - debug
      dryRun:
        description: Resolve updates without opening PRs
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  renovate:
    name: Scan dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # RENOVATE_TOKEN must be a PAT or GitHub App token, not GITHUB_TOKEN:
      # PRs opened with GITHUB_TOKEN do not trigger workflow runs, so CI would
      # never report on an update.
      - uses: renovatebot/github-action@230ce922b08968d0a4f6f70f295601daff09ef1d # v46.3.7
        with:
          configurationFile: renovate.json5
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || null }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
