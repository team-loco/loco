name: Railway Config

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
      - staging
    paths:
      - ".railway/**"
      - ".github/workflows/railway-config.yml"

permissions:
  contents: read
  pull-requests: write
  actions: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.base_ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Railway Plan (${{ github.base_ref == 'main' && 'production' || 'staging' }})
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: ${{ github.base_ref == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: railwayapp/config@9e17d413dbe219f19d62538d9c06b5dbb5e9abf8 # v1.2.0
        with:
          command: plan
          cli-version: 5.63.1
          railway-token: ${{ secrets.RAILWAY_TOKEN }}

  apply:
    name: Railway Apply (${{ github.base_ref == 'main' && 'production' || 'staging' }})
    if: github.event.action == 'closed' && github.event.pull_request.merged && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: ${{ github.base_ref == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: railwayapp/config@9e17d413dbe219f19d62538d9c06b5dbb5e9abf8 # v1.2.0
        with:
          command: apply
          cli-version: 5.63.1
          confirm-destructive: "false"
          railway-token: ${{ secrets.RAILWAY_TOKEN }}
