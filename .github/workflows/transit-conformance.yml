name: Transit Conformance

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  conformance:
    name: Transit Conformance
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-tools
        with:
          go-cache: transit-conformance

      - name: Run the transit key provider against OpenBao and Vault
        run: mise run test:transit-conformance
        timeout-minutes: 10
