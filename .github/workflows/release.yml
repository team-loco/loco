name: Release

# Publishes one Loco version: the platform bundle X.Y.Z, then release vX.Y.Z
# with the CLI binaries and the bundle's release.json, from a main commit
# whose CI and image builds have passed.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full main commit to release; empty releases the current main head
        required: false
        type: string
      version:
        description: Version X.Y.Z without a v prefix; empty bumps the patch of the latest v* tag
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Check Release Source
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the commit and version and check that they can be released
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_COMMIT: ${{ inputs.commit }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }

          commit=${INPUT_COMMIT:-$(git rev-parse origin/main)}
          [[ "$commit" =~ ^[a-f0-9]{40}$ ]] || fail "commit must be a full lowercase SHA: $commit"
          git merge-base --is-ancestor "$commit" origin/main 2>/dev/null || fail "$commit is not on main"

          latest=$(git tag -l 'v*' --sort=-v:refname | sed -n 1p)
          version=$INPUT_VERSION
          if [[ -z "$version" ]]; then
            IFS=. read -r major minor patch <<< "${latest:-v0.0.0}"
            version="${major#v}.${minor}.$((patch + 1))"
          fi
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || fail "version must be X.Y.Z without a v prefix: $version"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            fail "tag v$version already exists"
          fi

          # CI skips checks whose paths a push did not change, so every main push since the last release must pass.
          # A push of several commits runs CI once, on its head, over all of them; the others have no run.
          failed=()
          conclusion() {
            gh run list --workflow "$1" --commit "$2" --event push --limit 1 --json conclusion \
              --jq 'if length == 0 then "no run" else .[0].conclusion // "" end'
          }
          shas=""
          [[ -z "$latest" ]] || shas=$(git rev-list --first-parent "$latest..$commit")
          for sha in ${shas:-$commit}; do
            result=$(conclusion ci.yml "$sha")
            [[ "$result" == success || ( "$result" == "no run" && "$sha" != "$commit" ) ]] || failed+=("ci.yml on $sha: ${result:-in progress}")
          done
          result=$(conclusion build.yml "$commit")
          [[ "$result" == success ]] || failed+=("build.yml on $commit: ${result:-in progress}")
          if (( ${#failed[@]} )); then
            printf '::error::%s\n' "${failed[@]}"
            fail "the push runs above have not succeeded; re-running a failed run clears it"
          fi

          echo "Releasing $version from $commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - uses: ./.github/actions/setup-tools
        with:
          go-cache: release-cli

      - name: Build binary
        working-directory: cmd
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: v${{ needs.prepare.outputs.version }}
        run: |
          for binary in loco locoadm; do
            go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "../bin/${binary}-${GOOS}-${GOARCH}" -v "./${binary}"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loco-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            bin/loco-*
            bin/locoadm-*
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    environment: platform-release
    permissions:
      attestations: read
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      COMMIT: ${{ needs.prepare.outputs.commit }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-tools

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: loco-*
          path: bin
          merge-multiple: true

      - name: Generate checksums
        working-directory: bin
        run: sha256sum loco-* locoadm-* > checksums.txt

      - name: Authenticate image provenance verification
        env:
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin

      - name: Publish the platform bundle
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mise run release:platform -- --version "$VERSION" --commit "$COMMIT" --repository "${RELEASE_REPOSITORY,,}" > bin/release.json

      # The release stays a draft, without its tag, until every asset is uploaded.
      - name: Tag the commit and publish the release
        run: |
          gh release create "v$VERSION" \
            --target "$COMMIT" \
            --title "Release v$VERSION" \
            --generate-notes \
            bin/loco-* bin/locoadm-* bin/checksums.txt bin/release.json
