name: Buf

on:
  workflow_call:

permissions:
  contents: read

jobs:

  generate:
    name: Verify Generated Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-tools
        with:
          go-cache: buf-generate

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate Go, TypeScript and OpenAPI from the protos
        run: |
          buf generate
          buf generate --template buf.gen.googleapis.yaml

      - name: Fail if anything is out of date
        run: |
          if [ -n "$(git status --porcelain -- gen api/gen/openapi)" ]; then
            git status --short -- gen api/gen/openapi
            git diff -- gen api/gen/openapi
            echo "::error::Generated code is out of date. Run 'mise run gen' and commit the result."
            exit 1
          fi

  buf:
    name: Buf
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    # Pushes to the registry from main run one at a time; the step below moves
    # each to the branch's newest commit.
    concurrency:
      group: ${{ github.event_name == 'push' && 'buf-registry' || format('buf-{0}', github.run_id) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-tools

      - name: Check protobuf formatting and lint
        run: mise run lint:proto

      - name: Move to the current head of the branch
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_REF"
          git reset --hard FETCH_HEAD
          head=$(git rev-parse HEAD)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::$GITHUB_REF moved from $GITHUB_SHA to $head; pushing $head to the Buf Schema Registry"
          fi

      # A pull request labelled `break-buf` skips both breaking-change checks. The
      # label is read when the job runs, not from the event, and adding it does
      # not start CI: add the label, then re-run the failed jobs. Released CLIs
      # still call the old protos, so a breaking change ships with a CLI release
      # and the API's MIN_CLI_VERSION raised to that release.
      - name: Read the break-buf label
        id: labels
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          labels=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name')
          if grep -qx break-buf <<<"$labels"; then
            echo "breaking=false" >> "$GITHUB_OUTPUT"
          else
            echo "breaking=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch the pull request base
        if: steps.labels.outputs.breaking == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"

      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          token: ${{ secrets.BUF_TOKEN }}
          lint: true
          breaking: ${{ steps.labels.outputs.breaking == 'true' }}
          breaking_against: ".git#ref=${{ github.event.pull_request.base.sha }}"

      # The installed CLI can lag main by many commits; compare with the newest release too.
      # Main can hold unreleased break-buf changes, so only breaks this pull request adds fail.
      - name: Check for breaking changes against the latest release
        if: steps.labels.outputs.breaking == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          tag=$(git ls-remote --tags --refs --sort=v:refname origin 'v*' | tail -1 | cut -d/ -f3)
          git fetch --no-tags --depth=1 origin "refs/tags/${tag}:refs/tags/${tag}" "$BASE_SHA"
          breaks() {
            local rc=0
            buf breaking "$@" --against ".git#tag=${tag}" --error-format json > "$RUNNER_TEMP/breaks.json" || rc=$?
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 100 ]; then exit "$rc"; fi
            jq -c 'del(.start_line, .start_column, .end_line, .end_column)' "$RUNNER_TEMP/breaks.json" | sort
          }
          breaks ".git#ref=${BASE_SHA}" > "$RUNNER_TEMP/base.txt"
          breaks > "$RUNNER_TEMP/head.txt"
          added=$(comm -13 "$RUNNER_TEMP/base.txt" "$RUNNER_TEMP/head.txt")
          if [ -n "$added" ]; then
            jq -r '"::error file=\(.path)::\(.message)"' <<<"$added"
            exit 1
          fi
