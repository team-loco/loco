name: Buf

on:
  push:
    branches:
      - main
      - staging
    paths:
      - "**.proto"
      - "**/buf.yaml"
      - "**/buf.lock"
      - "**/buf.gen.yaml"
      - "gen/**"
      - "go.mod"
      - "go.sum"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/buf.yml"
      - "mise.toml"
      - "mise.lock"
      - ".github/actions/setup-tools/**"
  pull_request:
    # `labeled`/`unlabeled` are required on top of the defaults so that adding or
    # removing the `break-buf` label re-runs this workflow. Without them the
    # label can only take effect on the next push.
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "**.proto"
      - "**/buf.yaml"
      - "**/buf.lock"
      - "**/buf.gen.yaml"
      - "gen/**"
      - "go.mod"
      - "go.sum"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/buf.yml"
      - "mise.toml"
      - "mise.lock"
      - ".github/actions/setup-tools/**"
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Buf Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-tools

      - name: buf lint
        run: mise run lint:proto -- --error-format github-actions

  generate:
    name: Verify Generated Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-tools
        with:
          go-cache: buf-generate

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate Go and TypeScript from the protos
        run: buf generate

      - name: Fail if anything is out of date
        run: |
          if [ -n "$(git status --porcelain -- gen)" ]; then
            git status --short -- gen
            git diff -- gen
            echo "::error::Generated code is out of date. Run 'mise run gen' and commit the result."
            exit 1
          fi

  buf:
    name: Buf Breaking
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-tools

      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          token: ${{ secrets.BUF_TOKEN }}
          lint: false
          # Skip the breaking-change check on PRs labelled `break-buf`.
          # NOTE: this must key off the pull_request payload. The previous
          # `github.event.head_commit.message` only exists on push events, so on
          # a PR it was always null and the bypass could never fire.
          breaking: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'break-buf') }}
          breaking_against_registry: true
