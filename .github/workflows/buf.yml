name: Buf

on:
  workflow_call:

permissions:
  contents: read

jobs:

  generate:
    name: Verify Generated Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-tools
        with:
          go-cache: buf-generate

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Regenerate Go, TypeScript and OpenAPI from the protos
        run: mise run gen

      - name: Fail if anything is out of date
        run: |
          if [ -n "$(git status --porcelain -- gen api/gen/openapi)" ]; then
            git status --short -- gen api/gen/openapi
            git diff -- gen api/gen/openapi
            echo "::error::Generated code is out of date. Run 'mise run gen' and commit the result."
            exit 1
          fi

  buf:
    name: Buf
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    # Pushes to the registry from main run one at a time; the step below moves
    # each to the branch's newest commit.
    concurrency:
      group: ${{ github.event_name == 'push' && 'buf-registry' || format('buf-{0}', github.run_id) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-tools

      - name: Check protobuf formatting and lint
        run: mise run lint:proto

      - name: Move to the current head of the branch
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_REF"
          git reset --hard FETCH_HEAD
          head=$(git rev-parse HEAD)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::$GITHUB_REF moved from $GITHUB_SHA to $head; pushing $head to the Buf Schema Registry"
          fi

      # A pull request labelled `break-buf` skips the breaking-change check. The
      # label is read when the job runs, not from the event, and adding it does
      # not start CI: add the label, then re-run the failed jobs.
      - name: Read the break-buf label
        id: labels
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          labels=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name')
          if grep -qx break-buf <<<"$labels"; then
            echo "breaking=false" >> "$GITHUB_OUTPUT"
          else
            echo "breaking=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          token: ${{ secrets.BUF_TOKEN }}
          lint: true
          breaking: ${{ steps.labels.outputs.breaking == 'true' }}
          breaking_against_registry: true
