name: Publish platform artifacts

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - run: mise run test:platform-release
      - run: mise run test:platform-render
      - name: Check that changed CRD bundles bump their versions
        env:
          BASE_REF: ${{ github.base_ref }}
        run: mise run lint:crd-versions "origin/$BASE_REF"

  artifacts:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: platform-release
    concurrency:
      group: platform-release-artifacts
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      CORE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-tools

      - name: Validate platform packaging
        run: |
          mise run test:platform-release
          mise run test:platform-render

      - name: Publish every chart and CRD bundle version not yet in the registry
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mise run release:artifacts -- --commit "$CORE_COMMIT" --repository "${RELEASE_REPOSITORY,,}" | tee platform-artifacts.json

      - name: Report the published versions
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          artifacts = json.loads(Path('platform-artifacts.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.writelines('- `' + reference + '`\n' for reference in artifacts.values())
          PY
