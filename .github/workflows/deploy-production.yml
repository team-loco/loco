name: Build and Deploy to Production

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_PAT }}

jobs:
  test:
    name: Run Tests
    uses: ./.github/workflows/test.yml

  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      controller: ${{ steps.filter.outputs.controller }}
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      agent: ${{ steps.filter.outputs.agent }}
      cli: ${{ steps.filter.outputs.cli }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Filter
        id: filter
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            FILES=$(git ls-files)
          else
            FILES=$(git diff --name-only "$BEFORE" "$AFTER")
          fi
          echo "changed files:"
          echo "$FILES"

          match() { echo "$FILES" | grep -qE "$1" && echo true || echo false; }

          {
            echo "controller=$(match '^(controller/|k8sapi/)')"
            echo "api=$(match '^(api/|gen/go/|k8sapi/)')"
            echo "web=$(match '^(web/|gen/ts/|package\.json$|bun\.lock$)')"
            echo "agent=$(match '^(agent/|gen/go/|k8sapi/)')"
            echo "cli=$(match '^(cmd/|main\.go$|go\.(mod|sum)$)')"
          } >> "$GITHUB_OUTPUT"

  push-controller-image:
    name: Build and Push Controller Image
    needs: [test, changes]
    if: needs.changes.outputs.controller == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-push.yml
    with:
      image_name: ${{ github.repository }}-controller
      context: .
      dockerfile: ./controller/Dockerfile

  push-api-image:
    name: Build and Push API Image
    needs: [test, changes]
    if: needs.changes.outputs.api == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-push.yml
    with:
      image_name: ${{ github.repository }}-api
      context: .
      dockerfile: ./api/Dockerfile

  push-ui-image:
    name: Build and Push UI Image
    needs: [test, changes]
    if: needs.changes.outputs.web == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-push.yml
    with:
      image_name: ${{ github.repository }}-ui
      context: .
      dockerfile: ./web/Dockerfile
      build_args: |
        VITE_API_URL=${{ vars.VITE_API_URL_PRODUCTION || 'https://api.deploy-app.com' }}
        VITE_APP_ENV=PRODUCTION

  push-agent-image:
    name: Build and Push Agent Image
    needs: [test, changes]
    if: needs.changes.outputs.agent == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-push.yml
    with:
      image_name: ${{ github.repository }}-agent
      context: .
      dockerfile: ./agent/Dockerfile

  build-cli:
    name: Build CLI Binaries
    needs: [test, changes]
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-tools

      - name: Build Linux binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/loco-linux-amd64 -v

      - name: Build macOS AMD64 binary
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -o bin/loco-darwin-amd64 -v

      - name: Build macOS ARM64 binary
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o bin/loco-darwin-arm64 -v

      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: loco-binaries
          path: bin/loco-*

  deploy-production:
    name: Deploy to Production
    needs:
      - push-api-image
      - push-controller-image
      - push-ui-image
      - push-agent-image
      - build-cli
    runs-on: ubuntu-latest
    environment: production
    if: always()

    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      API_IMAGE: ${{ needs.push-api-image.outputs.image }}
      CONTROLLER_IMAGE: ${{ needs.push-controller-image.outputs.image }}
      UI_IMAGE: ${{ needs.push-ui-image.outputs.image }}
      AGENT_IMAGE: ${{ needs.push-agent-image.outputs.image }}
      CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
      GITLAB_PAT: ${{ secrets.GITLAB_PAT }}
      GITLAB_PROJECT_ID: ${{ secrets.GITLAB_PROJECT_ID }}
      GITLAB_TOKEN_NAME: ${{ secrets.GITLAB_TOKEN_NAME }}
      GITLAB_URL: ${{ secrets.GITLAB_URL }}
      GITLAB_REGISTRY_URL: ${{ secrets.GITLAB_REGISTRY_URL }}
      GITLAB_DEPLOY_TOKEN_NAME: ${{ secrets.GITLAB_DEPLOY_TOKEN_NAME }}
      GH_OAUTH_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
      GH_OAUTH_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
      GH_OAUTH_STATE: ${{ secrets.GH_OAUTH_STATE }}
      APP_ENV: ${{ secrets.APP_ENV }}
      LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
      PORT: ${{ secrets.PORT }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GH_SHA: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-tools

      - name: Terraform Init
        run: cd terraform/do && terraform init

      - name: Terraform Plan
        run: cd terraform/do && terraform plan -out=tfplan

      - name: Terraform Apply
        run: cd terraform/do && terraform apply -auto-approve "tfplan"

      - name: Get kubeconfig
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_PAT }}
        run: doctl kubernetes cluster kubeconfig save loco-cluster

      - name: Verify cluster access
        run: kubectl get nodes

      - name: Wait for nodes to be ready
        run: kubectl wait --for=condition=Ready node --all --timeout=180s

      - name: Build Helm dependencies
        run: mise run helm:deps

      - name: Helm dry-run
        run: mise run deploy:diff prod

      - name: Deploy to Production
        run: mise run deploy:sync prod

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/loco-api -n loco-core --timeout=5m || true
          kubectl rollout status deployment/loco-controller -n loco-controller --timeout=5m || true
          kubectl rollout status deployment/loco-ui -n loco-core --timeout=5m || true

      - name: Smoke tests
        run: |
          API_POD=$(kubectl get pod -n loco-core -l app=loco-api -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
          if [ -n "$API_POD" ]; then
            kubectl exec -n loco-core $API_POD -- curl -f http://localhost:8000/health || true
          fi

  release:
    name: Create GitHub Release
    needs: deploy-production
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download CLI binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: loco-binaries
          path: bin

      - name: Determine next version tag
        id: version
        run: |
          latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $latest_tag"

          major=$(echo $latest_tag | cut -d. -f1 | tr -d v)
          minor=$(echo $latest_tag | cut -d. -f2)
          patch=$(echo $latest_tag | cut -d. -f3)

          new_tag="v${major}.${minor}.$((patch + 1))"
          echo "new_tag=$new_tag" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$latest_tag" ]; then
            log=$(git log --pretty=format:"* %s (%h)" )
          else
            log=$(git log ${latest_tag}..HEAD --pretty=format:"* %s (%h)")
          fi

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$log" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create and push Git tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag ${{ steps.version.outputs.new_tag }}
          git push origin ${{ steps.version.outputs.new_tag }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ steps.version.outputs.new_tag }} \
            --title "Release ${{ steps.version.outputs.new_tag }}" \
            --notes "${{ steps.changelog.outputs.changelog }}" \
            bin/loco-*
