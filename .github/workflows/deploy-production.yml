name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full commit sha on main to deploy. Leave empty to deploy the commit staging runs.
        required: false
        default: ""

permissions:
  contents: read

env:
  NO_COLOR: "1"

jobs:
  resolve:
    name: Resolve Commit
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - uses: ./.github/actions/setup-tools

      - name: Resolve
        id: commit
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          REQUESTED: ${{ inputs.commit }}
        run: |
          set -euo pipefail

          commit="$REQUESTED"
          if [ -z "$commit" ]; then
            commit=$(mise run railway:deployed-commit staging)
          fi

          if ! [[ "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::'$commit' is not a full commit sha"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::$commit is not on main"
            exit 1
          fi

          echo "deploying $commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to Production
    needs: resolve
    uses: ./.github/workflows/deploy-railway.yml
    with:
      environment: production
      commit: ${{ needs.resolve.outputs.commit }}
    secrets: inherit
