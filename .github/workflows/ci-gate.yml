name: CI Gate

on:
  pull_request:

permissions:
  checks: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Wait for every other check to finish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          SELF: CI Gate
        run: |
          set -euo pipefail

          # A check that has not been created yet is indistinguishable from one
          # that will never run, so settle only after the set of checks has
          # stopped changing and everything in it has completed.
          stable=0
          prev=""

          for attempt in $(seq 1 60); do
            runs=$(gh api --paginate "repos/$REPO/commits/$SHA/check-runs" \
              --jq '.check_runs[] | select(.name != env.SELF) | "\(.name)\t\(.status)\t\(.conclusion // "")"' \
              | sort)

            total=$(printf '%s' "$runs" | grep -c . || true)
            pending=$(printf '%s\n' "$runs" | awk -F'\t' '$2 != "completed"' | grep -c . || true)

            if [ "$runs" = "$prev" ] && [ "$pending" -eq 0 ] && [ "$total" -gt 0 ]; then
              stable=$((stable + 1))
            else
              stable=0
            fi
            prev="$runs"

            if [ "$stable" -ge 2 ]; then
              break
            fi

            echo "attempt $attempt: $total checks, $pending still running"
            sleep 15
          done

          if [ "$pending" -ne 0 ] || [ "$total" -eq 0 ]; then
            echo "::error::timed out waiting for checks to report ($total seen, $pending pending)"
            exit 1
          fi

          echo
          printf '%s\n' "$runs" | awk -F'\t' '{printf "  %-34s %s\n", $1, ($3 == "" ? $2 : $3)}'
          echo

          failed=$(printf '%s\n' "$runs" \
            | awk -F'\t' '$3 == "failure" || $3 == "timed_out" || $3 == "cancelled" || $3 == "action_required" {print $1}')

          if [ -n "$failed" ]; then
            echo "::error::failing checks:"
            printf '%s\n' "$failed" | sed 's/^/  /'
            exit 1
          fi

          echo "all $total checks passed or were skipped"
