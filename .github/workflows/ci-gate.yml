name: CI Gate

on:
  workflow_run:
    types: [completed]
    workflows:
      - Auth Conformance
      - Buf
      - Chart Contracts
      - CI Gate Trigger
      - Controller Helm Chart Tests
      - Docker
      - Docs Drift
      - Documentation
      - E2E
      - Go Vulnerabilities
      - Lint
      - Local Stack
      - Observability Chart
      - OSV
      - Publish platform release
      - Tests
      - Transit Conformance
      - Web
      - Workflows

permissions:
  actions: read
  checks: read
  statuses: write
  contents: read

concurrency:
  group: ci-gate-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  gate:
    name: Evaluate CI Gate
    if: github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/actions/ci-gate
            .github/workflows

      - name: Report the newest run of every check on the pull request head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          SELF: CI Gate
          DETAILS: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" > "$RUNNER_TEMP/runs.json"
          gh api --paginate --slurp "repos/$REPO/commits/$SHA/check-runs?per_page=100" > "$RUNNER_TEMP/checks.json"
          yq -o json ".on.workflow_run.workflows" .github/workflows/ci-gate.yml > "$RUNNER_TEMP/gated.json"
          request=$(python3 .github/actions/ci-gate/filter_checks.py "$RUNNER_TEMP/runs.json" "$RUNNER_TEMP/checks.json" "$RUNNER_TEMP/gated.json" "$GITHUB_EVENT_PATH" "$SELF" "$DETAILS" "$RUNNER_TEMP/gate.json" "$GITHUB_STEP_SUMMARY")
          gh api --method "${request%% *}" "repos/$REPO/${request#* }" --input "$RUNNER_TEMP/gate.json" > /dev/null
