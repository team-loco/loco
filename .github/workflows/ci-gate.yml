name: CI Gate

on:
  pull_request:
  merge_group:

permissions:
  checks: read
  contents: read

jobs:
  gate:
    name: CI Gate
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Wait for every other check to finish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.merge_group.head_sha }}
          SELF: CI Gate
        run: |
          set -euo pipefail

          # A check that has not been created yet is indistinguishable from one
          # that will never run, so settle only after the set of checks has
          # stopped changing and everything in it has completed.
          stable=0
          settled=0
          prev=""

          for attempt in $(seq 1 200); do
            runs=$(gh api --paginate "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
              --jq '.check_runs[] | select(.name != env.SELF) | "\(.name)\t\(.id)\t\(.status)\t\(.conclusion // "")"' \
              | sort -t $'\t' -k1,1 -k2,2nr \
              | awk -F'\t' '!seen[$1]++ {print $1 "\t" $3 "\t" $4}')

            total=$(printf '%s' "$runs" | grep -c . || true)
            pending=$(printf '%s\n' "$runs" | awk -F'\t' '$2 != "completed"' | grep -c . || true)

            if [ "$runs" = "$prev" ] && [ "$pending" -eq 0 ]; then
              stable=$((stable + 1))
            else
              stable=0
            fi
            prev="$runs"

            need=2
            if [ "$total" -eq 0 ]; then
              need=8
            fi

            if [ "$stable" -ge "$need" ]; then
              settled=1
              break
            fi

            echo "attempt $attempt: $total checks, $pending still running"
            sleep 15
          done

          if [ "$settled" -ne 1 ]; then
            echo "::error::timed out waiting for checks to report ($total seen, $pending pending)"
            exit 1
          fi

          if [ "$total" -eq 0 ]; then
            echo "no other checks ran for this change"
            exit 0
          fi

          echo
          printf '%s\n' "$runs" | awk -F'\t' '{printf "  %-34s %s\n", $1, ($3 == "" ? $2 : $3)}'
          echo

          failed=$(printf '%s\n' "$runs" \
            | awk -F'\t' '$3 == "failure" || $3 == "timed_out" || $3 == "cancelled" || $3 == "action_required" {print $1}')

          if [ -n "$failed" ]; then
            echo "::error::failing checks:"
            printf '%s\n' "$failed" | sed 's/^/  /'
            exit 1
          fi

          echo "all $total checks passed or were skipped"
