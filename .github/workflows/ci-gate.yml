name: CI Gate

on:
  pull_request:

permissions:
  checks: read
  contents: read

jobs:
  gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Wait for every other check to finish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          SELF: CI Gate
        run: |
          set -euo pipefail

          # A check that has not been created yet is indistinguishable from one
          # that will never run, so pass only after the set of checks has
          # stopped changing for settle_seconds and everything in it has
          # completed. Fail as soon as the latest run of any check has failed.
          interval=5
          settle_seconds=30
          settle_seconds_empty=120
          deadline=$((SECONDS + 50 * 60))

          stable_since=$SECONDS
          settled=0
          prev=""
          runs=""
          total=0
          pending=0

          report() {
            echo
            printf '%s\n' "$runs" | awk -F'\t' '{printf "  %-34s %s\n", $1, ($3 == "" ? $2 : $3)}'
            echo
          }

          while [ "$SECONDS" -lt "$deadline" ]; do
            runs=$(gh api --paginate "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
              --jq '.check_runs[] | select(.name != env.SELF) | "\(.name)\t\(.id)\t\(.status)\t\(.conclusion // "")"' \
              | sort -t $'\t' -k1,1 -k2,2nr \
              | awk -F'\t' '!seen[$1]++ {print $1 "\t" $3 "\t" $4}')

            total=$(printf '%s' "$runs" | grep -c . || true)
            pending=$(printf '%s\n' "$runs" | awk -F'\t' '$2 != "completed"' | grep -c . || true)

            failed=$(printf '%s\n' "$runs" \
              | awk -F'\t' '$2 == "completed" && ($3 == "failure" || $3 == "timed_out" || $3 == "cancelled" || $3 == "action_required") {print $1}')

            if [ -n "$failed" ]; then
              report
              echo "::error::failing checks:"
              printf '%s\n' "$failed" | sed 's/^/  /'
              exit 1
            fi

            if [ "$runs" != "$prev" ] || [ "$pending" -ne 0 ]; then
              stable_since=$SECONDS
            fi
            if [ "$runs" != "$prev" ]; then
              echo "$total checks, $pending still running"
            fi
            prev="$runs"

            need=$settle_seconds
            if [ "$total" -eq 0 ]; then
              need=$settle_seconds_empty
            fi

            if [ "$pending" -eq 0 ] && [ $((SECONDS - stable_since)) -ge "$need" ]; then
              settled=1
              break
            fi

            sleep "$interval"
          done

          if [ "$settled" -ne 1 ]; then
            echo "::error::timed out waiting for checks to report ($total seen, $pending pending)"
            exit 1
          fi

          if [ "$total" -eq 0 ]; then
            echo "no other checks ran for this change"
            exit 0
          fi

          report
          echo "all $total checks passed or were skipped"
