name: Controller Helm Chart Tests

on:
  push:
    branches:
      - main
      - staging
    paths:
      - "controller/**"
      - "k8sapi/**"
      - "charts/**"
      - "go.mod"
      - "go.sum"
      - "mise-tasks/chart/sync-crd"
      - "mise.toml"
      - "mise.lock"
      - ".github/actions/setup-tools/**"
      - ".github/workflows/controller-helm-chart.yml"
  pull_request:
    paths:
      - "controller/**"
      - "k8sapi/**"
      - "charts/**"
      - "go.mod"
      - "go.sum"
      - "mise-tasks/chart/sync-crd"
      - "mise.toml"
      - "mise.lock"
      - ".github/actions/setup-tools/**"
      - ".github/workflows/controller-helm-chart.yml"
  merge_group:

# Both jobs execute code from the PR under review (Makefiles, Go tooling, helm
# charts), so neither may hold anything an attacker would want.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codegen:
    name: Verify Generated Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-tools
        with:
          go-cache: controller-codegen

      - name: Regenerate CRDs, RBAC, deepcopy, and the chart's CRD and RBAC copies
        run: mise run controller:gen

      - name: Fail if anything is out of date
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated files are out of date. Run 'mise run controller:gen' and commit the result."
            exit 1
          fi

  helm-chart:
    name: Test Helm Chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-tools
        with:
          go-cache: controller-helm-chart

      - name: Create kind cluster
        run: kind create cluster

      - name: Build and load controller image
        run: |
          go mod tidy -C controller
          make -C controller docker-build IMG=controller:v0.1.0
          kind load docker-image controller:v0.1.0

      - name: Lint Helm Chart
        run: |
          helm lint ./charts/loco-controller

      - name: Install Helm chart
        run: |
          helm install loco-controller ./charts/loco-controller \
            --create-namespace \
            --namespace controller-system

      - name: Check Helm release status
        run: |
          helm status loco-controller --namespace controller-system
