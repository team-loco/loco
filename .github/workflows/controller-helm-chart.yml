name: Controller Helm Chart Tests

on:
  push:
    paths:
      - "controller/**"
      - "k8sapi/**"
      - "charts/**"
      - "go.mod"
      - "go.sum"
  pull_request:
    paths:
      - "controller/**"
      - "k8sapi/**"
      - "charts/**"
      - "go.mod"
      - "go.sum"

# Both jobs execute code from the PR under review (Makefiles, Go tooling, helm
# charts), so neither may hold anything an attacker would want.
permissions:
  contents: read

jobs:
  codegen:
    name: Verify Generated Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # pinned: yq's formatting is part of the committed output, so a different
      # version would fail this check for no real reason. Kept in RUNNER_TEMP rather
      # than installed system-wide, and deliberately not the workspace -- putting the
      # checkout on PATH would let a PR shadow go, git or make for later steps.
      - name: Install yq
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl --fail --location --silent --show-error \
            -o "$RUNNER_TEMP/bin/yq" \
            https://github.com/mikefarah/yq/releases/download/v4.49.2/yq_linux_amd64
          echo "be2c0ddcf426b6a231648610ec5d1666ae50e9f6473e82f6486f9f4cb6e3e2f7  $RUNNER_TEMP/bin/yq" \
            | sha256sum --check -
          chmod +x "$RUNNER_TEMP/bin/yq"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/yq" --version

      - name: Regenerate CRDs, RBAC, deepcopy, and the chart's CRD copy
        run: make controller-gen

      - name: Fail if anything is out of date
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated files are out of date. Run 'make controller-gen' and commit the result."
            exit 1
          fi

  helm-chart:
    name: Test Helm Chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Create kind cluster
        run: kind create cluster

      - name: Build and load controller image
        run: |
          go mod tidy -C controller
          make -C controller docker-build IMG=controller:v0.1.0
          kind load docker-image controller:v0.1.0

      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Verify Helm installation
        run: helm version

      - name: Lint Helm Chart
        run: |
          helm lint ./charts/loco-controller

      - name: Install Helm chart
        run: |
          helm install loco-controller ./charts/loco-controller \
            --create-namespace \
            --namespace controller-system

      - name: Check Helm release status
        run: |
          helm status loco-controller --namespace controller-system
