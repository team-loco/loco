name: Controller Helm Chart Tests

on:
  push:
    branches:
      - main
    paths:
      - "controller/**"
      - "k8sapi/**"
      - "charts/**"
      - "go.mod"
      - "go.sum"
      - "mise-tasks/chart/**"
      - "mise-tasks/crds/**"
      - "mise-tasks/test/chart"
      - "mise.toml"
      - "mise.lock"
      - ".github/actions/setup-tools/**"
      - ".github/workflows/controller-helm-chart.yml"
  pull_request:
    paths:
      - "controller/**"
      - "k8sapi/**"
      - "charts/**"
      - "go.mod"
      - "go.sum"
      - "mise-tasks/chart/**"
      - "mise-tasks/crds/**"
      - "mise-tasks/test/chart"
      - "mise.toml"
      - "mise.lock"
      - ".github/actions/setup-tools/**"
      - ".github/workflows/controller-helm-chart.yml"

# Both jobs execute code from the PR under review (Makefiles, Go tooling, helm
# charts), so neither may hold anything an attacker would want.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  codegen:
    name: Verify Generated Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-tools
        with:
          go-cache: controller-codegen

      - name: Regenerate CRDs, RBAC, deepcopy, and the chart's RBAC copies
        run: mise run controller:gen

      - name: Fail if anything is out of date
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated files are out of date. Run 'mise run controller:gen' and commit the result."
            exit 1
          fi

  helm-chart:
    name: Test Helm Chart
    runs-on: ubuntu-latest
    env:
      CONTROLLER_IMAGE: loco-controller
      IMAGE_TAG: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-tools
        with:
          go-cache: controller-helm-chart

      - name: Create kind cluster
        run: kind create cluster

      - name: Build and load controller image
        run: |
          go mod tidy -C controller
          make -C controller docker-build IMG="$CONTROLLER_IMAGE:$IMAGE_TAG"
          kind load docker-image "$CONTROLLER_IMAGE:$IMAGE_TAG"

      - name: Check what the chart renders with builds on and off
        run: mise run test:chart

      - name: Lint Helm Chart
        run: |
          helm lint ./charts/loco-worker \
            --set agent.image.tag="$IMAGE_TAG" \
            --set controller.image.tag="$IMAGE_TAG" \
            --set builds.builderImage.tag="$IMAGE_TAG" \
            --set certManager.existingTLSSecret=ci-tls \
            --set global.region=ci \
            --set global.exporter.endpoint=http://ci.invalid

      - name: Apply the CRDs
        run: mise run crds:apply
        env:
          KIND_CLUSTER: kind

      - name: Install Helm chart
        run: |
          helm install loco-worker ./charts/loco-worker \
            --create-namespace \
            --namespace controller-system \
            --set agent.image.tag="$IMAGE_TAG" \
            --set controller.image.repository="$CONTROLLER_IMAGE" \
            --set controller.image.tag="$IMAGE_TAG" \
            --set controller.image.pullPolicy=IfNotPresent \
            --set builds.builderImage.tag="$IMAGE_TAG" \
            --set certManager.existingTLSSecret=ci-tls \
            --set global.region=ci \
            --set global.exporter.endpoint=http://ci.invalid

      - name: Check Helm release status
        run: |
          helm status loco-worker --namespace controller-system
