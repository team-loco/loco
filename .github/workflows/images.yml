name: Images

on:
  workflow_call:
    outputs:
      images:
        description: The pushed images, with * standing for the image name; empty for a pull request from a fork, which cannot push packages.
        value: ${{ jobs.go.outputs.images }}

permissions:
  contents: read

env:
  PUSH: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
  REGISTRY: ghcr.io/${{ github.repository }}
  TAG: ci-${{ github.sha }}
  VERSION: sha-${{ github.sha }}
  GO_IMAGES: controller api agent builder obs-proxy
  # The e2e fixtures, which run only on amd64.
  FIXTURE_IMAGES: api-failover installation-operator

jobs:

  # Each platform compiles its Go binaries natively on the runner, from the Go
  # build cache main saves, and copies them into the images. A push to main
  # tags each platform's images ci-<commit>-<arch>, which the merge job joins
  # into one ci-<commit> index per image.
  go:
    name: Go Images ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      images: ${{ steps.push.outputs.images }}
    strategy:
      matrix:
        arch: ${{ fromJSON(github.event_name == 'push' && '["amd64","arm64"]' || '["amd64"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.PUSH == 'true'
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-tools
        if: env.PUSH == 'true'
        with:
          go-cache: images-${{ matrix.arch }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: env.PUSH == 'true'

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract the image labels
        id: meta
        if: env.PUSH == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=sha,format=long

      - name: Build the Go binaries
        if: env.PUSH == 'true'
        run: mise run images:binaries bin/images "$VERSION"

      - name: Stage the operator fixture tools
        id: operator-tools
        if: env.PUSH == 'true' && matrix.arch == 'amd64'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          if [ "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" != "linux/$ARCH" ]; then
            echo "Operator tools require a native Linux runner matching the image architecture" >&2
            exit 1
          fi
          mkdir -p bin/operator-tools
          for tool in helm kubectl; do
            cp "$(mise which "$tool")" "bin/operator-tools/$tool"
            python3 tools/platform-images/verify.py binary "bin/operator-tools/$tool" "linux/$ARCH"
          done

      - name: Build and push the Go images
        id: push
        if: env.PUSH == 'true'
        env:
          ARCH: ${{ matrix.arch }}
          EVENT: ${{ github.event_name }}
          LABELS: ${{ steps.meta.outputs.bake-file-labels }}
        run: |
          set -euo pipefail
          read -ra targets <<<"$GO_IMAGES"
          if [ "$ARCH" = amd64 ]; then
            read -ra fixtures <<<"$FIXTURE_IMAGES"
            targets+=("${fixtures[@]}")
            export OPERATOR_TOOLS=bin/operator-tools
          fi
          tag=$TAG
          if [ "$EVENT" = push ]; then
            tag=$TAG-$ARCH
          fi
          HELM_VERSION=$(python3 -I -c 'import tomllib; print(tomllib.load(open("mise.toml", "rb"))["tools"]["helm"])')
          KUBECTL_VERSION=$(python3 -I -c 'import tomllib; print(tomllib.load(open("mise.toml", "rb"))["tools"]["kubectl"])')
          export REGISTRY=${REGISTRY,,} PLATFORMS=linux/$ARCH BINARIES=bin/images HELM_VERSION KUBECTL_VERSION
          TAG=$tag docker buildx bake -f docker-bake.hcl -f "$LABELS" --push "${targets[@]}"
          echo "images=$REGISTRY-*:$TAG" >> "$GITHUB_OUTPUT"

  merge:
    name: Merge Go Image Platforms
    needs: go
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag each image's platform images as one index
        run: |
          set -euo pipefail
          registry=${REGISTRY,,}
          for image in $GO_IMAGES; do
            docker buildx imagetools create --tag "$registry-$image:$TAG" "$registry-$image:$TAG-amd64" "$registry-$image:$TAG-arm64"
          done
          for image in $FIXTURE_IMAGES; do
            docker buildx imagetools create --tag "$registry-$image:$TAG" "$registry-$image:$TAG-amd64"
          done

  ui:
    name: UI Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.PUSH == 'true'
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: env.PUSH == 'true'

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract the image labels
        id: meta
        if: env.PUSH == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=sha,format=long

      # A push to main builds both platforms and the staging UI for ci.yml to
      # publish, and writes the build cache pull requests read.
      - name: Build and push the UI images
        if: env.PUSH == 'true'
        env:
          EVENT: ${{ github.event_name }}
          LABELS: ${{ steps.meta.outputs.bake-file-labels }}
        run: |
          set -euo pipefail
          targets=(ui)
          export PLATFORMS=linux/amd64 WRITE_CACHE=false REGISTRY=${REGISTRY,,}
          if [ "$EVENT" = push ]; then
            targets+=(ui-staging)
            PLATFORMS=linux/amd64,linux/arm64
            WRITE_CACHE=true
          fi
          docker buildx bake -f docker-bake.hcl -f "$LABELS" --push "${targets[@]}"
