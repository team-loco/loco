name: Images

on:
  workflow_call:
    outputs:
      images:
        description: The pushed images, with * standing for the image name; empty for a pull request from a fork, which cannot push packages.
        value: ${{ jobs.build.outputs.images }}

permissions:
  contents: read

jobs:

  build:
    name: Build Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      images: ${{ steps.push.outputs.images }}
    env:
      PUSH: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.PUSH == 'true'
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: env.PUSH == 'true'

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract the image labels
        id: meta
        if: env.PUSH == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=sha,format=long

      # A push to main builds every platform and the staging UI for build.yml
      # to publish, and writes the build cache pull requests read.
      - name: Build and push every image for this commit
        id: push
        if: env.PUSH == 'true'
        env:
          EVENT: ${{ github.event_name }}
          LABELS: ${{ steps.meta.outputs.bake-file-labels }}
          REGISTRY: ghcr.io/${{ github.repository }}
          TAG: ci-${{ github.sha }}
          VERSION: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          group=default
          export PLATFORMS=linux/amd64 WRITE_CACHE=false
          if [ "$EVENT" = push ]; then
            group=release
            PLATFORMS=linux/amd64,linux/arm64
            WRITE_CACHE=true
          fi
          HELM_VERSION=$(python3 -I -c 'import tomllib; print(tomllib.load(open("mise.toml", "rb"))["tools"]["helm"])')
          KUBECTL_VERSION=$(python3 -I -c 'import tomllib; print(tomllib.load(open("mise.toml", "rb"))["tools"]["kubectl"])')
          export REGISTRY=${REGISTRY,,} HELM_VERSION KUBECTL_VERSION
          docker buildx bake -f docker-bake.hcl -f "$LABELS" --push "$group"
          echo "images=$REGISTRY-*:$TAG" >> "$GITHUB_OUTPUT"
