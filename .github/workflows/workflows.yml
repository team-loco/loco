name: Workflows

on:
  push:
    branches:
      - main
      - staging
    paths:
      - ".github/workflows/**"
      - "Makefile"
      - "mise.toml"
      - "mise.lock"
      - ".github/actions/setup-tools/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "Makefile"
      - "mise.toml"
      - "mise.lock"
      - ".github/actions/setup-tools/**"

permissions:
  contents: read

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-tools
        with:
          tools: actionlint

      - name: actionlint
        run: make lint-actions
