name: Workflows

on:
  push:
    branches:
      - main
      - staging
    paths:
      - ".github/workflows/**"
      - "Makefile"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "Makefile"

permissions:
  contents: read

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: actionlint
        run: make lint-actions
