name: Workflows

on:
  push:
    branches:
      - main
      - staging
    paths:
      - ".github/workflows/**"
  pull_request:
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: actionlint
        run: |
          docker run --rm -v "$PWD":/repo -w /repo \
            rhysd/actionlint:1.7.12 -color -shellcheck=
