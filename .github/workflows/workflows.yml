name: Workflows

on:
  push:
    branches:
      - main
      - staging
    paths:
      - ".github/workflows/**"
      - "mise.toml"
      - "mise.lock"
      - ".github/actions/setup-tools/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "mise.toml"
      - "mise.lock"
      - ".github/actions/setup-tools/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-tools

      - name: actionlint
        run: mise run lint:actions
