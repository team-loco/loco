name: Python

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Python Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-tools
      - name: Lint and check formatting
        run: |
          mise exec -- ruff check
          mise exec -- ruff format --check
