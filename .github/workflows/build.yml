name: Build

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    uses: ./.github/workflows/test.yml

  docs-check:
    name: Check Documentation
    uses: ./.github/workflows/docs.yml

  push-image:
    name: Build and Push ${{ matrix.name }} Image
    needs: [test, docs-check]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Controller
            image: controller
            dockerfile: ./controller/Dockerfile

          - name: API
            image: api
            dockerfile: ./api/Dockerfile

          - name: Agent
            image: agent
            dockerfile: ./agent/Dockerfile
            build_args: |
              VERSION=${{ github.sha }}

          - name: Builder
            image: builder
            dockerfile: ./builder/Dockerfile

          - name: UI
            image: ui
            dockerfile: ./web/Dockerfile
            build_args: |
              DOCS_ENVIRONMENT=production
              VITE_API_URL=https://api.loco.build
              VITE_APP_ENV=PRODUCTION

          - name: Staging UI
            image: ui
            dockerfile: ./web/Dockerfile
            tag_suffix: ",suffix=-staging"
            build_args: |
              DOCS_ENVIRONMENT=staging
              VITE_API_URL=https://api.staging.loco.build
              VITE_APP_ENV=PRODUCTION
    uses: ./.github/workflows/build-push.yml
    with:
      image_name: ${{ github.repository }}-${{ matrix.image }}
      context: .
      dockerfile: ${{ matrix.dockerfile }}
      tag_suffix: ${{ matrix.tag_suffix || '' }}
      build_args: ${{ matrix.build_args || '' }}

  notify-deploy:
    name: Notify the Deployment Repository
    needs: push-image
    if: vars.DEPLOY_DISPATCH_REPOSITORY != ''
    runs-on: ubuntu-latest
    steps:
      - name: Send the built commit
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          REPOSITORY: ${{ vars.DEPLOY_DISPATCH_REPOSITORY }}
          COMMIT: ${{ github.sha }}
        run: gh api "repos/$REPOSITORY/dispatches" -f event_type=core-images-built -f "client_payload[commit]=$COMMIT"
