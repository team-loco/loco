name: Build

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # CI builds every image for the commit and tests it; publishing waits for
  # that run to pass.
  ci:
    name: Wait for CI
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
    steps:
      - name: Wait for the CI run of this push to pass
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          until run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&head_sha=$COMMIT" \
            --jq '.workflow_runs[0].id // empty') && [ -n "$run" ]; do
            sleep 10
          done
          gh run watch "$run" --repo "$GITHUB_REPOSITORY" --interval 30 --exit-status > /dev/null

  push-image:
    name: Publish ${{ matrix.name }} Image
    needs: ci
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Controller
            image: controller
          - name: API
            image: api
          - name: Agent
            image: agent
          - name: Builder
            image: builder
          - name: Observability Proxy
            image: obs-proxy
          - name: UI
            image: ui
          - name: Staging UI
            image: ui
            tag_suffix: -staging
    uses: ./.github/workflows/build-push.yml
    with:
      image_name: ${{ github.repository }}-${{ matrix.image }}
      tag_suffix: ${{ matrix.tag_suffix || '' }}

  notify-deploy:
    name: Notify the Deployment Repository
    needs: push-image
    if: vars.DEPLOY_DISPATCH_REPOSITORY != ''
    runs-on: ubuntu-latest
    steps:
      - name: Send the built commit
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          REPOSITORY: ${{ vars.DEPLOY_DISPATCH_REPOSITORY }}
          COMMIT: ${{ github.sha }}
        run: gh api "repos/$REPOSITORY/dispatches" -f event_type=core-images-built -f "client_payload[commit]=$COMMIT"
