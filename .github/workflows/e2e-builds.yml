name: Build E2E

on:
  pull_request:
    paths:
      - "agent/**"
      - "builder/**"
      - "controller/**"
      - "k8sapi/**"
      - "proto/loco/agent/**"
      - "proto/loco/build/**"
      - "api/main.go"
      - "api/migrations/**"
      - "api/queries/build.sql"
      - "api/service/agent.go"
      - "api/service/build*.go"
      - "api/service/sync.go"
      - "api/pkg/clusternotify/**"
      - "api/pkg/sourcebucket/**"
      - "charts/loco-worker/**"
      - "manifests/namespaces/**"
      - "dev/compose.yaml"
      - "dev/api.env"
      - "dev/openbao/**"
      - "tests/conformance/transit/compose.yaml"
      - "dev/registry/**"
      - "mise-tasks/cluster/registry"
      - "mise-tasks/cluster/build-egress"
      - "tests/e2e/**"
      - "mise-tasks/e2e/**"
      - "mise-tasks/crds/**"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "proto/loco/observability/**"
      - "api/queries/cluster.sql"
      - "mise.toml"
      - "mise.lock"
      - ".github/actions/setup-tools/**"
      - ".github/workflows/e2e-builds.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  e2e:
    name: Build E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-tools
        with:
          go-cache: e2e

      - name: Run the build end-to-end tests
        run: ./tests/e2e/run.sh --no-teardown build

  e2e-builds-disabled:
    name: Build E2E (builds disabled)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-tools
        with:
          go-cache: e2e

      - name: Run the end-to-end tests for an install without builds
        run: ./tests/e2e/run.sh --no-teardown --builds-disabled builds_disabled

  e2e-attachment:
    name: Cluster Attachment E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-tools
        with:
          go-cache: e2e

      - name: Run cluster attachment, lifecycle and rotation tests
        run: ./tests/e2e/run.sh --no-teardown --builds-disabled cluster_attachment
