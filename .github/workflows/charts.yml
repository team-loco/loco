name: Charts

on:
  workflow_call:
    inputs:
      images:
        description: Prebuilt images, with * standing for the image name; empty builds them here.
        type: string
        default: ""

permissions:
  contents: read

jobs:

  checks:
    name: Chart Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - name: Lint the charts changed since the event base with ct
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # ct reads both changed files and old chart versions through this ref.
          git update-ref refs/remotes/origin/chart-lint-base "$BASE"
          mise run lint:charts --target-branch chart-lint-base

      - name: Run each chart's helm-unittest suites
        if: ${{ !cancelled() }}
        run: mise run test:charts
      - name: Test the collector configuration and log severity
        if: ${{ !cancelled() }}
        run: mise run test:collectors

  # One install of the controlplane shard runs the control-plane chart, certificate and platform
  # telemetry suites side by side.
  e2e:
    name: Control Plane E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      E2E_RUN_ID: ci
      E2E_IMAGES: ${{ inputs.images }}
      E2E_VERSION: ${{ inputs.images != '' && format('sha-{0}', github.sha) || 'e2e' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-tools
        with:
          go-cache: e2e
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: inputs.images != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The runner is discarded with the run, so --keep skips the teardown.
      - name: Run the shard
        run: mise run e2e --keep controlplane
