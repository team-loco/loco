name: Charts

on:
  workflow_call:
    inputs:
      images:
        description: Prebuilt images, with * standing for the image name; empty builds them here.
        type: string
        default: ""

permissions:
  contents: read

jobs:

  checks:
    name: Chart Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - name: Lint the charts changed since main with ct
        run: mise run lint:charts

      - name: Run each chart's helm-unittest suites
        if: ${{ !cancelled() }}
        run: mise run test:charts
      - name: Test the collector configuration and log severity
        if: ${{ !cancelled() }}
        run: mise run test:collectors

  certificates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-tools
      - run: mise run e2e:certificates

  control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-tools
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: inputs.images != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          E2E_IMAGES: ${{ inputs.images }}
          E2E_VERSION: ${{ inputs.images != '' && format('sha-{0}', github.sha) || 'e2e' }}
        run: mise run e2e:control-plane
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: control-plane-evidence
          path: |
            tests/e2e/runs/loco-cp-*/diagnostics.txt
            tests/e2e/runs/loco-cp-*/postgres-migrations.txt
            tests/e2e/runs/loco-cp-*/observability.json
            tests/e2e/runs/loco-cp-*/config.json

  cluster-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-tools
      - run: mise run e2e:cluster-metrics
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cluster-metrics-evidence
          path: |
            tests/e2e/runs/loco-metrics-*/result.txt
            tests/e2e/runs/loco-metrics-*/diagnostics.txt
