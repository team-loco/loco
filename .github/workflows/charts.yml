name: Charts

on:
  push:
    branches:
      - main
    paths: &paths
      - "charts/**"
      - ".ct.yaml"
      - "mise-tasks/lint/charts"
      - "mise-tasks/chart/schema"
      - "tests/pyproject.toml"
      - "tests/uv.lock"
      - "tests/collector/**"
      - "tests/e2e/certificates.sh"
      - "tests/e2e/control-plane.sh"
      - "tests/e2e/control-plane-values.yaml"
      - "tests/e2e/api-failover.py"
      - "tests/e2e/cluster-metrics.py"
      - "tests/e2e/fixtures/api-failover/**"
      - "tests/e2e/fixtures/control-plane/**"
      - "tests/conformance/transit/compose.yaml"
      - "dev/compose.yaml"
      - "dev/api.env"
      - "dev/openbao/**"
      - "controller/config/crd/**"
      - "mise-tasks/crds/**"
      - "mise.toml"
      - "mise.lock"
      - ".github/actions/setup-tools/**"
      - ".github/workflows/charts.yml"
  pull_request:
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  lint:
    name: Lint Charts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - name: Lint the charts changed since main with ct
        run: mise run lint:charts

  test:
    name: Test Charts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - name: Run each chart's helm-unittest suites
        run: mise run test:charts

  collectors:
    name: Test Collector Configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - name: Test the collector configuration and log severity
        run: mise run test:collectors

  certificates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-tools
      - run: mise run e2e:certificates

  control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-tools
      - run: mise run e2e:control-plane
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: control-plane-evidence
          path: |
            tests/e2e/runs/loco-cp-*/diagnostics.txt
            tests/e2e/runs/loco-cp-*/postgres-migrations.txt
            tests/e2e/runs/loco-cp-*/observability.json
            tests/e2e/runs/loco-cp-*/config.json

  cluster-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-tools
      - run: mise run e2e:cluster-metrics
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cluster-metrics-evidence
          path: |
            tests/e2e/runs/loco-metrics-*/result.txt
            tests/e2e/runs/loco-metrics-*/diagnostics.txt
