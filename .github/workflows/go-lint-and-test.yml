name: Go Lint and Tests

on:
  workflow_call:
    inputs:
      modules:
        description: JSON list of the directories of the Go modules the changes affect.
        required: true
        type: string

permissions:
  contents: read

jobs:

  modules:
    name: Lint and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-tools
        with:
          go-cache: go
          lint-cache: true
          image-cache: true

      # Every affected module is linted and tested even after one fails. The E2E
      # workflow runs the cluster-backed suites separately.
      - name: Lint and test each module the changes affect
        env:
          MODULES: ${{ inputs.modules }}
        run: |
          set -uo pipefail
          status=0
          for entry in api "cmd test:cli" ". test:shared" "controller test:controller" "agent test:agent" \
            "builder test:builder" "k8sapi test:k8sapi" "observability-proxy test:counter-metrics" "tests/e2e test:e2e-platform" \
            "tools/terminal-evidence test:terminal-evidence"; do
            read -r module task <<<"$entry"
            jq -e --arg module "$module" 'any(.[]; . == $module)' <<<"$MODULES" >/dev/null || continue
            echo "::group::Lint $module"
            mise run lint:go "$module" || { echo "::error::golangci-lint failed in $module"; status=1; }
            echo "::endgroup::"
            if [ -n "$task" ]; then
              echo "::group::Test $module"
              mise run "$task" || { echo "::error::$task failed"; status=1; }
              echo "::endgroup::"
            fi
          done
          exit "$status"

      - name: Check the API docs scripts against the files their URLs serve
        if: ${{ !cancelled() }}
        run: mise run lint:sri

  api:
    name: API Tests
    if: contains(fromJSON(inputs.modules), 'api')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      LOCO_TEST_DATABASE_URL: postgres://loco_test:loco_test@localhost:5432/loco_test?sslmode=disable

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-tools
        with:
          go-cache: test-api
          image-cache: true

      - name: Start Postgres
        run: docker compose -f .github/compose.api-tests.yaml up -d --wait

      - name: Run tests
        run: mise run test:api
        timeout-minutes: 10

      - name: Display coverage
        if: always()
        run: cd api && go tool cover -func=coverage.out
