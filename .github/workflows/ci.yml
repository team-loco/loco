# Runs every check for a pull request or a push to main, and reports one
# result, the CI Gate job, which branch protection requires. Each check is a
# reusable workflow called only when the changes job finds a file matching its
# list in .github/ci-paths.yml; a skipped call passes the gate. A check whose
# pass marker for the same inputs a push to main saved is skipped too; on a
# push to main, the pass-markers job saves one for each check that passed. Path
# filters on the called workflows' own triggers would leave a required check
# without a result whenever they skipped it. After a push to main passes the
# gate, the publish jobs tag the images Images built and notify the
# deployment repository.
name: CI

on:
  # Every run evaluates every check for its commit, because protection reads
  # the newest CI Gate result on it. `ready_for_review` is a full run that lets
  # Docs Drift review a pull request leaving draft; label events are left out
  # because nothing needs a fresh run for them (see buf.yml for break-buf).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}-${{ github.event.pull_request.head.sha || github.sha }}
  # Base/head updates in a stack can enqueue two runs for the same head. Let
  # the active run finish so automatic cancellation cannot fail its always gate.
  # The concurrency group retains only the newest pending run for the head.
  # Runs for an older head of the PR are cancelled by the changes job instead.
  cancel-in-progress: false

jobs:

  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    outputs:
      auth-conformance: ${{ steps.select.outputs.auth-conformance }}
      buf: ${{ steps.select.outputs.buf }}
      charts: ${{ steps.select.outputs.charts }}
      controller-helm-chart: ${{ steps.select.outputs.controller-helm-chart }}
      docker: ${{ steps.select.outputs.docker }}
      docs-drift: ${{ steps.select.outputs.docs-drift }}
      docs: ${{ steps.select.outputs.docs }}
      e2e: ${{ steps.select.outputs.e2e }}
      e2e-installation: ${{ steps.select.outputs.e2e-installation }}
      go-lint-and-test: ${{ steps.select.outputs.go-lint-and-test }}
      govulncheck: ${{ steps.select.outputs.govulncheck }}
      images: ${{ steps.select.outputs.images }}
      obs-chart: ${{ steps.select.outputs.obs-chart }}
      osv: ${{ steps.select.outputs.osv }}
      platform-release: ${{ steps.select.outputs.platform-release }}
      transit-conformance: ${{ steps.select.outputs.transit-conformance }}
      web: ${{ steps.select.outputs.web }}
      workflows: ${{ steps.select.outputs.workflows }}
      markers: ${{ steps.select.outputs.markers }}
    steps:
      # Protection reads only the newest head's CI Gate, so a run for a head the
      # PR has replaced is wasted runner time. Only older runs are cancelled: a
      # run for a replaced head that starts late must not cancel the newer one.
      # A fork's token cannot cancel runs.
      - name: Cancel runs for heads this pull request replaced
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          gh api --method GET --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f event=pull_request -f branch="$BRANCH" -F per_page=100 \
            --jq ".workflow_runs[] | select(.status != \"completed\" and .head_sha != \"$HEAD\" and .run_number < $RUN_NUMBER) | .id" |
            while read -r id; do
              echo "Cancelling run $id"
              # A run can complete between the listing and the cancel.
              gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel" ||
                echo "::warning::Could not cancel run $id"
            done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-tools
        with:
          go-cache: ci-changes

      # A run restores caches of its own ref, a pull request's base branch and
      # the default branch.
      - name: Select the workflows the changed files need
        id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          MARKER_REFS: refs/heads/${{ github.event.repository.default_branch }}
        run: go run ./tools/ci-changes -event "$GITHUB_EVENT_NAME" -base "$BASE" -head "$HEAD" -marker-refs "$MARKER_REFS"

  auth-conformance:
    name: Auth Conformance
    needs: [changes]
    if: needs.changes.outputs.auth-conformance == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/auth-conformance.yml

  buf:
    name: Buf
    needs: [changes]
    if: needs.changes.outputs.buf == 'true'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/buf.yml
    secrets: inherit

  charts:
    name: Charts
    needs: [changes, images]
    if: needs.changes.outputs.charts == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/charts.yml
    with:
      images: ${{ needs.images.outputs.images }}

  controller-helm-chart:
    name: Controller Helm Chart Tests
    needs: [changes]
    if: needs.changes.outputs.controller-helm-chart == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/controller-helm-chart.yml

  docker:
    name: Docker
    needs: [changes, images]
    if: needs.changes.outputs.docker == 'true'
    permissions:
      contents: read
      packages: read
      security-events: write
    uses: ./.github/workflows/docker.yml
    with:
      images: ${{ needs.images.outputs.images }}

  docs-drift:
    name: Docs Drift
    needs: [changes]
    if: needs.changes.outputs.docs-drift == 'true'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/docs-drift.yml
    secrets: inherit

  docs:
    name: Documentation
    needs: [changes]
    if: needs.changes.outputs.docs == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/docs.yml

  e2e:
    name: E2E
    needs: [changes, images]
    if: needs.changes.outputs.e2e == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/e2e.yml
    with:
      images: ${{ needs.images.outputs.images }}

  e2e-installation:
    name: Installation E2E
    needs: [changes, images]
    if: needs.changes.outputs.e2e-installation == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/e2e-installation.yml
    with:
      images: ${{ needs.images.outputs.images }}

  go-lint-and-test:
    name: Go Lint and Tests
    needs: [changes]
    if: needs.changes.outputs.go-lint-and-test == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/go-lint-and-test.yml

  govulncheck:
    name: Go Vulnerabilities
    needs: [changes]
    if: needs.changes.outputs.govulncheck == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/govulncheck.yml

  images:
    name: Images
    needs: [changes]
    if: needs.changes.outputs.images == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml

  obs-chart:
    name: Observability Chart
    needs: [changes]
    if: needs.changes.outputs.obs-chart == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/obs-chart.yml

  osv:
    name: OSV
    needs: [changes, images]
    if: needs.changes.outputs.osv == 'true'
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    uses: ./.github/workflows/osv.yml
    with:
      images: ${{ needs.images.outputs.images }}

  platform-release:
    name: Publish platform artifacts
    needs: [changes]
    if: needs.changes.outputs.platform-release == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/platform-release.yml

  transit-conformance:
    name: Transit Conformance
    needs: [changes]
    if: needs.changes.outputs.transit-conformance == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/transit-conformance.yml

  web:
    name: Web
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/web.yml

  workflows:
    name: Workflows
    needs: [changes]
    if: needs.changes.outputs.workflows == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/workflows.yml

  gate:
    name: CI Gate
    needs:
      - changes
      - auth-conformance
      - buf
      - charts
      - controller-helm-chart
      - docker
      - docs-drift
      - docs
      - e2e
      - e2e-installation
      - go-lint-and-test
      - govulncheck
      - images
      - obs-chart
      - osv
      - platform-release
      - transit-conformance
      - web
      - workflows
    # always() rather than !cancelled(): a cancelled run must report a failed
    # gate, since a skipped job counts as passing.
    if: always()
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.passed.outputs.passed }}
    steps:
      - name: List the checks that ran and passed
        id: passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          MARKERS: ${{ needs.changes.outputs.markers || '{}' }}
        run: |
          passed=$(jq -c --argjson needs "$NEEDS" '[to_entries[] | select($needs[.key].result == "success") | {check: .key, key: .value}]' <<<"$MARKERS")
          echo "passed=$passed" >> "$GITHUB_OUTPUT"

      # Only success and skipped pass: a job the runner abandons reports
      # "abandoned", and if changes never ran every check is skipped.
      - name: Fail unless changes ran and every check passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e '.changes.result == "success" and all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS" > /dev/null

  publish:
    name: Publish ${{ matrix.name }} Image
    needs: [images, gate]
    # A skipped check upstream of the gate would skip this job without !cancelled().
    if: ${{ !cancelled() && github.event_name == 'push' && needs.gate.result == 'success' && needs.images.result == 'success' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Controller
            image: controller
          - name: API
            image: api
          - name: Agent
            image: agent
          - name: Builder
            image: builder
          - name: Observability Proxy
            image: obs-proxy
          - name: UI
            image: ui
          - name: Staging UI
            image: ui
            tag_suffix: -staging
    uses: ./.github/workflows/build-push.yml
    with:
      image_name: ${{ github.repository }}-${{ matrix.image }}
      tag_suffix: ${{ matrix.tag_suffix || '' }}

  notify-deploy:
    name: Notify the Deployment Repository
    needs: [gate, publish]
    if: ${{ !cancelled() && vars.DEPLOY_DISPATCH_REPOSITORY != '' && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Send the built commit
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          REPOSITORY: ${{ vars.DEPLOY_DISPATCH_REPOSITORY }}
          COMMIT: ${{ github.sha }}
        run: gh api "repos/$REPOSITORY/dispatches" -f event_type=core-images-built -f "client_payload[commit]=$COMMIT"

  pass-markers:
    name: Pass Marker ${{ matrix.check }}
    needs: [gate]
    if: always() && github.event_name == 'push' && needs.gate.outputs.passed != '' && needs.gate.outputs.passed != '[]'
    runs-on: ubuntu-latest
    permissions: {}
    strategy:
      matrix:
        include: ${{ fromJSON(needs.gate.outputs.passed) }}
    steps:
      - name: Write the marker
        env:
          KEY: ${{ matrix.key }}
        run: printf '%s\n' "$KEY" > pass-marker

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: pass-marker
          key: ${{ matrix.key }}
