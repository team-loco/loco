version: "2"
output:
  formats:
    text:
      print-linter-name: true
      print-issued-lines: true
      colors: true
  show-stats: true
  sort-order:
    - severity
run:
  timeout: "1m"
  issues-exit-code: 1
  tests: true
  allow-parallel-runners: true
  go: "1.27"
  relative-path-mode: wd
linters:
  exclusions:
    paths:
      - "web/node_modules"
    rules:
      - { linters: [errcheck], source: "^\\s*defer\\s+" }
      - { linters: [govet], text: "fieldalignment" }
      # ST1005 flags capitalized error strings; "Docker" is a proper noun here.
      - { linters: [staticcheck], text: "ST1005", path: "internal/docker/" }
      - { linters: [lll], source: "^\\s*// \\+kubebuilder:" }
      - { linters: [lll], source: "^\\s*// https?://\\S+$" }
      - { linters: [fatcontext], path: "suite_test\\.go$" }
      - { linters: [gosec], text: "G306|G703", path: "_test\\.go$" }
      - { linters: [gosec], text: "G101", path: "internal/controller/" }
      - { linters: [gosec], text: "G302", path: "cmd/loco/update\\.go$" }
  default: standard
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - copyloopvar
    - dupl
    - durationcheck
    - errchkjson
    - errorlint
    - exptostd
    - fatcontext
    - ginkgolinter
    - gocheckcompilerdirectives
    - gocritic
    - gosec
    - goconst
    - gocyclo
    - intrange
    - lll
    - loggercheck
    - makezero
    - mirror
    - misspell
    - modernize
    - musttag
    - nakedret
    - nilerr
    - nilnesserr
    - noctx
    - nolintlint
    - nosprintfhostport
    - perfsprint
    - prealloc
    - protogetter
    - predeclared
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - testifylint
    - thelper
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - "(*bytes.Buffer).Write"
        - "fmt.Print"
        - "fmt.Println"
        - "fmt.Printf"
        - "fmt.Fprint"
        - "fmt.Fprintln"
        - "fmt.Fprintf"
        - "charm.land/lipgloss/v2.Fprint"
        - "charm.land/lipgloss/v2.Fprintln"
        - "charm.land/lipgloss/v2.Fprintf"

    errchkjson:
      report-no-exported: true

    gocritic:
      enabled-tags:
        - diagnostic
      disabled-checks:
        - exitAfterDefer
        - sloppyReassign

    gosec:
      excludes:
        - G104
        - G115
        - G117
        - G204
        - G304
        - G706

    govet:
      enable-all: true

    loggercheck:
      require-string-key: true
      no-printf-like: true

    misspell:
      locale: US

    nolintlint:
      require-specific: true

    perfsprint:
      err-error: true
      strconcat: false

    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
        - name: var-naming
        - name: early-return
        - name: unused-parameter
        - name: unused-receiver

    testifylint:
      enable-all: true

    unparam:
      check-exported: false

    unused:
      field-writes-are-uses: true
      exported-fields-are-used: true

    usestdlibvars:
      http-method: true
      http-status-code: true
      time-weekday: true
      time-month: true
      time-layout: true
      crypto-hash: true
      default-rpc-path: true
      sql-isolation-level: true
      tls-signature-scheme: true
      constant-kind: true
formatters:
  enable:
    - gofmt
    - goimports
    - golines
  settings:
    golines:
      max-len: 120
  exclusions:
    generated: lax
    paths:
      - "web/node_modules"
      - third_party$
      - builtin$
      - examples$
