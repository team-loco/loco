version: "2"
sql:
  - schema: "./migrations"
    queries: "./queries"
    engine: "postgresql"
    gen:
      go:
        out: "./gen/db"
        package: "db"
        emit_prepared_queries: true
        sql_package: "pgx/v5"
        sql_driver: "github.com/jackc/pgx/v5"
        emit_interface: true
        emit_json_tags: true
        json_tags_case_style: camel
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"

          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true

          - db_type: "entity_scope"
            go_type:
              import: ""
              type: "EntityScope"

          - db_type: "entity_scope[]"
            go_type:
              import: ""
              type: "EntityScope"
              slice: true

          - column: "user_scopes.scope"
            go_type:
              import: ""
              type: "Scope"

          - column: "user_with_scopes_view.scopes"
            go_type:
              import: ""
              type: "[]EntityScope"

          - column: "api_tokens.scopes"
            go_type:
              import: ""
              type: "[]EntityScope"
