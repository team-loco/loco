<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{.Subject}}</title>
</head>
<body style="margin:0;padding:0;background:#f5f6f8;color:#16191f;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f5f6f8;">
<tr><td align="center" style="padding:32px 16px;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:480px;background:#ffffff;border:1px solid #dde0e6;border-radius:8px;">
<tr><td style="padding:28px 28px 8px;font-size:13px;font-weight:700;letter-spacing:0.04em;color:#4a5160;">LOCO</td></tr>
<tr><td style="padding:8px 28px 0;font-size:20px;font-weight:700;line-height:1.3;">{{.Heading}}</td></tr>
{{range .Paragraphs}}<tr><td style="padding:12px 28px 0;font-size:15px;line-height:1.55;color:#4a5160;">{{.}}</td></tr>
{{end}}{{if .Code}}<tr><td style="padding:20px 28px 0;"><div style="font-family:ui-monospace,Menlo,monospace;font-size:24px;font-weight:700;letter-spacing:0.2em;">{{.Code}}</div></td></tr>
{{end}}{{if .ActionURL}}<tr><td style="padding:24px 28px 0;"><a href="{{.ActionURL}}" style="display:inline-block;background:#16191f;color:#ffffff;text-decoration:none;font-size:15px;font-weight:600;padding:11px 18px;border-radius:6px;">{{.ActionLabel}}</a></td></tr>
<tr><td style="padding:16px 28px 0;font-size:13px;line-height:1.5;color:#7a8191;word-break:break-all;">Or open this link: {{.ActionURL}}</td></tr>
{{end}}{{if .Footnote}}<tr><td style="padding:20px 28px 0;font-size:13px;line-height:1.5;color:#7a8191;">{{.Footnote}}</td></tr>
{{end}}<tr><td style="padding:24px 28px 28px;font-size:12px;color:#7a8191;">Sent to {{.To}}</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
