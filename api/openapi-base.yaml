openapi: 3.1.0
info:
  title: Loco API
  # the API replaces this placeholder with its build version at startup.
  version: (unbuilt)
  description: Deploy applications and manage workspaces, environments, and resources through Loco's Connect RPC API.
paths: {}
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: An API token from `loco token create`, or the session token from `loco token show --raw`.
security:
  - bearer: []
