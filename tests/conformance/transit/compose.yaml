name: loco-transit-conformance

services:
  openbao:
    image: ${OPENBAO_IMAGE:?}
    command: ["server", "-dev", "-dev-root-token-id=loco-conformance-root", "-dev-listen-address=0.0.0.0:8200"]
    environment:
      SKIP_SETCAP: "true"
      BAO_ADDR: http://127.0.0.1:8200
    ports:
      - "${CONFORMANCE_OPENBAO_PORT:-58200}:8200"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 1s
      timeout: 3s
      retries: 30

  vault:
    image: hashicorp/vault:2.2.1@sha256:962a92876e168d68eaaa24b0b8b49bbce1cb63024060a67bba95cd158a366fc2
    command: ["server", "-dev", "-dev-root-token-id=loco-conformance-root", "-dev-listen-address=0.0.0.0:8200"]
    environment:
      SKIP_SETCAP: "true"
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - "${CONFORMANCE_VAULT_PORT:-58201}:8200"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 1s
      timeout: 3s
      retries: 30
