services:
  dex:
    environment:
      E2E_AUTH_ISSUER: ${E2E_AUTH_ISSUER:?}
    volumes: !override
      - ${E2E_ROOT_DIR:?}/tests/e2e/fixtures/auth/dex.yaml:/etc/dex/config.yaml:ro
  registry:
    networks:
      default:
      kind:
        aliases:
          - ${E2E_REGISTRY_ALIAS:?}
  public-image-registry:
    extends:
      file: ${E2E_ROOT_DIR:?}/dev/compose.yaml
      service: registry
    ports: !override
      - "127.0.0.1::5000"
    volumes: !override
      - ${E2E_ROOT_DIR:?}/tests/e2e/fixtures/public-image/registry.json:/etc/zot/config.json:ro
    networks: !override
      default:
      kind:
        aliases:
          - ${E2E_PUBLIC_REGISTRY_ALIAS:?}
  s3:
    networks:
      default:
      kind:
        aliases:
          - ${E2E_S3_ALIAS:?}

networks:
  kind:
    external: true
