apiVersion: v1
kind: ConfigMap
metadata: {name: loco-control-plane-values, namespace: flux-system}
data:
  values.yaml: |
{{ indent .ControlPlane 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: loco-worker-values, namespace: flux-system}
data:
  values.yaml: |
{{ indent .Worker 4 }}
---
apiVersion: v1
kind: Secret
metadata: {name: loco-api-env, namespace: loco-system}
stringData:
  DATABASE_URL: postgresql://loco:fixture-database-canary@postgres.installation-fixtures.svc.cluster.local:5432/loco?sslmode=disable
  LOCO_SOURCE_BUCKET_ACCESS_KEY_ID: fixture-access
  LOCO_SOURCE_BUCKET_SECRET_ACCESS_KEY: fixture-source-canary
  LOCO_REGISTRY_USERNAME: api
  LOCO_REGISTRY_PASSWORD: loco-dev-api
---
apiVersion: v1
kind: Secret
metadata: {name: loco-openbao-seal, namespace: loco-system}
stringData: {key: {{ .SealKey | quote }}}
---
apiVersion: v1
kind: Secret
metadata: {name: loco-clickhouse-operator, namespace: loco-system}
stringData: {username: loco_operator, password: fixture-clickhouse-operator}
{{ range .ClickHouseUsers }}
---
apiVersion: v1
kind: Secret
metadata: {name: loco-clickhouse-{{ . }}, namespace: loco-system}
stringData:
  password: fixture-clickhouse-{{ . }}
  url: clickhouse://loco_{{ . }}:fixture-clickhouse-{{ . }}@clickhouse-loco-clickhouse.loco-system.svc.cluster.local:9000
{{ end }}
---
apiVersion: v1
kind: Secret
metadata: {name: loco-registry-push, namespace: loco-system}
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{"registry.installation.localhost:5000":{"auth":{{ .PushAuth | quote }}}}}'
---
apiVersion: v1
kind: Secret
metadata: {name: loco-registry-pull, namespace: loco-system}
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{"registry.installation.localhost:5000":{"auth":{{ .PullAuth | quote }}}}}'
