envoyProxy:
  tls: {minVersion: "1.3"}
metrics-server:
  enabled: true
  args: [--kubelet-insecure-tls]
agent:
  joinToken: {existingSecret: loco-worker-enrollment}
builds:
  privateEgress: {{ .PrivateEgress | json }}
  pushSecretName: loco-registry-push
  insecureRegistry: true
registry:
  auth: static
  pullSecretName: loco-registry-pull
global:
  exporter:
    endpoint: http://ingest.installation.test
env:
  LOCO_REGISTRY_HOST: registry.installation.localhost:5000
certManager:
  issuer: {create: false, name: installation-ca, kind: ClusterIssuer}
