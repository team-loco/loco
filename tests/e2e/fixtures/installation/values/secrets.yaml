apiVersion: v1
kind: Secret
metadata: {name: loco-registry-push, namespace: loco-system}
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{"registry.installation.localhost:5000":{"auth":{{ .PushAuth | quote }}}}}'
---
apiVersion: v1
kind: Secret
metadata: {name: loco-registry-pull, namespace: loco-system}
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{"registry.installation.localhost:5000":{"auth":{{ .PullAuth | quote }}}}}'
