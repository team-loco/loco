apiVersion: v1
kind: Pod
metadata: {name: installation-network-probe, namespace: {{ .Namespace }}}
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile: {type: RuntimeDefault}
  containers:
  - name: probe
    image: {{ .Image | quote }}
    command: [sleep, '300']
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: {drop: [ALL]}
