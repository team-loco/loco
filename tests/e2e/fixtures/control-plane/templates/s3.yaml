apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: s3
  template:
    metadata:
      labels:
        app: s3
    spec:
      containers:
        - name: s3
          image: {{ required "rcloneImage is required" .Values.rcloneImage | quote }}
          command: [sh, -c]
          args:
            - mkdir -p "/data/$BUCKET" && exec rclone serve s3 --addr :8080 --auth-key "$ACCESS_KEY_ID,$SECRET_ACCESS_KEY" /data
          env:
            - name: BUCKET
              value: {{ required "snapshotBucket is required" .Values.snapshotBucket | quote }}
            - name: ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ required "snapshotSecret is required" .Values.snapshotSecret | quote }}
                  key: {{ required "snapshotAccessKeyIdKey is required" .Values.snapshotAccessKeyIdKey | quote }}
            - name: SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.snapshotSecret | quote }}
                  key: {{ required "snapshotSecretAccessKeyKey is required" .Values.snapshotSecretAccessKeyKey | quote }}
          readinessProbe:
            tcpSocket:
              port: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: s3
spec:
  selector:
    app: s3
  ports:
    - port: 8080
