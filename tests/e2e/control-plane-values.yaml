controlPlaneHostname: api.e2e.test.local
gatewayNamespace: loco-control-plane
certManager:
  enabled: false
gateway:
  # The failover check reads the admin stats of the one Envoy that the port-forwarded requests reach.
  replicaCount: 1
  autoscaling:
    enabled: false
  service:
    type: NodePort
    externalTrafficPolicy: Cluster
    patch:
      type: StrategicMerge
      value:
        spec:
          ports:
            - port: 80
              nodePort: 30080
ui:
  hostname: app.e2e.test.local
  image:
    repository: loco-ui
    tag: e2e
  imagePullPolicy: Never
api:
  image:
    repository: loco-api
    tag: e2e
  imagePullPolicy: Never
  existingSecret: api-env
  replicaCount: 2
  # Leave room for the extra API/proxy replica during rollouts on the shared single CI node.
  resources:
    requests:
      cpu: 100m
  registry:
    auth: token
  env:
    ORG_LINKS: '[{"label":"Support","url":"https://support.e2e.test.local/orgs/{orgId}"}]'
obsProxy:
  image:
    repository: loco-obs-proxy
    tag: e2e
  imagePullPolicy: Never
  ingest:
    hostname: ingest.e2e.test.local
clickhouse:
  enabled: true
  clickhouse:
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 1Gi
    settings:
      mark_cache_size: "67108864"
      index_mark_cache_size: "67108864"
      primary_index_cache_size: "67108864"
      uncompressed_cache_size: "0"
      background_schedule_pool_size: "16"
      max_concurrent_queries: "100"
registry:
  enabled: true
  hostname: registry.e2e.test.local
  storage:
    volume:
      size: 1Gi
postgres:
  enabled: true
  instances: 1
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
openbao:
  replicas: 1
  storage:
    size: 1Gi
  seal:
    static:
      existingSecret:
        name: openbao-seal
  recovery:
    shares: 1
    threshold: 1
  snapshots:
    s3:
      endpoint: http://s3:8080
      bucket: openbao-snapshots
      existingSecret:
        name: snapshot-s3

platformTelemetry:
  enabled: true
  region: local-1
