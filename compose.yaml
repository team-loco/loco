name: loco-dev

x-postgres-env: &postgres-env
  POSTGRES_USER: ${POSTGRES_USER:-loco_user}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loco_password}
  POSTGRES_DB: ${POSTGRES_DB:-loco}

services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment: *postgres-env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 120s
      start_interval: 1s

  valkey:
    image: valkey/valkey:8.1.10-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

  registry:
    image: ghcr.io/project-zot/zot:v2.1.22@sha256:96cda11459ce6f8c60da3b03f03e9f67fd11b3ae2d82c4c04c92b3c608996080
    ports:
      - "${REGISTRY_PORT:-5001}:5000"
    volumes:
      - ./registry/local/config.json:/etc/zot/config.json:ro
      - ./registry/local/htpasswd:/etc/zot/htpasswd:ro
      - registry-data:/var/lib/registry

  s3:
    image: versity/versitygw:v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499
    environment:
      ROOT_ACCESS_KEY: ${LOCO_SOURCE_BUCKET_ACCESS_KEY_ID:-loco-dev}
      ROOT_SECRET_KEY: ${LOCO_SOURCE_BUCKET_SECRET_ACCESS_KEY:-loco-dev-secret}
      VGW_REGION: ${LOCO_SOURCE_BUCKET_REGION:-us-east-1}
      VGW_PORT: :${S3_PORT:-9000}
      SOURCE_BUCKET: ${LOCO_SOURCE_BUCKET:-loco-sources}
    ports:
      - "${S3_PORT:-9000}:${S3_PORT:-9000}"
    volumes:
      - s3-data:/data
    entrypoint: ["sh", "-c"]
    command:
      - |
        mkdir -p "/data/$$SOURCE_BUCKET"
        exec versitygw posix /data

  dex:
    image: ghcr.io/dexidp/dex:v2.46.0@sha256:933fcd3f523338c847b88ef84a7145fb2fcb7b9917f08418612afeaaa2001777
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports:
      - "${DEX_PORT:-5556}:5556"
    environment:
      WEB_URL: ${WEB_URL:-http://localhost:5173}
      DEX_PORT: ${DEX_PORT:-5556}
      GH_OAUTH_CLIENT_ID: ${GH_OAUTH_CLIENT_ID:-}
      GH_OAUTH_CLIENT_SECRET: ${GH_OAUTH_CLIENT_SECRET:-}
    volumes:
      - ./env/local/dex.yaml:/etc/dex/config.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5556/dex/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

  seed:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *postgres-env
      PGHOST: postgres
      SEED_FILE: ${SEED_FILE:-api/seed/local.sql}
      AGENT_TOKEN: ${AGENT_TOKEN:-}
    volumes:
      - .:/repo:ro
    working_dir: /repo
    entrypoint: ["sh", "-c"]
    command:
      - |
        export PGUSER="$$POSTGRES_USER" PGPASSWORD="$$POSTGRES_PASSWORD" PGDATABASE="$$POSTGRES_DB"
        if [ -z "$$AGENT_TOKEN" ]; then
          echo "AGENT_TOKEN is not set; the seeded cluster's agent authenticates with it" >&2
          exit 1
        fi
        echo "seeding $$SEED_FILE"
        psql -q -v ON_ERROR_STOP=1 -v agent_token="$$AGENT_TOKEN" -f "$$SEED_FILE"

volumes:
  postgres-data:
  registry-data:
  s3-data:
