name: loco-dev

x-postgres-env: &postgres-env
  POSTGRES_USER: ${POSTGRES_USER:-loco_user}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loco_password}
  POSTGRES_DB: ${POSTGRES_DB:-loco}

services:
  postgres:
    image: postgres:18.6-alpine
    environment: *postgres-env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 1s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:8.1.10-alpine
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

  auth-db:
    image: postgres:18.6-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *postgres-env
      PGHOST: postgres
    volumes:
      - ./env/local/auth-db.sql:/auth-db.sql:ro
    entrypoint: ["sh", "-c"]
    command:
      - PGUSER="$$POSTGRES_USER" PGPASSWORD="$$POSTGRES_PASSWORD" PGDATABASE="$$POSTGRES_DB" psql -q -v ON_ERROR_STOP=1 -f /auth-db.sql

  auth:
    image: supabase/gotrue:v2.197.0
    depends_on:
      auth-db:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    ports:
      - "${AUTH_PORT:-9999}:9999"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      PORT: "9999"
      API_EXTERNAL_URL: http://localhost:${AUTH_PORT:-9999}
      GOTRUE_DB_DRIVER: postgres
      DATABASE_URL: postgres://supabase_auth_admin:supabase_auth_admin@postgres:5432/loco_auth
      GOTRUE_SITE_URL: ${WEB_URL:-http://localhost:5173}
      GOTRUE_URI_ALLOW_LIST: ${WEB_URL:-http://localhost:5173}/**
      GOTRUE_JWT_ISSUER: http://localhost:${AUTH_PORT:-9999}
      GOTRUE_JWT_KEYS: ${GOTRUE_JWT_KEYS:-}
      GOTRUE_JWT_SECRET: ${GOTRUE_JWT_SECRET:-}
      GOTRUE_JWT_EXP: "600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_SMTP_ADMIN_EMAIL: noreply@loco.local
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: "1025"
      GOTRUE_SMTP_SENDER_NAME: Loco
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: ${AUTH_EMAIL_TEMPLATES:-http://host.docker.internal:5173/email}/confirmation.html
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: "Confirm your email for Loco"
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: ${AUTH_EMAIL_TEMPLATES:-http://host.docker.internal:5173/email}/magic-link.html
      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: "Your Loco sign-in link"
      GOTRUE_MAILER_TEMPLATES_RECOVERY: ${AUTH_EMAIL_TEMPLATES:-http://host.docker.internal:5173/email}/recovery.html
      GOTRUE_MAILER_SUBJECTS_RECOVERY: "Reset your Loco password"
      GOTRUE_MAILER_TEMPLATES_INVITE: ${AUTH_EMAIL_TEMPLATES:-http://host.docker.internal:5173/email}/invite.html
      GOTRUE_MAILER_SUBJECTS_INVITE: "You're invited to Loco"
      GOTRUE_MAILER_TEMPLATES_EMAIL_CHANGE: ${AUTH_EMAIL_TEMPLATES:-http://host.docker.internal:5173/email}/email-change.html
      GOTRUE_MAILER_SUBJECTS_EMAIL_CHANGE: "Confirm the change of your Loco email"
      GOTRUE_MAILER_TEMPLATES_REAUTHENTICATION: ${AUTH_EMAIL_TEMPLATES:-http://host.docker.internal:5173/email}/reauthentication.html
      GOTRUE_MAILER_SUBJECTS_REAUTHENTICATION: "Your Loco verification code"
      GOTRUE_EXTERNAL_GITHUB_ENABLED: ${AUTH_GITHUB_ENABLED:-true}
      GOTRUE_EXTERNAL_GITHUB_CLIENT_ID: ${GH_OAUTH_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GITHUB_SECRET: ${GH_OAUTH_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_GITHUB_REDIRECT_URI: http://localhost:${AUTH_PORT:-9999}/callback
      GOTRUE_SAML_ENABLED: "true"
      GOTRUE_SAML_PRIVATE_KEY: ${GOTRUE_SAML_PRIVATE_KEY:-}
      GOTRUE_HOOK_BEFORE_USER_CREATED_ENABLED: "true"
      GOTRUE_HOOK_BEFORE_USER_CREATED_URI: http://host.docker.internal${APP_PORT:-:8000}/auth/hooks/before-user-created
      GOTRUE_HOOK_BEFORE_USER_CREATED_SECRETS: ${AUTH_HOOK_SECRET:-}
      GOTRUE_RATE_LIMIT_EMAIL_SENT: "1000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9999/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  seed:
    image: postgres:18.6-alpine
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *postgres-env
      PGHOST: postgres
      SEED_FILE: ${SEED_FILE:-api/seed/local.sql}
      AGENT_TOKEN: ${AGENT_TOKEN:-}
    volumes:
      - .:/repo:ro
    working_dir: /repo
    entrypoint: ["sh", "-c"]
    command:
      - |
        export PGUSER="$$POSTGRES_USER" PGPASSWORD="$$POSTGRES_PASSWORD" PGDATABASE="$$POSTGRES_DB"
        if [ -z "$$AGENT_TOKEN" ]; then
          echo "AGENT_TOKEN is not set; the seeded cluster's agent authenticates with it" >&2
          exit 1
        fi
        echo "seeding $$SEED_FILE"
        psql -q -v ON_ERROR_STOP=1 -v agent_token="$$AGENT_TOKEN" -f "$$SEED_FILE"

volumes:
  postgres-data:
