name: loco-dev

x-postgres-env: &postgres-env
  POSTGRES_USER: ${POSTGRES_USER:-loco_user}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loco_password}
  POSTGRES_DB: ${POSTGRES_DB:-loco}

services:
  postgres:
    image: postgres:18.6-alpine
    environment: *postgres-env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 1s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:8.1.10-alpine
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

  migrate:
    image: postgres:18.6-alpine
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *postgres-env
      PGHOST: postgres
      SEED_FILE: ${SEED_FILE:-api/seed/local.sql}
      AGENT_TOKEN: ${AGENT_TOKEN:-}
    volumes:
      - .:/repo:ro
    working_dir: /repo
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        export PGUSER="$$POSTGRES_USER" PGPASSWORD="$$POSTGRES_PASSWORD" PGDATABASE="$$POSTGRES_DB"
        export PGOPTIONS="-c client_min_messages=warning"
        sql() { psql -X -q -v ON_ERROR_STOP=1 "$$@"; }
        has_tracking=$$(sql -tAc "SELECT to_regclass('public.schema_migrations') IS NOT NULL")
        has_schema=$$(sql -tAc "SELECT to_regclass('public.users') IS NOT NULL")
        sql -c "CREATE TABLE IF NOT EXISTS schema_migrations (filename text PRIMARY KEY, applied_at timestamptz NOT NULL DEFAULT now())"
        for f in api/migrations/*.sql; do
          name=$$(basename "$$f")
          case "$$name" in
            *[!A-Za-z0-9_.-]*) echo "unsupported migration file name: $$name" >&2; exit 1 ;;
          esac
          if [ "$$has_tracking" = f ] && [ "$$has_schema" = t ]; then
            echo "recording $$name as applied: the schema predates schema_migrations"
            sql -c "INSERT INTO schema_migrations (filename) VALUES ('$$name') ON CONFLICT DO NOTHING"
            continue
          fi
          if [ -n "$$(sql -tAc "SELECT 1 FROM schema_migrations WHERE filename = '$$name'")" ]; then
            continue
          fi
          echo "applying $$name"
          sql --single-transaction -f "$$f" -c "INSERT INTO schema_migrations (filename) VALUES ('$$name')"
        done
        if [ -z "$$AGENT_TOKEN" ]; then
          echo "AGENT_TOKEN is not set; the seeded cluster's agent authenticates with it" >&2
          exit 1
        fi
        echo "seeding $$SEED_FILE"
        psql -q -v ON_ERROR_STOP=1 -v agent_token="$$AGENT_TOKEN" -f "$$SEED_FILE" || exit 1
        echo "migrations applied"

volumes:
  postgres-data:
