name: loco-auth-conformance

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: loco_test
      POSTGRES_PASSWORD: loco_test
      POSTGRES_DB: loco_test
    ports:
      - "${CONFORMANCE_POSTGRES_PORT:-55440}:5432"
    volumes:
      - ../local/auth-db.sql:/docker-entrypoint-initdb.d/auth-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U loco_test -d loco_auth -tAc 'select 1'"]
      interval: 1s
      timeout: 3s
      retries: 30

  supabase:
    image: supabase/gotrue:v2.197.0
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "59999:9999"
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      PORT: "9999"
      API_EXTERNAL_URL: http://localhost:59999
      GOTRUE_DB_DRIVER: postgres
      DATABASE_URL: postgres://supabase_auth_admin:supabase_auth_admin@postgres:5432/loco_auth
      GOTRUE_SITE_URL: http://localhost:5173
      GOTRUE_JWT_ISSUER: http://localhost:59999
      GOTRUE_JWT_KEYS: ${GOTRUE_JWT_KEYS:?run through mise run test:auth-conformance}
      GOTRUE_JWT_SECRET: ${GOTRUE_JWT_SECRET:?run through mise run test:auth-conformance}
      GOTRUE_JWT_EXP: "600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "true"
      GOTRUE_RATE_LIMIT_EMAIL_SENT: "1000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9999/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm", "--http-port=8080", "--health-enabled=true"]
    ports:
      - "58080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak-realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 3s
      timeout: 3s
      retries: 60

  dex:
    image: ghcr.io/dexidp/dex:v2.45.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports:
      - "55556:5556"
    volumes:
      - ./dex.yaml:/etc/dex/config.yaml:ro

  zitadel-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zitadel
    healthcheck:
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U postgres -d zitadel -tAc 'select 1'"]
      interval: 1s
      timeout: 3s
      retries: 30

  zitadel:
    image: ghcr.io/zitadel/zitadel:v4.19.4
    command: ["start-from-init", "--masterkey", "MasterkeyNeedsToHave32Characters", "--tlsMode", "disabled"]
    depends_on:
      zitadel-db:
        condition: service_healthy
    ports:
      - "58090:8080"
    environment:
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: "58090"
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_DATABASE_POSTGRES_HOST: zitadel-db
      ZITADEL_DATABASE_POSTGRES_PORT: "5432"
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: conformance-admin
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Conformance admin
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_PATPATH: /bootstrap/admin.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: conformance-login
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Conformance login client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /bootstrap/login-client.pat
    volumes:
      - ${CONFORMANCE_ZITADEL_BOOTSTRAP:?run through mise run test:auth-conformance}:/bootstrap
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 3s
      timeout: 5s
      retries: 60
