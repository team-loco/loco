name: loco-auth-conformance

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: loco_test
      POSTGRES_PASSWORD: loco_test
      POSTGRES_DB: loco_test
    ports:
      - "${CONFORMANCE_POSTGRES_PORT:-55440}:5432"
    volumes:
      - ../local/auth-db.sql:/docker-entrypoint-initdb.d/auth-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loco_test -d loco_auth"]
      interval: 1s
      timeout: 3s
      retries: 30

  supabase:
    image: supabase/gotrue:v2.197.0
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "59999:9999"
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      PORT: "9999"
      API_EXTERNAL_URL: http://localhost:59999
      GOTRUE_DB_DRIVER: postgres
      DATABASE_URL: postgres://supabase_auth_admin:supabase_auth_admin@postgres:5432/loco_auth
      GOTRUE_SITE_URL: http://localhost:5173
      GOTRUE_JWT_ISSUER: http://localhost:59999
      GOTRUE_JWT_KEYS: ${GOTRUE_JWT_KEYS:?run through mise run test:auth-conformance}
      GOTRUE_JWT_SECRET: ${GOTRUE_JWT_SECRET:?run through mise run test:auth-conformance}
      GOTRUE_JWT_EXP: "600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "true"
      GOTRUE_RATE_LIMIT_EMAIL_SENT: "1000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9999/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm", "--http-port=8080", "--health-enabled=true"]
    ports:
      - "58080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak-realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 3s
      timeout: 3s
      retries: 60

  dex:
    image: ghcr.io/dexidp/dex:v2.45.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports:
      - "55556:5556"
    volumes:
      - ./dex.yaml:/etc/dex/config.yaml:ro
