name: loco-auth-conformance

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: loco_test
      POSTGRES_PASSWORD: loco_test
      POSTGRES_DB: loco_test
    ports:
      - "${CONFORMANCE_POSTGRES_PORT:-55440}:5432"
    healthcheck:
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U loco_test -d loco_test -tAc 'select 1'"]
      interval: 1s
      timeout: 3s
      retries: 30

  auth-db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: railway
    healthcheck:
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U postgres -d railway -tAc 'select 1'"]
      interval: 1s
      timeout: 3s
      retries: 30

  supabase:
    build:
      context: ../..
      dockerfile: images/supabase-auth/Dockerfile
    depends_on:
      auth-db:
        condition: service_healthy
    ports:
      - "59999:9999"
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      PORT: "9999"
      API_EXTERNAL_URL: http://localhost:59999
      GOTRUE_DB_DRIVER: postgres
      DATABASE_URL: postgres://postgres:postgres@auth-db:5432/railway
      GOTRUE_SITE_URL: http://localhost:5173
      GOTRUE_JWT_ISSUER: http://localhost:59999
      GOTRUE_JWT_KEYS: ${GOTRUE_JWT_KEYS:?run through mise run test:auth-conformance}
      GOTRUE_JWT_SECRET: ${GOTRUE_JWT_SECRET:?run through mise run test:auth-conformance}
      GOTRUE_JWT_EXP: "600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_RATE_LIMIT_EMAIL_SENT: "1000"
      GOTRUE_SAML_ENABLED: "true"
      GOTRUE_SAML_PRIVATE_KEY: ${GOTRUE_SAML_PRIVATE_KEY:?run through mise run test:auth-conformance}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9999/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm", "--http-port=8080", "--health-enabled=true"]
    ports:
      - "58080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak-realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 3s
      timeout: 3s
      retries: 60

  dex:
    image: ghcr.io/dexidp/dex:v2.45.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports:
      - "55556:5556"
    volumes:
      - ./dex.yaml:/etc/dex/config.yaml:ro

  saml-idp:
    image: kristophjunge/test-saml-idp:1.15
    platform: linux/amd64
    ports:
      - "58081:8080"
    environment:
      SIMPLESAMLPHP_SP_ENTITY_ID: http://localhost:59999/sso/saml/metadata
      SIMPLESAMLPHP_SP_ASSERTION_CONSUMER_SERVICE: http://localhost:59999/sso/saml/acs
    volumes:
      - ./saml20-sp-remote.php:/var/www/simplesamlphp/metadata/saml20-sp-remote.php:ro
