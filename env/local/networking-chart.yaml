cilium:
  enabled: true
  rollOutCiliumPods: true
  kubeProxyReplacement: true
  k8sServicePort: "6443"
  ipam:
    mode: kubernetes
  bpf:
    hostLegacyRouting: true
    masquerade: false
  l2announcements:
    enabled: true
  operator:
    replicas: 1
  k8sClientRateLimit:
    qps: 10
    burst: 20
