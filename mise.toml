min_version = "2026.9.15"

[tools]
go = "1.27.3"
bun = "1.4.3"
uv = "0.12.24"
python = "3.14.8"
gh = "2.102.0"

buf = "1.73.0"
"github:sqlc-dev/sqlc" = "1.31.1"
"github:pressly/goose" = "3.28.0"
yq = "4.54.1"
"github:kubernetes-sigs/controller-tools" = { version = "0.22.0", bin = "controller-gen" }
kustomize = "5.8.3"

golangci-lint = "2.14.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
actionlint = "1.7.12"
pinact = "5.0.0"
hadolint = "2.15.1"
osv-scanner = "2.6.0"
lefthook = "2.2.2"

helm = "4.3.1"
helmfile = "1.8.2"
helm-diff = { version = "3.15.15", rename_exe = "diff", filter_bins = "none" }
kubectl = "1.37.1"
kind = "0.33.0"
tilt = "0.37.8"


[settings]
lockfile = true
locked = true

[env]
GOTOOLCHAIN = "local"

[tasks.setup]
description = "Install the pinned tools, the web dependencies and the git hooks, then check Docker"
run = ["mise install", "bun install --frozen-lockfile", "lefthook install", "mise run doctor"]

[tasks.build]
description = "Build the loco CLI into bin/loco"
run = "go build -o bin/loco ./cmd/loco"

[tasks."build:locoadm"]
description = "Build the locoadm operator CLI into bin/locoadm"
run = "go build -o bin/locoadm ./cmd/locoadm"

[tasks."build:linux"]
description = "Build the loco CLI for linux/amd64"
env = { CGO_ENABLED = "0", GOOS = "linux", GOARCH = "amd64" }
run = "go build -o bin/loco_unix ./cmd/loco"

[tasks."build:api"]
description = "Build the API server into api/bin"
dir = "api"
run = "go build -o ./bin/loco-api ."

[tasks."build:agent"]
description = "Build the agent into agent/bin"
dir = "agent"
run = "go build -o ./bin/loco-agent ."

[tasks."build:builder"]
description = "Build the image builder into builder/bin"
dir = "builder"
run = "go build -o ./bin/loco-builder ."

[tasks."build:obs-proxy"]
description = "Build the observability proxy into observability-proxy/bin"
dir = "observability-proxy"
run = "go build -o ./bin/loco-obs-proxy ."

[tasks.fmt]
description = "Format every Go module with the gofmt, goimports and golines settings in .golangci.yml"
run = "for m in $(git ls-files -- '*go.mod' ':!:gen/**' | xargs -n1 dirname); do (cd \"$m\" && golangci-lint fmt --config=\"$MISE_PROJECT_ROOT/.golangci.yml\"); done"

[tasks.vet]
description = "Run go vet in every Go module"
run = "for m in $(git ls-files -- '*go.mod' ':!:gen/**' | xargs -n1 dirname); do (cd \"$m\" && go vet ./...); done"

[tasks.gen]
description = "Generate Go and TypeScript from the protos, and Go from the SQL queries"
run = ["buf generate", "cd api && sqlc generate"]

[tasks."controller:gen"]
description = "Generate the controller's CRDs, RBAC and deepcopy code, and sync the chart's CRD and RBAC copies"
run = ["make -C controller manifests generate", "mise run chart:sync-crd", "mise run chart:sync-rbac"]

[tasks.test]
description = "Run every test suite"
depends = ["test:*"]

[tasks."test:cli"]
description = "Test the CLI and the dev tools in the root module"
run = "go test -v -coverprofile=coverage.out ./cmd/... ./internal/... ./tools/..."

[tasks."test:api"]
description = "Test the API server"
dir = "api"
run = "go test -v -coverprofile=coverage.out ./..."

[tasks."test:agent"]
description = "Test the agent"
dir = "agent"
run = "go test -v -coverprofile=coverage.out ./..."

[tasks."test:builder"]
description = "Test the image builder"
dir = "builder"
run = "go test -v -coverprofile=coverage.out ./..."

[tasks."test:web"]
description = "Test the web UI"
dir = "web"
run = "bun run test"

[tasks."test:controller"]
description = "Test the controller against envtest"
run = "make -C controller test"

[tasks."test:k8sapi"]
description = "Test Kubernetes API types and validation"
dir = "k8sapi"
run = "go test -v -coverprofile=coverage.out ./..."

[tasks.coverage]
description = "Open an HTML coverage report for the CLI tests"
depends = ["test:cli"]
run = "go tool cover -o coverage.html -html=coverage.out && open coverage.html"

[tasks.lint]
description = "Run every linter CI runs"
depends = ["lint:*"]

[tasks."fmt:proto"]
description = "Format the protobuf definitions with buf"
run = "buf format -w"

[tasks."lint:proto"]
description = "Check protobuf formatting and lint rules"
run = ["buf format --diff --exit-code", "buf lint"]

[tasks."lint:web"]
description = "Run oxlint, eslint and the typecheck on the web UI"
dir = "web"
run = ["bun run lint:fast", "bun run lint:types", "bun run typecheck"]

[tasks."test:e2e-diagnostics"]
description = "Test discovery failure diagnostics without a cluster"
run = "uv run --locked --project tests pytest tests/e2e/test_discovery_diagnostics.py"

[tasks."test:ci"]
description = "Test CI component selection and pull-request diffs"
run = "uv run --locked --project tests pytest .github/actions/go-changes/tests .github/actions/ci-gate/tests"

[tasks."test:govulncheck"]
description = "Test vulnerability scan module coverage and failure propagation"
run = "uv run --locked --project tests pytest tests/govulncheck"

[tasks."test:stack"]
description = "Test how each checkout's local stack gets its slot, names, ports and LoadBalancer range"
run = "uv run --locked --project tests pytest tests/stack"

[tasks."lint:actions"]
description = "Run actionlint on the GitHub workflows, and check that every action is pinned to a commit SHA"
run = ["actionlint -shellcheck=", "pinact run --check"]

[tasks."lint:docker"]
description = "Run hadolint on every Dockerfile; LINT_DOCKER_FORMAT selects the output format"
run = "git ls-files '*Dockerfile' | grep -v '^examples/' | xargs hadolint --no-color -f \"${LINT_DOCKER_FORMAT:-tty}\" --failure-threshold error"

[tasks.ui]
description = "Run the web UI dev server"
dir = "web"
env = { _.source = "env/local/stack.sh" }
run = "bun run dev"

[tasks.tilt]
description = "Start this checkout's local environment (cluster, infrastructure and services) with Tilt, including one mise run stop stopped; mise run stack prints its URLs"
alias = "start"
env = { _.file = ".env", _.source = "env/local/stack.sh" }
run = """
if [ ! -f .env ]; then
  echo ".env is missing: copy .env.example to .env, or in a git worktree link the main checkout's .env" >&2
  exit 1
fi
orbstack_sock="$HOME/.orbstack/run/docker.sock"
if [ -z "${DOCKER_HOST:-}" ] && [ -S "$orbstack_sock" ]; then
  export DOCKER_HOST="unix://$orbstack_sock"
fi
mise run doctor
mise run cluster:up
tilt up --context "kind-$KIND_CLUSTER"
"""

[tasks."infra:up"]
description = "Start Postgres, Valkey, the identity provider, the image registry and the source bucket from compose.yaml and wait until they are up"
env = { _.source = "env/local/stack.sh" }
run = "docker compose up -d --wait postgres valkey dex registry s3"

[tasks."infra:down"]
description = "Stop the compose services; the database, images and sources are kept in their volumes"
env = { _.source = "env/local/stack.sh" }
run = "docker compose down"

[tasks."db:migrate"]
description = "Apply api/migrations with goose and seed api/seed/local.sql into the local database"
env = { _.file = ".env", _.source = "env/local/stack.sh" }
run = [
  "docker compose up -d --wait postgres",
  'goose -dir api/migrations postgres "$DATABASE_URL" up',
  "docker compose run --rm seed",
]

[tasks."db:status"]
description = "Show which migrations goose has applied to the local database"
env = { _.file = ".env", _.source = "env/local/stack.sh" }
run = 'goose -dir api/migrations postgres "$DATABASE_URL" status'

[tasks."db:psql"]
description = "Open psql against the local database, inside the Postgres container"
env = { _.source = "env/local/stack.sh" }
raw = true
run = "docker compose exec postgres sh -c 'exec psql -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\"'"

[tasks."cluster:down"]
description = "Delete this checkout's kind cluster"
env = { _.source = "env/local/stack.sh" }
run = 'kind delete cluster --name "$KIND_CLUSTER"'

[tasks.down]
description = "Remove this checkout's local environment: stop it, delete its kind cluster, its compose containers and volumes, and free its stack slot"
env = { _.source = "env/local/stack.sh" }
run = [
  "mise run stop",
  "mise run cluster:down",
  "docker compose down --volumes",
  'if [ -n "$LOCO_STACK_CLAIM" ]; then rm -f "$LOCO_STACK_CLAIM"; fi',
]

[tasks.stack]
description = "Print this checkout's local stack: its slot, URLs, kind context and compose project"
quiet = true
env = { _.source = "env/local/stack.sh" }
run = """
cat <<EOF
slot             $LOCO_STACK_SLOT
web UI           $WEB_URL
API              $PUBLIC_API_URL
Dex              http://localhost:$DEX_PORT/dex
Tilt UI          http://localhost:$TILT_PORT
kube context     kind-$KIND_CLUSTER
compose project  $COMPOSE_PROJECT_NAME
EOF
"""

[tasks."helm:repos"]
description = "Add and update the helm repositories the charts depend on"
run = [
  "helm repo add jetstack https://charts.jetstack.io",
  "helm repo add cilium https://helm.cilium.io",
  "helm repo add altinity https://helm.altinity.com",
  "helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts",
  "helm repo update jetstack cilium altinity open-telemetry",
]

[tasks."helm:deps"]
description = "Build the helm chart dependencies; skipped while every chart's dependencies are newer than its Chart.yaml and Chart.lock"
sources = ["charts/*/Chart.yaml", "charts/*/Chart.lock"]
outputs = ["charts/*/charts/*.tgz"]
run = [
  "mise run helm:repos",
  "helm dependency build --skip-refresh ./charts/loco-networking",
  "helm dependency build --skip-refresh ./charts/loco-obs",
  "helm dependency build --skip-refresh ./charts/loco-core",
]

[tasks."helm:sync:namespaces"]
description = "Sync the platform namespaces and their Pod Security labels to the local cluster"
env = { _.file = ".env", _.source = "env/local/stack.sh" }
run = "helmfile -e local -l name=loco-namespaces sync --skip-deps"

[tasks."helm:sync:cert-manager"]
description = "Sync cert-manager to the local cluster"
env = { _.file = ".env", _.source = "env/local/stack.sh" }
run = "helmfile -e local -l name=cert-manager sync --skip-deps"

[tasks."helm:destroy"]
description = "Uninstall every release from the local cluster"
env = { _.file = ".env", _.source = "env/local/stack.sh" }
run = "helmfile -e local destroy"

[tasks."helm:fix-clickhouse"]
description = "Remove the ClickHouse finalizer when it is stuck"
env = { _.source = "env/local/stack.sh" }
run = """kubectl --context "kind-$KIND_CLUSTER" -n observability patch clickhouseinstallations.clickhouse.altinity.com/clickhouse -p '{"metadata":{"finalizers":[]}}' --type=merge"""

[tasks.e2e]
description = "Run the end-to-end tests in this worktree's own kind cluster and compose project (E2E_RUN_ID overrides the run). Flags: --no-teardown keeps the run, a later run reuses its cluster and resets its state; --skip-build reuses the images and binaries; a trailing filter picks test files"
env = { _.file = ".env" }
run = "./e2e/run.sh"

[tasks."e2e:control-plane"]
description = "Install the control-plane Helm chart with Kubernetes Postgres and ClickHouse fixtures; takes --no-teardown and --skip-build"
depends = ["helm:deps"]
run = "./e2e/control-plane.sh"

[tasks."e2e:certificates"]
description = "Issue local Gateway certificates through cert-manager using the core chart; takes --no-teardown"
depends = ["helm:deps"]
run = "./e2e/certificates.sh"

[tasks."e2e:attachment"]
description = "Test automatic cluster attachment, heartbeats and application deployment from an empty cluster registry"
env = { _.file = ".env" }
run = "./e2e/run.sh --builds-disabled cluster_attachment"

[tasks."e2e:builds"]
description = "Run only the image build end-to-end tests, controller-only and through the API and agent; takes the e2e flags"
env = { _.file = ".env" }
run = "./e2e/run.sh build"

[tasks."e2e:builds-disabled"]
description = "Run the end-to-end tests for an install with builds.enabled=false: no build objects, public images deploy, source deploys are refused; takes the e2e flags"
env = { _.file = ".env" }
run = "./e2e/run.sh --builds-disabled builds_disabled"

[tasks."e2e:ingress"]
description = "Run the end-to-end tests for apps with and without a domain: routes, gateway ingress and the CLI's URL output; takes the e2e flags"
env = { _.file = ".env" }
run = "./e2e/run.sh --builds-disabled ingress"

[tasks."e2e:discovery"]
description = "Run private service discovery end-to-end tests: logical DNS names, HTTP and TCP ports, resource rename and deletion; takes the e2e flags"
env = { _.file = ".env" }
run = "./e2e/run.sh discovery"

[tasks."e2e:status"]
description = "Run the end-to-end tests for resource status: healthy after a deploy, unavailable when its pods cannot run, unknown while its cluster is silent; takes the e2e flags"
env = { _.file = ".env" }
run = "./e2e/run.sh --builds-disabled resource_status"

[tasks."e2e:config"]
description = "Run the end-to-end tests for loco.yaml: validate, plan, apply, deploy, updates, deletes and disabled environments; takes the e2e flags"
env = { _.file = ".env" }
run = "./e2e/run.sh config_apply"

[tasks."e2e:observability"]
description = "Run the end-to-end tests for telemetry from the Envoy gateway through ClickHouse to the observability proxy, with Envoy Gateway and the loco-obs chart installed; writes e2e/out/observability-evidence.md (E2E_OBS_EVIDENCE overrides the path); takes the e2e flags"
env = { _.file = ".env" }
run = "./e2e/run.sh --observability observability"

[tasks."e2e:teardown"]
description = "Remove this worktree's end-to-end run (or E2E_RUN_ID's): its kind cluster, compose project and state"
env = { _.file = ".env" }
run = "./e2e/run.sh --teardown-only"

[tasks."docs:build"]
description = "Build production documentation with strict validation"
run = "uv run --frozen --project docs python docs/scripts/build.py build production"

[tasks."docs:build:staging"]
description = "Build staging documentation with staging URLs and noindex"
run = "uv run --frozen --project docs python docs/scripts/build.py build staging"

[tasks."docs:serve"]
description = "Preview documentation at http://127.0.0.1:8001"
run = "uv run --frozen --project docs python docs/scripts/build.py serve"

[tasks."test:docs"]
description = "Test production and staging documentation builds"
run = "uv run --locked --project docs pytest docs/tests"

[tasks."docs:check:browser"]
description = "Check documentation navigation, search, themes and Markdown copying in Chromium"
run = "uv run --locked --project docs pytest docs/tests/browser.py"

[tasks."docs:check:container"]
description = "Check the combined UI and documentation image"
run = "uv run --locked --project docs pytest docs/tests/container.py"

[tasks."test:collector-logs"]
description = "Verify collected log severity with the chart-pinned OpenTelemetry Collector"
run = "uv run --locked --project tests pytest tests/collector"

[tasks."test:chart-contracts"]
description = "Render regional certificate, observability Secret and collector pipeline contracts"
depends = ["helm:deps"]
run = "uv run --locked --project tests pytest tests/charts"

[tasks."test:platform-release"]
description = "Test immutable platform artifacts and Flux release manifests offline"
run = "uv run --locked --project tests pytest tools/platform-release/tests"

[tasks."release:platform"]
description = "Publish immutable platform charts, CRDs and the final OCI bundle"
run = "python tools/platform-release/release.py"

[tasks."test:platform-render"]
description = "Render and package the real platform charts, CRDs and Flux layers"
depends = ["helm:deps"]
run = "python tools/platform-release/verify.py"

[tasks."test:platform-images"]
description = "Test image platform selection, executable architecture and Dockerfile version pins"
run = "uv run --locked --project tests pytest tools/platform-images/tests tests/versions"

[tasks."obs:serve"]
description = "Serve the regional control-plane observability proxy against local ClickHouse"
env = { _.file = ".env", _.source = "env/local/stack.sh" }
run = "./mise-tasks/obs/serve"

[tasks."e2e:settings-labels"]
description = "Test settings field labels and descriptions in the production browser with isolated API fixtures"
run = "uv run --frozen --project docs python e2e/settings_labels_ui.py"

[tasks."e2e:deployment-history"]
description = "Test production deployment history, environment switching and scoped controls with an isolated API and database"
run = "uv run --frozen --project docs python e2e/deployment_history_ui.py"

[tasks."e2e:resource-details"]
description = "Test resource image copy, spec geometry, scoped secrets and managed deletion"
run = "uv run --frozen --project docs python e2e/resource_details_ui.py"

[tasks."e2e:activity-ui"]
description = "Test scoped audit Activity with real limited-user API permissions and production Chromium"
run = "uv run --frozen --project docs python e2e/activity_ui.py"

[tasks."e2e:trace-ui"]
description = "Test the production trace viewer against fixture trace responses with a throwaway API and database"
run = "uv run --frozen --project docs python e2e/trace_ui.py"

[tasks."test:python"]
description = "Run all Python unit tests"
depends = ["helm:deps"]
run = "uv run --locked --project docs pytest"

[tasks."e2e:shared-controls"]
description = "Test compact shared controls, segmented selection and pinned navigation in the production browser"
run = "uv run --frozen --project docs python e2e/shared_controls_ui.py"

[tasks."e2e:cluster-metrics"]
description = "Verify configurable Kubernetes platform telemetry in an isolated kind cluster"
depends = ["helm:deps"]
run = "python e2e/cluster-metrics.py"
