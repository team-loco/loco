min_version = "2026.9.15"

[tools]
go = "1.27.2"
bun = "1.4.2"
uv = "0.9.28"
python = "3.13.16"

buf = "1.73.0"
"github:sqlc-dev/sqlc" = "1.31.1"
"github:pressly/goose" = "3.28.0"
yq = "4.54.1"
"github:kubernetes-sigs/controller-tools" = { version = "0.22.0", bin = "controller-gen" }
kustomize = "5.8.2"

golangci-lint = "2.14.0"
actionlint = "1.7.12"
pinact = "5.0.0"
hadolint = "2.15.1"
lefthook = "2.1.16"

helm = "4.3.0"
helmfile = "1.8.1"
helm-diff = { version = "3.15.15", rename_exe = "diff", filter_bins = "none" }
kubectl = "1.37.1"
kind = "0.33.0"
tilt = "0.37.8"


[settings]
lockfile = true
locked = true

[env]
GOTOOLCHAIN = "local"

[tasks.setup]
description = "Install the pinned tools, the web dependencies and the git hooks, then check Docker"
run = ["mise install", "bun install --frozen-lockfile", "lefthook install", "mise run doctor"]

[tasks.build]
description = "Build the loco CLI into bin/loco"
run = "go build -o bin/loco ."

[tasks."build:linux"]
description = "Build the loco CLI for linux/amd64"
env = { CGO_ENABLED = "0", GOOS = "linux", GOARCH = "amd64" }
run = "go build -o bin/loco_unix ."

[tasks."build:api"]
description = "Build the API server into api/bin"
dir = "api"
run = "go build -o ./bin/loco-api ."

[tasks."build:agent"]
description = "Build the agent into agent/bin"
dir = "agent"
run = "go build -o ./bin/loco-agent ."

[tasks."build:builder"]
description = "Build the image builder into builder/bin"
dir = "builder"
run = "go build -o ./bin/loco-builder ."

[tasks."build:obs-proxy"]
description = "Build the observability proxy into observability-proxy/bin"
dir = "observability-proxy"
run = "go build -o ./bin/loco-obs-proxy ."

[tasks.fmt]
description = "Format every Go module with the gofmt, goimports and golines settings in .golangci.yml"
run = "for m in $(git ls-files -- '*go.mod' ':!:gen/**' | xargs -n1 dirname); do (cd \"$m\" && golangci-lint fmt --config=\"$MISE_PROJECT_ROOT/.golangci.yml\"); done"

[tasks.vet]
description = "Run go vet in every Go module"
run = "for m in $(git ls-files -- '*go.mod' ':!:gen/**' | xargs -n1 dirname); do (cd \"$m\" && go vet ./...); done"

[tasks.gen]
description = "Generate Go and TypeScript from the protos, and Go from the SQL queries"
run = ["buf generate", "cd api && sqlc generate"]

[tasks."controller:gen"]
description = "Generate the controller's CRDs, RBAC and deepcopy code, and sync the chart's CRD and RBAC copies"
run = ["make -C controller manifests generate", "mise run chart:sync-crd", "mise run chart:sync-rbac"]

[tasks.test]
description = "Run every test suite"
depends = ["test:*"]

[tasks."test:cli"]
description = "Test the CLI"
run = "go test -v -coverprofile=coverage.out ./cmd/... ./internal/..."

[tasks."test:api"]
description = "Test the API server"
dir = "api"
run = "go test -v -coverprofile=coverage.out ./..."

[tasks."test:agent"]
description = "Test the agent"
dir = "agent"
run = "go test -v -coverprofile=coverage.out ./..."

[tasks."test:builder"]
description = "Test the image builder"
dir = "builder"
run = "go test -v -coverprofile=coverage.out ./..."

[tasks."test:controller"]
description = "Test the controller against envtest"
run = "make -C controller test"

[tasks.coverage]
description = "Open an HTML coverage report for the CLI tests"
depends = ["test:cli"]
run = "go tool cover -o coverage.html -html=coverage.out && open coverage.html"

[tasks.lint]
description = "Run every linter CI runs"
depends = ["lint:*"]

[tasks."lint:proto"]
description = "Run buf lint on the protobuf definitions"
run = "buf lint"

[tasks."lint:web"]
description = "Run oxlint, eslint and the typecheck on the web UI"
dir = "web"
run = ["bun run lint:fast", "bun run lint:types", "bun run typecheck"]

[tasks."lint:actions"]
description = "Run actionlint on the GitHub workflows, and check that every action is pinned to a commit SHA"
run = ["actionlint -shellcheck=", "pinact run --check"]

[tasks."lint:docker"]
description = "Run hadolint on every Dockerfile; LINT_DOCKER_FORMAT selects the output format"
run = "git ls-files '*Dockerfile' | grep -v '^examples/' | xargs hadolint --no-color -f \"${LINT_DOCKER_FORMAT:-tty}\" --failure-threshold error"

[tasks.ui]
description = "Run the web UI dev server"
dir = "web"
run = "bun run dev"

[tasks.tilt]
description = "Start the full local environment (cluster, infrastructure and services) with Tilt"
env = { _.file = ".env" }
run = """
if [ ! -f .env ]; then
  echo ".env is missing: copy .env.example to .env, or in a git worktree link the main checkout's .env" >&2
  exit 1
fi
orbstack_sock="$HOME/.orbstack/run/docker.sock"
if [ -z "${DOCKER_HOST:-}" ] && [ -S "$orbstack_sock" ]; then
  export DOCKER_HOST="unix://$orbstack_sock"
fi
tilt up
"""

[tasks."infra:up"]
description = "Start Postgres, Valkey, the image registry and the source bucket from compose.yaml and wait until they are up"
run = "docker compose up -d --wait postgres valkey registry s3"

[tasks."infra:down"]
description = "Stop the compose services; the database, images and sources are kept in their volumes"
run = "docker compose down"

[tasks."db:migrate"]
description = "Apply api/migrations with goose and seed api/seed/local.sql into the local database"
env = { _.file = ".env" }
run = [
  "docker compose up -d --wait postgres",
  'goose -dir api/migrations postgres "$DATABASE_URL" up',
  "docker compose run --rm seed",
]

[tasks."db:status"]
description = "Show which migrations goose has applied to the local database"
env = { _.file = ".env" }
run = 'goose -dir api/migrations postgres "$DATABASE_URL" status'

[tasks."db:psql"]
description = "Open psql against the local database, inside the Postgres container"
raw = true
run = "docker compose exec postgres sh -c 'exec psql -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\"'"

[tasks."cluster:down"]
description = "Delete the local kind cluster"
run = "kind delete cluster --name loco-cluster-local"

[tasks."helm:repos"]
description = "Add and update the helm repositories the charts depend on"
run = [
  "helm repo add jetstack https://charts.jetstack.io",
  "helm repo add cilium https://helm.cilium.io",
  "helm repo add altinity https://helm.altinity.com",
  "helm repo add grafana https://grafana.github.io/helm-charts",
  "helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts",
  "helm repo update jetstack cilium altinity grafana open-telemetry",
]

[tasks."helm:deps"]
description = "Build the helm chart dependencies; skipped while every chart's dependencies are newer than its Chart.yaml and Chart.lock"
sources = ["charts/*/Chart.yaml", "charts/*/Chart.lock"]
outputs = ["charts/*/charts/*.tgz"]
run = [
  "mise run helm:repos",
  "helm dependency build --skip-refresh ./charts/loco-networking",
  "helm dependency build --skip-refresh ./charts/loco-obs",
  "helm dependency build --skip-refresh ./charts/loco-core",
]

[tasks."helm:sync:namespaces"]
description = "Sync the platform namespaces and their Pod Security labels to the local cluster"
env = { _.file = ".env" }
run = "helmfile -e local -l name=loco-namespaces sync --skip-deps"

[tasks."helm:sync:cert-manager"]
description = "Sync cert-manager to the local cluster"
env = { _.file = ".env" }
run = "helmfile -e local -l name=cert-manager sync --skip-deps"

[tasks."helm:destroy"]
description = "Uninstall every release from the local cluster"
env = { _.file = ".env" }
run = "helmfile -e local destroy"

[tasks."helm:fix-clickhouse"]
description = "Remove the ClickHouse finalizer when it is stuck"
run = """kubectl -n observability patch clickhouseinstallations.clickhouse.altinity.com/clickhouse -p '{"metadata":{"finalizers":[]}}' --type=merge"""

[tasks.e2e]
description = "Run the end-to-end tests (full setup and teardown)"
env = { _.file = ".env" }
run = "./e2e/run.sh"

[tasks."e2e:builds"]
description = "Run only the image build end-to-end tests, controller-only and through the API and agent (full setup and teardown)"
env = { _.file = ".env" }
run = "./e2e/run.sh build"

[tasks."e2e:builds-disabled"]
description = "Run the end-to-end tests for an install with builds.enabled=false: no build objects, public images deploy, source deploys are refused (full setup and teardown)"
env = { _.file = ".env" }
run = "./e2e/run.sh --builds-disabled builds_disabled"

[tasks."e2e:no-teardown"]
description = "Run the end-to-end tests and keep the infrastructure running"
env = { _.file = ".env" }
run = "./e2e/run.sh --no-teardown"

[tasks."e2e:teardown"]
description = "Tear down the end-to-end infrastructure"
env = { _.file = ".env" }
run = "./e2e/run.sh --teardown-only"

[tasks."docs:build"]
description = "Build production documentation with strict validation"
run = "uv run --frozen --project docs python docs/scripts/build.py build production"

[tasks."docs:build:staging"]
description = "Build staging documentation with staging URLs and noindex"
run = "uv run --frozen --project docs python docs/scripts/build.py build staging"

[tasks."docs:serve"]
description = "Preview documentation at http://127.0.0.1:8001"
run = "uv run --frozen --project docs python docs/scripts/build.py serve"

[tasks."test:docs"]
description = "Test production and staging documentation builds"
run = "uv run --frozen --project docs python -m unittest discover -s docs/tests"

[tasks."docs:check:browser"]
description = "Check documentation navigation, search, themes and Markdown copying in Chromium"
run = "uv run --frozen --project docs python docs/tests/browser.py"

[tasks."docs:check:container"]
description = "Check combined UI and documentation images in production and staging"
run = "uv run --frozen --project docs python docs/tests/container.py"
