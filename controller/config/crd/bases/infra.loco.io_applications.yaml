---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: applications.infra.loco.io
spec:
  group: infra.loco.io
  names:
    kind: Application
    listKind: ApplicationList
    plural: applications
    singular: application
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Application is the Schema for the applications API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Application
            properties:
              deploymentId:
                type: string
              environmentId:
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: environmentId is immutable
                  rule: self == oldSelf
              environmentName:
                type: string
              organizationId:
                type: string
              region:
                type: string
              resourceId:
                type: string
              serviceSpec:
                description: ServiceSpec contains service-specific deployment and
                  resource configuration
                properties:
                  deployment:
                    description: Deployment info (current or requested)
                    properties:
                      args:
                        description: Args replaces the image CMD. Without it the image's
                          CMD is passed to the entrypoint.
                        items:
                          type: string
                        maxItems: 100
                        type: array
                      command:
                        description: Command replaces the image ENTRYPOINT. Without
                          it the image's ENTRYPOINT runs.
                        items:
                          minLength: 1
                          type: string
                        maxItems: 100
                        type: array
                      env:
                        additionalProperties:
                          type: string
                        type: object
                      envSecretRef:
                        description: |-
                          EnvSecretRef names the Secret in the Application's namespace that holds the service's secret values
                          and the placement revision whose values it must carry.
                        properties:
                          name:
                            minLength: 1
                            type: string
                          revision:
                            format: int64
                            minimum: 1
                            type: integer
                        required:
                        - name
                        - revision
                        type: object
                      healthCheck:
                        description: HealthCheckSpec describes readiness/liveness
                          checks
                        properties:
                          failThreshold:
                            format: int32
                            minimum: 1
                            type: integer
                          interval:
                            format: int32
                            minimum: 1
                            type: integer
                          path:
                            minLength: 1
                            type: string
                          startupGracePeriod:
                            format: int32
                            minimum: 0
                            type: integer
                          timeout:
                            format: int32
                            minimum: 1
                            type: integer
                        required:
                        - failThreshold
                        - interval
                        - path
                        - timeout
                        type: object
                      image:
                        minLength: 1
                        type: string
                      observability:
                        default: {}
                        description: ObservabilityConfig controls automatic application
                          SDK environment configuration.
                        properties:
                          injectOtel:
                            default: true
                            description: InjectOtel supplies SDK environment defaults
                              for each variable the application does not set itself.
                            type: boolean
                        type: object
                      platform:
                        enum:
                        - linux/amd64
                        - linux/arm64
                        type: string
                      port:
                        description: |-
                          Port is the port the service listens on. Without it the service is a worker: it gets no
                          Service, no route and no readiness probe.
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                      runAsGroup:
                        format: int64
                        maximum: 2147483647
                        minimum: 1
                        type: integer
                      runAsUser:
                        format: int64
                        maximum: 2147483647
                        minimum: 1
                        type: integer
                    required:
                    - image
                    - platform
                    type: object
                  resources:
                    description: Resources (CPU, Memory, Replicas, Scalers)
                    properties:
                      cpu:
                        minLength: 1
                        type: string
                      memory:
                        minLength: 1
                        type: string
                      replicas:
                        properties:
                          max:
                            format: int32
                            minimum: 1
                            type: integer
                          min:
                            format: int32
                            minimum: 1
                            type: integer
                        required:
                        - max
                        - min
                        type: object
                      scalers:
                        properties:
                          cpuTarget:
                            format: int32
                            type: integer
                          enabled:
                            type: boolean
                          memoryTarget:
                            format: int32
                            type: integer
                        type: object
                    required:
                    - cpu
                    - memory
                    - replicas
                    type: object
                  restartPolicy:
                    description: |-
                      RestartPolicySpec bounds how often a replica may restart: the restart past MaxRestarts within
                      WindowSeconds stops the revision.
                    properties:
                      maxRestarts:
                        format: int32
                        maximum: 20
                        minimum: 0
                        type: integer
                      windowSeconds:
                        format: int32
                        maximum: 3600
                        minimum: 60
                        type: integer
                    required:
                    - maxRestarts
                    - windowSeconds
                    type: object
                  routing:
                    description: Routing exposes the service to the internet. Without
                      it the service gets no HTTPRoute and no gateway ingress.
                    properties:
                      hostName:
                        minLength: 1
                        type: string
                      idleTimeout:
                        format: int32
                        minimum: 1
                        type: integer
                      pathPrefix:
                        minLength: 1
                        type: string
                    required:
                    - hostName
                    - idleTimeout
                    - pathPrefix
                    type: object
                required:
                - deployment
                - resources
                - restartPolicy
                type: object
              slug:
                type: string
              type:
                description: Type is the resource type. SERVICE is the only one.
                type: string
              workspaceId:
                type: string
            required:
            - environmentId
            - type
            type: object
          status:
            description: status defines the observed state of Application
            properties:
              observedDeploymentId:
                type: string
              observedPlacementRevision:
                format: int64
                type: integer
              readyReplicas:
                format: int32
                type: integer
              rollout:
                properties:
                  available:
                    type: boolean
                  desiredReplicas:
                    format: int32
                    type: integer
                  healthy:
                    description: Healthy is Available with no current replica restarted
                      within the controller's health window.
                    type: boolean
                  healthyAt:
                    description: HealthyAt is when an available rollout becomes healthy
                      if no replica restarts again.
                    format: date-time
                    type: string
                  problem:
                    properties:
                      detail:
                        maxLength: 1024
                        type: string
                      reason:
                        enum:
                        - build_failed
                        - apply_failed
                        - unschedulable
                        - image_pull_failed
                        - image_user
                        - config_error
                        - restarting
                        - restarts_exhausted
                        - out_of_memory
                        - health_check_failing
                        - rollout_timeout
                        - unclean_shutdown
                        type: string
                      replica:
                        type: string
                      since:
                        format: date-time
                        type: string
                    required:
                    - reason
                    type: object
                  progressDeadlineExceeded:
                    type: boolean
                  provenRevision:
                    description: |-
                      ProvenRevision is the newest placement revision whose replicas all served for the health window
                      without a restart.
                    format: int64
                    type: integer
                  replicas:
                    items:
                      properties:
                        deploymentId:
                          type: string
                        detail:
                          maxLength: 512
                          type: string
                        lastExit:
                          description: LastExit is the most recent container exit
                            the kubelet recorded.
                          properties:
                            exitCode:
                              format: int32
                              type: integer
                            finishedAt:
                              format: date-time
                              type: string
                            reason:
                              type: string
                          required:
                          - exitCode
                          type: object
                        lastRestart:
                          description: LastRestart is the exit the kubelet most recently
                            restarted the replica after.
                          properties:
                            at:
                              format: date-time
                              type: string
                            cause:
                              enum:
                              - exit
                              - health_check
                              - out_of_memory
                              type: string
                            exitCode:
                              format: int32
                              type: integer
                          required:
                          - at
                          - cause
                          - exitCode
                          type: object
                        name:
                          type: string
                        node:
                          type: string
                        placementRevision:
                          format: int64
                          type: integer
                        ready:
                          type: boolean
                        restarts:
                          format: int32
                          type: integer
                        restartsAt:
                          description: RestartsAt lists the replica's restarts within
                            its restart window, oldest first.
                          items:
                            format: date-time
                            type: string
                          maxItems: 21
                          type: array
                        startedAt:
                          description: StartedAt is when the kubelet started the pod,
                            or its creation time before that.
                          format: date-time
                          type: string
                        state:
                          enum:
                          - Scheduling
                          - Pulling
                          - Starting
                          - Serving
                          - Failing
                          - Stopping
                          - Stopped
                          - Killed
                          - Unknown
                          type: string
                        stateDeadline:
                          description: StateDeadline is set only while Stopping.
                          format: date-time
                          type: string
                        stateSince:
                          format: date-time
                          type: string
                        uid:
                          type: string
                      required:
                      - name
                      - state
                      - uid
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - uid
                    x-kubernetes-list-type: map
                  stopped:
                    description: StoppedRevision is a placement revision Loco stopped
                      because a replica used up its restart budget.
                    properties:
                      at:
                        format: date-time
                        type: string
                      lastRestart:
                        properties:
                          at:
                            format: date-time
                            type: string
                          cause:
                            enum:
                            - exit
                            - health_check
                            - out_of_memory
                            type: string
                          exitCode:
                            format: int32
                            type: integer
                        required:
                        - at
                        - cause
                        - exitCode
                        type: object
                      placementRevision:
                        format: int64
                        type: integer
                      replica:
                        type: string
                      restarts:
                        description: Restarts is how many times the replica restarted
                          within the window.
                        format: int32
                        type: integer
                      rollout:
                        description: Rollout is set when a previous version took the
                          stopped revision's place.
                        type: boolean
                    required:
                    - at
                    - lastRestart
                    - placementRevision
                    - replica
                    - restarts
                    type: object
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
