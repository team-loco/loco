apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  labels:
    app: demo-app
  name: demo-app-local
  namespace: default
spec:
  endpoints:
  - fqdn:
      hostname: demo-app.default.svc.cluster.local
      port: 80
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  labels:
    app: demo-app
  name: demo-app-peers
  namespace: default
spec:
  endpoints:
  - fqdn:
      hostname: us-east-1.deploy-app.com
      port: 443
  fallback: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  labels:
    app: demo-app
  name: demo-app-route
  namespace: default
spec:
  hostnames:
  - app.demo.local
  parentRefs:
  - name: eg
    namespace: default
  rules:
  - backendRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: demo-app-local
      port: 80
    matches:
    - headers:
      - name: x-loco-forwarded-by
        type: RegularExpression
        value: .+
  - backendRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: demo-app-local
      port: 80
    - group: gateway.envoyproxy.io
      kind: Backend
      name: demo-app-peers
      port: 80
    filters:
    - requestHeaderModifier:
        set:
        - name: x-loco-forwarded-by
          value: eu-west-1
      type: RequestHeaderModifier
    matches:
    - path:
        type: PathPrefix
        value: /
status:
  parents: null
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  labels:
    app: demo-app
  name: demo-app-failover
  namespace: default
spec:
  healthCheck:
    passive:
      baseEjectionTime: 5s
      consecutive5XxErrors: 1
      consecutiveLocalOriginFailures: 1
      interval: 2s
      maxEjectionPercent: 100
  retry:
    numRetries: 2
    retryOn:
      triggers:
      - connect-failure
      - reset
      - 5xx
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: demo-app-route
