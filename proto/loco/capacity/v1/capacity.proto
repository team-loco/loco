syntax = "proto3";
package loco.capacity.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/team-loco/loco/gen/go/loco/capacity/v1;capacityv1";

// One complete controller collection, received through OpenTelemetry and ClickHouse.
// No sample means unknown reservations, including when individual points have arrived.
message AllocationSample {
  string id = 1;
  google.protobuf.Timestamp reported_at = 2;
  bool stale = 3;
}

// Coverage includes every registered, non-removed worker cluster. A missing or stale
// cluster means a displayed zero is not proof that nothing is allocated there.
message AllocationCoverage {
  int32 reporting_clusters = 1;
  int32 stale_clusters = 2;
  int32 missing_clusters = 3;
  google.protobuf.Timestamp oldest_reported_at = 4;
}
