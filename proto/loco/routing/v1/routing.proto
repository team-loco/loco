syntax = "proto3";
package loco.routing.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/team-loco/loco/gen/go/loco/routing/v1;routingv1";

// RoutingService exposes provider-neutral routing intent. External publishers own
// provider credentials and record identifiers; these never enter this contract.
service RoutingService {
  rpc BindPublisher(BindPublisherRequest) returns (BindPublisherResponse);
  rpc ListRouteIntents(ListRouteIntentsRequest) returns (ListRouteIntentsResponse);
  rpc ReportPublication(ReportPublicationRequest) returns (ReportPublicationResponse);
}
message BindPublisherRequest {
  string app_domain = 1 [(buf.validate.field).string.hostname = true];
  repeated string reserved_prefixes = 2 [(buf.validate.field).repeated.unique = true];
}
message BindPublisherResponse {
  string publisher_id = 1;
}
message RouteIntent {
  string publication_id = 1;
  int64 revision = 2;
  string hostname = 3;
  string resource_id = 4;
  string environment_id = 5;
  repeated string cluster_ids = 6;
  // "nearest" asks the publisher to prefer a nearby member of this exact set.
  string preference = 7;
  bool withdrawing = 8;
  int64 change_sequence = 9;
}
message ListRouteIntentsRequest {
  string publisher_id = 1 [(buf.validate.field).string.uuid = true];
  // A random UUID generated once per process. A different writer must wait for
  // the current session to expire. Each successful list renews the session.
  string session_id = 2 [(buf.validate.field).string.uuid = true];
  // Zero requests the initial snapshot. Advance using next_sequence, never a
  // per-publication revision. Tombstones remain available after acknowledgement.
  int64 after_sequence = 3 [(buf.validate.field).int64.gte = 0];
}
message ListRouteIntentsResponse {
  repeated RouteIntent intents = 1;
  int64 next_sequence = 2;
  bool has_more = 3;
  // Lease budget measured conservatively from when this list call began.
  int32 session_seconds = 4;
}
enum PublicationOutcome {
  PUBLICATION_OUTCOME_UNSPECIFIED = 0;
  PUBLICATION_OUTCOME_PUBLISHED = 1;
  PUBLICATION_OUTCOME_ERROR = 2;
}
message ReportPublicationRequest {
  string publisher_id = 1 [(buf.validate.field).string.uuid = true];
  string session_id = 2 [(buf.validate.field).string.uuid = true];
  string publication_id = 3 [(buf.validate.field).string.uuid = true];
  int64 revision = 4 [(buf.validate.field).int64.gt = 0];
  PublicationOutcome outcome = 5 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // Safe operator-facing text only. Do not include provider response bodies,
  // secrets, zone identifiers, or record identifiers.
  string message = 6 [(buf.validate.field).string.max_len = 512];
}
message ReportPublicationResponse {}
