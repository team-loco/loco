syntax = "proto3";

package loco.cluster.v1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "loco/event/v1/event.proto";

option go_package = "github.com/team-loco/loco/gen/go/loco/cluster/v1;clusterv1";

service ClusterAdminService {
  rpc CreateCluster(CreateClusterRequest) returns (CreateClusterResponse);
  rpc IssueJoinToken(IssueJoinTokenRequest) returns (IssueJoinTokenResponse);
  rpc ListClusters(ListClustersRequest) returns (ListClustersResponse);
  rpc ListClusterNodes(ListClusterNodesRequest) returns (ListClusterNodesResponse);
  rpc GetNodeAllocations(GetNodeAllocationsRequest) returns (GetNodeAllocationsResponse);
  rpc ListWorkspaceAllocations(ListWorkspaceAllocationsRequest) returns (ListWorkspaceAllocationsResponse);
  rpc GetClusterOperations(GetClusterOperationsRequest) returns (GetClusterOperationsResponse);
  rpc PauseCluster(PauseClusterRequest) returns (PauseClusterResponse);
  rpc ResumeCluster(ResumeClusterRequest) returns (ResumeClusterResponse);
  rpc RemoveCluster(RemoveClusterRequest) returns (RemoveClusterResponse);
  rpc RestoreCluster(RestoreClusterRequest) returns (RestoreClusterResponse);
}

// RegionAdminService lists the regions clusters run in. A region is the region code its clusters
// carry; CreateCluster builds new codes.
service RegionAdminService {
  rpc ListRegions(ListRegionsRequest) returns (ListRegionsResponse);
}

// Region is the code clusters share, `{country}-{subdivision}-{n}` or `local-1`.
message Region {
  string code = 1;
  // clusters in the region that are not removed
  int32 cluster_count = 2;
}

// NewRegion describes the region CreateCluster creates. The API builds its code.
message NewRegion {
  // such as us; lowercase letters and digits
  string country = 1 [(buf.validate.field).string.pattern = "^[a-z0-9]+$"];
  // such as ca, the state or province; lowercase letters and digits
  string subdivision = 2 [(buf.validate.field).string.pattern = "^[a-z0-9]+$"];
}

message Cluster {
  string id = 1;
  string cluster_key = 2;
  string name = 3;
  string region = 4;
  reserved 5;
  reserved "tier";
  bool is_active = 6;
  google.protobuf.Timestamp removed_at = 7;
  optional string health_status = 8;
  google.protobuf.Timestamp last_heartbeat = 9;
  optional string agent_version = 10;
  optional string agent_key_fingerprint = 11;
  ClusterRole role = 12;
  repeated string domains = 13;
  reserved 14, 15;
  reserved "dns_records", "gateway_hostname";
  // The last heartbeat before the API recorded cluster.silent; unset while the cluster reports.
  google.protobuf.Timestamp silent_since = 16;
  // Last successful capacity sample; absent before the first successful sample.
  ClusterCapacity capacity = 17;
  string health_message = 18;
}

// ClusterRole is chosen when the worker is installed and reported by its agent.
enum ClusterRole {
  CLUSTER_ROLE_UNSPECIFIED = 0;
  CLUSTER_ROLE_APPS = 1;
  CLUSTER_ROLE_BUILDS = 2;
  CLUSTER_ROLE_ALL = 3;
}

message ClusterWorkload {
  string id = 1;
  string kind = 2;
}

message ClusterWorkloads {
  repeated ClusterWorkload workloads = 1;
}

message JoinToken {
  string token = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message CreateClusterRequest {
  // Omit for the server default; positive and bounded by the server maximum.
  google.protobuf.Duration ttl = 5;
  // persist before sending; reuse only for the same worker registration
  string request_id = 4 [(buf.validate.field).string.uuid = true];
  // Omit to name the region's first cluster after the region code.
  string name = 1 [(buf.validate.field).string.max_len = 255];
  oneof target {
    option (buf.validate.oneof).required = true;
    // code of a region that has a cluster, or local-1
    string region = 2 [(buf.validate.field).string = {
      min_len: 1
      max_len: 255
    }];
    NewRegion new_region = 6;
  }
  reserved 3;
  reserved "tier";
}

message CreateClusterResponse {
  string cluster_id = 1;
  JoinToken join_token = 2;
  string name = 3;
  string region = 4;
}

message IssueJoinTokenRequest {
  // Omit for the server default; positive and bounded by the server maximum.
  google.protobuf.Duration ttl = 2;
  string cluster_id = 1 [(buf.validate.field).string.uuid = true];
}

message IssueJoinTokenResponse {
  string cluster_id = 1;
  JoinToken join_token = 2;
}

message ListClustersRequest {}

message ListClustersResponse {
  repeated Cluster clusters = 1;
}

message PauseClusterRequest {
  string cluster_id = 1 [(buf.validate.field).string.uuid = true];
}

message PauseClusterResponse {
  string cluster_id = 1;
}

message ResumeClusterRequest {
  string cluster_id = 1 [(buf.validate.field).string.uuid = true];
}

message ResumeClusterResponse {
  string cluster_id = 1;
}

message RemoveClusterRequest {
  string cluster_id = 1 [(buf.validate.field).string.uuid = true];
  bool force = 2;
}

message RemoveClusterResponse {
  string cluster_id = 1;
  repeated ClusterWorkload workloads = 2;
}

message RestoreClusterRequest {
  string cluster_id = 1 [(buf.validate.field).string.uuid = true];
}

message RestoreClusterResponse {
  string cluster_id = 1;
}

message ListRegionsRequest {}

message ListRegionsResponse {
  repeated Region regions = 1;
}

// ClusterCapacity is a reservation snapshot, not measured CPU or memory usage.
// Requested resources cover assigned, non-terminal pods including init containers and overhead.
// Aggregate headroom does not guarantee a workload can be scheduled on an individual node.
message ClusterCapacity {
  int64 cpu_millicores_allocatable = 1;
  int64 cpu_millicores_requested = 2;
  int64 memory_bytes_allocatable = 3;
  int64 memory_bytes_requested = 4;
  int32 pods_allocatable = 5;
  int32 pods_running = 6;
  google.protobuf.Timestamp reported_at = 7;
  int32 pods_assigned = 8;
  // Sample is older than the installation's configured heartbeat silence threshold.
  bool stale = 9;
}

message GetClusterOperationsRequest {
  string cluster_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetClusterOperationsResponse {
  repeated ClusterWorkloadAttention workloads = 1;
  bool has_more_workloads = 2;
  repeated loco.event.v1.Event events = 3;
}

// ClusterWorkloadAttention identifies current Loco work that is blocked or failing.
message ClusterWorkloadAttention {
  string id = 1;
  string kind = 2;
  string resource_id = 3;
  string resource_name = 4;
  string org_id = 5;
  string workspace_id = 6;
  string environment_id = 7;
  string environment_slug = 8;
  string status = 9;
  string message = 10;
  google.protobuf.Timestamp updated_at = 11;
}

// NodeCapacity is the agent's reservation sample for one Kubernetes node.
message NodeCapacity {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 253
  }];
  bool ready = 2;
  int64 cpu_millicores_allocatable = 3 [(buf.validate.field).int64.gte = 0];
  int64 memory_bytes_allocatable = 4 [(buf.validate.field).int64.gte = 0];
  int64 cpu_millicores_requested = 5 [(buf.validate.field).int64.gte = 0];
  int64 memory_bytes_requested = 6 [(buf.validate.field).int64.gte = 0];
  int32 resource_count = 7;
  bool unschedulable = 8;
}

// AllocationSample is absent until a complete sample arrives. Failed collection retains
// the last sample; stale follows the same silence threshold as cluster capacity.
message AllocationSample {
  string id = 1;
  google.protobuf.Timestamp reported_at = 2;
  bool stale = 3;
}

message ListClusterNodesRequest {
  string cluster_id = 1 [(buf.validate.field).string.uuid = true];
  string query = 2 [(buf.validate.field).string.max_len = 200];
  int32 page = 3 [(buf.validate.field).int32 = {
    gte: 0
    lte: 1000000
  }];
  bool memory = 4;
}
message ListClusterNodesResponse {
  AllocationSample sample = 1;
  repeated NodeCapacity nodes = 2;
  int32 total_count = 3;
  int32 resource_count = 4;
}

message AllocationConsumer {
  // Workspace ID in workspace scope; resource ID in resource scope. System/Other use literal IDs.
  string id = 1;
  string name = 2;
  string org_id = 3;
  string org_name = 4;
  string workspace_id = 5;
  // workspace, resource, system, or other. Resource reservations include its active builds.
  string kind = 6;
  int64 cpu_millicores = 7;
  int64 memory_bytes = 8;
  int32 resource_count = 9;
  int32 pods = 10;
}
message GetNodeAllocationsRequest {
  string cluster_id = 1 [(buf.validate.field).string.uuid = true];
  string node = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 253
  }];
  string workspace_id = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  bool memory = 4;
  string query = 5 [(buf.validate.field).string.max_len = 200];
  int32 page = 6 [(buf.validate.field).int32 = {
    gte: 0
    lte: 1000000
  }];
  bool remainder_only = 7;
  // Pins the node list and inspector to the same sample. A replaced sample returns Aborted.
  string sample_id = 8 [(buf.validate.field).string.uuid = true];
}
message GetNodeAllocationsResponse {
  AllocationSample sample = 1;
  NodeCapacity node = 2;
  repeated AllocationConsumer top = 3;
  AllocationConsumer remainder = 4;
  AllocationConsumer system = 5;
  repeated AllocationConsumer consumers = 6;
  int32 total_count = 7;
  bool memory = 8;
  string workspace_id = 9;
  string workspace_name = 10;
}
message ListWorkspaceAllocationsRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string query = 2 [(buf.validate.field).string.max_len = 200];
  int32 page = 3 [(buf.validate.field).int32 = {
    gte: 0
    lte: 1000000
  }];
  bool memory = 4;
  bool ascending = 5;
}
message WorkspaceAllocation {
  string workspace_id = 1;
  string name = 2;
  string org_id = 3;
  int32 resource_count = 4;
  int64 cpu_millicores = 5;
  int64 memory_bytes = 6;
  // Zero allocations are only meaningful alongside reporting coverage.
  int32 reporting_clusters = 7;
  int32 stale_clusters = 8;
  int32 missing_clusters = 9;
  google.protobuf.Timestamp oldest_reported_at = 10;
}
message ListWorkspaceAllocationsResponse {
  repeated WorkspaceAllocation workspaces = 1;
  int32 total_count = 2;
}
