syntax = "proto3";

package loco.agent.v1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";

option go_package = "github.com/team-loco/loco/gen/go/loco/agent/v1;agentv1";

// AgentService handles communication between the control plane and data plane agents.
service AgentService {
  // Register announces an agent to the control plane and returns the cluster ID.
  rpc Register(RegisterRequest) returns (RegisterResponse);

  rpc Sync(stream SyncRequest) returns (stream SyncResponse);
}

// RegisterRequest is sent by the agent on startup to announce itself.
message RegisterRequest {
  reserved 1, 2, 7, 8, 9;
  reserved "cluster_name", "region", "display_name", "cluster_region", "tier";
  string agent_version = 3;
  AgentCapacity capacity = 4;
  bool builds_enabled = 5;
  string cluster_key = 6 [(buf.validate.field).string.uuid = true];
  Enrollment enrollment = 10;
}

// Enrollment binds the agent's public key to the cluster that issued the join token.
message Enrollment {
  string join_token = 1 [(buf.validate.field).string.min_len = 1];
  bytes public_key = 2 [(buf.validate.field).bytes.len = 32];
}

// RegisterResponse contains the assigned cluster ID.
message RegisterResponse {
  string cluster_id = 1;
  google.protobuf.Duration heartbeat_interval = 2;
}

message SyncRequest {
  oneof message {
    Inventory inventory = 1;
    Applied applied = 2;
    PlacementStatus status = 3;
    BuildStatus build_status = 4;
    Heartbeat heartbeat = 5;
  }
}

message Inventory {
  repeated InventoryEntry entries = 1;
  repeated InventoryBuild builds = 2;
}

message InventoryEntry {
  string placement_id = 1;
  int64 revision = 2;
  bool env_secret_pending = 3;
}

message InventoryBuild {
  string build_id = 1 [(buf.validate.field).string.uuid = true];
  BuildPhase phase = 2 [(buf.validate.field).enum.defined_only = true];
}

enum BuildPhase {
  BUILD_PHASE_UNSPECIFIED = 0;
  BUILD_PHASE_PENDING = 1;
  BUILD_PHASE_RUNNING = 2;
  BUILD_PHASE_SUCCEEDED = 3;
  BUILD_PHASE_FAILED = 4;
  BUILD_PHASE_CANCELED = 5;
}

message BuildStatus {
  string build_id = 1 [(buf.validate.field).string.uuid = true];
  BuildPhase phase = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string image_digest = 3 [(buf.validate.field).string.pattern = "^(sha256:[a-f0-9]{64})?$"];
  string cache_digest = 4 [(buf.validate.field).string.pattern = "^(sha256:[a-f0-9]{64})?$"];
  string message = 5 [(buf.validate.field).string.max_len = 4096];
}

message Applied {
  string placement_id = 1;
  int64 revision = 2;
  string error = 3;
  bool retrying = 4;
}

message PlacementStatus {
  string placement_id = 1;
  int64 observed_revision = 2;
  bool ready = 3;
  int32 ready_replicas = 4;
  string phase = 5;
  string message = 6;
}

message SyncResponse {
  oneof message {
    Apply apply = 1;
    Delete delete = 2;
    StartBuild start_build = 3;
    CancelBuild cancel_build = 4;
  }
}

message Apply {
  string placement_id = 1;
  int64 revision = 2;
  string resource_id = 3;
  bytes application = 4;
  EnvSecret env_secret = 5;
}

// EnvSecret carries the secret values a placement declares, beside the Application that never holds them.
message EnvSecret {
  int64 revision = 1;
  map<string, bytes> data = 2;
}

message Delete {
  string placement_id = 1;
  int64 revision = 2;
  string resource_id = 3;
}

message StartBuild {
  string build_id = 1 [(buf.validate.field).string.uuid = true];
  string workspace_id = 2 [(buf.validate.field).string.uuid = true];
  string resource_id = 3 [(buf.validate.field).string.uuid = true];
  string source_url = 4 [(buf.validate.field).string.uri = true];
  string dockerfile_path = 5 [(buf.validate.field).string.min_len = 1];
  string image_repository = 6 [(buf.validate.field).string.min_len = 1];
  string cache_ref = 7;
  // context is the build context directory relative to the uploaded source, "." for its root.
  string context = 8 [(buf.validate.field).string.min_len = 1];
  string organization_id = 9 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
}

message CancelBuild {
  string build_id = 1 [(buf.validate.field).string.uuid = true];
}

// Heartbeat is sent periodically by the agent.
message Heartbeat {
  AgentCapacity capacity = 1;
  AgentHealth health = 2;
  bool builds_enabled = 3;
}

// AgentCapacity reports cluster resource capacity.
message AgentCapacity {
  int64 cpu_millicores_total = 1;
  int64 cpu_millicores_used = 2;
  int64 memory_bytes_total = 3;
  int64 memory_bytes_used = 4;
  int32 pods_total = 5;
  int32 pods_running = 6;
}

// AgentHealth reports agent and cluster health status.
message AgentHealth {
  bool kubernetes_healthy = 1;
  bool controller_healthy = 2;
  string message = 3;
}
