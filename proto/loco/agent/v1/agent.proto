syntax = "proto3";

package loco.agent.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/team-loco/loco/gen/go/loco/agent/v1;agentv1";

// AgentService handles communication between the control plane and data plane agents.
service AgentService {
  // Register announces an agent to the control plane and returns the cluster ID.
  rpc Register(RegisterRequest) returns (RegisterResponse);

  rpc Sync(stream SyncRequest) returns (stream SyncResponse);

  // Heartbeat is a bidirectional stream for agent health reporting.
  // Agent sends periodic heartbeats.
  rpc Heartbeat(stream HeartbeatRequest) returns (stream HeartbeatResponse);
}

// RegisterRequest is sent by the agent on startup to announce itself.
message RegisterRequest {
  string cluster_name = 1;
  string region = 2;
  string agent_version = 3;
  AgentCapacity capacity = 4;
}

// RegisterResponse contains the assigned cluster ID.
message RegisterResponse {
  string cluster_id = 1;
}

message SyncRequest {
  oneof message {
    Inventory inventory = 1;
    Applied applied = 2;
    PlacementStatus status = 3;
  }
}

message Inventory {
  repeated InventoryEntry entries = 1;
}

message InventoryEntry {
  string placement_id = 1;
  int64 revision = 2;
}

message Applied {
  string placement_id = 1;
  int64 revision = 2;
  string error = 3;
  bool retrying = 4;
}

message PlacementStatus {
  string placement_id = 1;
  int64 observed_revision = 2;
  bool ready = 3;
  int32 ready_replicas = 4;
  string phase = 5;
  string message = 6;
}

message SyncResponse {
  oneof message {
    Apply apply = 1;
    Delete delete = 2;
  }
}

message Apply {
  string placement_id = 1;
  int64 revision = 2;
  string resource_id = 3;
  bytes application = 4;
}

message Delete {
  string placement_id = 1;
  int64 revision = 2;
  string resource_id = 3;
}

// HeartbeatRequest is sent periodically by the agent.
message HeartbeatRequest {
  string cluster_id = 1 [(buf.validate.field).string.uuid = true];
  AgentCapacity capacity = 2;
  AgentHealth health = 3;
}

// HeartbeatResponse is the control plane's reply on the heartbeat stream.
message HeartbeatResponse {
  reserved 1, 2, 3;
  reserved "drain", "reload_config", "resync";
}

// AgentCapacity reports cluster resource capacity.
message AgentCapacity {
  int64 cpu_millicores_total = 1;
  int64 cpu_millicores_used = 2;
  int64 memory_bytes_total = 3;
  int64 memory_bytes_used = 4;
  int32 pods_total = 5;
  int32 pods_running = 6;
}

// AgentHealth reports agent and cluster health status.
message AgentHealth {
  bool kubernetes_healthy = 1;
  bool controller_healthy = 2;
  string message = 3;
}
