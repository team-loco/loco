syntax = "proto3";

package loco.agent.v1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "loco/cluster/v1/cluster.proto";
import "loco/deployment/v1/deployment.proto";

option go_package = "github.com/team-loco/loco/gen/go/loco/agent/v1;agentv1";

// AgentService handles communication between the control plane and data plane agents.
service AgentService {
  // Register announces an agent to the control plane and returns the cluster ID.
  rpc Register(RegisterRequest) returns (RegisterResponse);

  rpc Sync(stream SyncRequest) returns (stream SyncResponse);
}

// RegisterRequest is sent by the agent on startup to announce itself.
message RegisterRequest {
  string agent_version = 1;
  AgentCapacity capacity = 2;
  loco.cluster.v1.ClusterRole role = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string cluster_key = 4 [(buf.validate.field).string.uuid = true];
  Enrollment enrollment = 5;
  repeated string domains = 6 [(buf.validate.field).repeated.items.string.hostname = true];
  reserved 7;
  reserved "dns_records";
  // Set by an agent that holds an enrolled key but lost its cluster ID: the Authorization
  // assertion names cluster_key as its issuer, and the response returns the cluster the key
  // is enrolled to.
  bool recover_cluster_id = 8;
  // the worker chart's global.region; the API refuses a region the cluster is not registered in.
  // Empty from an agent that does not report one.
  string region = 9;
}

// Enrollment binds the agent's public key to the cluster that issued the join token.
message Enrollment {
  string join_token = 1 [(buf.validate.field).string.min_len = 1];
  bytes public_key = 2 [(buf.validate.field).bytes.len = 32];
}

// RegisterResponse contains the assigned cluster ID.
message RegisterResponse {
  string cluster_id = 1;
  google.protobuf.Duration heartbeat_interval = 2;
}

message SyncRequest {
  oneof message {
    Inventory inventory = 1;
    Applied applied = 2;
    PlacementStatus status = 3;
    BuildStatus build_status = 4;
    Heartbeat heartbeat = 5;
  }
}

message Inventory {
  repeated InventoryEntry entries = 1;
  repeated InventoryBuild builds = 2;
  reserved 3;
  reserved "workspace_ids";
}

message InventoryEntry {
  string placement_id = 1;
  int64 revision = 2;
  bool env_secret_pending = 3;
}

message InventoryBuild {
  string build_id = 1 [(buf.validate.field).string.uuid = true];
  BuildPhase phase = 2 [(buf.validate.field).enum.defined_only = true];
}

enum BuildPhase {
  BUILD_PHASE_UNSPECIFIED = 0;
  BUILD_PHASE_PENDING = 1;
  BUILD_PHASE_RUNNING = 2;
  BUILD_PHASE_SUCCEEDED = 3;
  BUILD_PHASE_FAILED = 4;
  BUILD_PHASE_CANCELED = 5;
}

message BuildStatus {
  string build_id = 1 [(buf.validate.field).string.uuid = true];
  BuildPhase phase = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string image_digest = 3 [(buf.validate.field).string.pattern = "^(sha256:[a-f0-9]{64})?$"];
  string cache_digest = 4 [(buf.validate.field).string.pattern = "^(sha256:[a-f0-9]{64})?$"];
  string message = 5 [(buf.validate.field).string.max_len = 4096];
  string stage = 6;
  google.protobuf.Timestamp stage_since = 7;
}

message Applied {
  string placement_id = 1;
  int64 revision = 2;
  string error = 3;
  bool retrying = 4;
}

message PlacementStatus {
  string placement_id = 1;
  int64 observed_revision = 2;
  int32 ready_replicas = 4;
  int32 desired_replicas = 9;
  // Every desired replica of the observed revision counted: ready for a service, available for a worker.
  bool available = 10;
  reserved 11, 19;
  repeated loco.deployment.v1.Replica replicas = 12;
  ProblemReport problem = 13;
  string deployment_id = 14;
  // Available with no current replica restarted within the controller's health window.
  bool healthy = 15;
  // When an available placement becomes healthy if no replica restarts again.
  google.protobuf.Timestamp healthy_at = 16;
  // Set when the controller stopped the observed revision.
  StoppedRevision stopped = 17;
  // The observed revision's failure policy.
  loco.deployment.v1.FailurePolicy failure_policy = 18;
  // Set once the observed revision became healthy with every replica available.
  bool deployed = 20;
}

// StopReason is why the controller stopped a placement revision.
enum StopReason {
  STOP_REASON_UNSPECIFIED = 0;
  // A replica restarted past its restart policy while the revision rolled out.
  STOP_REASON_RESTARTS_EXHAUSTED = 1;
  // The revision was not healthy within its deploy timeout.
  STOP_REASON_DEPLOY_TIMEOUT = 2;
  // The image or container configuration cannot start.
  STOP_REASON_STARTUP_FAILED = 3;
}

// StoppedRevision is a placement revision the controller stopped.
message StoppedRevision {
  int64 placement_revision = 1;
  StopReason reason = 7;
  // The replica whose failure stopped the revision.
  string replica_name = 2;
  // Restarts of the replica since it last stayed up for the cluster's health window.
  int32 restarts = 3;
  loco.deployment.v1.ReplicaRestart last_restart = 4;
  google.protobuf.Timestamp at = 5;
  // Set when the revision never proved itself, so the previous revision serves in its place.
  bool rollout = 6;
  reserved 8;
}

message ProblemReport {
  string reason = 1;
  string replica_name = 2;
  string detail = 3 [(buf.validate.field).string.max_len = 1024];
  google.protobuf.Timestamp since = 4;
}

message SyncResponse {
  oneof message {
    Apply apply = 1;
    Delete delete = 2;
    StartBuild start_build = 3;
    CancelBuild cancel_build = 4;
    KeepWorkspaces keep_workspaces = 6;
  }
  reserved 5;
  reserved "delete_workspace";
}

// KeepWorkspaces is the complete set of workspaces the cluster keeps; the agent deletes every other workspace.
message KeepWorkspaces {
  repeated string workspace_ids = 1 [(buf.validate.field).repeated.items.string.uuid = true];
}

message Apply {
  string placement_id = 1;
  int64 revision = 2;
  string resource_id = 3;
  bytes application = 4;
  EnvSecret env_secret = 5;
  // traceparent is the W3C trace context of the request that created the placement's deployment, empty outside a trace.
  string traceparent = 6 [(buf.validate.field).string.max_len = 256];
}

// EnvSecret carries the secret values a placement declares, beside the Application that never holds them.
message EnvSecret {
  int64 revision = 1;
  map<string, bytes> data = 2;
}

message Delete {
  string placement_id = 1;
  int64 revision = 2;
  string resource_id = 3;
}

message StartBuild {
  string build_id = 1 [(buf.validate.field).string.uuid = true];
  string workspace_id = 2 [(buf.validate.field).string.uuid = true];
  string resource_id = 3 [(buf.validate.field).string.uuid = true];
  string source_url = 4 [(buf.validate.field).string.uri = true];
  string dockerfile_path = 5 [(buf.validate.field).string.min_len = 1];
  string image_repository = 6 [(buf.validate.field).string.min_len = 1];
  string cache_ref = 7;
  // context is the build context directory relative to the uploaded source, "." for its root.
  string context = 8 [(buf.validate.field).string.min_len = 1];
  string organization_id = 9 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  // registry_credential is the password the build presents to the registry token endpoint as user loco-build,
  // set in token mode; it is valid while this build is queued or running on the cluster.
  string registry_credential = 10;
  string platform = 11 [
    (buf.validate.field).string.in = "linux/amd64",
    (buf.validate.field).string.in = "linux/arm64"
  ];
  // traceparent is the W3C trace context of the request that created the build, empty outside a trace.
  string traceparent = 12 [(buf.validate.field).string.max_len = 256];
}

message CancelBuild {
  string build_id = 1 [(buf.validate.field).string.uuid = true];
}

// Heartbeat is sent periodically by the agent.
message Heartbeat {
  AgentCapacity capacity = 1;
  AgentHealth health = 2;
  loco.cluster.v1.ClusterRole role = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  repeated string domains = 4 [(buf.validate.field).repeated.items.string.hostname = true];
  reserved 5, 6;
  reserved "dns_records", "platform_domain";
}

// AgentCapacity reports cluster resource capacity.
message AgentCapacity {
  int64 cpu_millicores_total = 1;
  int64 cpu_millicores_used = 2;
  int64 memory_bytes_total = 3;
  int64 memory_bytes_used = 4;
  int32 pods_total = 5;
  int32 pods_running = 6;
  repeated string platforms = 7 [(buf.validate.field).repeated.items.string.pattern = "^linux/(amd64|arm64)$"];
}

// AgentHealth reports agent and cluster health status.
message AgentHealth {
  bool kubernetes_healthy = 1;
  bool controller_healthy = 2;
  string message = 3;
}
