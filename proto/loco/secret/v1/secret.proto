syntax = "proto3";

package loco.secret.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/team-loco/loco/gen/go/loco/secret/v1;secretv1";

// SecretService stores named values per environment. Values are write-only: no RPC returns one.
service SecretService {
  // SetSecrets encrypts and stores values, creating or replacing each name.
  rpc SetSecrets(SetSecretsRequest) returns (SetSecretsResponse);
  // DeleteSecrets removes names from an environment.
  rpc DeleteSecrets(DeleteSecretsRequest) returns (DeleteSecretsResponse);
  // ListSecrets lists the names in an environment with their version and who set them.
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);
  // RewrapEnvironmentKeys rewraps environment data keys under the provider's current key, and with
  // new_dek replaces one environment's data key and re-encrypts its values.
  rpc RewrapEnvironmentKeys(RewrapEnvironmentKeysRequest) returns (RewrapEnvironmentKeysResponse);
}

// SetSecretsRequest sets values by name in one environment.
message SetSecretsRequest {
  string environment_id = 1 [(buf.validate.field).string.uuid = true];
  map<string, string> values = 2 [(buf.validate.field).map = {
    min_pairs: 1
    keys: {
      string: {pattern: "^[A-Z_][A-Z0-9_]*$"}
    }
  }];
}

// SecretVersion is the version a name reached after a write.
message SecretVersion {
  string name = 1;
  int32 version = 2;
}

// SetSecretsResponse reports the environment revision and the version of each name set.
message SetSecretsResponse {
  int64 revision = 1;
  repeated SecretVersion versions = 2;
}

// DeleteSecretsRequest removes names from one environment.
message DeleteSecretsRequest {
  string environment_id = 1 [(buf.validate.field).string.uuid = true];
  repeated string names = 2 [(buf.validate.field).repeated = {
    min_items: 1
    items: {
      string: {pattern: "^[A-Z_][A-Z0-9_]*$"}
    }
  }];
}

// DeleteSecretsResponse reports the environment revision after the delete.
message DeleteSecretsResponse {
  int64 revision = 1;
}

// ListSecretsRequest lists the secrets of one environment.
message ListSecretsRequest {
  string environment_id = 1 [(buf.validate.field).string.uuid = true];
}

// Secret is the metadata of one name; it never carries the value.
message Secret {
  string name = 1;
  int32 version = 2;
  string updated_by_type = 3;
  string updated_by_id = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

// ListSecretsResponse lists the names in an environment.
message ListSecretsResponse {
  repeated Secret secrets = 1;
}

// RewrapEnvironmentKeysRequest selects the environment keys to rewrap. An empty environment_id
// selects every environment. new_dek replaces the data key and requires environment_id.
message RewrapEnvironmentKeysRequest {
  string environment_id = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  bool new_dek = 2;
}

// RewrapEnvironmentKeysResponse counts the keys rewrapped and lists the environments skipped because
// the provider could not unwrap their key or their key belongs to another provider.
message RewrapEnvironmentKeysResponse {
  int32 rewrapped = 1;
  int32 skipped = 2;
  repeated string skipped_environment_ids = 3;
}
