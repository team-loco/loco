syntax = "proto3";

package loco.webhook.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/team-loco/loco/gen/go/loco/webhook/v1;webhookv1";

service WebhookService {
  rpc CreateWebhook(CreateWebhookRequest) returns (CreateWebhookResponse);
  rpc ListWebhooks(ListWebhooksRequest) returns (ListWebhooksResponse);
  // UpdateWebhook replaces a webhook's URL and event types. Pending retries go to the new URL.
  rpc UpdateWebhook(UpdateWebhookRequest) returns (UpdateWebhookResponse);
  rpc DeleteWebhook(DeleteWebhookRequest) returns (DeleteWebhookResponse);
  // RotateWebhookSecret replaces a webhook's signing secret and returns the new one. For
  // grace_period_seconds, deliveries also carry a signature made with the replaced secret;
  // rotating again during that window drops the older secret.
  rpc RotateWebhookSecret(RotateWebhookSecretRequest) returns (RotateWebhookSecretResponse);
  rpc ListWebhookDeliveries(ListWebhookDeliveriesRequest) returns (ListWebhookDeliveriesResponse);
  // RedeliverWebhookDelivery sends a succeeded or failed delivery again with the same Webhook-Id,
  // restarting its retry schedule. A pending delivery is rejected with FAILED_PRECONDITION.
  rpc RedeliverWebhookDelivery(RedeliverWebhookDeliveryRequest) returns (RedeliverWebhookDeliveryResponse);
  // SendTestEvent records a webhook.test event and delivers it to this webhook only, whatever
  // event types it subscribes to.
  rpc SendTestEvent(SendTestEventRequest) returns (SendTestEventResponse);
}

message Webhook {
  string id = 1;
  string url = 2;
  repeated string event_types = 3;
  google.protobuf.Timestamp created_at = 4;
  // Set while deliveries are also signed with the secret the last rotation replaced.
  google.protobuf.Timestamp previous_secret_expires_at = 5;
}

message WebhookDelivery {
  string id = 1;
  string event_id = 2;
  string event_type = 3;
  string status = 4;
  int32 attempts = 5;
  string last_error = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp delivered_at = 8;
  google.protobuf.Timestamp next_attempt_at = 9;
}

message CreateWebhookRequest {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
  string url = 2 [(buf.validate.field).string = {
    uri: true
    max_len: 2048
  }];
  repeated string event_types = 3 [(buf.validate.field).repeated = {
    max_items: 100
    items: {
      string: {
        min_len: 1
        max_len: 100
      }
    }
  }];
}

message CreateWebhookResponse {
  Webhook webhook = 1;
  string secret = 2;
}

message ListWebhooksRequest {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
}

message ListWebhooksResponse {
  repeated Webhook webhooks = 1;
}

message UpdateWebhookRequest {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
  string webhook_id = 2 [(buf.validate.field).string.uuid = true];
  string url = 3 [(buf.validate.field).string = {
    uri: true
    max_len: 2048
  }];
  // An empty list subscribes the webhook to every event.
  repeated string event_types = 4 [(buf.validate.field).repeated = {
    max_items: 100
    items: {
      string: {
        min_len: 1
        max_len: 100
      }
    }
  }];
}

message UpdateWebhookResponse {
  Webhook webhook = 1;
}

message RotateWebhookSecretRequest {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
  string webhook_id = 2 [(buf.validate.field).string.uuid = true];
  // At most seven days; zero stops signing with the replaced secret at once.
  int32 grace_period_seconds = 3 [(buf.validate.field).int32 = {
    gte: 0
    lte: 604800
  }];
}

message RotateWebhookSecretResponse {
  Webhook webhook = 1;
  string secret = 2;
}

message DeleteWebhookRequest {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
  string webhook_id = 2 [(buf.validate.field).string.uuid = true];
}

message DeleteWebhookResponse {}

// ListWebhookDeliveriesRequest lists a webhook's deliveries, newest first.
message ListWebhookDeliveriesRequest {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
  string webhook_id = 2 [(buf.validate.field).string.uuid = true];
  int32 page_size = 3 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
  string page_token = 4;
  // Only deliveries with this status; empty lists every status.
  string status = 5 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      in: [
        "pending",
        "succeeded",
        "failed"
      ]
    }
  ];
}

message ListWebhookDeliveriesResponse {
  repeated WebhookDelivery deliveries = 1;
  string next_page_token = 2; // empty if no more pages
}

message RedeliverWebhookDeliveryRequest {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
  string webhook_id = 2 [(buf.validate.field).string.uuid = true];
  string delivery_id = 3 [(buf.validate.field).string.uuid = true];
}

message RedeliverWebhookDeliveryResponse {}

message SendTestEventRequest {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
  string webhook_id = 2 [(buf.validate.field).string.uuid = true];
}

message SendTestEventResponse {}
