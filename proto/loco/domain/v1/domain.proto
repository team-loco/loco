syntax = "proto3";

package loco.domain.v1;

import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/team-loco/loco/gen/go/loco/domain/v1;domainv1";

// DomainType indicates the source of a domain.
enum DomainType {
  DOMAIN_TYPE_UNSPECIFIED = 0;
  DOMAIN_TYPE_PLATFORM_PROVIDED = 1;
  // eventually add support for custom domains.
}

// --- Messages ---

// PlatformDomain is a domain the clusters of an environment serve, with the regions whose cluster serves it.
message PlatformDomain {
  string domain = 1;
  repeated string regions = 2;
}

// DomainInput specifies domain configuration for a resource.
message DomainInput {
  DomainType domain_source = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional string subdomain = 2; // for PLATFORM_PROVIDED: "myapp"
  optional string platform_domain = 3 [(buf.validate.field).string.hostname = true]; // for PLATFORM_PROVIDED: a domain a cluster serves

  option (buf.validate.message).cel = {
    id: "platform_provided.subdomain_required"
    message: "subdomain is required for platform-provided domains"
    expression: "this.domain_source != 1 || (has(this.subdomain) && this.subdomain != '')"
  };
  option (buf.validate.message).cel = {
    id: "platform_provided.platform_domain_required"
    message: "platform_domain is required for platform-provided domains"
    expression: "this.domain_source != 1 || (has(this.platform_domain) && this.platform_domain != '')"
  };
}

// ResourceDomain represents a domain assigned to a resource.
message ResourceDomain {
  string id = 1;
  string resource_id = 2;
  string domain = 3;
  DomainType domain_source = 4;
  optional string subdomain_label = 5;
  optional string platform_domain = 6;
  bool is_primary = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

// --- Service ---

// DomainService manages domains for resources.
service DomainService {
  // ListPlatformDomains lists the domains the clusters an environment deploys to serve.
  rpc ListPlatformDomains(ListPlatformDomainsRequest) returns (ListPlatformDomainsResponse);

  // Resource Domain Management
  // CreateResourceDomain assigns a domain to a resource.
  rpc CreateResourceDomain(CreateResourceDomainRequest) returns (CreateResourceDomainResponse);
  // UpdateResourceDomain updates a resource's domain configuration.
  rpc UpdateResourceDomain(UpdateResourceDomainRequest) returns (UpdateResourceDomainResponse);
  // SetPrimaryResourceDomain sets the primary domain for a resource.
  rpc SetPrimaryResourceDomain(SetPrimaryResourceDomainRequest) returns (SetPrimaryResourceDomainResponse);
  // DeleteResourceDomain removes a domain from a resource.
  rpc DeleteResourceDomain(DeleteResourceDomainRequest) returns (DeleteResourceDomainResponse);

  // Queries
  // ListLocoOwnedDomains lists all domains owned by Loco with resources.
  rpc ListLocoOwnedDomains(ListLocoOwnedDomainsRequest) returns (ListLocoOwnedDomainsResponse);
  // CheckDomainAvailability checks if a domain is available.
  rpc CheckDomainAvailability(CheckDomainAvailabilityRequest) returns (CheckDomainAvailabilityResponse);
}

// --- Platform Domain Requests/Responses ---

// ListPlatformDomainsRequest names the environment whose clusters' domains to list.
message ListPlatformDomainsRequest {
  string environment_id = 1 [(buf.validate.field).string.uuid = true];
}

// ListPlatformDomainsResponse contains the domains the environment's clusters serve.
message ListPlatformDomainsResponse {
  repeated PlatformDomain platform_domains = 1;
}

// --- List Loco Owned Domains ---

// LocoOwnedDomain represents a platform-managed domain paired with a resource deployment.
message LocoOwnedDomain {
  string id = 1;
  string domain = 2;
  string resource_name = 3;
  string resource_id = 4;
  string platform_domain = 5;
}

// Loco owned domain already has string ids. No changes needed.

// ListLocoOwnedDomainsRequest is the request to list all Loco-owned domains.
message ListLocoOwnedDomainsRequest {}

// ListLocoOwnedDomainsResponse contains the list of Loco-owned domains.
message ListLocoOwnedDomainsResponse {
  repeated LocoOwnedDomain domains = 1;
}

// --- Resource Domain Management ---

// CreateResourceDomainRequest is the request to add a domain to a resource.
message CreateResourceDomainRequest {
  string resource_id = 1 [(buf.validate.field).string.uuid = true];
  DomainInput domain = 2 [(buf.validate.field).required = true];
}

// CreateResourceDomainResponse is the response containing the created resource domain ID.
message CreateResourceDomainResponse {
  string domain_id = 1;
}

// UpdateResourceDomainRequest is the request to update a resource's domain.
message UpdateResourceDomainRequest {
  string domain_id = 1 [(buf.validate.field).string.uuid = true];
  google.protobuf.FieldMask update_mask = 2;
  optional string domain = 3 [(buf.validate.field).string.min_len = 1];
}

// UpdateResourceDomainResponse is the response containing the updated resource domain ID.
message UpdateResourceDomainResponse {
  string domain_id = 1;
}

// SetPrimaryResourceDomainRequest is the request to set the primary domain for a resource.
message SetPrimaryResourceDomainRequest {
  string resource_id = 1 [(buf.validate.field).string.uuid = true];
  string domain_id = 2 [(buf.validate.field).string.uuid = true];
}

// SetPrimaryResourceDomainResponse is the response containing the resource and domain IDs.
message SetPrimaryResourceDomainResponse {
  string resource_id = 1;
  string domain_id = 2;
}

// DeleteResourceDomainRequest is the request to remove a domain from a resource.
message DeleteResourceDomainRequest {
  string domain_id = 1 [(buf.validate.field).string.uuid = true];
}

// DeleteResourceDomainResponse is the response after removing a domain from a resource.
message DeleteResourceDomainResponse {}

// --- Domain Availability ---

// CheckDomainAvailabilityRequest is the request to check if a domain is available.
message CheckDomainAvailabilityRequest {
  string domain = 1 [(buf.validate.field).string.min_len = 1];
}

// CheckDomainAvailabilityResponse contains the availability check result.
message CheckDomainAvailabilityResponse {
  bool is_available = 1;
}
