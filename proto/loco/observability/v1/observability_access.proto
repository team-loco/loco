syntax = "proto3";

package loco.observability.v1;

option go_package = "github.com/team-loco/loco/proto/loco/observability/v1;observabilityv1";

// ObservabilityAccessService runs on the control plane.
// It returns regional proxy endpoints and validates token permissions for the proxy.
service ObservabilityAccessService {
  // GetObservabilityAccess returns the regional proxy endpoints the client should connect to.
  // The client's existing TVM token is used directly when talking to the proxy.
  rpc GetObservabilityAccess(GetObservabilityAccessRequest) returns (GetObservabilityAccessResponse);

  // CheckPermission is called by the observability proxy to validate whether a token
  // has the requested permission on an entity. Authenticated with a proxy auth token.
  rpc CheckPermission(CheckPermissionRequest) returns (CheckPermissionResponse);
}

message GetObservabilityAccessRequest {
  string workspace_id = 1;
  // Optional: restrict to specific resources. Empty means all resources in workspace.
  repeated string resource_ids = 2;
}

message GetObservabilityAccessResponse {
  repeated ClusterAccess clusters = 1;
}

message ClusterAccess {
  int64 cluster_id = 1;
  string proxy_url = 2;
  string region = 3;
}

message CheckPermissionRequest {
  string token = 1;
  string entity_type = 2; // e.g. "workspace"
  string entity_id = 3;
  string scope = 4; // e.g. "read"
}

message CheckPermissionResponse {
  bool allowed = 1;
}
