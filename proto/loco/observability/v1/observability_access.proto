syntax = "proto3";

package loco.observability.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/team-loco/loco/gen/go/loco/observability/v1;observabilityv1";

// ObservabilityAccessService runs on the control plane.
// It returns regional proxy endpoints for the observability proxy.
service ObservabilityAccessService {
  // GetObservabilityAccess returns the regional proxy endpoints the client should connect to.
  // The client's existing TVM token is used directly when talking to the proxy.
  rpc GetObservabilityAccess(GetObservabilityAccessRequest) returns (GetObservabilityAccessResponse);
}

message GetObservabilityAccessRequest {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
  // Optional: restrict to specific resources. Empty means all resources in workspace.
  repeated string resource_ids = 2 [(buf.validate.field).repeated.items.string.uuid = true];
}

message GetObservabilityAccessResponse {
  repeated ClusterAccess clusters = 1;
}

message ClusterAccess {
  string cluster_id = 1;
  string proxy_url = 2;
  string region = 3;
}
