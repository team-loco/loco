syntax = "proto3";

package loco.user.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/team-loco/loco/gen/go/loco/user/v1;userv1";

// UserService manages user accounts and operations.
service UserService {
  // GetUser retrieves a user by ID or email.
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  // WhoAmI retrieves the current authenticated user.
  rpc WhoAmI(WhoAmIRequest) returns (WhoAmIResponse);
  // UpdateUser updates user information.
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  // ListUsers lists users with pagination.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  // DeleteUser deletes a user account.
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
  // Logout logs out the current user.
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  // SetUserStatus suspends or reinstates a user. Requires system admin.
  rpc SetUserStatus(SetUserStatusRequest) returns (SetUserStatusResponse);
}

// User represents a user account with OAuth identity and profile information.
message User {
  string id = 1;
  string email = 2;
  string avatar_url = 3;
  string name = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

// GetUserRequest is the request to retrieve a user.
message GetUserRequest {
  oneof key {
    string user_id = 1 [(buf.validate.field).string.uuid = true];
    string email = 2 [(buf.validate.field).string.email = true];
  }
}

// GetUserResponse is the response containing the user.
message GetUserResponse {
  User user = 1;
}

// UpdateUserRequest is the request to update user information.
message UpdateUserRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
  optional string avatar_url = 2 [(buf.validate.field) = {
    cel: {
      id: "user.avatar_url"
      message: "must be empty or a valid URI"
      expression: "this == '' || this.isUri()"
    }
  }];
  optional string name = 3 [(buf.validate.field).string.max_len = 200];
}

// UpdateUserResponse is the response containing the updated user ID.
message UpdateUserResponse {
  string user_id = 1;
}

// ListUsersRequest is the request to list users.
message ListUsersRequest {
  int32 page_size = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }]; // default: 50, max: 200
  string page_token = 2; // cursor from previous page (base64-encoded timestamp+id)
}

// ListUsersResponse is the response containing user list.
message ListUsersResponse {
  repeated User users = 1;
  string next_page_token = 2; // empty if no more pages
}

// WhoAmIRequest is the request to get the current authenticated user.
message WhoAmIRequest {}

// WhoAmIResponse is the response containing the current user.
message WhoAmIResponse {
  User user = 1;
  // claimed_orgs lists the organizations whose invitations this request claimed.
  repeated ClaimedOrg claimed_orgs = 2;
}

// ClaimedOrg is an organization the user joined through an invitation.
message ClaimedOrg {
  string org_id = 1;
  string org_name = 2;
  string inviter_name = 3;
}

// UserStatus is whether a user may sign in.
enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_ACTIVE = 1;
  USER_STATUS_SUSPENDED = 2;
}

// SetUserStatusRequest is the request to suspend or reinstate a user.
message SetUserStatusRequest {
  oneof key {
    option (buf.validate.oneof).required = true;
    string user_id = 1 [(buf.validate.field).string.uuid = true];
    string email = 2 [(buf.validate.field).string.email = true];
  }
  UserStatus status = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// SetUserStatusResponse is the response after changing a user's status.
message SetUserStatusResponse {}

// DeleteUserRequest is the request to delete a user.
message DeleteUserRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
}

// DeleteUserResponse is the response after deleting a user.
message DeleteUserResponse {}

// LogoutRequest is the request to logout the current user.
message LogoutRequest {}

// LogoutResponse is the response after logging out.
message LogoutResponse {}
