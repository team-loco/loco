syntax = "proto3";

package loco.org.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/team-loco/loco/gen/go/loco/org/v1;orgv1";

// OrgService manages organizations.
service OrgService {
  // CreateOrg creates a new organization.
  rpc CreateOrg(CreateOrgRequest) returns (CreateOrgResponse);
  // GetOrg retrieves an organization by ID or name.
  rpc GetOrg(GetOrgRequest) returns (GetOrgResponse);
  // UpdateOrg updates organization information.
  rpc UpdateOrg(UpdateOrgRequest) returns (UpdateOrgResponse);
  // DeleteOrg deletes an organization.
  rpc DeleteOrg(DeleteOrgRequest) returns (DeleteOrgResponse);

  // ListUserOrgs lists organizations for a user.
  rpc ListUserOrgs(ListUserOrgsRequest) returns (ListUserOrgsResponse);
  rpc ListOrgMembers(ListOrgMembersRequest) returns (ListOrgMembersResponse);
  rpc AddOrgMember(AddOrgMemberRequest) returns (AddOrgMemberResponse);
  rpc RemoveOrgMember(RemoveOrgMemberRequest) returns (RemoveOrgMemberResponse);

  // SuspendOrg stops every workload of the organization and rejects deployments until ResumeOrg.
  // It keeps resources, specs, secrets, domains and deployment history. It requires system:admin.
  // Suspending a suspended organization changes nothing and keeps the first reason.
  rpc SuspendOrg(SuspendOrgRequest) returns (SuspendOrgResponse);
  // ResumeOrg runs again what the organization's active deployments describe. It requires system:admin.
  // Resuming an organization that is not suspended changes nothing.
  rpc ResumeOrg(ResumeOrgRequest) returns (ResumeOrgResponse);
  rpc InviteOrgMember(InviteOrgMemberRequest) returns (InviteOrgMemberResponse);
  rpc ListInvitations(ListInvitationsRequest) returns (ListInvitationsResponse);
  rpc RevokeInvitation(RevokeInvitationRequest) returns (RevokeInvitationResponse);
  rpc ResendInvitation(ResendInvitationRequest) returns (ResendInvitationResponse);
}

// Organization represents a top-level organization container for users, workspaces, and resources.
message Organization {
  string id = 1;
  string name = 2;
  string created_by = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  google.protobuf.Timestamp suspended_at = 6;
  string suspension_reason = 7;
}

// CreateOrgRequest is the request to create a new organization.
message CreateOrgRequest {
  optional string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
}

// CreateOrgResponse is the response containing the created organization ID.
message CreateOrgResponse {
  string org_id = 1;
}

// GetOrgRequest is the request to retrieve an organization.
message GetOrgRequest {
  oneof key {
    string org_id = 1 [(buf.validate.field).string.uuid = true];
    string org_name = 2 [(buf.validate.field).string.min_len = 1];
  }
}

// GetOrgResponse is the response containing the organization.
message GetOrgResponse {
  Organization organization = 1;
}

// ListUserOrgsRequest is the request to list organizations for a user.
message ListUserOrgsRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }]; // default: 50, max: 200
  string page_token = 3; // cursor from previous page (base64-encoded timestamp+id)
}

// ListUserOrgsResponse is the response containing organization list.
message ListUserOrgsResponse {
  repeated Organization orgs = 1;
  string next_page_token = 2; // empty if no more pages
}

message ListOrgMembersRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }]; // default: 50, max: 200
  string page_token = 3; // cursor from previous page (base64-encoded timestamp+id)
}

message ListOrgMembersResponse {
  repeated OrgMember members = 1;
  string next_page_token = 2; // empty if no more pages
}

message OrgMember {
  User user = 1;
  repeated string scopes = 2;
}

message AddOrgMemberRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string user_id = 2 [(buf.validate.field).string.uuid = true];
}

message AddOrgMemberResponse {}

message RemoveOrgMemberRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string user_id = 2 [(buf.validate.field).string.uuid = true];
}

message RemoveOrgMemberResponse {}

enum InvitationStatus {
  INVITATION_STATUS_UNSPECIFIED = 0;
  INVITATION_STATUS_EMAILED = 1;
  INVITATION_STATUS_FAILED = 2;
  INVITATION_STATUS_NO_TRANSPORT = 3;
  INVITATION_STATUS_EXPIRED = 4;
}

message Invitation {
  string id = 1;
  string org_id = 2;
  string email = 3;
  User invited_by = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp expires_at = 6;
  InvitationStatus status = 7;
  string delivery_error = 8;
  string link = 9;
}

message InviteOrgMemberRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string email = 2 [(buf.validate.field).string.min_len = 1];
}

message InviteOrgMemberResponse {
  Invitation invitation = 1;
}

message ListInvitationsRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }]; // default: 50, max: 200
  string page_token = 3;
}

message ListInvitationsResponse {
  repeated Invitation invitations = 1;
  string next_page_token = 2; // empty if no more pages
}

message RevokeInvitationRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message RevokeInvitationResponse {}

message ResendInvitationRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message ResendInvitationResponse {
  Invitation invitation = 1;
}

// User is a lightweight representation of a user for listing.
message User {
  string id = 1;
  string email = 2;
  string name = 3;
  string avatar_url = 4;
}

// UpdateOrgRequest is the request to update an organization.
message UpdateOrgRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  optional string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
}

// UpdateOrgResponse is the response containing the updated organization ID.
message UpdateOrgResponse {
  string org_id = 1;
}

// DeleteOrgRequest is the request to delete an organization.
message DeleteOrgRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
}

// DeleteOrgResponse is the response after deleting an organization.
message DeleteOrgResponse {}

// SuspendOrgRequest is the request to suspend an organization.
message SuspendOrgRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string reason = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 500
  }];
}

// SuspendOrgResponse is the organization after the request.
message SuspendOrgResponse {
  Organization organization = 1;
}

// ResumeOrgRequest is the request to resume a suspended organization.
message ResumeOrgRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
}

// ResumeOrgResponse is the organization after the request.
message ResumeOrgResponse {
  Organization organization = 1;
}
