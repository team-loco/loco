syntax = "proto3";

package loco.org.v1;

import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "loco/config/v1/config.proto";

option go_package = "github.com/team-loco/loco/gen/go/loco/org/v1;orgv1";

// OrgService manages organizations.
service OrgService {
  // CreateOrg creates a new organization.
  rpc CreateOrg(CreateOrgRequest) returns (CreateOrgResponse);
  // GetOrg retrieves an organization by ID.
  rpc GetOrg(GetOrgRequest) returns (GetOrgResponse);
  // UpdateOrg updates organization information.
  rpc UpdateOrg(UpdateOrgRequest) returns (UpdateOrgResponse);
  // DeleteOrg deletes an organization.
  rpc DeleteOrg(DeleteOrgRequest) returns (DeleteOrgResponse);

  // ListUserOrgs lists organizations for a user.
  rpc ListUserOrgs(ListUserOrgsRequest) returns (ListUserOrgsResponse);
  // ListOrgMembers lists organization members; organization membership is required.
  rpc ListOrgMembers(ListOrgMembersRequest) returns (ListOrgMembersResponse);
  // SetOrgMemberRole sets a member role; requires organization admin and preserves at least one admin.
  rpc SetOrgMemberRole(SetOrgMemberRoleRequest) returns (SetOrgMemberRoleResponse);
  // RemoveOrgMember removes another member; requires organization admin and preserves at least one admin.
  rpc RemoveOrgMember(RemoveOrgMemberRequest) returns (RemoveOrgMemberResponse);

  // SuspendOrg stops every workload of the organization and rejects deployments until ResumeOrg.
  // It keeps resources, specs, secrets, domains and deployment history. It requires system:admin.
  // Suspending a suspended organization changes nothing and keeps the first reason.
  rpc SuspendOrg(SuspendOrgRequest) returns (SuspendOrgResponse);
  // ResumeOrg runs again what the organization's active deployments describe. It requires system:admin.
  // Resuming an organization that is not suspended changes nothing.
  rpc ResumeOrg(ResumeOrgRequest) returns (ResumeOrgResponse);
  // GetOrgLimits returns the organization's effective count limits. Any member may call it.
  rpc GetOrgLimits(GetOrgLimitsRequest) returns (GetOrgLimitsResponse);
  // SetOrgLimits overrides the install's count limits for one organization. Only the fields in
  // update_mask change; a masked field set to 0 goes back to the install default. orgs_per_user
  // belongs to users and cannot be overridden. Lowering a limit deletes nothing. It requires
  // system:admin.
  rpc SetOrgLimits(SetOrgLimitsRequest) returns (SetOrgLimitsResponse);
  // InviteOrgMember invites an email address; requires an organization admin user and rejects existing members.
  rpc InviteOrgMember(InviteOrgMemberRequest) returns (InviteOrgMemberResponse);
  // ListInvitations lists open invitations; organization membership is required.
  rpc ListInvitations(ListInvitationsRequest) returns (ListInvitationsResponse);
  // RevokeInvitation revokes an open invitation; requires organization admin.
  rpc RevokeInvitation(RevokeInvitationRequest) returns (RevokeInvitationResponse);
  // ResendInvitation extends an open invitation and records a resend; requires organization admin.
  rpc ResendInvitation(ResendInvitationRequest) returns (ResendInvitationResponse);
}

// Organization represents a top-level organization container for users, workspaces, and resources.
message Organization {
  string id = 1;
  string name = 2;
  string created_by = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  google.protobuf.Timestamp suspended_at = 6;
  string suspension_reason = 7;
}

// CreateOrgRequest is the request to create a new organization.
message CreateOrgRequest {
  optional string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
}

// CreateOrgResponse is the response containing the created organization ID.
message CreateOrgResponse {
  string org_id = 1;
}

// GetOrgRequest is the request to retrieve an organization.
message GetOrgRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
}

// GetOrgResponse is the response containing the organization.
message GetOrgResponse {
  Organization organization = 1;
}

// ListUserOrgsRequest is the request to list organizations for a user.
message ListUserOrgsRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }]; // default: 50, max: 200
  string page_token = 3; // cursor from previous page (base64-encoded timestamp+id)
  // create_if_missing creates an organization and its "default" workspace, with the caller as admin,
  // when the caller belongs to no organization. It requires user_id to be the caller.
  bool create_if_missing = 4;
}

// ListUserOrgsResponse is the response containing organization list.
message ListUserOrgsResponse {
  repeated Organization orgs = 1;
  string next_page_token = 2; // empty if no more pages
}

// ListOrgMembersRequest selects a page of organization members.
message ListOrgMembersRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }]; // default: 50, max: 200
  string page_token = 3; // cursor from previous page (base64-encoded timestamp+id)
}

// ListOrgMembersResponse contains a page of members and a continuation token.
message ListOrgMembersResponse {
  repeated OrgMember members = 1;
  string next_page_token = 2; // empty if no more pages
}

// OrgMember pairs a user with their organization scopes.
message OrgMember {
  User user = 1;
  repeated string scopes = 2;
}

// RemoveOrgMemberRequest identifies another user to remove from the organization.
message RemoveOrgMemberRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string user_id = 2 [(buf.validate.field).string.uuid = true];
}

// RemoveOrgMemberResponse acknowledges member removal.
message RemoveOrgMemberResponse {}

// OrgRole selects organization administrator or member access.
enum OrgRole {
  ORG_ROLE_UNSPECIFIED = 0;
  ORG_ROLE_ADMIN = 1;
  ORG_ROLE_MEMBER = 2;
}

// SetOrgMemberRoleRequest identifies the organization member and their desired role.
message SetOrgMemberRoleRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string user_id = 2 [(buf.validate.field).string.uuid = true];
  OrgRole role = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// SetOrgMemberRoleResponse acknowledges the member role assignment.
message SetOrgMemberRoleResponse {}

// Invitation describes an open invitation and its sign-in link.
message Invitation {
  string id = 1;
  string org_id = 2;
  string email = 3;
  User invited_by = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp expires_at = 6;
  string link = 7;
}

// InviteOrgMemberRequest identifies the organization and email address to invite.
message InviteOrgMemberRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string email = 2 [(buf.validate.field).string.min_len = 1];
}

// InviteOrgMemberResponse contains the created invitation.
message InviteOrgMemberResponse {
  Invitation invitation = 1;
}

// ListInvitationsRequest selects a page of open organization invitations.
message ListInvitationsRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }]; // default: 50, max: 200
  string page_token = 3;
}

// ListInvitationsResponse contains a page of invitations and a continuation token.
message ListInvitationsResponse {
  repeated Invitation invitations = 1;
  string next_page_token = 2; // empty if no more pages
}

// RevokeInvitationRequest identifies the open invitation to revoke.
message RevokeInvitationRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// RevokeInvitationResponse acknowledges invitation revocation.
message RevokeInvitationResponse {}

// ResendInvitationRequest identifies the open invitation to extend and resend.
message ResendInvitationRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// ResendInvitationResponse contains the invitation with its extended expiry.
message ResendInvitationResponse {
  Invitation invitation = 1;
}

// User is a lightweight representation of a user for listing.
message User {
  string id = 1;
  string email = 2;
  string name = 3;
  string avatar_url = 4;
}

// UpdateOrgRequest is the request to update an organization.
message UpdateOrgRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  optional string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
}

// UpdateOrgResponse is the response containing the updated organization ID.
message UpdateOrgResponse {
  string org_id = 1;
}

// DeleteOrgRequest is the request to delete an organization.
message DeleteOrgRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
}

// DeleteOrgResponse is the response after deleting an organization.
message DeleteOrgResponse {}

// SuspendOrgRequest is the request to suspend an organization.
message SuspendOrgRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string reason = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 500
  }];
}

// SuspendOrgResponse is the organization after the request.
message SuspendOrgResponse {
  Organization organization = 1;
}

// ResumeOrgRequest is the request to resume a suspended organization.
message ResumeOrgRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
}

// ResumeOrgResponse is the organization after the request.
message ResumeOrgResponse {
  Organization organization = 1;
}

// OrgLimits are an organization's effective count limits and the latest change to them.
message OrgLimits {
  loco.config.v1.CountLimits limits = 1;
  // overridden names the CountLimits fields set for this organization rather than by the install.
  repeated string overridden = 2;
  // reason, updated_by and updated_at describe the latest SetOrgLimits; empty without one.
  string reason = 3;
  string updated_by = 4;
  google.protobuf.Timestamp updated_at = 5;
}

// GetOrgLimitsRequest is the request for an organization's count limits.
message GetOrgLimitsRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
}

// GetOrgLimitsResponse holds the organization's count limits.
message GetOrgLimitsResponse {
  OrgLimits limits = 1;
}

// SetOrgLimitsRequest is the request to override an organization's count limits.
message SetOrgLimitsRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  loco.config.v1.CountLimits limits = 2 [(buf.validate.field).required = true];
  google.protobuf.FieldMask update_mask = 3 [(buf.validate.field).required = true];
  string reason = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 500
  }];
}

// SetOrgLimitsResponse holds the organization's count limits after the request.
message SetOrgLimitsResponse {
  OrgLimits limits = 1;
}
