syntax = "proto3";

package loco.org.v1;

import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "loco/token/v1/token.proto";

option go_package = "github.com/team-loco/loco/gen/go/loco/org/v1;orgv1";

// OrgService manages organizations.
service OrgService {
  // CreateOrg creates a new organization.
  rpc CreateOrg(CreateOrgRequest) returns (CreateOrgResponse);
  // GetOrg retrieves an organization by ID or name.
  rpc GetOrg(GetOrgRequest) returns (GetOrgResponse);
  // UpdateOrg updates organization information.
  rpc UpdateOrg(UpdateOrgRequest) returns (UpdateOrgResponse);
  // DeleteOrg deletes an organization.
  rpc DeleteOrg(DeleteOrgRequest) returns (DeleteOrgResponse);

  // ListUserOrgs lists organizations for a user.
  rpc ListUserOrgs(ListUserOrgsRequest) returns (ListUserOrgsResponse);
  // ListOrgUsers lists users in an organization.
  rpc ListOrgUsers(ListOrgUsersRequest) returns (ListOrgUsersResponse);
  // ListOrgWorkspaces lists workspaces in an organization.
  rpc ListOrgWorkspaces(ListOrgWorkspacesRequest) returns (ListOrgWorkspacesResponse);

  rpc AddOrgDomain(AddOrgDomainRequest) returns (AddOrgDomainResponse);
  rpc ListOrgDomains(ListOrgDomainsRequest) returns (ListOrgDomainsResponse);
  rpc VerifyOrgDomain(VerifyOrgDomainRequest) returns (VerifyOrgDomainResponse);
  rpc SetOrgDomainAutoJoin(SetOrgDomainAutoJoinRequest) returns (SetOrgDomainAutoJoinResponse);
  rpc DeleteOrgDomain(DeleteOrgDomainRequest) returns (DeleteOrgDomainResponse);

  rpc GetOrgSSO(GetOrgSSORequest) returns (GetOrgSSOResponse);
  rpc ConfigureOrgSSO(ConfigureOrgSSORequest) returns (ConfigureOrgSSOResponse);
  rpc SetOrgRequireSSO(SetOrgRequireSSORequest) returns (SetOrgRequireSSOResponse);
  rpc DeleteOrgSSO(DeleteOrgSSORequest) returns (DeleteOrgSSOResponse);
}

// Organization represents a top-level organization container for users, workspaces, and resources.
message Organization {
  string id = 1;
  string name = 2;
  string created_by = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

// WorkspaceSummary provides a lightweight summary of a workspace for listing operations.
message WorkspaceSummary {
  string id = 1;
  string name = 2;
  string created_by = 3;
  google.protobuf.Timestamp created_at = 4;
}

// CreateOrgRequest is the request to create a new organization.
message CreateOrgRequest {
  optional string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
}

// CreateOrgResponse is the response containing the created organization ID.
message CreateOrgResponse {
  string org_id = 1;
}

// GetOrgRequest is the request to retrieve an organization.
message GetOrgRequest {
  oneof key {
    string org_id = 1 [(buf.validate.field).string.uuid = true];
    string org_name = 2 [(buf.validate.field).string.min_len = 1];
  }
}

// GetOrgResponse is the response containing the organization.
message GetOrgResponse {
  Organization organization = 1;
}

// ListUserOrgsRequest is the request to list organizations for a user.
message ListUserOrgsRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }]; // default: 50, max: 200
  string page_token = 3; // cursor from previous page (base64-encoded timestamp+id)
}

// ListUserOrgsResponse is the response containing organization list.
message ListUserOrgsResponse {
  repeated Organization orgs = 1;
  string next_page_token = 2; // empty if no more pages
}

// ListOrgUsersRequest is the request to list users in an organization.
message ListOrgUsersRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }]; // default: 50, max: 200
  string page_token = 3; // cursor from previous page (base64-encoded timestamp+id)
}

// ListOrgUsersResponse is the response containing user list.
message ListOrgUsersResponse {
  repeated User users = 1;
  string next_page_token = 2; // empty if no more pages
}

// User is a lightweight representation of a user for listing.
message User {
  string id = 1;
  string email = 2;
  string name = 3;
  string avatar_url = 4;
}

// ListOrgWorkspacesRequest is the request to list workspaces in an organization.
message ListOrgWorkspacesRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }]; // default: 50, max: 200
  string page_token = 3; // cursor from previous page (base64-encoded timestamp+id)
}

// ListOrgWorkspacesResponse is the response containing workspace list.
message ListOrgWorkspacesResponse {
  repeated WorkspaceSummary workspaces = 1;
  string next_page_token = 2; // empty if no more pages
}

// UpdateOrgRequest is the request to update an organization.
message UpdateOrgRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  google.protobuf.FieldMask update_mask = 2;
  optional string name = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
}

// UpdateOrgResponse is the response containing the updated organization ID.
message UpdateOrgResponse {
  string org_id = 1;
}

// DeleteOrgRequest is the request to delete an organization.
message DeleteOrgRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
}

// DeleteOrgResponse is the response after deleting an organization.
message DeleteOrgResponse {}

message OrgDomain {
  string id = 1;
  string domain = 2;
  bool verified = 3;
  string verification_record_name = 4;
  string verification_record_value = 5;
  loco.token.v1.Scope auto_join_scope = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp verified_at = 8;
}

message AddOrgDomainRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string domain = 2 [(buf.validate.field).string = {
    hostname: true
    max_len: 253
  }];
}

message AddOrgDomainResponse {
  OrgDomain domain = 1;
}

message ListOrgDomainsRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
}

message ListOrgDomainsResponse {
  repeated OrgDomain domains = 1;
}

message VerifyOrgDomainRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string domain_id = 2 [(buf.validate.field).string.uuid = true];
}

message VerifyOrgDomainResponse {
  OrgDomain domain = 1;
}

message SetOrgDomainAutoJoinRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string domain_id = 2 [(buf.validate.field).string.uuid = true];
  loco.token.v1.Scope scope = 3 [(buf.validate.field).enum.defined_only = true];
}

message SetOrgDomainAutoJoinResponse {
  OrgDomain domain = 1;
  int32 users_added = 2;
}

message DeleteOrgDomainRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  string domain_id = 2 [(buf.validate.field).string.uuid = true];
}

message DeleteOrgDomainResponse {}

message ServiceProvider {
  string metadata_url = 1;
  string acs_url = 2;
}

message OrgSSO {
  string connection_id = 1;
  bool require_sso = 2;
  repeated string domains = 3;
  google.protobuf.Timestamp created_at = 4;
}

message GetOrgSSORequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetOrgSSOResponse {
  bool available = 1;
  ServiceProvider service_provider = 2;
  optional OrgSSO sso = 3;
  bool signed_in_with_sso = 4;
}

message ConfigureOrgSSORequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  oneof metadata {
    option (buf.validate.oneof).required = true;
    string metadata_url = 2 [(buf.validate.field).string = {
      uri: true
      prefix: "https://"
      max_len: 2048
    }];
    string metadata_xml = 3 [(buf.validate.field).string = {
      min_len: 1
      max_len: 262144
    }];
  }
}

message ConfigureOrgSSOResponse {
  OrgSSO sso = 1;
}

message SetOrgRequireSSORequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  bool require_sso = 2;
}

message SetOrgRequireSSOResponse {
  OrgSSO sso = 1;
}

message DeleteOrgSSORequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
}

message DeleteOrgSSOResponse {}
