syntax = "proto3";

package loco.resource.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "loco/deployment/v1/deployment.proto";
import "loco/domain/v1/domain.proto";

option go_package = "github.com/team-loco/loco/gen/go/loco/resource/v1;resourcev1";

// ResourceType categorizes the type of resource being deployed.
enum ResourceType {
  RESOURCE_TYPE_UNSPECIFIED = 0;
  RESOURCE_TYPE_SERVICE = 1;
  RESOURCE_TYPE_DATABASE = 2;
  RESOURCE_TYPE_FUNCTION = 3;
  RESOURCE_TYPE_CACHE = 4;
  RESOURCE_TYPE_QUEUE = 5;
  RESOURCE_TYPE_BLOB = 6;
}

// ResourceStatus is whether a resource is serving, derived from the replicas its clusters report ready.
// HEALTHY: ready replicas of any version cover every desired replica. DEGRADED: some replicas or
// regions are not ready. UNAVAILABLE: no replica is ready. DEPLOYING: a first rollout has no ready
// replica yet.
// UNKNOWN: the cluster running it stopped reporting, so its last report cannot be trusted.
enum ResourceStatus {
  RESOURCE_STATUS_UNSPECIFIED = 0;
  RESOURCE_STATUS_HEALTHY = 1;
  RESOURCE_STATUS_DEPLOYING = 2;
  RESOURCE_STATUS_DEGRADED = 3;
  RESOURCE_STATUS_UNAVAILABLE = 4;
  RESOURCE_STATUS_UNKNOWN = 5;
}

// ResourceService manages resource lifecycle and operations.
service ResourceService {
  // CreateResource creates a new resource.
  rpc CreateResource(CreateResourceRequest) returns (CreateResourceResponse);
  // GetResource retrieves a resource by ID or slug.
  rpc GetResource(GetResourceRequest) returns (GetResourceResponse);
  // UpdateResource updates a resource configuration.
  rpc UpdateResource(UpdateResourceRequest) returns (UpdateResourceResponse);
  // DeleteResource deletes a resource.
  rpc DeleteResource(DeleteResourceRequest) returns (DeleteResourceResponse);

  // ListWorkspaceResources lists, searches, filters, sorts and counts the resources of a workspace.
  // A caller who cannot list the workspace gets the resources of it that GetResource would return,
  // with every count over those alone; one who can read none of them is denied.
  rpc ListWorkspaceResources(ListWorkspaceResourcesRequest) returns (ListWorkspaceResourcesResponse);
  // ListOrgResources lists, newest first, the resources across an organization's workspaces that the
  // caller can read: every resource of a workspace it reads, and the resources granted to it directly.
  rpc ListOrgResources(ListOrgResourcesRequest) returns (ListOrgResourcesResponse);
  // GetEnvironmentAllocation sums the CPU and memory the resources of a workspace are allocated in
  // an environment. A caller who cannot list the workspace gets the sums over the resources of it
  // that GetResource would return; one who can read none of them is denied.
  rpc GetEnvironmentAllocation(GetEnvironmentAllocationRequest) returns (GetEnvironmentAllocationResponse);
  // ListRegions lists the regions an environment deploys to.
  rpc ListRegions(ListRegionsRequest) returns (ListRegionsResponse);
  // GetResourceEnv returns the variables a service runs with in an environment as written, the
  // env map of loco.yaml, with references unresolved. Secret values are never included.
  rpc GetResourceEnv(GetResourceEnvRequest) returns (GetResourceEnvResponse);
  // ListResourceOutputs lists what each resource of the workspace provides to references in an
  // environment: its built-in outputs and its variables.
  rpc ListResourceOutputs(ListResourceOutputsRequest) returns (ListResourceOutputsResponse);

  // Resource Operations
  // ScaleResource adjusts resource replicas and resource allocation.
  rpc ScaleResource(ScaleResourceRequest) returns (ScaleResourceResponse);
  // RestartResource rolls the current replicas without creating a new deployment.
  rpc RestartResource(RestartResourceRequest) returns (RestartResourceResponse);
  // TransferPartial moves a resource to another partial.
  rpc TransferPartial(TransferPartialRequest) returns (TransferPartialResponse);
}

// RoutingConfig defines routing configuration for a resource. A service without a port is a
// worker: it gets no Kubernetes Service, no route and no readiness probe.
message RoutingConfig {
  option (buf.validate.message).cel = {
    id: "routing.path_prefix_requires_port"
    message: "path_prefix needs a port: a service without a port receives no traffic"
    expression: "has(this.port) || this.path_prefix == ''"
  };

  optional int32 port = 1; // application port
  string path_prefix = 2; // e.g., "/"
  int32 idle_timeout = 3; // seconds
}

// RegionTarget defines the desired state for a specific region.
message RegionTarget {
  bool enabled = 1;
  string cpu = 2; // e.g., "100m"
  string memory = 3; // e.g., "256Mi"
  int32 min_replicas = 4;
  int32 max_replicas = 5;
  optional deployment.v1.Scalers scalers = 6; // autoscaling config
}

// ServiceSpec is the resource specification for SERVICE type resources.
message ServiceSpec {
  option (buf.validate.message).cel = {
    id: "service.health_check_requires_port"
    message: "health_check needs routing.port: the HTTP check probes the service port"
    expression: "has(this.routing.port) || !has(this.health_check)"
  };

  RoutingConfig routing = 1;
  map<string, RegionTarget> regions = 2 [(buf.validate.field).map.min_pairs = 1]; // key = region name
  optional deployment.v1.HealthCheckConfig health_check = 3; // health check defaults
  // Application SDK environment injection defaults to true.
  deployment.v1.ObservabilityConfig observability = 4;
  reserved 5;
}

// ResourceSpec defines the global infrastructure intent for a resource.
// Uses oneof to support different resource types.
message ResourceSpec {
  oneof spec {
    ServiceSpec service = 1;
  }
}

// Resource represents a resource in a workspace.
message Resource {
  string id = 1;
  string workspace_id = 2;
  // slug is the resource's key: a DNS label, unique in its workspace.
  string slug = 3;
  ResourceType type = 4;
  repeated domain.v1.ResourceDomain domains = 5;
  optional ResourceSpec spec = 6;
  int32 spec_version = 7;
  optional string description = 8;
  string created_by = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  optional string partial = 12;
  repeated EnvironmentStatus environment_statuses = 13;
  // revision increases with every change to the resource spec or its scaling.
  int64 revision = 15;
  // name is the label the dashboard shows.
  string name = 16;
  // The failure policy the service's next deployment runs under, with the defaults filled in.
  deployment.v1.FailurePolicy failure_policy = 17;
}

// EnvironmentStatus is a resource's status in one environment it has an active deployment in.
message EnvironmentStatus {
  string environment_id = 1;
  string environment_slug = 2;
  ResourceStatus status = 3;
  repeated RegionStatus regions = 4;
  // When the environment entered its current status: the earliest time a region entered a failing
  // status, or the latest time a region entered a healthy or deploying one. Unset when no region
  // has reported yet.
  optional google.protobuf.Timestamp status_since = 5;
}

// RegionStatus is a resource's status in one region of an environment: its active deployment and
// the replicas the cluster running it reports ready.
message RegionStatus {
  string region = 1;
  ResourceStatus status = 2;
  // The ready replicas of every version, at most desired_replicas.
  int32 ready_replicas = 3;
  int32 desired_replicas = 4;
  // The live deployment: the one placed in this region, or a newer one waiting for its build.
  string deployment_id = 5;
  // The deployment with the most ready replicas in this region, the live deployment and then the
  // newest on a tie. Empty while no replica is ready.
  string serving_deployment_id = 13;
  // The newest earlier deployment in this region that a rollback returns to: running or superseded,
  // and not the live deployment. Empty when there is none.
  string last_good_deployment_id = 14;
  // The status of the live deployment's placement in this region.
  deployment.v1.PlacementStatus placement_status = 10;
  optional string message = 7;
  optional google.protobuf.Timestamp reported_at = 8;
  // When the region entered its current status. When Loco did not see the change, the time of the
  // last report. Unset until the first replica report.
  optional google.protobuf.Timestamp status_since = 12;
  // The replicas the cluster last reported for this region's placement. GetResource fills them;
  // list responses leave them empty.
  repeated deployment.v1.Replica replicas = 9;
  reserved 11;
}

// --- CRUD ---

// CreateResourceRequest is the request to create a new resource.
message CreateResourceRequest {
  option (buf.validate.message).cel = {
    id: "create_resource.domain_requires_port"
    message: "domain needs spec.service.routing.port: a service without a port receives no traffic"
    expression: "!has(this.domain) || has(this.spec.service.routing.port)"
  };

  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
  // The label the dashboard shows: 1 to 63 characters after trimming, unique in the workspace.
  string name = 2;
  ResourceType type = 3 [(buf.validate.field).enum = {
    in: [1]
  }];
  optional domain.v1.DomainInput domain = 4;
  ResourceSpec spec = 5 [(buf.validate.field).required = true];
  optional string description = 6 [(buf.validate.field).string.max_len = 256];
  // The environment for domain. If omitted, the workspace's production environment is used.
  optional string environment_id = 7 [(buf.validate.field).string.uuid = true];
  // A DNS label other than localhost and resource-<UUID>, unique in the workspace. If omitted,
  // it is derived from name.
  optional string slug = 8;
}

// CreateResourceResponse is the response containing the created resource ID.
message CreateResourceResponse {
  string resource_id = 1;
  // The committed resource revision, for a following optimistic configuration update.
  int64 revision = 2;
}

// GetResourceSlugKey looks up a resource by slug within a workspace.
message GetResourceSlugKey {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
  string slug = 2 [(buf.validate.field).string.min_len = 1];
}

// GetResourceRequest is the request to retrieve a resource.
message GetResourceRequest {
  oneof key {
    string resource_id = 1;
    GetResourceSlugKey slug_key = 2;
  }
}

// GetResourceResponse is the response containing the resource.
message GetResourceResponse {
  Resource resource = 1;
}

// ResourceOrder is what ListWorkspaceResources sorts by. Ties sort by name, then ID, ascending.
enum ResourceOrder {
  // Newest first: creation time, descending, whatever descending says.
  RESOURCE_ORDER_UNSPECIFIED = 0;
  // Case-insensitive name.
  RESOURCE_ORDER_NAME = 1;
  // Status rank: degraded or unavailable, then unknown or deploying, then healthy, then no status.
  // Across environments a resource ranks by its worst environment.
  RESOURCE_ORDER_STATUS = 2;
  // Creation time.
  RESOURCE_ORDER_CREATED = 3;
  // CPU, then memory, of the live deployment in the sort environment, else of the resource's spec.
  RESOURCE_ORDER_SIZE = 4;
  // The first of the resource's regions, alphabetically.
  RESOURCE_ORDER_REGION = 5;
  // Total desired replicas of the live deployments.
  RESOURCE_ORDER_REPLICAS = 6;
  // When the newest deployment started, or was created before it started, live or not. Across
  // environments the latest environment's.
  RESOURCE_ORDER_DEPLOYED = 7;
}

// ListWorkspaceResourcesRequest is the request to list resources. A resource's regions are the
// regions its live deployments run in and the enabled regions of its spec. environment_id scopes
// the status, live regions, image and size that query, the filters, the facets and the order read;
// without it they read every environment, and a resource matches a status or region any
// environment has.
message ListWorkspaceResourcesRequest {
  option (buf.validate.message).cel = {
    id: "resources.status_or_not_deployed"
    message: "status and not_deployed are mutually exclusive"
    expression: "this.status == 0 || !this.not_deployed"
  };
  option (buf.validate.message).cel = {
    id: "resources.environment_scoped_requires_environment"
    message: "environment_scoped needs environment_id"
    expression: "!this.environment_scoped || this.environment_id != ''"
  };

  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }]; // default: 50, max: 200
  // next_page_token from the previous page of the same order, direction and sort_environment_id;
  // empty for the first page.
  string page_token = 3 [(buf.validate.field).string.max_len = 1024];
  // Case-insensitive substring of the name, slug, description, a domain or a region, or of an
  // image of the resource's live deployments.
  string query = 4 [(buf.validate.field).string.max_len = 256];
  string environment_id = 5 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  // Only resources with this status.
  ResourceStatus status = 6 [(buf.validate.field).enum.defined_only = true];
  // Only resources with no status: nothing live, though older deployments may exist.
  bool not_deployed = 7;
  // Only resources with this region.
  string region = 8 [(buf.validate.field).string.max_len = 63];
  // Only resources of this type.
  ResourceType type = 9 [(buf.validate.field).enum.defined_only = true];
  // Only resources with a deployment in environment_id, or with no deployment anywhere.
  bool environment_scoped = 10;
  ResourceOrder order_by = 11 [(buf.validate.field).enum.defined_only = true];
  bool descending = 12;
  // Sets total_count in the response.
  bool include_total_count = 13;
  // Sets facets in the response.
  bool include_facets = 14;
  // The environment whose status, size and deployment time the STATUS, SIZE and DEPLOYED orders
  // read, while query, the filters and the facets follow environment_id. Empty sorts by
  // environment_id, or across environments without it.
  string sort_environment_id = 15 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  // Only these resources. They also limit the resources the facets count.
  repeated string resource_ids = 16 [(buf.validate.field).repeated = {
    max_items: 100
    items: {
      string: {uuid: true}
    }
  }];
}

// ListWorkspaceResourcesResponse is the response containing the list of resources.
message ListWorkspaceResourcesResponse {
  repeated Resource resources = 1;
  string next_page_token = 2; // empty if no more pages
  // The resources the filters match, ignoring page_token; set when include_total_count is.
  // Exact up to 10,000; 10,001 means more than 10,000.
  int32 total_count = 3;
  // Set when include_facets is.
  ResourceFacets facets = 4;
}

// ResourceFacets counts the resources per value of the status, region and type filters, over the
// resources the query and the other filters match, ignoring page_token. Counts are capped like
// total_count.
message ResourceFacets {
  // Ignores status and not_deployed; statuses no resource has are left out. A resource with
  // statuses in several environments counts once for each status.
  repeated ResourceStatusCount statuses = 1;
  // The resources not_deployed would match, ignoring status.
  int32 not_deployed = 2;
  // Ignores region, status and not_deployed. Every region a resource of the workspace has, with 0
  // where none matches, ordered by region; a resource counts once for each of its regions.
  repeated ResourceRegionCount regions = 3;
  // Ignores type; types no resource has are left out.
  repeated ResourceTypeCount types = 4;
}

message ResourceStatusCount {
  ResourceStatus status = 1;
  int32 count = 2;
}

message ResourceRegionCount {
  string region = 1;
  int32 count = 2;
}

message ResourceTypeCount {
  ResourceType type = 1;
  int32 count = 2;
}

// UpdateResourceRequest is the request to update a resource.
message UpdateResourceRequest {
  string resource_id = 1 [(buf.validate.field).string.uuid = true];
  // The label the dashboard shows: 1 to 63 characters after trimming, unique in the workspace.
  optional string name = 2;
  optional string description = 3 [(buf.validate.field).string.max_len = 256];
  // regions replaces the resource's whole region map when set; omitted regions are torn down.
  optional RegionTargets regions = 4;
  // revision is the Resource.revision the caller loaded; a regions update fails when it moved.
  int64 revision = 5;
  // failure_policy replaces the service's failure policy; it applies from the next deployment.
  optional deployment.v1.FailurePolicy failure_policy = 6;
  // A new slug: a DNS label other than localhost and resource-<UUID>, unique in the workspace.
  // Resources that loco.yaml manages keep the slug the file names them by.
  optional string slug = 7;
}

// RegionTargets is a resource's desired region map, keyed by region name.
message RegionTargets {
  map<string, RegionTarget> targets = 1;
}

// UpdateResourceResponse is the response containing the updated resource ID.
message UpdateResourceResponse {
  string resource_id = 1;
}

// DeleteResourceRequest is the request to delete a resource.
message DeleteResourceRequest {
  string resource_id = 1 [(buf.validate.field).string.uuid = true];
}

// DeleteResourceResponse is the response after deleting a resource.
message DeleteResourceResponse {}

// RegionAvailability describes whether a region has a cluster heard from recently.
enum RegionAvailability {
  REGION_AVAILABILITY_UNSPECIFIED = 0;
  REGION_AVAILABILITY_AVAILABLE = 1;
  REGION_AVAILABILITY_OFFLINE = 2;
}

// RegionInfo describes a region served by an environment's eligible clusters.
message RegionInfo {
  string region = 1;
  reserved 2;
  reserved "is_default";
  string health_status = 3;
  RegionAvailability availability = 4;
}

// ListOrgResourcesRequest names the organization and the page of its resources to list.
message ListOrgResourcesRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }]; // default: 50, max: 200
  // next_page_token from the previous page of the same query; empty for the first page.
  string page_token = 3;
  // Case-insensitive substring of the resource's name or slug.
  string query = 4 [(buf.validate.field).string.max_len = 256];
  // Sets total_count in the response.
  bool include_total_count = 5;
  // Only these resources.
  repeated string resource_ids = 6 [(buf.validate.field).repeated = {
    max_items: 200
    items: {
      string: {uuid: true}
    }
  }];
}

// ListOrgResourcesResponse is one page of an organization's resources.
message ListOrgResourcesResponse {
  repeated OrgResource resources = 1;
  string next_page_token = 2; // empty on the last page
  // The resources the query matches, ignoring page_token; set when include_total_count is.
  // Exact up to 10,000; 10,001 means more than 10,000.
  int32 total_count = 3;
}

// OrgResource is a resource with the workspace that holds it.
message OrgResource {
  string id = 1;
  string name = 2;
  string slug = 3;
  ResourceType type = 4;
  string workspace_id = 5;
  string workspace_name = 6;
}

// GetEnvironmentAllocationRequest names the workspace and the environment to sum.
message GetEnvironmentAllocationRequest {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
  string environment_id = 2 [(buf.validate.field).string.uuid = true];
}

// GetEnvironmentAllocationResponse is the allocation of the environment. A resource's allocation
// sums, over the regions of its status in the environment, the region's desired replicas times
// the CPU and memory its live deployment sizes the region with; resources whose allocation is
// zero are left out of every field.
message GetEnvironmentAllocationResponse {
  int64 cpu_millicores = 1;
  int64 memory_bytes = 2;
  // The resources with an allocation.
  int32 resource_count = 3;
  // The six largest allocations, by CPU, then memory, descending, then by name.
  repeated ResourceAllocation resources = 4;
}

// ResourceAllocation is one resource's allocation in an environment.
message ResourceAllocation {
  string resource_id = 1;
  string name = 2;
  int64 cpu_millicores = 3;
  int64 memory_bytes = 4;
}

// ListRegionsRequest names the environment whose clusters' regions to list.
message ListRegionsRequest {
  string environment_id = 1 [(buf.validate.field).string.uuid = true];
}

// ListRegionsResponse contains the regions the environment's clusters serve.
message ListRegionsResponse {
  repeated RegionInfo regions = 1;
}

// GetResourceEnvRequest names the service and the environment whose variables to read.
message GetResourceEnvRequest {
  string resource_id = 1 [(buf.validate.field).string.uuid = true];
  string environment_id = 2 [(buf.validate.field).string.uuid = true];
}

// GetResourceEnvResponse holds the variables of the service's active deployment in the
// environment, empty when it has none.
message GetResourceEnvResponse {
  map<string, string> env = 1;
}

// ListResourceOutputsRequest names the environment whose resource outputs to list.
message ListResourceOutputsRequest {
  string environment_id = 1 [(buf.validate.field).string.uuid = true];
}

// ResourceOutput is one value another resource can refer to as ${{ resource.KEY }}.
message ResourceOutput {
  string key = 1;
  // value is the output with its references to other resources resolved; references to
  // secrets stay as ${{ secrets.NAME }}.
  string value = 2;
  // built_in is true for the outputs Loco provides: PRIVATE_HOST, PORT, PRIVATE_URL and
  // PUBLIC_URL. The others are the resource's variables.
  bool built_in = 3;
}

// ResourceOutputs is what one resource provides in the environment, read from its latest
// deployment there and its primary domain.
message ResourceOutputs {
  string resource_id = 1;
  // resource_slug is the name references use: ${{ <slug>.KEY }}.
  string resource_slug = 2;
  repeated ResourceOutput outputs = 3;
  // used_by holds the slugs of the resources whose latest deployment refers to this resource.
  repeated string used_by = 4;
}

// ListResourceOutputsResponse lists every resource of the workspace by slug.
message ListResourceOutputsResponse {
  repeated ResourceOutputs resources = 1;
}

// --- Resource Operations ---

// ScaleResourceRequest is the request to scale a resource's active deployments in one environment.
message ScaleResourceRequest {
  string resource_id = 1 [(buf.validate.field).string.uuid = true];
  optional int32 replicas = 2 [(buf.validate.field).int32.gte = 1];
  optional string cpu = 3 [(buf.validate.field).string.min_len = 1];
  optional string memory = 4 [(buf.validate.field).string.min_len = 1];
  optional string region = 5; // if provided, scale only this region; otherwise scale all regions
  string environment_id = 6 [(buf.validate.field).string.uuid = true];
}

// ScaleResourceResponse is the response after scaling a resource.
message ScaleResourceResponse {}

// TransferPartialRequest is the request to move a resource to another partial.
message TransferPartialRequest {
  string resource_id = 1 [(buf.validate.field).string.uuid = true];
  string partial = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
    pattern: "^[a-z]([-a-z0-9]*[a-z0-9])?$"
  }];
}

// TransferPartialResponse is the response after moving a resource to another partial.
message TransferPartialResponse {}

// RestartResourceRequest targets one environment; omitting region restarts every region.
message RestartResourceRequest {
  string resource_id = 1 [(buf.validate.field).string.uuid = true];
  string environment_id = 2 [(buf.validate.field).string.uuid = true];
  optional string region = 3 [(buf.validate.field).string.min_len = 1];
}

// RestartResourceResponse is the response after scheduling a rolling restart.
message RestartResourceResponse {}
