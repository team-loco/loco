syntax = "proto3";

package loco.config.v1;

import "loco/deployment/v1/deployment.proto";
import "loco/resource/v1/resource.proto";

option go_package = "github.com/team-loco/loco/gen/go/loco/config/v1;configv1";

// ConfigService provides static configuration values. Clients can query this to show safe defaults.
service ConfigService {
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);
}

message GetConfigRequest {}

message GetConfigResponse {
  DefaultServiceConfig service_defaults = 1;
  string min_cli_version = 2;
  AuthConfig auth = 3;
  string schema_url = 4;
}

message AuthConfig {
  reserved 1, 3;
  reserved "adapter", "url";

  string issuer = 2;
  string client_id = 4;
  string scopes = 5;
}

// DefaultServiceConfig contains default values for service deployments.
// These values are used when users don't specify explicit configuration.
message DefaultServiceConfig {
  reserved 1, 2;
  reserved "build_type", "dockerfile_path";

  // Default routing configuration
  resource.v1.RoutingConfig routing = 3;

  // Default health check configuration
  deployment.v1.HealthCheckConfig health_check = 4;

  // Default resource allocation
  string cpu = 5; // e.g., "0.25"
  string memory = 6; // e.g., "256Mi"
  int32 min_replicas = 7;
  int32 max_replicas = 8;

  // Default observability configuration
  resource.v1.ObservabilityConfig observability = 9;

  // Default platform domain (e.g., "onloco.app")
  string platform_domain = 10;
}
