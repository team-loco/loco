syntax = "proto3";

package loco.config.v1;

import "loco/deployment/v1/deployment.proto";
import "loco/resource/v1/resource.proto";

option go_package = "github.com/team-loco/loco/gen/go/loco/config/v1;configv1";

// ConfigService provides static configuration values. Clients can query this to show safe defaults.
service ConfigService {
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);
}

message GetConfigRequest {}

message GetConfigResponse {
  DefaultServiceConfig service_defaults = 1;
  string min_cli_version = 2;
  AuthConfig auth = 3;
  string schema_url = 4;
  repeated OrgLink org_links = 5;
  int64 api_token_max_lifetime_seconds = 6;
  SizeLimits size_limits = 7;
  // count_limits are the install's defaults; GetOrgLimits reports an organization's own.
  CountLimits count_limits = 8;
}

// CountLimits cap how many of each thing can exist. A create past a cap fails with
// RESOURCE_EXHAUSTED; deployment_history and build_history instead delete the oldest finished
// records. Per-workspace and per-resource limits apply to each workspace or resource.
message CountLimits {
  // orgs_per_user counts the organizations a user created.
  int32 orgs_per_user = 1;
  int32 workspaces_per_org = 2;
  int32 members_per_org = 3;
  // invitations_per_org counts open invitations.
  int32 invitations_per_org = 4;
  int32 environments_per_workspace = 5;
  int32 resources_per_workspace = 6;
  int32 webhooks_per_workspace = 7;
  // tokens_per_entity counts the API tokens of one user, organization, workspace or resource.
  int32 tokens_per_entity = 8;
  // domains_per_resource counts a resource's domains in one environment.
  int32 domains_per_resource = 9;
  // secrets_per_resource counts a resource's secrets in one environment.
  int32 secrets_per_resource = 10;
  // deployment_history is how many deployments a resource keeps in each environment.
  int32 deployment_history = 11;
  // build_history is how many builds a resource keeps.
  int32 build_history = 12;
}

// SizeLimits are the inclusive bounds a service's CPU, memory and replica counts must
// fall within; requests outside them are rejected.
message SizeLimits {
  int32 min_cpu_millis = 1;
  int32 max_cpu_millis = 2;
  int64 min_memory_bytes = 3;
  int64 max_memory_bytes = 4;
  int32 min_replicas = 5;
  int32 max_replicas = 6;
}

message OrgLink {
  string label = 1;
  string url = 2;
}

message AuthConfig {
  string issuer = 1;
  string client_id = 2;
  string scopes = 3;
}

// DefaultServiceConfig contains default values for service deployments.
// These values are used when users don't specify explicit configuration.
message DefaultServiceConfig {
  // Default routing configuration
  resource.v1.RoutingConfig routing = 1;

  // Default health check configuration
  deployment.v1.HealthCheckConfig health_check = 2;

  // Default resource allocation
  string cpu = 3; // e.g., "0.25"
  string memory = 4; // e.g., "256Mi"
  int32 min_replicas = 5;
  int32 max_replicas = 6;

  // Default observability configuration
  resource.v1.ObservabilityConfig observability = 7;
  int32 deploy_attempts = 8;
  int32 deploy_retry_delay_seconds = 9;
  int32 cpu_target = 10;
}
