syntax = "proto3";

package loco.usage.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/team-loco/loco/gen/go/loco/usage/v1;usagev1";

service UsageService {
  rpc ListWorkloadRuns(ListWorkloadRunsRequest) returns (ListWorkloadRunsResponse);
  rpc ListEgressUsage(ListEgressUsageRequest) returns (ListEgressUsageResponse);
}

message ListWorkloadRunsRequest {
  string cursor = 1 [(buf.validate.field).string.max_len = 64];
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 1000
  }];
}

message ListWorkloadRunsResponse {
  repeated WorkloadRun runs = 1;
  string next_cursor = 2;
  google.protobuf.Timestamp metered_through = 3;
}

message WorkloadRun {
  string id = 1;
  string cluster_id = 2;
  string region = 3;
  string organization_id = 4;
  string workspace_id = 5;
  string resource_id = 6;
  string environment_id = 7;
  int64 cpu_millicores = 8;
  int64 memory_bytes = 9;
  google.protobuf.Timestamp started_at = 10;
  google.protobuf.Timestamp last_seen_at = 11;
  optional google.protobuf.Timestamp ended_at = 12;
}

message ListEgressUsageRequest {
  string cursor = 1 [(buf.validate.field).string.max_len = 64];
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 1000
  }];
}

message ListEgressUsageResponse {
  repeated EgressUsage usage = 1;
  string next_cursor = 2;
  google.protobuf.Timestamp metered_through = 3;
}

message EgressUsage {
  string cluster_id = 1;
  string region = 2;
  string organization_id = 3;
  string workspace_id = 4;
  string resource_id = 5;
  string environment_id = 6;
  google.protobuf.Timestamp hour_start = 7;
  int64 bytes = 8;
}
