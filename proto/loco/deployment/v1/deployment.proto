syntax = "proto3";

package loco.deployment.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/team-loco/loco/gen/go/loco/deployment/v1;deploymentv1";

enum DeploymentStatus {
  DEPLOYMENT_STATUS_UNSPECIFIED = 0;
  DEPLOYMENT_STATUS_BUILDING = 1;
  DEPLOYMENT_STATUS_DEPLOYING = 2;
  DEPLOYMENT_STATUS_RUNNING = 3;
  DEPLOYMENT_STATUS_FAILED = 4;
  DEPLOYMENT_STATUS_CANCELED = 5;
  DEPLOYMENT_STATUS_SUPERSEDED = 6;
  DEPLOYMENT_STATUS_DEGRADED = 7;
  DEPLOYMENT_STATUS_CRASHED = 8;
}

// PlacementStatus is the state of one region of a deployment.
enum PlacementStatus {
  PLACEMENT_STATUS_UNSPECIFIED = 0;
  // Waiting for the deployment's build.
  PLACEMENT_STATUS_PENDING = 1;
  PLACEMENT_STATUS_DEPLOYING = 2;
  PLACEMENT_STATUS_RUNNING = 3;
  PLACEMENT_STATUS_DEGRADED = 4;
  PLACEMENT_STATUS_CRASHED = 5;
  PLACEMENT_STATUS_FAILED = 6;
  PLACEMENT_STATUS_CANCELED = 7;
  PLACEMENT_STATUS_SUPERSEDED = 8;
}

// DeploymentTrigger is what created a deployment.
enum DeploymentTrigger {
  DEPLOYMENT_TRIGGER_UNSPECIFIED = 0;
  DEPLOYMENT_TRIGGER_DEPLOY = 1;
  DEPLOYMENT_TRIGGER_REDEPLOY = 2;
  DEPLOYMENT_TRIGGER_ROLLBACK = 3;
  DEPLOYMENT_TRIGGER_SCALE = 4;
  reserved 5;
}

// DeploymentService manages resource deployments.
service DeploymentService {
  // CreateDeployment creates a new deployment for a resource.
  rpc CreateDeployment(CreateDeploymentRequest) returns (CreateDeploymentResponse);
  // GetDeployment retrieves a deployment by ID.
  rpc GetDeployment(GetDeploymentRequest) returns (GetDeploymentResponse);
  // ListDeployments lists deployments visible to the caller.
  rpc ListDeployments(ListDeploymentsRequest) returns (ListDeploymentsResponse);
  // QueryDeploymentBuckets splits a time window into equal buckets and summarizes, per nonempty
  // bucket, the deployments of a workspace environment the caller can read.
  rpc QueryDeploymentBuckets(QueryDeploymentBucketsRequest) returns (QueryDeploymentBucketsResponse);
  // WatchDeployment streams deployment events in real-time.
  rpc WatchDeployment(WatchDeploymentRequest) returns (stream WatchDeploymentResponse);
  // DeleteDeployment deletes/inactivates a deployment.
  rpc DeleteDeployment(DeleteDeploymentRequest) returns (DeleteDeploymentResponse);
  // CancelDeployment stops a building or rolling-out deployment. Regions it does not run yet
  // return to the deployment that served them before; regions it already runs keep it, or
  // roll back to the version they ran before when the request asks.
  rpc CancelDeployment(CancelDeploymentRequest) returns (CancelDeploymentResponse);
  // GetDeploymentCancelImpact lists the regions that already run a deployment and keep it when
  // it is canceled, with the version each would roll back to.
  rpc GetDeploymentCancelImpact(GetDeploymentCancelImpactRequest) returns (GetDeploymentCancelImpactResponse);
  // ResolveImage returns the digest-pinned image reference.
  rpc ResolveImage(ResolveImageRequest) returns (ResolveImageResponse);
}

// HealthCheckConfig defines health check parameters.
message HealthCheckConfig {
  string path = 1 [(buf.validate.field).string.min_len = 1];
  int32 initial_delay_seconds = 2;
  int32 interval_seconds = 3 [(buf.validate.field).int32.gte = 1]; // how often to probe
  int32 timeout_seconds = 4 [(buf.validate.field).int32.gte = 1]; // how long to wait for response
  int32 failure_threshold = 5 [(buf.validate.field).int32.gte = 1]; // number of failures before marking unhealthy
}

// Scalers defines autoscaling configuration.
message Scalers {
  option (buf.validate.message).cel = {
    id: "scalers.target_required"
    message: "enabled autoscaling needs a CPU target between 1 and 100"
    expression: "!this.enabled || (has(this.cpu_target) && this.cpu_target > 0)"
  };
  reserved 3;
  reserved "memory_target";

  bool enabled = 1; // enable autoscaling
  optional int32 cpu_target = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }]; // target CPU percentage (0-100)
}

// BuildSource defines where the code comes from.
message BuildSource {
  string type = 1 [(buf.validate.field).string.min_len = 1]; // "dockerfile" (build_id of a succeeded build) or "image" (public image reference, pinned by digest)
  string image = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {pattern: "^([a-z0-9\\-._]+(:[0-9]+)?(/[a-z0-9\\-._]+)*)(:[a-z0-9\\-._]+)?(@sha256:[a-f0-9]{64})?$"}
  ]; // final image or pre-built
  optional string build_id = 3 [(buf.validate.field).string.uuid = true];
}

// ObservabilityConfig controls automatic application SDK environment configuration.
// Omitted inject_otel defaults to true.
message ObservabilityConfig {
  optional bool inject_otel = 1;
}

// ServiceDeploymentSpec is the deployment specification for SERVICE type resources.
message ServiceDeploymentSpec {
  BuildSource build = 1 [(buf.validate.field).required = true];
  optional HealthCheckConfig health_check = 2;
  // The variables the deployment runs with, exactly; empty sets none. A value can refer to a
  // secret of the environment as ${{ secrets.NAME }} and to an output of another resource in the
  // workspace as ${{ resource.NAME }}; the references resolve when the deployment is created.
  map<string, string> env = 8;
  // port is the port the service listens on; without it the service is a worker.
  optional int32 port = 9 [(buf.validate.field).int32 = {
    gte: 1
    lte: 65535
  }];
  // routing is the HTTP routing the deployment's environment uses. An empty message means the
  // service sets no routing and the defaults apply; without the field the resource's routing
  // applies.
  optional ServiceRouting routing = 10;

  // Defaults to the resource settings when omitted; stored in the deployment snapshot.
  ObservabilityConfig observability = 13;
  reserved 14;
  // The API assigns the installation target when recording this immutable snapshot.
  string platform = 15;
  // command replaces the image entrypoint; without it the image's ENTRYPOINT runs.
  repeated string command = 16 [(buf.validate.field).repeated = {
    max_items: 100
    items: {
      string: {min_len: 1}
    }
  }];
  // args replaces the image CMD; without it the image's CMD is passed to the entrypoint.
  repeated string args = 17 [(buf.validate.field).repeated.max_items = 100];
  // The sizing of each region the deployment targets, keyed by region name. In a request,
  // an entry overrides the resource's region target; the stored snapshot carries every
  // target region filled in.
  map<string, RegionDeploymentTarget> regions = 18;

  option (buf.validate.message).cel = {
    id: "service_deployment.health_check_requires_port"
    message: "health_check needs a port: the HTTP check probes the service port"
    expression: "has(this.port) || !has(this.health_check)"
  };
}

// RegionDeploymentTarget is the sizing of one region of a deployment. Omitted fields default
// from the resource's region target.
message RegionDeploymentTarget {
  optional string cpu = 1 [(buf.validate.field).string.min_len = 1]; // e.g., "100m"
  optional string memory = 2 [(buf.validate.field).string.min_len = 1]; // e.g., "256Mi"
  optional int32 min_replicas = 3 [(buf.validate.field).int32.gte = 1];
  optional int32 max_replicas = 4 [(buf.validate.field).int32.gte = 1];
  optional Scalers scalers = 5;

  option (buf.validate.message).cel = {
    id: "replicas.min_lte_max"
    message: "min_replicas must be <= max_replicas"
    expression: "!has(this.min_replicas) || !has(this.max_replicas) || this.min_replicas <= this.max_replicas"
  };
}

// ServiceRouting is the HTTP routing of one environment's deployment of a service.
message ServiceRouting {
  string path_prefix = 1;
  int32 idle_timeout = 2;
}

// DeploymentSpec is the immutable runtime snapshot for a deployment.
// Uses oneof to support different resource types.
message DeploymentSpec {
  oneof spec {
    ServiceDeploymentSpec service = 1;
  }
}

enum DeploymentActorType {
  DEPLOYMENT_ACTOR_TYPE_UNSPECIFIED = 0;
  DEPLOYMENT_ACTOR_TYPE_USER = 1;
  DEPLOYMENT_ACTOR_TYPE_API_TOKEN = 2;
}

enum DeploymentMethod {
  DEPLOYMENT_METHOD_UNSPECIFIED = 0;
  DEPLOYMENT_METHOD_API_TOKEN = 1;
  DEPLOYMENT_METHOD_CLI = 2;
  DEPLOYMENT_METHOD_WEB = 3;
}

// Deployment is one rollout request for a resource in an environment. It fans out to one
// placement per target region; the status aggregates the placements.
message Deployment {
  string id = 1;
  string resource_id = 2;
  DeploymentStatus status = 6;
  google.protobuf.Timestamp created_at = 9;
  optional google.protobuf.Timestamp started_at = 10;
  optional google.protobuf.Timestamp completed_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  int32 spec_version = 13;
  DeploymentSpec spec = 14;
  string environment_id = 15;
  DeploymentActorType actor_type = 16;
  string actor_id = 17;
  string actor_name = 18;
  string actor_avatar_url = 19;
  DeploymentMethod method = 20;
  SourceCommit commit = 21;
  // One per target region, ordered by region.
  repeated DeploymentPlacement placements = 26;
  DeploymentTrigger trigger = 27;
  // The deployment a redeploy or rollback copied, if any.
  string source_deployment_id = 28;
  // Who canceled the deployment; empty unless a user or token canceled it.
  string canceled_by_name = 29;
  string resource_name = 30;
}

// DeploymentPlacement is one region of a deployment.
message DeploymentPlacement {
  string cluster_id = 1;
  string region = 2;
  int32 desired_replicas = 3;
  PlacementStatus status = 4;
  // The image this region runs; empty while the build runs.
  string image = 5;
  optional google.protobuf.Timestamp started_at = 6;
  optional google.protobuf.Timestamp completed_at = 7;
  int64 current_revision = 8;
  Problem problem = 9;
  // A live placement exposes the cluster's latest reported replicas, including previous
  // deployment IDs; a retired one keeps its last snapshot. List responses leave them empty.
  repeated Replica replicas = 10;
  // Whether the region runs this deployment or is building it.
  bool live = 11;
  // The newer deployment that replaced this region, if any.
  string superseded_by = 12;
  // The deployment before this one in this region: the newest older deployment of the resource in
  // the same environment with a placement in the region. Empty for the region's first deployment.
  string previous_deployment_id = 13;
}

// CreateDeploymentRequest is the request to create a new deployment.
message CreateDeploymentRequest {
  // Persist one ID per deployment attempt and reuse it after a lost response. Reusing an ID with
  // different input or actor fails. Replay returns the original response while the resource exists,
  // even after its deployment history is pruned.
  string request_id = 12 [(buf.validate.field).string.uuid = true];
  string resource_id = 1 [(buf.validate.field).string.uuid = true];
  // The regions to deploy to; empty deploys to every enabled region of the resource.
  repeated string regions = 8 [(buf.validate.field).repeated = {
    unique: true
    items: {
      string: {min_len: 1}
    }
  }];
  DeploymentSpec spec = 4 [(buf.validate.field).required = true];
  string environment_id = 5 [(buf.validate.field).string.uuid = true];
  SourceCommit commit = 7;
  // Unspecified records a deploy; redeploy and rollback name the deployment they copy.
  DeploymentTrigger trigger = 9 [(buf.validate.field).enum = {
    in: [
      0,
      1,
      2,
      3
    ]
  }];
  string source_deployment_id = 10 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  // remove_health_check runs the deployment without a health check and removes the resource's
  // own, which a spec without one inherits. The resource's check is the default for every
  // environment of the workspace; deployments already running in other environments keep theirs.
  bool remove_health_check = 11;
  // Replace resource region defaults with this deployment's complete target map atomically.
  // Existing deployments in other environments keep their configuration.
  bool update_resource_targets = 13;
  // Required when update_resource_targets is true; rejects edits to a changed resource.
  optional int64 resource_revision = 14 [(buf.validate.field).int64.gte = 0];

  option (buf.validate.message).cel = {
    id: "create_deployment.resource_targets_revision"
    message: "updating resource targets requires resource_revision and explicit regions"
    expression: "!this.update_resource_targets || (has(this.resource_revision) && size(this.regions) > 0)"
  };

  option (buf.validate.message).cel = {
    id: "create_deployment.remove_health_check_without_check"
    message: "remove_health_check needs a spec without a health_check"
    expression: "!this.remove_health_check || !has(this.spec.service.health_check)"
  };
}

// CreateDeploymentResponse is the response containing the created deployment ID.
message CreateDeploymentResponse {
  string deployment_id = 1;
  BuildSource build = 2;
}

// GetDeploymentRequest is the request to retrieve a deployment.
message GetDeploymentRequest {
  string deployment_id = 1 [(buf.validate.field).string.uuid = true];
}

// GetDeploymentResponse is the response containing the deployment.
message GetDeploymentResponse {
  Deployment deployment = 1;
}

// ListDeploymentsRequest is the request to list deployments.
message ListDeploymentsRequest {
  option (buf.validate.message).cel = {
    id: "list_deployments.scope"
    message: "provide resource_id or workspace_id with environment_id"
    expression: "(this.resource_id != '' && this.workspace_id == '') || (this.resource_id == '' && this.workspace_id != '' && this.environment_id != '')"
  };
  option (buf.validate.message).cel = {
    id: "list_deployments.window"
    message: "start_time must precede end_time"
    expression: "!has(this.start_time) || !has(this.end_time) || this.start_time < this.end_time"
  };
  string resource_id = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }]; // default: 50, max: 200
  string page_token = 3; // cursor from previous page (base64-encoded timestamp+id)
  string environment_id = 4 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  string workspace_id = 5 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  // The window includes start_time and excludes end_time, using deployment creation time.
  google.protobuf.Timestamp start_time = 6;
  google.protobuf.Timestamp end_time = 7;
  // Sets total_count in the response.
  bool include_total_count = 8;
  // Lists only deployments in these statuses; empty lists every status.
  repeated DeploymentStatus statuses = 9 [(buf.validate.field).repeated = {
    unique: true
    items: {
      enum: {
        defined_only: true
        not_in: [0]
      }
    }
  }];
  // Lists only deployments whose spec builds from this build.
  string build_id = 10 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
}

// ListDeploymentsResponse is the response containing deployment list.
message ListDeploymentsResponse {
  repeated Deployment deployments = 1;
  string next_page_token = 2; // empty if no more pages
  // The deployments the filters match, ignoring page_token; set when include_total_count is.
  // Exact up to 10,000; 10,001 means more than 10,000.
  int32 total_count = 3;
}

// QueryDeploymentBucketsRequest splits [start_time, end_time), at most 30 days, into bucket_count equal
// buckets by deployment creation time.
message QueryDeploymentBucketsRequest {
  option (buf.validate.message).cel = {
    id: "query_deployment_buckets.window"
    message: "start_time must precede end_time"
    expression: "this.start_time < this.end_time"
  };
  option (buf.validate.message).cel = {
    id: "query_deployment_buckets.window_length"
    message: "the window spans at most 30 days"
    expression: "this.end_time - this.start_time <= duration('720h')"
  };
  option (buf.validate.message).cel = {
    id: "query_deployment_buckets.group_by_resource"
    message: "group_by_resource requires resource_ids"
    expression: "!this.group_by_resource || size(this.resource_ids) > 0"
  };
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
  string environment_id = 2 [(buf.validate.field).string.uuid = true];
  // Counts only these resources' deployments; empty counts every resource.
  repeated string resource_ids = 3 [(buf.validate.field).repeated = {
    max_items: 100
    unique: true
    items: {
      string: {uuid: true}
    }
  }];
  google.protobuf.Timestamp start_time = 4 [(buf.validate.field).required = true];
  google.protobuf.Timestamp end_time = 5 [(buf.validate.field).required = true];
  int32 bucket_count = 6 [(buf.validate.field).int32 = {
    gte: 1
    lte: 200
  }];
  // Summarizes each resource of resource_ids in its own series of buckets.
  bool group_by_resource = 7;
  // The most resource names a bucket lists.
  int32 max_resource_names = 8 [(buf.validate.field).int32 = {
    gte: 0
    lte: 20
  }];
}

// QueryDeploymentBucketsResponse holds the nonempty buckets, ordered by resource_id, then index.
message QueryDeploymentBucketsResponse {
  repeated DeploymentBucket buckets = 1;
}

// DeploymentBucket summarizes the deployments created in one bucket of the window.
message DeploymentBucket {
  // The bucket's position in the window, from 0 to bucket_count - 1.
  int32 index = 1;
  // The resource the bucket counts; empty unless the request groups by resource.
  string resource_id = 2;
  int32 deployment_count = 3;
  // The mean creation time of the bucket's deployments.
  google.protobuf.Timestamp mean_created_at = 4;
  // The deployments per current status, ordered by status; statuses without deployments are left out.
  repeated DeploymentStatusCount status_counts = 5;
  // The distinct resources deployed in the bucket.
  int32 resource_count = 6;
  // Up to max_resource_names of the bucket's resource names, most recently deployed first.
  repeated string resource_names = 7;
  // The bucket's deployment when it holds exactly one.
  DeploymentBucketEntry only_deployment = 8;
}

message DeploymentStatusCount {
  DeploymentStatus status = 1;
  int32 count = 2;
}

message DeploymentBucketEntry {
  string id = 1;
  string resource_id = 2;
  string resource_name = 3;
  DeploymentStatus status = 4;
  google.protobuf.Timestamp created_at = 5;
  // The image the deployment's spec names; empty while its build runs.
  string image = 6;
}

message Replica {
  string uid = 1;
  string name = 2;
  string node = 3;
  int64 placement_revision = 4;
  string state = 5;
  google.protobuf.Timestamp state_since = 6;
  google.protobuf.Timestamp state_deadline = 7;
  int32 restarts = 8;
  string detail = 10 [(buf.validate.field).string.max_len = 512];
  // The deployment that created this Pod.
  string deployment_id = 11;
  // The Pod was ready and not terminating in this observation.
  bool ready = 12;
  // When the kubelet started the Pod.
  google.protobuf.Timestamp started_at = 13;
  // The most recent container exit the kubelet recorded for the Pod.
  ReplicaExit last_exit = 14;
  // The replica's restarts since it last stayed up for the cluster's health window, oldest first.
  repeated google.protobuf.Timestamp restarts_at = 15;
  // The exit the replica most recently restarted after.
  ReplicaRestart last_restart = 16;
}

// RestartPolicy decides when a replica's exits stop a version.
enum RestartPolicy {
  RESTART_POLICY_UNSPECIFIED = 0;
  // Stops the version on the restart past max_restarts before the replica stays up for the
  // cluster's health window.
  RESTART_POLICY_ON_FAILURE = 1;
  // Restarts the replica after every exit.
  RESTART_POLICY_ALWAYS = 2;
  // Stops the version on a replica's first exit.
  RESTART_POLICY_NEVER = 3;
}

// FailurePolicy is when Loco stops a version of a service. Either stop keeps the previous version
// serving when one ran before it.
message FailurePolicy {
  RestartPolicy restart_policy = 1;
  // The on-failure restart budget; zero under the other policies.
  int32 max_restarts = 2;
  // How long a new version has to become healthy before Loco stops it.
  int32 deploy_timeout_seconds = 3;
}

// ReplicaRestart is an exit the kubelet restarted a replica's container after.
message ReplicaRestart {
  google.protobuf.Timestamp at = 1;
  // exit, health_check or out_of_memory.
  string cause = 2;
  int32 exit_code = 3;
}

// ReplicaExit is how a replica's container last terminated.
message ReplicaExit {
  // The kubelet's termination reason, such as OOMKilled, Error or Completed.
  string reason = 1;
  int32 exit_code = 2;
  google.protobuf.Timestamp finished_at = 3;
}

message Problem {
  string reason = 1;
  string message = 2;
  string detail = 3;
  string replica_name = 4;
  google.protobuf.Timestamp since = 5;
  // A log query selecting the lines that explain the problem: the build's logs for a failed build,
  // the replica's logs when the problem names one. Empty when no narrower selection exists, and
  // the resource's logs are the place to look.
  string logs_query = 6;
}

message Activity {
  int64 seq = 1;
  int64 revision = 2;
  google.protobuf.Timestamp at = 3;
  string severity = 4;
  string replica_name = 5;
  string message = 6;
  // The region the entry is about; empty for the whole deployment, such as its build.
  string region = 7;
}

message WatchDeploymentRequest {
  string deployment_id = 1 [(buf.validate.field).string.uuid = true];
  int64 after_seq = 2 [(buf.validate.field).int64.gte = 0];
}

message WatchDeploymentResponse {
  Deployment deployment = 1;
  repeated Activity activity = 2;
  bool has_more_activity = 3;
}

// DeleteDeploymentRequest is the request to delete/inactivate a deployment.
message DeleteDeploymentRequest {
  string deployment_id = 1 [(buf.validate.field).string.uuid = true];
}

// DeleteDeploymentResponse is the response after deleting/inactivating a deployment.
message DeleteDeploymentResponse {}

message CancelDeploymentRequest {
  string deployment_id = 1 [(buf.validate.field).string.uuid = true];
  // Also deploy, to each region that already runs the deployment, the version it ran before.
  bool rollback_finished_regions = 2;
}

message CancelDeploymentResponse {
  // The rollback deployments queued for the finished regions, one per previous version.
  repeated string rollback_deployment_ids = 1;
}

message GetDeploymentCancelImpactRequest {
  string deployment_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetDeploymentCancelImpactResponse {
  // Ordered by region.
  repeated FinishedRegion finished_regions = 1;
}

// FinishedRegion is a region that already runs a deployment being canceled.
message FinishedRegion {
  string region = 1;
  // The deployment the region ran before; unset when this was its first deployment.
  Deployment previous = 2;
}

message ResolveImageRequest {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
  string image = 2 [(buf.validate.field).string.min_len = 1];
}

message ResolveImageResponse {
  string image = 1;
}

// SourceCommit is client-reported metadata, not a verified source identity.
message SourceCommit {
  string sha = 1 [(buf.validate.field).string.pattern = "^([0-9a-f]{40}|[0-9a-f]{64})$"];
  bool dirty = 2;
  // Subject line of the commit, read from the deployment's build. Output only.
  string message = 3;
}
