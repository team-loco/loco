syntax = "proto3";

package loco.deployment.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/team-loco/loco/gen/go/loco/deployment/v1;deploymentv1";

enum DeploymentStatus {
  DEPLOYMENT_STATUS_UNSPECIFIED = 0;
  DEPLOYMENT_STATUS_BUILDING = 1;
  DEPLOYMENT_STATUS_DEPLOYING = 2;
  DEPLOYMENT_STATUS_RUNNING = 3;
  DEPLOYMENT_STATUS_FAILED = 4;
  DEPLOYMENT_STATUS_CANCELED = 5;
  DEPLOYMENT_STATUS_SUPERSEDED = 6;
}

// DeploymentService manages resource deployments.
service DeploymentService {
  // CreateDeployment creates a new deployment for a resource.
  rpc CreateDeployment(CreateDeploymentRequest) returns (CreateDeploymentResponse);
  // GetDeployment retrieves a deployment by ID.
  rpc GetDeployment(GetDeploymentRequest) returns (GetDeploymentResponse);
  // ListDeployments lists deployments visible to the caller.
  rpc ListDeployments(ListDeploymentsRequest) returns (ListDeploymentsResponse);
  // WatchDeployment streams deployment events in real-time.
  rpc WatchDeployment(WatchDeploymentRequest) returns (stream WatchDeploymentResponse);
  rpc ListDeploymentActivity(ListDeploymentActivityRequest) returns (ListDeploymentActivityResponse);
  // DeleteDeployment deletes/inactivates a deployment.
  rpc DeleteDeployment(DeleteDeploymentRequest) returns (DeleteDeploymentResponse);
  // ResolveImage returns the digest-pinned image reference.
  rpc ResolveImage(ResolveImageRequest) returns (ResolveImageResponse);
}

// Port defines a network port configuration.
message Port {
  int32 port = 1;
  string protocol = 2;
}

// ResourceSpec defines CPU and memory resource constraints.
message ResourceSpec {
  optional string cpu = 1;
  optional string memory = 2;
}

// HealthCheckConfig defines health check parameters.
message HealthCheckConfig {
  string path = 1 [(buf.validate.field).string.min_len = 1];
  int32 initial_delay_seconds = 2;
  int32 interval_seconds = 3 [(buf.validate.field).int32.gte = 1]; // how often to probe
  int32 timeout_seconds = 4 [(buf.validate.field).int32.gte = 1]; // how long to wait for response
  int32 failure_threshold = 5 [(buf.validate.field).int32.gte = 1]; // number of failures before marking unhealthy
}

// Scalers defines autoscaling configuration.
message Scalers {
  option (buf.validate.message).cel = {
    id: "scalers.target_required"
    message: "enabled autoscaling needs a CPU or memory target between 1 and 100"
    expression: "!this.enabled || (has(this.cpu_target) && this.cpu_target > 0) || (has(this.memory_target) && this.memory_target > 0)"
  };

  bool enabled = 1; // enable autoscaling
  optional int32 cpu_target = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }]; // target CPU percentage (0-100)
  optional int32 memory_target = 3 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }]; // target memory percentage (0-100)
}

// BuildSource defines where the code comes from.
message BuildSource {
  string type = 1 [(buf.validate.field).string.min_len = 1]; // "dockerfile" (build_id of a succeeded build) or "image" (public image reference, pinned by digest)
  string image = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {pattern: "^([a-z0-9\\-._]+(:[0-9]+)?(/[a-z0-9\\-._]+)*)(:[a-z0-9\\-._]+)?(@sha256:[a-f0-9]{64})?$"}
  ]; // final image or pre-built
  optional string build_id = 3 [(buf.validate.field).string.uuid = true];
}

// ObservabilityConfig controls automatic application SDK environment configuration.
// Omitted inject_otel defaults to true.
message ObservabilityConfig {
  optional bool inject_otel = 1;
}

// ServiceDeploymentSpec is the deployment specification for SERVICE type resources.
message ServiceDeploymentSpec {
  BuildSource build = 1 [(buf.validate.field).required = true];
  optional HealthCheckConfig health_check = 2;
  optional string cpu = 3 [(buf.validate.field).string.min_len = 1]; // e.g., "100m" (defaults from resource if omitted)
  optional string memory = 4 [(buf.validate.field).string.min_len = 1]; // e.g., "256Mi" (defaults from resource if omitted)
  optional int32 min_replicas = 5 [(buf.validate.field).int32.gte = 1]; // defaults from resource if omitted
  optional int32 max_replicas = 6 [(buf.validate.field).int32.gte = 1]; // defaults from resource if omitted
  optional Scalers scalers = 7; // autoscaling config (defaults from resource if omitted)
  map<string, string> env = 8;
  // port is the port the service listens on; without it the service is a worker.
  optional int32 port = 9 [(buf.validate.field).int32 = {
    gte: 1
    lte: 65535
  }];
  // routing is the HTTP routing the deployment's environment uses. An empty message means the
  // service sets no routing and the defaults apply; without the field the resource's routing
  // applies.
  optional ServiceRouting routing = 10;
  optional int64 run_as_user = 11 [(buf.validate.field).int64 = {
    gt: 0
    lte: 2147483647
  }];
  optional int64 run_as_group = 12 [(buf.validate.field).int64 = {
    gt: 0
    lte: 2147483647
  }];

  // Defaults to the resource settings when omitted; stored in the deployment snapshot.
  ObservabilityConfig observability = 13;
  // Restores the previous deployment on failure; off by default.
  optional bool rollback_on_failure = 14;

  option (buf.validate.message).cel = {
    id: "replicas.min_lte_max"
    message: "min_replicas must be <= max_replicas"
    expression: "!has(this.min_replicas) || !has(this.max_replicas) || this.min_replicas <= this.max_replicas"
  };
  option (buf.validate.message).cel = {
    id: "service_deployment.health_check_requires_port"
    message: "health_check needs a port: the HTTP check probes the service port"
    expression: "has(this.port) || !has(this.health_check)"
  };
}

// ServiceRouting is the HTTP routing of one environment's deployment of a service.
message ServiceRouting {
  string path_prefix = 1;
  int32 idle_timeout = 2;
}

// DatabaseDeploymentSpec is the spec of the corresponding resource type.
message DatabaseDeploymentSpec {}

// CacheDeploymentSpec is the spec of the corresponding resource type.
message CacheDeploymentSpec {}

// QueueDeploymentSpec is the spec of the corresponding resource type.
message QueueDeploymentSpec {}

// DeploymentSpec is the immutable runtime snapshot for a deployment.
// Uses oneof to support different resource types.
message DeploymentSpec {
  oneof spec {
    ServiceDeploymentSpec service = 1;
    DatabaseDeploymentSpec database = 2;
    CacheDeploymentSpec cache = 3;
    QueueDeploymentSpec queue = 4;
  }
}

enum DeploymentActorType {
  DEPLOYMENT_ACTOR_TYPE_UNSPECIFIED = 0;
  DEPLOYMENT_ACTOR_TYPE_USER = 1;
  DEPLOYMENT_ACTOR_TYPE_API_TOKEN = 2;
}

enum DeploymentMethod {
  DEPLOYMENT_METHOD_UNSPECIFIED = 0;
  DEPLOYMENT_METHOD_API_TOKEN = 1;
  DEPLOYMENT_METHOD_CLI = 2;
  DEPLOYMENT_METHOD_WEB = 3;
}

// Deployment represents a resource deployment (immutable, single-region).
message Deployment {
  string id = 1;
  string resource_id = 2;
  string cluster_id = 3;
  string region = 4;
  int32 desired_replicas = 5;
  DeploymentStatus status = 6;
  bool is_active = 7;
  google.protobuf.Timestamp created_at = 9;
  optional google.protobuf.Timestamp started_at = 10;
  optional google.protobuf.Timestamp completed_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  int32 spec_version = 13;
  DeploymentSpec spec = 14;
  string environment_id = 15;
  DeploymentActorType actor_type = 16;
  string actor_id = 17;
  string actor_name = 18;
  string actor_avatar_url = 19;
  DeploymentMethod method = 20;
  SourceCommit commit = 21;
  int64 current_revision = 22;
  Problem problem = 23;
  repeated Replica replicas = 24;
}

// CreateDeploymentRequest is the request to create a new deployment.
message CreateDeploymentRequest {
  string resource_id = 1 [(buf.validate.field).string.uuid = true];
  string region = 3 [(buf.validate.field).string.min_len = 1];
  DeploymentSpec spec = 4 [(buf.validate.field).required = true];
  string environment_id = 5 [(buf.validate.field).string.uuid = true];
  // Omit to keep the active deployment's secret bindings in the target environment and region.
  DeploymentSecretBindings secret_bindings = 6;
  SourceCommit commit = 7;
}

// DeploymentSecretBindings selects secrets already stored for the resource in the target environment.
message DeploymentSecretBindings {
  // An empty list clears the bindings.
  repeated string names = 1 [(buf.validate.field).repeated = {
    unique: true
    items: {
      string: {pattern: "^[A-Z_][A-Z0-9_]*$"}
    }
  }];
}

// CreateDeploymentResponse is the response containing the created deployment ID.
message CreateDeploymentResponse {
  string deployment_id = 1;
  BuildSource build = 2;
}

// GetDeploymentRequest is the request to retrieve a deployment.
message GetDeploymentRequest {
  string deployment_id = 1 [(buf.validate.field).string.uuid = true];
}

// GetDeploymentResponse is the response containing the deployment.
message GetDeploymentResponse {
  Deployment deployment = 1;
}

// ListDeploymentsRequest is the request to list deployments.
message ListDeploymentsRequest {
  option (buf.validate.message).cel = {
    id: "list_deployments.scope"
    message: "provide resource_id or workspace_id with environment_id"
    expression: "(this.resource_id != '' && this.workspace_id == '') || (this.resource_id == '' && this.workspace_id != '' && this.environment_id != '')"
  };
  option (buf.validate.message).cel = {
    id: "list_deployments.window"
    message: "since must precede until"
    expression: "!has(this.since) || !has(this.until) || this.since < this.until"
  };
  string resource_id = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }]; // default: 50, max: 200
  string page_token = 3; // cursor from previous page (base64-encoded timestamp+id)
  string environment_id = 4 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  string workspace_id = 5 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  // The window includes since and excludes until, using deployment creation time.
  google.protobuf.Timestamp since = 6;
  google.protobuf.Timestamp until = 7;
}

// ListDeploymentsResponse is the response containing deployment list.
message ListDeploymentsResponse {
  repeated Deployment deployments = 1;
  string next_page_token = 2; // empty if no more pages
}

message Replica {
  string uid = 1;
  string name = 2;
  string node = 3;
  int64 placement_revision = 4;
  string state = 5;
  google.protobuf.Timestamp state_since = 6;
  google.protobuf.Timestamp state_deadline = 7;
  int32 restarts = 8;
  optional int32 exit_code = 9;
  string detail = 10;
}

message Problem {
  string reason = 1;
  string message = 2;
  string detail = 3;
  string replica_name = 4;
  google.protobuf.Timestamp since = 5;
}

message Activity {
  int64 seq = 1;
  int64 revision = 2;
  google.protobuf.Timestamp at = 3;
  string severity = 4;
  string replica_name = 5;
  string message = 6;
}

message WatchDeploymentRequest {
  string deployment_id = 1 [(buf.validate.field).string.uuid = true];
  int64 after_seq = 2 [(buf.validate.field).int64.gte = 0];
}

message WatchDeploymentResponse {
  Deployment deployment = 1;
  repeated Activity activity = 2;
  bool has_more_activity = 3;
}

message ListDeploymentActivityRequest {
  string deployment_id = 1 [(buf.validate.field).string.uuid = true];
  int64 after_seq = 2 [(buf.validate.field).int64.gte = 0];
  int32 page_size = 3 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
}

message ListDeploymentActivityResponse {
  repeated Activity activity = 1;
  int64 next_seq = 2;
}

// DeleteDeploymentRequest is the request to delete/inactivate a deployment.
message DeleteDeploymentRequest {
  string deployment_id = 1 [(buf.validate.field).string.uuid = true];
}

// DeleteDeploymentResponse is the response after deleting/inactivating a deployment.
message DeleteDeploymentResponse {}

message ResolveImageRequest {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
  string image = 2 [(buf.validate.field).string.min_len = 1];
}

message ResolveImageResponse {
  string image = 1;
}

// SourceCommit is client-reported metadata, not a verified source identity.
message SourceCommit {
  string sha = 1 [(buf.validate.field).string.pattern = "^([0-9a-f]{40}|[0-9a-f]{64})$"];
  bool dirty = 2;
}
