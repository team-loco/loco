syntax = "proto3";

package loco.registry.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/team-loco/loco/gen/go/loco/registry/v1;registryv1";

message GetImageRepositoryRequest {
  string environment_id = 1 [(buf.validate.field).string.uuid = true];
  string stack_name = 2 [(buf.validate.field).string.pattern = "^[a-z][a-z0-9-]{0,62}$"];
  string service_key = 3 [(buf.validate.field).string.pattern = "^[a-z][a-z0-9-]{0,62}$"];
}

message GetImageRepositoryResponse {
  string repository = 1;
  string push_repository = 2;
}

service RegistryService {
  rpc GetImageRepository(GetImageRepositoryRequest) returns (GetImageRepositoryResponse);
}
