syntax = "proto3";

package loco.event.v1;

import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/team-loco/loco/gen/go/loco/event/v1;eventv1";

service EventService {
  rpc ListOrgEvents(ListOrgEventsRequest) returns (ListOrgEventsResponse);
  rpc StreamEvents(StreamEventsRequest) returns (stream StreamEventsResponse);
}

message Event {
  int64 seq = 1;
  string id = 2;
  string type = 3;
  string org_id = 4;
  string workspace_id = 5;
  string actor_type = 6;
  string actor_id = 7;
  string subject_type = 8;
  string subject_id = 9;
  string request_id = 10;
  google.protobuf.Struct data = 11;
  google.protobuf.Timestamp created_at = 12;
  string actor_email = 13;
  string actor_name = 14;
}

message ListOrgEventsRequest {
  string org_id = 1 [(buf.validate.field).string.uuid = true];
  int64 before_seq = 2 [(buf.validate.field).int64.gte = 0];
  repeated string types = 3 [(buf.validate.field).repeated.max_items = 50];
  int32 page_size = 4 [(buf.validate.field).int32 = {
    gte: 0
    lte: 500
  }];
}

message ListOrgEventsResponse {
  repeated Event events = 1;
  int64 next_before_seq = 2;
}

message StreamEventsRequest {
  string cursor = 1 [(buf.validate.field).string.max_len = 64];
}

message StreamEventsResponse {
  repeated Event events = 1;
  string cursor = 2;
}
