syntax = "proto3";

package loco.event.v1;

import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/team-loco/loco/gen/go/loco/event/v1;eventv1";

service EventService {
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
  rpc StreamEvents(StreamEventsRequest) returns (stream StreamEventsResponse);
}

message Event {
  int64 seq = 1;
  string id = 2;
  string type = 3;
  string org_id = 4;
  string workspace_id = 5;
  string actor_type = 6;
  string actor_id = 7;
  string subject_type = 8;
  string subject_id = 9;
  string request_id = 10;
  google.protobuf.Struct data = 11;
  google.protobuf.Timestamp created_at = 12;
  string actor_email = 13;
  // The user's name, or the name the acting API token had when the event was recorded.
  string actor_name = 14;
  string resource_id = 15;
  string environment_id = 16;
  // The entity type that owns the API token that acted: user, organization, workspace or resource.
  string actor_token_type = 17;
  // The deployment the event concerns: the one a deployment event is about, or the one running
  // when resource.degraded or resource.recovered fired. Empty for other events.
  string deployment_id = 18;
  // The dashboard's label for the event, from its type and region.
  string title = 19;
  // How the Events view grades the event: "normal", "warning" or "error".
  string severity = 20;
  // The region the event names: its region, or its regions joined with ", ".
  string region = 21;
  // The actor changed the organization through an installation role (a Loco operator), not as one of
  // its members.
  bool acted_as_operator = 22;
  // The organization's name, or the name an event about it recorded when it is deleted. Empty when
  // unknown. Set on every listing.
  string org_name = 23;
}

message ListEventsRequest {
  // Empty lists the events of every organization and the installation, which needs system read.
  string org_id = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  // With no org_id: only the events that belong to no organization.
  bool installation_only = 19;
  // next_page_token from the previous page; empty for the newest events.
  string page_token = 2 [(buf.validate.field).string.max_len = 64];
  int32 page_size = 4 [(buf.validate.field).int32 = {
    gte: 0
    lte: 500
  }];
  string workspace_id = 5 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  string resource_id = 6 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  string environment_id = 7 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  // Inclusive start and exclusive end of the event creation time range.
  google.protobuf.Timestamp start_time = 8;
  google.protobuf.Timestamp end_time = 9;
  // Audit query: free text matched against the actor, target, event type, title, reason, region,
  // message and request ID, the @actor, @actor_type, @target, @type, @request, @severity, @region,
  // @reason and @resource fields, AND, OR, - and parentheses.
  // docs/content/reference/audit-queries.md describes the fields. Empty matches every event.
  string query = 13 [(buf.validate.field).string.max_bytes = 4096];
  // Sets total_count in the response.
  bool include_total_count = 14;
  // Only events of these types; empty matches every type. Facets count within these types.
  repeated string types = 15 [(buf.validate.field).repeated.max_items = 100];
  // Sets facets in the response.
  bool include_facets = 16;
  // With workspace_id and no resource_id: a caller who cannot list the workspace's events gets the
  // events of the workspace's resources it can list, as one ListEvents per resource would.
  bool readable_resources = 17;
  // With workspace_id and no resource_id: only the events of these resources. With
  // readable_resources, only those of them the caller can list.
  repeated string resource_ids = 18 [(buf.validate.field).repeated = {
    max_items: 100
    items: {
      string: {uuid: true}
    }
  }];
}

// EventFacet counts the events per value of one key.
message EventFacet {
  // type, severity, region, reason, actor or resource.
  string key = 1;
  repeated EventFacetValue values = 2;
}

message EventFacetValue {
  string value = 1;
  int32 count = 2;
}

message ListEventsResponse {
  // Newest first.
  repeated Event events = 1;
  // Empty on the last page.
  string next_page_token = 2;
  // The events the filters match, ignoring page_token; set when include_total_count is.
  // Exact up to 10,000; 10,001 means more than 10,000.
  int32 total_count = 3;
  // Set when include_facets is: counts per value of each facet key over the newest 10,001 events the
  // scope, time range and types match, ignoring query and page_token.
  repeated EventFacet facets = 4;
}

message StreamEventsRequest {
  string cursor = 1 [(buf.validate.field).string.max_len = 64];
  string org_id = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  string workspace_id = 5 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  string resource_id = 6 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  string environment_id = 7 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
  // Inclusive start and exclusive end of the event creation time range.
  google.protobuf.Timestamp start_time = 8;
  google.protobuf.Timestamp end_time = 9;
  // Audit query: free text matched against the actor, target, event type, title, reason, region,
  // message and request ID, the @actor, @actor_type, @target, @type, @request, @severity, @region,
  // @reason and @resource fields, AND, OR, - and parentheses.
  // docs/content/reference/audit-queries.md describes the fields. Empty matches every event.
  string query = 13 [(buf.validate.field).string.max_bytes = 4096];
}

message StreamEventsResponse {
  repeated Event events = 1;
  string cursor = 2;
}
